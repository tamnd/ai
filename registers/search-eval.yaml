# The evaluation set of the search (spec 17.10). aik search eval runs it on the built index with the ranking of the
# browser, and aik site build fails when a gate fails.
# q is the query as a reader types it. class is one of title, alias, id, acronym, version, question and log, and sets
# what the query must do: title, alias, id and version want the item at rank 1; an acronym wants its target at rank 1,
# or every sense in the top 5 when it has several; a question or a query of the logs wants an answering item in the top 3.
# want is a slug, a tag or the path of a page, or a list of them. A query none of whose items is in the index is
# pending and no gate counts it, so a query can name a node before the node is written.
# Questions are written by the evaluator role and reviewed; queries of the logs come from the gaps job (17.9), reviewed.

