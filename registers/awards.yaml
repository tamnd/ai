# The awards of the field whose recipients are notable (rule S-P1 of spec 18, and 19.6): a recipient of one of these is
# a person card, and a node may name them with their public professional facts only (P01).
# aik harvest awards reads this list and asks Wikidata (through QLever) for the recipients of each award (P166) and the
# years (P585). qid is the Wikidata item of the award; note says when the award is not given for AI work alone, so that
# a node checks that the recipient's work is AI.
# A change to this file is its own pull request with a reason, and each new QID is checked to have recipients on P166.
- qid: Q185667
  name: Turing Award
  note: all of computing; a recipient is a node only for AI work
- qid: Q5971529
  name: IJCAI Computers and Thought Award
- qid: Q5971528
