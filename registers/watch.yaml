# The pages that the daily job reads (spec 14.9).
# A developer here announces models on its own pages, so each model that it announces is a card (rule S-M3). The journals, the policy database, the regulators and the institutes give the policy and provision cards (rule S-L1). The standards bodies give the standard cards (rule S-L2).
# region is an ISO 3166-1 alpha-2 code, EU for the European Union, or INT for an international body. A URL here is an entry point, not a source of facts: each fact cites the page that states it.
# A change to this file is its own pull request with a reason.
