# A course of spec 5.7: an ordered list of items with section headings. Names and orders only (19.3).
# An item names its node by slug when the node exists; before that it is a name and a kind, which aik harvest courses
# reads into the inventory, so that the catalog step can place it and the course can count its coverage (18).
