# A course of spec 5.7: an ordered list of items with section headings. Names and orders only (19.3).
# An item names its node by slug when the node exists; before that it is a name and a kind, which aik harvest courses
# reads into the inventory, so that the catalog step can place it and the course can count its coverage (18).
id: learning-theory
title: Learning theory
basis: >-
  the chapter order of Shalev-Shwartz and Ben-David, Understanding Machine Learning: From Theory to Algorithms (2014),
  parts 1 to 4, then the topics that Mohri, Rostamizadeh and Talwalkar, Foundations of Machine Learning, 2nd edition
  (2018), adds, then the questions that deep learning raised
sections:
