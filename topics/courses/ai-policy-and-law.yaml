# A course of spec 5.7: an ordered list of items with section headings. Names and orders only (19.3).
# An item names its node by slug when the node exists; before that it is a name and a kind, which aik harvest courses
# reads into the inventory, so that the catalog step can place it and the course can count its coverage (18).
id: ai-policy-and-law
title: AI policy and law
basis: >-
  the sub-areas of ai-governance-and-law (5.2), in the order of a reading path from principles to national law to
  international governance, with the provisions that a reader needs; the instruments are named as their official texts
  name them, cross-checked with the OECD.AI policy database and public AI policy syllabi
