    setting: "neural machine translation, training loss"
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 1", stance: for}

- id: c-liu-ppl
  type: empirical
  text: "The vanilla Adam algorithm leads to suspicious/bad local optima (i.e., converges to a training perplexity around 500), and needs a learning rate warmup stage to stabilize the training."
  scope:
    models: "Transformer trained with Adam"
    data: ["IWSLT'14 De-En", "IWSLT'14 En-De", "WMT'16 En-De"]
    scale: "the models of Liu et al."
    setting: "neural machine translation, training perplexity"
