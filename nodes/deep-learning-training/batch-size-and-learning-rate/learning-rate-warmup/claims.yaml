- id: c-liu-cifar
  type: empirical
  text: "Adam with warmup on CIFAR10 reaches a best test accuracy of 91.29, similar to RAdam (91.38); when setting the learning rate as 0.1, Adam with 100 steps of warmup only results in an accuracy of 90.13, while RAdam gets 91.06 with β1 = 0.9, β2 = 0.999."
  scope:
