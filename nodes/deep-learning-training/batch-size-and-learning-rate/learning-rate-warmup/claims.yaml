  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 8", stance: for}

- id: c-xiong-845
  type: empirical
  text: "Without the warm-up stage, the BLEU score of the model trained with Adam can only achieve 8.45, while the model trained using the warm-up stage can achieve around 34; with SGD the BLEU score is just above zero in 15 epochs without using the warm-up stage."
  scope:
    models: "Post-LN Transformer trained with Adam and with SGD"
    data: ["IWSLT14 De-En"]
    scale: "Twarmup = 4000 when warmup is used"
    setting: "machine translation, BLEU"
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 3.2", stance: for}

- id: c-xiong-small-lr
  type: empirical
  text: "Using a very small and fixed learning rate, 1e−4, can mitigate the problem and optimize the Post-LN Transformer to a certain extent but the convergence is significantly slower."
  scope:
    models: "Post-LN Transformer"
    data: ["IWSLT14 De-En"]
    scale: "fixed learning rate 1e-4, no warmup"
    setting: "machine translation, training from scratch"
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 3.4", stance: for}

- id: c-xiong-preln
  type: empirical
  text: "Without the warm-up stage, the BLEU score and validation loss of the Pre-LN Transformer can achieve around 34 and 4, which are comparable with the performance of the Post-LN Transformer."
  scope:
    models: "Pre-LN Transformer trained with Adam"
    data: ["IWSLT14 De-En"]
    scale: "no warmup"
    setting: "machine translation, BLEU and validation loss"
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 4.2", stance: for}

- id: c-xiong-radam
  type: empirical
  text: "The change of the position of layer normalization dominates the change of the optimizer: although RAdam trains the Post-LN Transformer well without the warm-up stage, it has little difference with Adam when training the Pre-LN Transformer."
  scope:
    models: "Post-LN and Pre-LN Transformers trained with Adam and RAdam"
    data: ["IWSLT14 De-En"]
    scale: "no warmup"
    setting: "machine translation"
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 4.2", stance: for}

- id: c-xiong-bert
  type: empirical
  text: "Similar to the machine translation tasks, the learning rate warm-up stage can be removed for the Pre-LN BERT model, and the Pre-LN model can be trained faster, which suggests there is a 40% speed-up rate."
  scope:
    models: "BERT with Post-LN and Pre-LN"
    data: ["the BERT pre-training corpus"]
    scale: "BERT base"
    setting: "unsupervised pre-training, validation loss"
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 4.2", stance: for}

- id: c-liu-no-theory
  type: attributive
  text: "Due to the lack of the theoretical underpinnings, there is neither guarantee that warmup would bring consistent improvements for various machine learning settings nor guidance on how we should conduct warmup, so researchers have to take a trial-and-error approach."
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 1", stance: for}
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 2", stance: for}

- id: c-xiong-disadvantages
  type: attributive
  text: "Such a warm-up stage has several disadvantages: first, its configuration significantly affects the final performance and needs careful hyper-parameter tuning, which is computationally expensive for large-scale NLP tasks; second, the warm-up stage could slow down the optimization, since the learning rate has to gradually increase from zero."
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 3.2", stance: for}

- id: c-goyal-sensitive
  type: empirical
  text: "With a minibatch of 8k images the optimum error is also achieved with η = 0.1 · 32, but in this case results are more sensitive to changing η; in practice Goyal et al. suggest to use a minibatch size that is not close to the breaking point."
  scope:
    models: "ResNet-50 trained with SGD"
    data: ["ImageNet"]
    scale: "minibatch 8k"
    setting: "learning rate sweep, top-1 validation error"
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "p. 9", stance: for}

- id: c-xiong-not-adam
  type: attributive
  text: "Liu et al. claimed that the benefit of the warm-up stage comes from reducing the variance for the adaptive learning rate in Adam; however, not only for Adam, the learning rate warm-up stage also helps quite a lot for other optimizers, which may indicate that Adam is not the prerequisite for the necessity of the warm-up stage."
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 2", stance: for}

- id: c-liu-no-tw
  type: attributive
  text: "RAdam does not require an additional hyperparameter (i.e., Tw) and can automatically adapt to different moving average rules."
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 6", stance: for}

- id: c-liu-orthogonal
  type: attributive
  text: "The proposed rectification term is orthogonal to other training stabilization techniques such as gradient clipping, smoothing the adaptive learning rate, initialization and normalization, and these techniques can be combined with the variance rectification method."
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 6", stance: for}

- id: c-nguyen
  type: attributive
  text: "In a concurrent and independent work, Nguyen & Salazar (2019) also empirically observed that the Pre-LN Transformer can be trained without learning rate warm-up stage."
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Section 2", stance: for}

- id: c-liu-other-optimizers
  type: attributive
  text: "The analysis focuses on learning rate warmup for Adam, while it can be applied to other algorithms that use similar adaptive learning rate designs, e.g., RMSprop and Nadam."
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 3", stance: for}

- id: c-goyal-zero-gamma
  type: attributive
  text: "For BN layers, the learnable scaling coefficient γ is initialized to be 1, except for each residual block's last BN where γ is initialized to be 0; this causes the signal initially to propagate through the identity shortcut, which eases optimization at the start of training and is particularly helpful for large minibatch training."
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "p. 6", stance: for}

- id: c-torch-radam
  type: mathematical
  text: "With beta2 = 0.999, rho_5 ≈ 4.996 and rho_6 ≈ 5.994, so under the threshold rho_t > 5 the first adaptive step is t = 6, with r_6 ≈ 0.026, while under rho_t > 4 it is t = 5."
  assumes: ["torch.optim.RAdam 2.15 takes the adaptive step when rho_t > 5, as in its documented algorithm", "eq-rho and eq-rect with beta2 = 0.999"]
  derivation: "node.md#worked-example"

- id: c-goyal-sqrt
  type: empirical
  text: "Keeping η fixed at 0.1 or using 0.1 · sqrt(32) according to the square root scaling rule, also with gradual warmup for 0.1 · sqrt(32), both policies work poorly in practice."
  scope:
    models: "ResNet-50 trained with SGD"
    data: ["ImageNet"]
    scale: "minibatch 8k"
    setting: "alternatives to the linear scaling rule, top-1 validation error"
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "p. 9", stance: for}

- id: c-liu-origin
  type: historical
  text: "Warmup is originally proposed to handle training with very large batches for SGD (Goyal et al., 2017; Gotmare et al., 2019; Bernstein et al., 2018; Xiao et al., 2017)."
  evidence:
    - {work: "liu-2020-variance-adaptive-learning-rate", role: original, locator: "p. 6", stance: for}
