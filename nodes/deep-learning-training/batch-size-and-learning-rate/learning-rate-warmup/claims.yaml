  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "p. 1", stance: for}

- id: c-liu-3-10
  type: empirical
  text: "When training typical Transformers based neural machine translation models on the De-En IWSLT'14 dataset, removing the warmup stage increases the training loss from 3 to around 10; similar phenomena are observed in BERT pre-training."
