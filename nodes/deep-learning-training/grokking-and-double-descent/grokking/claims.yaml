# Derived on this page

- id: c-fourier-peak
  type: mathematical
  text: "For a prime p, frequencies k in 1, ..., p - 1 and positive weights alpha_k, the logit sum_k alpha_k cos(2 pi k (a + b - c) / p) equals sum_k alpha_k at c = a + b mod p and is strictly smaller at every other c."
  assumes: ["p is a prime", "every alpha_k is positive", "every k lies in 1, ..., p - 1"]
  derivation: fourier-identity

- id: c-fourier-prime
  type: mathematical
  text: "If p is not prime the rule can fail: for p = 12 and the single frequency k = 3, the answer c = a + b - 4 gets the same logit as the right one."
  assumes: ["one frequency with a factor in common with p"]
  derivation: fourier-identity

- id: c-fourier-all-frequencies
  type: mathematical
  text: "With all frequencies k = 1, ..., (p - 1)/2 and unit weights, the logit is (p - 1)/2 at c = a + b mod p and exactly -1/2 at every other c."
  assumes: ["p is an odd prime"]
  derivation: fourier-identity

- id: c-fourier-113
  type: mathematical
  text: "For p = 113 with the five key frequencies 14, 35, 41, 42 and 52 and unit weights, the right answer has logit 5 and the largest wrong logit is 2.5898, at c = a + b + 16 mod 113, so the rule answers all 12,769 pairs correctly."
  assumes: ["unit weights"]
  derivation: fourier-identity

- id: c-decay-geometric
  type: mathematical
  text: "With a zero data gradient and zero Adam moments, each AdamW step multiplies the weights and their norm by 1 - lr x wd, so after t steps they are (1 - lr x wd)^t times their start."
  assumes: ["decoupled weight decay", "a zero gradient of the data loss"]
  derivation: weight-decay-shrinkage

- id: c-decay-time
  type: mathematical
  text: "Under decay alone, the number of steps to bring the weight norm from w_0 down to w_c is ceil(ln(w_0/w_c) / -ln(1 - lr x wd)), at most ceil(ln(w_0/w_c) / (lr x wd)), so it grows as one over the weight decay."
  assumes: ["0 < lr x wd < 1"]
  derivation: weight-decay-shrinkage

- id: c-decay-numbers
  type: mathematical
  text: "At learning rate 10^-3 and weight decay 1, decay alone multiplies the weights by 0.999 per step and by 0.3677 over 1,000 steps, and halves their norm in 693 steps."
  assumes: ["lr = 10^-3", "wd = 1"]
  derivation: weight-decay-shrinkage
