- id: c-cohen-caveats
  type: empirical
  text: "With ReLU or hardtanh activations, the sharpness sometimes started to plateau, and the training loss to behave non-monotonically, a bit before the sharpness crossed 2/η; with batch normalization the sharpness at the iterates sometimes plateaued below 2/η while the sharpness in between the iterates plateaued just above it."
  scope:
