# Explanations: the quadratic model

- id: c-cohen-quadratic
  type: mathematical
  text: "On a quadratic, if the second derivative a exceeds 2/η the gradient descent iterates oscillate around the minimum with exponentially increasing magnitude, and in d dimensions each coordinate along an eigenvector of the Hessian evolves separately."
  assumes: ["the objective is a quadratic", "a fixed step size eta"]
  derivation: quadratic-stability
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 3", stance: for}

- id: c-quad-modes
  type: mathematical
  text: "For gradient descent on 0.5 x^T H x, the coordinate of the iterate along each eigenvector q_i of H is multiplied by 1 - η λ_i at every step."
  assumes: ["H is symmetric", "a fixed step size eta"]
  derivation: quadratic-stability

- id: c-quad-threshold
  type: mathematical
  text: "With H positive definite, gradient descent converges from every start if and only if η λ_max < 2; at η λ_max = 2 the top coordinate flips sign with constant size, and above it grows geometrically."
  assumes: ["H is symmetric positive definite", "a fixed step size eta > 0"]
  derivation: quadratic-stability

- id: c-quad-example
  type: mathematical
  text: "With eigenvalues 20 and 1, the top factor is -0.8 at η = 0.09 and -1.2 at η = 0.11, so over 100 steps the top coordinate shrinks by a factor of about 2.04e-10 in the first run and grows by about 8.28e7 in the second."
  assumes: ["H = diag(20, 1)", "plain gradient descent"]
  derivation: quadratic-stability

- id: c-quad-momentum
  type: mathematical
  text: "On quadratics, gradient descent with step size η and momentum parameter β diverges if the sharpness exceeds the maximum stable sharpness, (2 + 2β)/η for Polyak momentum and (2 + 2β)/(η(1 + 2β)) for Nesterov momentum."
  assumes: ["the objective is a quadratic with positive definite Hessian", "0 <= beta < 1"]
  derivation: quadratic-stability
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 3", stance: for}

- id: c-cohen-taylor
  type: empirical
  text: "At the Edge of Stability, gradient descent on the real neural training objective makes consistent progress, whereas gradient descent on the quadratic Taylor approximation would diverge, so the Edge of Stability is inherently non-quadratic."
  scope:
    models: "the networks of the paper"
    data: [cifar-10]
    scale: "5k subset"
    setting: "full-batch gradient descent"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 10", stance: for}

# Explanations: the catapult

- id: c-lewk-phases
  type: empirical
  text: "In the catapult phase, 2/λ0 < η < ηmax, optimization begins with a period of exponential growth in the loss coupled with a rapid decrease in curvature, until curvature stabilizes at a value λfinal < 2/η; training then converges to a minimum that is flatter than those found in the lazy phase, η < 2/λ0, after a number of steps of order log(n)."
  scope:
    models: "wide fully-connected, convolutional and residual networks"
    data: [cifar-10, mnist]
    scale: "sufficiently wide networks"
    setting: "SGD and gradient descent with MSE loss, large initial learning rates"
  evidence:
    - {work: "lewkowycz-2020-large-learning-rate-phase", role: original, locator: "p. 3", stance: for}

- id: c-lewk-curvature
  type: definitional
  text: "Lewkowycz et al. measure curvature by λ, the maximum eigenvalue of the neural tangent kernel, which in large width models is a local measure of the loss landscape curvature similar to the top eigenvalue of the Hessian."
  evidence:
    - {work: "lewkowycz-2020-large-learning-rate-phase", role: original, locator: "p. 3", stance: for}

- id: c-catapult-update
  type: mathematical
  text: "For the model f = n^(-1/2) v^T u on one example with label 0 and loss f^2/2, one gradient step gives exactly f' = (1 - ηλ + η^2 f^2/n) f and λ' = λ + (η f^2/n)(ηλ - 4), with λ = (|u|^2 + |v|^2)/n."
  assumes: ["the two-layer linear model with a single example x = 1, y = 0", "plain gradient descent"]
  derivation: catapult-update
  evidence:
    - {work: "lewkowycz-2020-large-learning-rate-phase", role: original, locator: "p. 4", stance: for}

- id: c-catapult-decrease
  type: mathematical
  text: "In that model, every step with f nonzero lowers the curvature λ when ηλ < 4 and raises it when ηλ > 4, which separates the catapult phase from the divergent phase at ηmax = 4/λ0."
  assumes: ["the two-layer linear model with a single example x = 1, y = 0", "f is nonzero"]
  derivation: catapult-update

- id: c-lewk-max-rate
  type: empirical
  text: "For networks with ReLU non-linearity ηmax ≈ 12/λ0 is a good predictor of the maximum learning rate, and the initial increase of the loss in the catapult phase is short, taking less than 10 steps to complete."
  scope:
    models: "wide fully-connected and convolutional ReLU networks, Wide ResNet"
    data: [cifar-10, mnist]
    scale: "wide networks"
    setting: "SGD with MSE loss"
  evidence:
    - {work: "lewkowycz-2020-large-learning-rate-phase", role: original, locator: "p. 7", stance: for}

- id: c-cohen-catapult
  type: attributive
  text: "Cohen et al. suggest that the behavior of gradient descent at the Edge of Stability can conceivably be viewed as a never-ending series of micro-catapults."
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 7", stance: for}

# Explanations: self-stabilization

- id: c-damian-self-stabilization
  type: empirical
  text: "The dynamics of gradient descent at the edge of stability can be captured by a cubic Taylor expansion: as the iterates diverge in the direction of the top eigenvector of the Hessian, the cubic term causes the curvature to decrease until stability is restored, so gradient descent implicitly follows projected gradient descent under the constraint S(θ) ≤ 2/η."
  scope:
    models: "MLP, CNN and Transformer"
    data: [cifar-10, sst-2]
    scale: "5k subset of CIFAR10"
    setting: "full-batch gradient descent, under the assumptions of the analysis"
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 1", stance: for}

- id: c-damian-progressive
  type: definitional
  text: "Damian et al. state progressive sharpening as the gradient of the loss being negatively aligned with the gradient of sharpness, ∇L(θ) · ∇S(θ) < 0."
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 2", stance: for}

- id: c-damian-lemma
  type: mathematical
  text: "If the top eigenvalue of ∇²L(θ) is unique, then the sharpness S(θ) is differentiable at θ and ∇S(θ) = ∇³L(θ)(u(θ), u(θ)), with u(θ) the top eigenvector."
  assumes: ["the top eigenvalue of the Hessian is unique", "the loss is three times differentiable"]
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 3", stance: for}

- id: c-damian-map
  type: mathematical
  text: "In the simplified dynamics of Damian et al., with x_t the deviation from θ* in the u direction and y_t the sharpness minus 2/η, x_{t+1} ≈ -(1 + η y_t) x_t and y_{t+1} ≈ y_t + η(α - β x_t^2/2), so once x_t^2 > 2α/β the sharpness begins to decrease."
  assumes: ["a cubic Taylor expansion around a fixed reference point", "alpha = -∇L · ∇S > 0 and beta = |∇S|^2", "∇S orthogonal to u and ∇L, ∇S in the kernel of the Hessian"]
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 7", stance: for}

- id: c-ode-conserved
  type: mathematical
  text: "For X' = XY and Y' = α - βX^2/2 with α, β > 0, the quantity h(βX^2/(2α)) + Y^2/α with h(z) = z - log z - 1 is conserved, and the unique fixed point is (sqrt(2α/β), 0)."
  assumes: ["alpha > 0 and beta > 0", "X(t) > 0"]
  derivation: self-stabilization-ode
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 8", stance: for}

- id: c-damian-loss
  type: attributive
  text: "Damian et al. explain the non-monotonic decrease of the loss by gradient descent staying close to a constrained trajectory, and report that in a standard setting full-batch gradient descent generalizes better with large learning rates."
  evidence:
    - {work: "damian-2023-self-stabilization-edge-stability", role: original, locator: "p. 14", stance: for}

# The tools of this page

- id: c-hvp-central
  type: mathematical
  text: "The central difference (g(θ + εv) - g(θ - εv))/(2ε) of the gradient g equals the Hessian-vector product Hv up to an error of order ε^2, and is exact when the loss is quadratic."
  assumes: ["the loss is three times continuously differentiable near theta"]
  derivation: power-iteration-hvp

- id: c-power-iteration
  type: mathematical
  text: "Power iteration on Hessian-vector products converges to the Hessian eigenvalue of largest modulus, which is the sharpness when the Hessian is positive semi-definite or its top eigenvalue dominates the negative ones."
  assumes: ["the Hessian is symmetric with a unique eigenvalue of largest modulus", "the start vector has a nonzero component along its eigenvector"]
  derivation: power-iteration-hvp

# Implications

- id: c-cohen-l-smooth
  type: attributive
  text: "Cohen et al. argue that at any step size for which gradient descent enters the Edge of Stability, gradient descent cannot be analyzed using L-smoothness, and convergence analyses which assert monotone descent cannot apply."
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 10", stance: for}

- id: c-cohen-step-rule
  type: empirical
  text: "Gradient descent with the purportedly optimal step size rule ηt = 1/λt is soundly outperformed by gradient descent with a fixed step size ηt = 1/λ0, where λ0 is the sharpness at initialization."
  scope:
    models: "the networks of Appendix F"
    data: [cifar-10]
    scale: "5k subset"
    setting: "full-batch gradient descent"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 11", stance: for}

- id: c-lewk-budget
  type: empirical
  text: "For a fixed amount of computational budget, the performance of models trained in the catapult phase either matches or exceeds that of models trained in the lazy phase."
  scope:
    models: "wide fully-connected, convolutional and residual networks"
    data: [cifar-10, mnist]
    scale: "wide networks"
    setting: "SGD with MSE loss"
  evidence:
    - {work: "lewkowycz-2020-large-learning-rate-phase", role: original, locator: "p. 6", stance: for}

# Open questions

- id: c-cohen-unknown
  type: attributive
