- id: c-cohen-cross-entropy
  type: empirical
  text: "With cross-entropy loss the sharpness typically drops at the end of training, because the second derivative of the cross-entropy loss is small when the margins of the classifier's predictions are large."
  scope:
    models: "classifiers trained with cross-entropy"
    data: [cifar-10]
    scale: "5k subset"
    setting: "full-batch gradient descent"
  evidence:
