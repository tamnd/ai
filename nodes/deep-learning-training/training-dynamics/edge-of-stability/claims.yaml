# Scope and conditions

- id: c-cohen-width
  type: empirical
  text: "Progressive sharpening occurs to a lesser degree as networks become increasingly wide, and to a lesser degree if the task is easy, or if the network is shallow."
  scope:
    models: "networks of varying width under NTK and standard parameterizations"
    data: [cifar-10]
    scale: "5k subset"
