# The claims of the edge-of-stability page (spec 07). The build computes the labels.

# The finding

- id: c-cohen-eos
  type: empirical
  text: "Full-batch gradient descent on neural network training objectives typically operates in a regime called the Edge of Stability, in which the maximum eigenvalue of the training loss Hessian hovers just above the value 2/(step size), and the training loss behaves non-monotonically over short timescales, yet consistently decreases over long timescales."
  scope:
    models: "fully-connected, convolutional, VGG, ResNet and Transformer networks"
    data: [cifar-10, wikitext-2, synthetic regression]
    scale: "subsets of 5k CIFAR-10 examples up to the full CIFAR-10 training set"
    setting: "full-batch gradient descent at a fixed step size"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 1", stance: for}
    - {work: "damian-2023-self-stabilization-edge-stability", role: replication, locator: "p. 12", stance: for}

- id: c-cohen-sharpness
  type: definitional
  text: "In this usage, sharpness strictly means the maximum eigenvalue of the training loss Hessian, with no claimed connection to generalization."
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 2", stance: for}

- id: c-cohen-progressive
  type: empirical
  text: "So long as the sharpness is less than 2/η, gradient descent has an overwhelming tendency to continually increase the sharpness, a phenomenon Cohen et al. call progressive sharpening; brief decreases, especially at the beginning of training, are followed by a return to continual increase."
  scope:
    models: "neural networks trained by full-batch gradient descent"
    data: [cifar-10]
    scale: "a 5k subset of CIFAR-10 and the full dataset"
    setting: "step sizes small enough that the sharpness is below 2/η"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 3", stance: for}

- id: c-cohen-fc-setup
  type: empirical
  text: "With a fully-connected network with two hidden layers of width 200 and tanh activations, trained with the mean squared error at the small step size 2/600 until the training accuracy reaches 99%, the sharpness continually rises during training except for a brief dip at the beginning."
  scope:
    models: "fully-connected tanh network, two hidden layers of width 200"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent, MSE loss"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 4", stance: for}

- id: c-cohen-subset
  type: empirical
  text: "The experiments that illustrate progressive sharpening use full-batch gradient descent to train a network on a subset of 5,000 examples from CIFAR-10 while monitoring the evolution of the sharpness."
  scope:
    models: "fully-connected network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 3", stance: for}

- id: c-cohen-breakeven
  type: empirical
  text: "Trained at the larger step size η = 0.01, the same network reaches the point where the sharpness rises to 2/η = 200, which Jastrzębski et al. (2020) dubbed the breakeven point."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent, η = 0.01"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 4", stance: for}

- id: c-cohen-oscillate
  type: empirical
  text: "Once the sharpness crosses 2/η, the iterates oscillate along the leading Hessian eigenvector q1 with ever-increasing magnitude; after initially spiking around iteration 215, the train loss continues to decrease, albeit non-monotonically, and gradient descent avoids diverging entirely."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent, η = 0.01"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 5", stance: for}

- id: c-cohen-regime
  type: empirical
  text: "In general, after the sharpness initially crosses 2/η, gradient descent enters the Edge of Stability, in which the sharpness hovers right at, or just above, the value 2/η, and the train loss behaves non-monotonically over short timescales, yet decreases consistently over long timescales."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent at a range of step sizes, MSE and cross-entropy"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 5", stance: for}

- id: c-cohen-gap
  type: empirical
  text: "For MSE loss the sharpness hovers just a minuscule amount above 2/η, while for cross-entropy loss the gap between the sharpness and 2/η is small yet non-miniscule."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 6", stance: for}

- id: c-cohen-lr-drop
  type: empirical
  text: "After training at step size 2/200 until reaching the Edge of Stability and dropping the step size to 2/300 at iteration 6,000, the sharpness immediately starts to increase, and only stops increasing once gradient descent is back at the Edge of Stability."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent with one learning rate drop"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 6", stance: for}

- id: c-cohen-stable-slow
  type: empirical
  text: "With cross-entropy loss it takes 3700 iterations to train at the stable step size but only 1000 iterations at a larger step size, and stable step sizes are always observed to be suboptimal in terms of convergence speed."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent, cross-entropy loss"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 6", stance: for}

- id: c-cohen-momentum
  type: empirical
  text: "With step size η = 0.01 and Polyak or Nesterov momentum at several settings of the momentum parameter β, the sharpness rises until reaching the maximum stable sharpness of Equation 1, and then plateaus there."
  scope:
    models: "fully-connected tanh network"
    data: [cifar-10]
    scale: "5,000 training examples"
    setting: "full-batch gradient descent with momentum"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 6", stance: for}

- id: c-cohen-next-eigenvalues
  type: empirical
  text: "The next few Hessian eigenvalues also each rise until plateauing near 2/η."
  scope:
    models: "networks of Appendix P"
    data: [cifar-10]
    scale: "5k subset"
    setting: "full-batch gradient descent"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 7", stance: for}

- id: c-cohen-gradient-flow
  type: empirical
  text: "For many but not all networks, gradient descent at any step size η closely tracks the Runge-Kutta gradient flow trajectory until reaching the point where the sharpness hits 2/η; if η < 2/λmax it never enters the Edge of Stability, and if η ∈ [2/λmax, 2/λ0] it becomes destabilized shortly after that point and enters the Edge of Stability."
  scope:
    models: "networks with continuously differentiable components, and some with ReLU or max-pooling"
    data: [cifar-10]
    scale: "5k subset"
    setting: "full-batch gradient descent compared with an RK4 integration of gradient flow"
  evidence:
    - {work: "cohen-2021-gradient-descent-edge-stability", role: original, locator: "p. 8", stance: for}

