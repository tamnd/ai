  type: empirical
  text: "On a 5k subset of CIFAR-10, fully-connected networks and convolutional networks with max-pooling and average pooling, with tanh, ReLU and ELU activations and for fully-connected networks also softplus and hardtanh, eleven networks in total, each trained with both cross-entropy and MSE loss, reproduce the Edge of Stability behaviour in each case."
  scope:
    models: "eleven fully-connected and convolutional networks"
    data: [cifar-10]
    scale: "5k subset"
