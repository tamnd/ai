  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 11", stance: for}

- id: c-tp4-omniglot
  type: empirical
  text: "On Omniglot 1-shot 5-way meta-test, the muP limit of a 1-hidden-layer linear MLP reaches 66.42% accuracy against 41.68% for its GP and NTK limits and 47.60% and 47.82% for the relu GP and NTK limits, and finite-width muP networks approach it from below."
  scope:
    models: "1-hidden-layer MLPs and their infinite-width limits (Yang and Hu)"
    data: ["Omniglot"]
    scale: "unknown"
    setting: "first-order MAML pretraining"
  evidence:
    - {work: "yang-2020-feature-learning-infinite-width-networks", role: original, locator: "p. 28", stance: for}

- id: c-tp4-word2vec
  type: attributive
  text: "On Word2Vec and few-shot learning on Omniglot, the feature learning infinite-width networks outperform both NTK baselines and finite-width networks, with the latter approaching the infinite-width performance as width increases."
  evidence:
    - {work: "yang-2020-feature-learning-infinite-width-networks", role: original, locator: "p. 2", stance: for}

# Limitations

- id: c-tp5-table1
  type: attributive
  text: "Optimization-related hyperparameters, initialization and parameter multipliers can be muTransferred; regularization hyperparameters such as dropout and weight decay cannot; transfer is across width, and empirically across depth, batch size, training time and sequence length."
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 2", stance: for}

- id: c-tp5-regularization
  type: attributive
  text: "The amount of regularization naturally depends on both the model size and the data size, so transfer should not be expected to work if the parametrization depends only on model size."
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 8", stance: for}

- id: c-tp5-minimums
  type: empirical
  text: "For language modeling on Transformers, hyperparameters generally transfer if some minimum width (e.g. 256), depth (e.g. 4), batch size (e.g. 32), sequence length (e.g. 128) and number of training steps (e.g. 5000) are met."
  scope:
    models: "pre-layernorm muP Transformers (Yang et al.)"
    data: ["wikitext-2"]
    scale: "unknown"
    setting: "sweeps of one hyperparameter along width and depth, 5 seeds"
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 8", stance: for}

- id: c-tp5-depth-init
  type: empirical
  text: "The best initialization standard deviation does not seem to transfer well across depth, and transfer across depth only works for pre-layernorm Transformers."
  scope:
    models: "pre-layernorm and post-layernorm muP Transformers (Yang et al.)"
    data: ["wikitext-2"]
    scale: "unknown"
    setting: "sweeps of one hyperparameter along width and depth"
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 8", stance: for}

- id: c-tp5-finetune
  type: attributive
  text: "In settings such as finetuning on small datasets, where regularization is the bottleneck, muTransfer may not be sufficient."
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 2", stance: for}

- id: c-tp5-puzzle
  type: attributive
  text: "It is theoretically unclear why the hyperparameter optimum converges quickly with width while the network function and its loss converge much more slowly."
  evidence:
    - {work: "yang-2022-tensor-programs-v-hyperparameter-transfer", role: original, locator: "p. 12", stance: for}

- id: c-ev-alignment
  type: attributive
  text: "The derivations of muP-style stability constraints assume that parameter updates are sufficiently correlated with the data to change the scaling exponent of the activations; Everett et al. call this correlation alignment."
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 2", stance: for}

- id: c-ev-scale
  type: empirical
  text: "Everett et al. train tens of thousands of models with three optimizers, four parameterizations, several alignment assumptions, more than a dozen learning rates and fourteen model sizes up to 26.8B parameters."
  scope:
    models: "decoder-only Transformers up to 26.8B parameters (Everett et al.)"
    data: ["unknown"]
    scale: "26.8B parameters"
    setting: "width scaling across parameterizations and optimizers"
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 1", stance: for}

- id: c-ev-all
  type: attributive
  text: "All parameterizations, not just muP, can achieve hyperparameter transfer, and a per-layer learning rate prescription for standard parameterization outperforms muP."
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 1", stance: for}

- id: c-ev-sp-adam
  type: attributive
  text: "The best prescription for Adam scales the learning rate of the embedding layer as O(1) and of the hidden and readout layers as O(1/n) in standard parameterization."
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 2", stance: for}

- id: c-ev-sgd
  type: attributive
  text: "For SGD in standard parameterization, under common assumptions the hidden-layer learning rate would ideally scale like O(1/sqrt(n)) and the readout learning rate like O(1/n)."
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 1", stance: for}

- id: c-ev-epsilon
  type: attributive
  text: "The epsilon parameter in Adam must be scaled correctly to avoid gradient underflow; Adam-atan2 is a numerically stable, scale-invariant version of Adam that eliminates epsilon."
  evidence:
    - {work: "everett-2024-scaling-exponents-parameterizations-optimizers", role: original, locator: "p. 1", stance: for}

- id: c-he-init
  type: attributive
  text: "He et al. derive a robust initialization method that particularly considers the rectifier nonlinearities, with the sufficient condition that one half of n_l Var[w_l] equals 1 for every layer, which results in a zero-mean Gaussian distribution whose standard deviation is the square root of 2/n_l."
  evidence:
    - {work: "he-2015-delving-deep-rectifiers", role: original, locator: "pp. 1 and 4", stance: for}

- id: c-he-30layer
  type: empirical
  text: "Their initialization method allows for extremely deep models (e.g., 30 conv/fc layers) to converge, while the Xavier method cannot."
  scope:
    models: "rectified convolutional networks with up to 30 layers (27 conv and 3 fc)"
    data: ["imagenet"]
    scale: "up to 30 layers"
    setting: "training from scratch with the He and Xavier initializations"
  evidence:
    - {work: "he-2015-delving-deep-rectifiers", role: original, locator: "p. 3", stance: for}

- id: c-jacot-factors
  type: attributive
  text: "Jacot et al. initialize the parameters as iid Gaussians N(0, 1) and put factors of one over the square root of n_l in the realization function; the factors are key to obtaining a consistent asymptotic behavior as the widths grow to infinity, but a side-effect is that they reduce greatly the influence of the connection weights during training when n_l is large."
  evidence:
    - {work: "jacot-2018-neural-tangent-kernel", role: original, locator: "pp. 2 and 3", stance: for}
