# The claims of the mixup page (spec 07). The build computes the labels.

# Setting

- id: c-zh-memorize
  type: attributive
  text: "Zhang et al. note that the empirical risk monitors the behaviour of f only at a finite set of n examples, that for functions with a number of parameters comparable to n one trivial way to minimize it is to memorize the training data, and that memorization leads to undesirable behaviour of f outside the training data."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-vrm
  type: attributive
  text: "In the Vicinal Risk Minimization principle, human knowledge is required to describe a vicinity around each training example, from which additional virtual examples are drawn; Zhang et al. note that such data augmentation is dataset-dependent, requires expert knowledge, and assumes that the examples in the vicinity share the same class."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 1", stance: for}

- id: c-zh-gaussian
  type: attributive
  text: "Chapelle et al. considered Gaussian vicinities ν(x̃, ỹ | x_i, y_i) = N(x̃ − x_i, σ²) δ(ỹ = y_i), which is equivalent to augmenting the training data with additive Gaussian noise."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

# The method

- id: c-zh-virtual
  type: definitional
  text: "mixup constructs virtual training examples x̃ = λx_i + (1 − λ)x_j and ỹ = λy_i + (1 − λ)y_j, where x_i and x_j are raw input vectors, y_i and y_j are one-hot label encodings, the two examples are drawn at random from the training data, and λ ∈ [0, 1]."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 1", stance: for}

- id: c-zh-prior
  type: attributive
  text: "Zhang et al. write that mixup extends the training distribution by incorporating the prior knowledge that linear interpolations of feature vectors should lead to linear interpolations of the associated targets, and that it can be implemented in a few lines of code with minimal computation overhead."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 1", stance: for}

- id: c-zh-vicinal
  type: definitional
  text: "Zhang et al. propose mixup as a generic vicinal distribution μ(x̃, ỹ | x_i, y_i) = (1/n) Σ_j E_λ[δ(x̃ = λ·x_i + (1 − λ)·x_j, ỹ = λ·y_i + (1 − λ)·y_j)], where λ ∼ Beta(α, α) for α ∈ (0, ∞)."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-alpha
  type: attributive
  text: "The mixup hyper-parameter α controls the strength of interpolation between feature-target pairs, recovering the ERM principle as α → 0."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-code
  type: attributive
  text: "Figure 1a of Zhang et al. shows the few lines of code of one epoch of mixup training in PyTorch, which draws lam = numpy.random.beta(alpha, alpha) and mixes the inputs and the one-hot targets of two loaders."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-one-loader
  type: attributive
  text: "Zhang et al. report that their implementation uses a single data loader to obtain one minibatch, and then applies mixup to the same minibatch after random shuffling, a strategy that works equally well while reducing I/O requirements."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-alternatives
  type: attributive
  text: "Zhang et al. report that in preliminary experiments convex combinations of three or more examples with weights sampled from a Dirichlet distribution did not provide further gain but increased the computation cost, and interpolating only between inputs with equal label did not lead to the performance gains of mixup."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-linear
  type: attributive
  text: "Zhang et al. argue that mixup encourages the model to behave linearly in-between training examples, that this linear behaviour reduces the amount of undesirable oscillations when predicting outside the training examples, and that linearity is a good inductive bias from the perspective of Occam's razor."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 2", stance: for}

- id: c-zh-figure2
  type: empirical
  text: "Evaluated at points x = λx_i + (1 − λ)x_j in-between training data, a CIFAR-10 model trained with mixup has fewer misses, predictions outside {y_i, y_j}, and smaller norms of the gradients with respect to the input than a model trained with ERM."
  scope:
    models: "the same architecture and training procedure for ERM and mixup"
    data: [cifar-10]
    scale: "averages over randomly sampled pairs of training data"
    setting: "image classification"
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "figure 2", stance: for}

- id: c-cm-def
  type: definitional
  text: "CutMix generates a training sample by combining two training samples as x̃ = M ⊙ x_A + (1 − M) ⊙ x_B and ỹ = λy_A + (1 − λ)y_B, where M ∈ {0, 1}^{W×H} is a binary mask indicating where to drop out and fill in from two images, and the combination ratio λ is sampled from the beta distribution Beta(α, α), with α set to 1 in all their experiments."
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "Section 3.1", stance: for}

- id: c-cm-box
  type: definitional
  text: "CutMix samples the bounding box B = (r_x, r_y, r_w, r_h) with r_x ∼ Unif(0, W), r_w = W√(1 − λ), r_y ∼ Unif(0, H) and r_h = H√(1 − λ), making the cropped area ratio r_w r_h/(WH) = 1 − λ, and the binary mask M is filled with 0 within the bounding box and 1 otherwise."
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "Section 3.1", stance: for}

- id: c-cm-adjust
  type: attributive
  text: "In the pseudo-code of CutMix (Algorithm A1), the minibatch input and target are shuffled into input_s and target_s, lambda = Unif(0,1), r_x = Unif(0,W) and r_y = Unif(0,H), x1, x2, y1, y2 are computed with Round and Clip, input[:, :, x1:x2, y1:y2] is taken from input_s, and lambda = 1 − (x2−x1)(y2−y1)/(W·H) adjusts lambda to the exact area ratio before target = lambda · target + (1 − lambda) · target_s."
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "p. 12", stance: for}

- id: c-cm-natural
  type: attributive
  text: "Yun et al. note that the major difference from Mixup is that CutMix replaces an image region with a patch from another training image and generates a more locally natural image than Mixup does."
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "Section 3.1", stance: for}

- id: c-mm-def
  type: definitional
  text: "Manifold Mixup selects a random layer k from a set of eligible layers S, which may include the input layer, processes two random minibatches as usual until layer k, mixes their hidden representations and one-hot labels with λ ∼ Beta(α, α), continues the forward pass from layer k, and uses the output to compute the loss and gradients that update all the parameters."
  evidence:
    - {work: "verma-2019-manifold-mixup", role: original, locator: "Section 2", stance: for}

- id: c-mm-reduces
  type: attributive
  text: "Verma et al. note that with S = {0} Manifold Mixup reduces to the original mixup algorithm, that they sample a single (k, λ) per minibatch, which in practice gives the same performance as sampling per example, and that, as in Input Mixup, they mix the minibatch with a copy of itself with shuffled rows."
  evidence:
    - {work: "verma-2019-manifold-mixup", role: original, locator: "Section 2", stance: for}

# Derivation

- id: c-mixed-loss
  type: mathematical
  text: "For logits z, labels y_i and y_j and any λ in [0, 1], the cross-entropy of p = softmax(z) against the mixed target λe_{y_i} + (1 − λ)e_{y_j} equals λ(−log p_{y_i}) + (1 − λ)(−log p_{y_j}), and its gradient in the logits is p minus the mixed target."
  assumes: ["p is the softmax of finite logits", "the target is a convex combination of the one-hot labels with a weight that does not depend on the logits", "0 ≤ λ ≤ 1"]
  derivation: mixed-cross-entropy

- id: c-mixed-batch
  type: mathematical
  text: "Mixing a minibatch with a permutation π of itself and training on the targets λy + (1 − λ)y_π gives the same loss and the same gradient as the two-label form λ CE(f(x̃), y) + (1 − λ) CE(f(x̃), y_π) on the same mixed inputs, so the mixed one-hot targets never need to be formed."
  assumes: ["the loss is the cross-entropy or another loss linear in the target", "π is a permutation of the minibatch indices", "0 ≤ λ ≤ 1"]
  derivation: mixed-cross-entropy

- id: c-zh21-class
  type: attributive
  text: "Zhang et al. (2021) consider losses of the form l(θ, (x, y)) = h(f_θ(x)) − y f_θ(x), a class that includes the losses of generalized linear models such as linear regression and logistic regression, and also cross-entropy for neural networks."
  evidence:
    - {work: "zhang-2021-how-does-mixup-help", role: original, locator: "p. 3", stance: for}

- id: c-zh21-lemma
  type: attributive
  text: "Lemma 3.1 of Zhang et al. (2021) rewrites the mixup loss with λ ∼ Beta(α, β) as the standard loss plus three regularization terms R_1, R_2, R_3 and higher order terms, which shows that mixup is related to regularizing ∇f_θ(x_i) and ∇²f_θ(x_i), the first and second directional derivatives with respect to x_i."
  evidence:
    - {work: "zhang-2021-how-does-mixup-help", role: original, locator: "p. 4", stance: for}

- id: c-zh21-claims
  type: attributive
  text: "Zhang et al. (2021) show that minimizing the mixup loss corresponds to approximately minimizing an upper bound of the adversarial loss, which explains the robustness of mixup models to attacks such as the Fast Gradient Sign Method (FGSM), and prove that mixup corresponds to a specific type of data-adaptive regularization which reduces overfitting."
  evidence:
    - {work: "zhang-2021-how-does-mixup-help", role: original, locator: "p. 1", stance: for}

- id: c-beta-moments
  type: mathematical
  text: "For λ ∼ Beta(α, α), E[λ] = 1/2 and Var[λ] = 1/(4(2α + 1)); as α → 0 the distribution of λ tends to mass 1/2 at each of 0 and 1, so every mixed example is a plain training example as in ERM, and as α → ∞ it concentrates at 1/2; α = 1 gives the uniform distribution on [0, 1]."
  assumes: ["λ ∼ Beta(α, α) with α > 0"]
  derivation: beta-moments

- id: c-cutmix-area
  type: mathematical
  text: "For a box with integer corners clipped to a W × H image, the fraction of the pixels of the CutMix image that come from x_A is exactly 1 − (x2 − x1)(y2 − y1)/(WH), the adjusted λ; before clipping the box covers the fraction 1 − λ of the image, and clipping can only remove area, so up to rounding the adjusted λ is at least the sampled one."
  assumes: ["the mask is 0 inside the clipped box and 1 elsewhere", "the box has width W√(1 − λ) and height H√(1 − λ) about a center inside the image", "0 ≤ λ ≤ 1"]
  derivation: cutmix-area

- id: c-cutmix-mean
  type: mathematical
  text: "With α = 1 and the box center uniform over the image, clipping raises the mean of the adjusted λ from 1/2 to 163/240 ≈ 0.68 in the limit of a large image, so CutMix as coded keeps more of x_A on average than the sampled λ says."
  assumes: ["λ ∼ Unif(0, 1)", "the box center is uniform over the image", "the image is large enough for rounding to be negligible"]
  derivation: cutmix-area

# Hyperparameters

- id: c-zh-imagenet-alpha
  type: empirical
  text: "On ImageNet-2012, Zhang et al. find that α ∈ [0.1, 0.4] leads to improved performance over ERM, whereas for large α mixup leads to underfitting."
  scope:
    models: "ResNet-50, ResNet-101, ResNeXt-101"
    data: [imagenet]
    scale: "90 and 200 epochs, minibatch size 1,024"
    setting: "image classification"
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 3.1", stance: for}

- id: c-zh-cifar-setup
  type: attributive
  text: "For the CIFAR experiments Zhang et al. fix α = 1, which results in interpolations λ uniformly distributed between zero and one, and train for 200 epochs with 128 examples per minibatch and weight decay 10^−4, without dropout."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "p. 5", stance: for}

- id: c-cm-alpha
  type: empirical
  text: "On CIFAR-100, Yun et al. evaluated CutMix with α ∈ {0.1, 0.25, 0.5, 1.0, 2.0, 4.0}; for all α values it improves upon the baseline (16.45%), the best performance is achieved when α = 1.0, and CutMix achieves the best performance when applied on the input images rather than at higher feature levels."
  scope:
    models: "PyramidNet-200"
    data: [cifar-100]
    scale: "300 epochs"
    setting: "image classification, ablation of α and of the layer"
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "Section 4.1.3", stance: for}

- id: c-zh-warmup
  type: attributive
  text: "On the Google commands dataset, Zhang et al. use a warm-up period of five epochs in which the network trains on the original training examples, since they find it speeds up initial convergence."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 3.3", stance: for}

# Evidence

- id: c-zh-imagenet
  type: empirical
  text: "On the ImageNet-2012 development set after 90 epochs, the top-1 error of ResNet-50 goes from 23.5 with ERM to 23.3 with mixup α = 0.2 and that of ResNet-101 from 22.1 to 21.5; after 200 epochs ResNet-50 goes from 23.6 to 22.1 and ResNet-101 from 22.0 to 20.8."
  scope:
    models: "ResNet-50, ResNet-101"
    data: [imagenet]
    scale: "90 and 200 epochs, central 224 × 224 crop"
    setting: "image classification"
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "table 1", stance: for}

- id: c-zh-capacity
  type: empirical
  text: "Zhang et al. find that models with higher capacities and longer training runs benefit the most from mixup: at 90 epochs ResNet-101 and ResNeXt-101 gain 0.5% to 0.6% over ERM against 0.2% for ResNet-50, and at 200 epochs the mixup ResNet-50 is a further 1.2% better than at 90 epochs while its ERM analogue stays the same."
  scope:
    models: "ResNet-50, ResNet-101, ResNeXt-101"
    data: [imagenet]
    scale: "90 and 200 epochs"
    setting: "image classification"
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 3.1", stance: for}

