# Limitations and failure modes

- id: c-zh-sweet-spot
  type: attributive
  text: "Zhang et al. observe that with increasingly large α the training error on real data increases while the generalization gap decreases, that they do not yet have a good theory for the sweet spot of this bias-variance trade-off, and that in CIFAR-10 the training error on real data stays very low even when α → ∞, whereas in ImageNet it increases significantly."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 5", stance: for}

- id: c-zh-conjecture
  type: attributive
  text: "Based on their ImageNet and Google commands experiments, Zhang et al. conjecture that increasing the model capacity would make training error less sensitive to large α, giving mixup a more significant advantage."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 5", stance: for}

- id: c-zh-structured
  type: attributive
  text: "Zhang et al. write that generalizing mixup to regression problems is straightforward, while its application to structured prediction problems such as image segmentation remains less obvious."
  evidence:
    - {work: "zhang-2018-mixup", role: original, locator: "Section 5", stance: for}

- id: c-cm-ambiguous
  type: attributive
  text: "Yun et al. write that Mixup samples suffer from the fact that they are locally ambiguous and unnatural, and therefore confuse the model, especially for localization."
  evidence:
    - {work: "yun-2019-cutmix", role: original, locator: "Section 2", stance: for}

# Variants

- id: c-mm-flatten
  type: attributive
  text: "Verma et al. write that neural networks trained with Manifold Mixup have smoother decision boundaries at multiple levels of representation and learn class-representations with fewer directions of variance."
  evidence:
    - {work: "verma-2019-manifold-mixup", role: original, locator: "the abstract", stance: for}

- id: c-mm-theorem
  type: attributive
  text: "Theorem 1 of Verma et al. states that if the dimension of the representation space H satisfies dim(H) ≥ d − 1, where d is the number of classes, the Manifold Mixup loss can reach zero with a linear classifier, and Corollary 1 that for dim(H) > d − 1 the minimizing representations of the training points fall on a (dim(H) − d + 1)-dimensional subspace."
  evidence:
    - {work: "verma-2019-manifold-mixup", role: original, locator: "Section 3.1", stance: for}

- id: c-cm-feature
