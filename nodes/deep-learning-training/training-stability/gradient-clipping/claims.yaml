    - {work: "zhang-2020-why-gradient-clipping-accelerates", role: original, locator: "p. 19", stance: for}

- id: c-awd-ppl
  type: empirical
  text: "The AWD-LSTM model is trained for 500 epochs and reaches a test-set perplexity of 56.5 on PTB."
  scope:
    models: "3-layer AWD-LSTM, hidden size 1150, embedding size 400"
    data: ["Penn Treebank"]
    scale: "500 epochs"
    setting: "clipped SGD, clip value 0.25, learning rate 30"
  evidence:
    - {work: "zhang-2020-why-gradient-clipping-accelerates", role: original, locator: "p. 18", stance: for}

- id: c-agc-scale
  type: empirical
  text: "AGC helps scale NF-ResNets to large batch sizes, up to 4096, while maintaining performance comparable or better than batch-normalized networks, and the benefits of AGC are smaller when the batch size is small."
  scope:
    models: "pre-activation NF-ResNet-50 and NF-ResNet-200; batch-normalized ResNets"
    data: ["ImageNet"]
    scale: "batch sizes 256 to 4096, 90 epochs"
    setting: "SGD with Nesterov momentum, best clipping threshold per batch size"
  evidence:
    - {work: "brock-2021-image-recognition-without-normalization", role: original, locator: "p. 4", stance: for}

- id: c-agc-randaugment
  type: empirical
  text: "Using AGC, NF-ResNets train stably with very strong data augmentations like RandAugment, for which NF-ResNets without AGC fail to train."
  scope:
    models: "NF-ResNets"
    data: ["ImageNet"]
    scale: "unknown"
    setting: "RandAugment data augmentation"
  evidence:
    - {work: "brock-2021-image-recognition-without-normalization", role: original, locator: "p. 4", stance: for}

- id: c-lstm-no-explode
  type: attributive
  text: "LSTM units are a solution for the vanishing gradients problem, and this solution does not address explicitly the exploding gradients problem."
  evidence:
    - {work: "pascanu-2013-difficulty-training-recurrent", role: original, locator: "p. 6", stance: for}

- id: c-m-bias
  type: mathematical
  text: "If g is 0 or 4 with probability 1/2 each and c = 1, the expected clipped value is 0.5 while the clipped expected value is 1."
