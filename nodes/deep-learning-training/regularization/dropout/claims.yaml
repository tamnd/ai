# The claims of the dropout page (spec 07). The build computes the labels.
- id: c-inverted-scaling
  type: mathematical
  text: "With inverted dropout, the expected value of each output unit equals its input: E[h_j m_j / (1 - p)] = h_j."
  assumes: ["each mask entry m_j is Bernoulli with mean 1 - p", "0 <= p < 1"]
  derivation: "node.md#derivation"

- id: c-noise-variance
  type: mathematical
  text: "With inverted dropout, the variance of an output unit is p / (1 - p) times the square of its input."
  assumes: ["each mask entry m_j is Bernoulli with mean 1 - p", "0 <= p < 1", "the input h_j is fixed"]
  derivation: "node.md#derivation"

- id: c-linear-ridge
  type: mathematical
  text: "Dropout on the inputs of linear regression is equivalent, in expectation, to ridge regression, with the weight cost of each weight scaled by the data of its input dimension."
  assumes: ["the model is linear", "the loss is the squared error", "the mask entries are independent and Bernoulli with mean 1 - p"]
  derivation: "node.md#derivation"
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "Section 9.1", stance: for}

- id: c-adaptive-l2
  type: mathematical
  text: "For generalized linear models, the dropout regularizer is first-order equivalent to an L2 regularizer applied after scaling the features by an estimate of the inverse diagonal Fisher information matrix."
  assumes: ["the model is a generalized linear model", "a second-order expansion of the loss in the noise"]
  evidence:
    - {work: "wager-2013-dropout-adaptive-regularization", role: original, locator: "the abstract, Section 2.1", stance: for}

- id: c-geometric-mean
  type: mathematical
  text: "For one logistic unit, the network with scaled weights gives the normalized weighted geometric mean of the outputs of all its dropout sub-networks."
  assumes: ["one layer with a logistic output", "independent dropout on the inputs of the unit"]
  evidence:
    - {work: "baldi-2013-understanding-dropout", role: original, locator: "Section 3.1", stance: for}

- id: c-reduces-error
  type: empirical
  text: "Dropout gave a lower test error than the same networks without dropout on MNIST, SVHN, CIFAR-10, CIFAR-100, TIMIT and Reuters."
  scope:
    models: "feedforward and convolutional networks of 2012 to 2014"
    data: [mnist, svhn, cifar-10, cifar-100, timit, reuters-rcv1]
    scale: "unknown"
    setting: "supervised classification, SGD with momentum, often with max-norm constraints"
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "Section 6 and Tables 2 to 9", stance: for}
  exp: [mlp-mnist-2k, mlp-mnist-6k]
  small_scale: "yes"
  small_scale_note: "A small multilayer perceptron on MNIST shows the effect on one GPU or a CPU in minutes."

- id: c-weight-scaling-close
  type: empirical
  text: "On MNIST, the weight scaling rule at test time gave about the same test error as the average of the predictions of about 50 sampled masks."
  scope:
    models: "the dropout networks of the MNIST experiments"
    data: [mnist]
    scale: "unknown"
    setting: "test-time inference with sampled masks against weight scaling"
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "Section 7.5, Figure 11", stance: for}
  small_scale: "yes"
  small_scale_note: "The comparison needs one trained network and repeated forward passes."

- id: c-slower-training
  type: empirical
  text: "A dropout network typically takes two to three times longer to train than a standard network of the same architecture."
  scope:
    models: "the networks of the study"
    data: [unknown]
    scale: "unknown"
    setting: "the authors' report of their own experiments"
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "Section 11", stance: for}

- id: c-variance-shift
  type: empirical
  text: "Dropout placed before batch normalization changes the variance of the units from training to inference, and this variance shift can lower the test accuracy."
  scope:
    models: "convolutional networks with batch normalization, such as ResNet, ResNeXt, DenseNet and Wide ResNet"
    data: [cifar-10, cifar-100]
    scale: "unknown"
    setting: "image classification"
  evidence:
    - {work: "li-2019-disharmony-dropout-batch-normalization", role: original, locator: "Section 1", stance: for}

- id: c-typical-rates
  type: attributive
  text: "Srivastava et al. recommend keeping hidden units with probability 0.5 to 0.8 and real-valued inputs with probability 0.8."
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "Appendix A.4", stance: for}

- id: c-rnn-nonrecurrent
  type: attributive
  text: "Zaremba et al. apply dropout only to the non-recurrent connections of an LSTM."
  evidence:
    - {work: "zaremba-2014-recurrent-neural-network-regularization", role: original, locator: "Section 3.2", stance: for}

- id: c-llm-no-dropout
  type: historical
  text: "The PaLM model was trained without dropout, and dropout of 0.1 is used for finetuning in most cases."
  evidence:
    - {work: "chowdhery-2022-palm", role: original, locator: "Section 5", stance: for}

- id: c-mc-dropout
  type: definitional
  text: "MC dropout performs $T$ stochastic forward passes through the network with dropout on, averages the results, and estimates the uncertainty of the model from the same passes."
  evidence:
    - {work: "gal-2016-dropout-bayesian-approximation", role: original, locator: "Section 4", stance: for}

- id: c-first-2012
  type: historical
  text: "In the 2012 preprint arXiv 1207.0580, Hinton, Srivastava, Krizhevsky, Sutskever and Salakhutdinov reduced overfitting by randomly omitting half of the feature detectors on each training case, and called it dropout."
  evidence:
    - {work: "hinton-2012-improving-neural-networks-arxiv", role: original, locator: "the title page", stance: for}

- id: c-canonical-2014
  type: historical
  text: "Srivastava et al. (2014) is published in the Journal of Machine Learning Research 15, pages 1929 to 1958."
  evidence:
    - {work: "srivastava-2014-dropout-jmlr", role: original, locator: "the title page", stance: for}

- id: c-alexnet
  type: historical
  text: "AlexNet used dropout in its first two fully connected layers, and a variant of it won ILSVRC-2012."
  evidence:
    - {work: "krizhevsky-2012-imagenet-classification", role: original, locator: "Section 4.2, the abstract", stance: for}
