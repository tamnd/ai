id: mlp-mnist-2k
claims: [c-reduces-error]
question: "Does dropout lower the test error of a 2-hidden-layer MLP trained on the first 2000 training images of MNIST?"
scale_note:
  here: "A 2-hidden-layer MLP with 256 ReLU units per layer, trained on the first 2000 training images of MNIST for 100 epochs and tested on the full test set of 10,000 images."
  source: "Srivastava et al. (2014) report it on full MNIST with 60,000 training images, larger networks and max-norm constraints."
replicates: null
arms:
  - {id: no-dropout, config: {p: 0.0, p_input: 0.0}}
  - {id: dropout, config: {p: 0.5, p_input: 0.2}}
base_config:
  model: {hidden: [256, 256], activation: relu}
  optimizer: {name: sgd, lr: 0.05, momentum: 0.9}
  epochs: 100
  batch_size: 64
  train_images: 2000
  test_images: 10000
data:
  - {dataset: mnist, version: "lecun-1998", subset: "train[:2000], test", pin: "S:mnist-ai-data"}
seeds: {n: 5, base: 20261113}  # 10 seeds of both arms do not fit the 600 seconds of cpu-small; the power with 5 is about 1, from a pilot of 6 seeds (rule R07)
budget: cpu-small
framework: pytorch
uses_impl: ../../impl/pytorch/dropout.py
metrics: [test_error, test_loss, train_loss, train_error]
