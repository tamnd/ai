# Evidence: representations

- id: c-mu-constant-gap
  type: attributive
  text: "Müller et al. state that training with label smoothing encourages the differences between the logit of the correct class and the logits of the incorrect classes to be a constant dependent on α, while training with hard targets typically makes the correct logit much larger than any incorrect logit and allows the incorrect logits to be very different from one another."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-template
  type: attributive
  text: "Müller et al. read the logit x^T w_k as a measure of the squared Euclidean distance between the penultimate-layer activations x and a template w_k, since ||x − w_k||^2 = x^T x − 2x^T w_k + w_k^T w_k, where x^T x is factored out when calculating the softmax and w_k^T w_k is usually constant across classes."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-equidistant
  type: attributive
  text: "Müller et al. conclude that label smoothing encourages the activations of the penultimate layer to be close to the template of the correct class and equally distant to the templates of the incorrect classes."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-visualization
  type: definitional
  text: "The visualization of Müller et al. picks three classes, finds an orthonormal basis of the plane crossing the templates of these three classes, and projects the penultimate layer activations of examples from these three classes onto this plane."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-tight
  type: empirical
  text: "For AlexNet on CIFAR-10, the projections of a network trained without label smoothing spread into defined but broad clusters, while with a label smoothing factor of 0.1 the clusters are much tighter and organize in regular triangles, although the two networks have similar accuracies."
  scope:
    models: "AlexNet"
    data: [cifar-10]
    scale: "the classes airplane, automobile and bird"
    setting: "projection of the penultimate layer activations of training and validation examples"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-table2
  type: empirical
  text: "The networks of the visualizations had top-1 accuracies, without and with label smoothing of 0.1, of 86.8 ± 0.2 and 86.7 ± 0.3 for AlexNet on CIFAR-10, 72.1 ± 0.3 and 72.7 ± 0.3 for ResNet-56 on CIFAR-100, and 80.9 and 80.9 for Inception-v4 on ImageNet."
  scope:
    models: "AlexNet, ResNet-56, Inception-v4"
    data: [cifar-10, cifar-100, imagenet]
    scale: "the networks used in the visualizations"
    setting: "image classification, α = 0.0 against α = 0.1"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "table 2", stance: for}

- id: c-mu-scale
  type: attributive
  text: "Müller et al. note that with label smoothing the difference between the logits of two classes has to be limited in absolute value to get the desired soft target, while without it the projection can take much higher absolute values, which represent over-confident predictions."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-poodles
  type: empirical
  text: "For two semantically similar ImageNet classes, toy poodle and miniature poodle, hard targets give clusters close to each other with an isotropic spread, while with label smoothing the similar classes lie in an arc."
  scope:
    models: "Inception-v4"
    data: [imagenet]
    scale: "two similar classes and the class tench"
    setting: "projection of the penultimate layer activations"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 2", stance: for}

- id: c-mu-erased
  type: attributive
  text: "Müller et al. observe that without label smoothing there is a continuous degree of change between the tench cluster and the poodles cluster, so that one could measure how much a poodle is a particular tench, but that with label smoothing this information is virtually erased."
