# Evidence: calibration

- id: c-mu-guo
  type: attributive
  text: "Müller et al. recall that Guo et al. showed modern neural networks to be poorly calibrated and over-confident, measured calibration by the expected calibration error (ECE), and reduced it with temperature scaling, which multiplies the logits by a scalar before applying the softmax."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-calibrates
  type: attributive
  text: "Müller et al. show that label smoothing also reduces ECE and can be used to calibrate a network without the need for temperature scaling."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-ece
  type: empirical
  text: "Table 3 of Müller et al. gives an ECE of 0.150 for ResNet-56 on CIFAR-100 with hard targets, 0.021 after temperature scaling at T = 1.9 and 0.024 with label smoothing of 0.05; for Inception-v4 on ImageNet 0.071, 0.022 at T = 1.4 and 0.035 with 0.1; and for the Transformer on EN-DE 0.056, 0.018 at T = 1.13 and 0.019 with 0.1."
  scope:
    models: "ResNet-56, Inception-v4, Transformer"
    data: [cifar-100, imagenet, wmt-2014-en-de]
    scale: "15-bin reliability diagrams"
    setting: "expected calibration error of the baseline, of temperature scaling, and of label smoothing at T = 1.0"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "table 3", stance: for}

- id: c-mu-imagenet-untuned
  type: attributive
  text: "Müller et al. did not tune α extensively on ImageNet, and found that label smoothing of 0.1 improves ECE to 0.035, better calibrated than the unscaled network trained with hard targets."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-surprising
  type: attributive
  text: "Müller et al. find this somewhat surprising: despite trying to collapse the training examples to tiny clusters, these networks generalize and are calibrated, and in the validation set the tight training cluster spreads towards the center, representing the full range of confidences."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-beam
  type: attributive
  text: "Müller et al. argue that in translation the network's soft outputs are inputs to beam search, which approximates a maximum likelihood sequence detection algorithm and is affected by calibration, so a better calibrated model is expected to perform better."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-nll
  type: empirical
  text: "For the Transformer on English-to-German, label smoothing gives better calibration and better BLEU scores but worse negative log-likelihood than hard targets at all temperature scaling settings, and temperature scaling with hard targets is insufficient to recover the BLEU improvement of label smoothing."
  scope:
    models: "Transformer"
    data: [wmt-2014-en-de]
    scale: "next-token predictions with a correct prefix on the validation set"
    setting: "machine translation, α = 0.1 against hard targets with temperature scaling"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

- id: c-mu-partly
  type: attributive
  text: "Müller et al. conclude that label smoothing improves translation quality measured by BLEU despite worse NLL, that the difference in BLEU is only partly explained by calibration, and that changing the temperature of the network trained with label smoothing degrades both calibration and BLEU score."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 3", stance: for}

# Evidence: distillation

- id: c-mu-mnist-distill
  type: empirical
  text: "A non-convolutional teacher trained on translated MNIST with hard targets and dropout gets 0.67% test error and distills into a student with 0.74%; with label smoothing instead of dropout the teacher trains much faster and does slightly better, 0.59%, but distillation produces a much worse student with 0.91% test error."
  scope:
    models: "non-convolutional teacher, narrower unregularized student"
    data: [mnist]
    scale: "one teacher of each kind"
    setting: "knowledge distillation"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

- id: c-mu-distill-useful
  type: attributive
  text: "Müller et al. note that both label smoothing and knowledge distillation fit a model using soft targets, so distillation is only useful if it gives the student an additional gain over training it with label smoothing, which is simpler because it does not require training a teacher."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

- id: c-mu-cifar-distill
  type: empirical
  text: "Distilling a ResNet-56 teacher into an AlexNet student on CIFAR-10 with β = 1, increasing α improves the teacher's accuracy up to α = 0.6 and slightly degrades the student baseline; all students distilled from a teacher trained with hard targets outperform the student trained with label smoothing, while teachers trained with label smoothing are no better, and sometimes worse, than training the student directly with label smoothing."
  scope:
    models: "ResNet-56 teacher, AlexNet student"
    data: [cifar-10]
    scale: "a sweep of the label smoothing factor and of the distillation temperature"
    setting: "knowledge distillation with the true labels ignored"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

- id: c-mu-better-teacher
  type: attributive
  text: "Müller et al. explain that label smoothing encourages examples to lie in tight equally separated clusters, so every example of one class has very similar proximities to examples of the other classes, and a teacher with better accuracy is not necessarily the one that distills better."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

- id: c-mu-mi
  type: empirical
  text: "The estimated mutual information between the index of N = 600 training examples from two classes and the difference of the two logits first increases rapidly during training and then slowly decreases, especially for the network trained with label smoothing, and later in training stays slightly above log(2), the case where all training examples collapse to two separate clusters."
  scope:
    models: "the teacher networks of the distillation experiment"
    data: [cifar-10]
    scale: "600 training examples from two classes"
    setting: "mutual information under data augmentation with a Gaussian approximation"
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

- id: c-mu-conclusion
  type: attributive
  text: "Müller et al. conclude that with label smoothing the model is encouraged to treat each incorrect class as equally probable, while hard targets enforce less structure in later representations and allow more logit variation across predicted class and across examples, and that label smoothing reduces the mutual information between input example and output logit."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 6", stance: for}

# Variants and related work

- id: c-mu-disturblabel
  type: attributive
  text: "Müller et al. relate label smoothing to DisturbLabel, which can be seen as label dropout, whereas label smoothing is the marginalized version of label dropout."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 5", stance: for}

- id: c-mu-unigram
  type: attributive
  text: "Müller et al. note that Pereyra et al. also propose distributions other than uniform, giving unigram label smoothing, which is advantageous when the distribution of the output labels is not balanced."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 5", stance: for}

- id: c-mu-kornblith
  type: attributive
  text: "Müller et al. cite Kornblith et al. as having demonstrated that label smoothing impairs the accuracy of transfer learning, which similarly depends on the presence of non-class-relevant information in the final layers of the network."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 5", stance: for}

- id: c-mu-chorowski-beam
  type: attributive
  text: "Müller et al. report that Chorowski and Jaitly concluded that both temperature scaling and label smoothing improve word error rates after beam search, with label smoothing performing best."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 5", stance: for}

- id: c-pe-anneal
  type: attributive
  text: "Pereyra et al. note that in supervised learning one wants quick convergence while preventing overfitting near the end of training, which suggests annealing the confidence penalty, or applying it only when the entropy of the output is below a threshold through a hinge loss."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3.1", stance: for}

- id: c-pe-functional
  type: attributive
  text: "Pereyra et al. view the knowledge of a model as the conditional distribution it produces over outputs given an input, so the probabilities assigned to incorrect class labels are part of the knowledge of the network and an indication of how it generalizes."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 1", stance: for}

- id: c-pe-invariant
  type: attributive
  text: "Pereyra et al. note that by operating on the output distribution, which has a natural scale, rather than on internal weights, output regularization is invariant to the parameterization of the underlying neural network."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 1", stance: for}

# History

- id: c-hist-szegedy
  type: historical
  text: "Christian Szegedy, Vincent Vanhoucke, Sergey Ioffe and Jonathon Shlens of Google Inc. and Zbigniew Wojna of University College London wrote Rethinking the Inception Architecture for Computer Vision, posted as arXiv 1512.00567."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "the title page", stance: for}

- id: c-mu-intro
  type: historical
  text: "Müller et al. write that Szegedy et al. introduced label smoothing, which improves accuracy by computing cross entropy not with the hard targets from the dataset but with a weighted mixture of these targets with the uniform distribution."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 1", stance: for}

- id: c-hist-muller
  type: historical
  text: "Rafael Müller, Simon Kornblith and Geoffrey Hinton of Google Brain in Toronto wrote When Does Label Smoothing Help?, published at the 33rd Conference on Neural Information Processing Systems (NeurIPS 2019) in Vancouver."
  evidence:
