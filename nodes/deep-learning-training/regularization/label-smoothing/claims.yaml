  text: "In their ImageNet experiments with K = 1000 classes, Szegedy et al. used u(k) = 1/1000 and ε = 0.1, and found on ILSVRC 2012 a consistent improvement of about 0.2% absolute both for the top-1 error and the top-5 error."
  scope:
