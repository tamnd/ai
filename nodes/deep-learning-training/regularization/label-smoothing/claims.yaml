# The claims of the label smoothing page (spec 07). The build computes the labels.

# Setting

- id: c-sz-softmax
  type: definitional
  text: "For each training example x, the model of Szegedy et al. computes the probability of each label k in {1 ... K} as p(k|x) = exp(z_k) / Σ_i exp(z_i), where z_i are the logits or unnormalized log-probabilities."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 6", stance: for}

- id: c-sz-loss
  type: definitional
  text: "Szegedy et al. define the loss for an example as the cross entropy ℓ = −Σ_k log(p(k)) q(k) with the ground-truth distribution over labels q(k|x); minimizing it is equivalent to maximizing the expected log-likelihood of a label selected according to its ground-truth distribution."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 6", stance: for}

- id: c-sz-gradient
  type: attributive
  text: "Szegedy et al. note that the gradient of the cross-entropy loss with respect to the logits has the simple form ∂ℓ/∂z_k = p(k) − q(k), which is bounded between −1 and 1."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 6", stance: for}

- id: c-sz-unreachable
  type: attributive
  text: "For a single ground-truth label y the log-likelihood is maximized for q(k) = δ_{k,y}; this maximum is not achievable for finite logits but is approached if the logit of the ground-truth label is much greater than all other logits."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-two-problems
  type: attributive
  text: "Szegedy et al. state that this can cause two problems: over-fitting, since a model that assigns full probability to the ground-truth label of each training example is not guaranteed to generalize, and large differences between the largest logit and all others, which combined with the bounded gradient reduce the ability of the model to adapt."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-too-confident
  type: attributive
  text: "Szegedy et al. say that intuitively this happens because the model becomes too confident about its predictions, and propose a mechanism for encouraging the model to be less confident, which may not be desired if the goal is to maximize the log-likelihood of training labels but does regularize the model and makes it more adaptable."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

# The method

- id: c-sz-mixture
  type: definitional
  text: "For a training example with ground-truth label y, label smoothing replaces the label distribution q(k|x) = δ_{k,y} with q'(k|x) = (1 − ε)δ_{k,y} + εu(k), a mixture of the original ground-truth distribution and a fixed distribution u(k), independent of the training example, with weights 1 − ε and ε."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-sampling
  type: attributive
  text: "Szegedy et al. note that q' can be seen as the distribution of the label obtained by first setting it to the ground-truth label k = y and then, with probability ε, replacing k with a sample drawn from the distribution u(k)."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-uniform
  type: definitional
  text: "Szegedy et al. propose to use the prior distribution over labels as u(k), and in their experiments used the uniform distribution u(k) = 1/K, so that q'(k) = (1 − ε)δ_{k,y} + ε/K; they refer to this change in the ground-truth label distribution as label-smoothing regularization, or LSR."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-label-dropout
  type: attributive
  text: "Szegedy et al. propose label smoothing as a mechanism to regularize the classifier layer by estimating the marginalized effect of label-dropout during training."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 6", stance: for}

- id: c-mu-ls-definition
  type: definitional
  text: "Müller et al. write the targets of label smoothing with parameter α as y_k^LS = y_k(1 − α) + α/K, where y_k is 1 for the correct class and 0 for the rest, and minimize the cross-entropy between these modified targets and the network's outputs p_k instead of the cross-entropy with the hard targets."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 1.1", stance: for}

- id: c-sz-lower-bound
  type: attributive
  text: "Szegedy et al. note that LSR prevents the largest logit from becoming much larger than all others: if it did, a single probability would approach 1 while all others approach 0, which would result in a large cross-entropy with q', because unlike the hard target all q'(k) have a positive lower bound."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-pe-overconfident
  type: attributive
  text: "Pereyra et al. write that confident predictions correspond to output distributions with low entropy, and that a network is overconfident when it places all probability on a single class in the training set, which is often a symptom of overfitting."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3", stance: for}

# Derivation: the pair of losses

- id: c-sz-pair
  type: attributive
  text: "Szegedy et al. write the cross entropy with the smoothed labels as H(q', p) = −Σ_k log p(k) q'(k) = (1 − ε)H(q, p) + εH(u, p), so that LSR is equivalent to replacing a single cross-entropy loss H(q, p) with a pair of such losses H(q, p) and H(u, p)."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-kl
  type: attributive
  text: "Szegedy et al. note that the second loss penalizes the deviation of the predicted label distribution p from the prior u, and that this deviation could be equivalently captured by the KL divergence, since H(u, p) = D_KL(u‖p) + H(u) and H(u) is fixed."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-sz-negentropy
  type: attributive
  text: "Szegedy et al. note that when u is the uniform distribution, H(u, p) measures how dissimilar the predicted distribution p is to uniform, which could also be measured, but not equivalently, by the negative entropy −H(p), and that they did not experiment with this approach."
  evidence:
    - {work: "szegedy-2016-rethinking-inception", role: original, locator: "p. 7", stance: for}

- id: c-decomposition
  type: mathematical
  text: "For any distribution u over the K classes and any ε in [0, 1], the cross-entropy of the predicted distribution p against the smoothed target (1 − ε)δ_y + εu equals (1 − ε)(−log p_y) + εH(u, p), where H(u, p) = −Σ_k u_k log p_k."
  assumes: ["p is a distribution with p_k > 0 for every k, as a softmax gives", "u is a distribution over the K classes", "0 ≤ ε ≤ 1"]
  derivation: smoothed-cross-entropy

- id: c-kl-form
  type: mathematical
  text: "With the uniform distribution u = 1/K, the smoothed cross-entropy equals (1 − ε)(−log p_y) + ε D_KL(u‖p) + ε log K, so up to a constant label smoothing adds ε D_KL(u‖p) to (1 − ε) times the negative log-likelihood."
  assumes: ["u is uniform over K classes", "p_k > 0 for every k", "0 ≤ ε ≤ 1"]
  derivation: smoothed-cross-entropy

- id: c-confidence-relation
  type: mathematical
  text: "For the uniform distribution u over K classes, the negative entropy satisfies −H(p) = D_KL(p‖u) − log K, so the confidence penalty −βH(p) equals β D_KL(p‖u) up to a constant, while label smoothing penalizes D_KL(u‖p): the two penalize the two directions of the same divergence."
  assumes: ["u is uniform over K classes", "p_k > 0 for every k"]
  derivation: smoothed-cross-entropy

- id: c-marginalized
  type: mathematical
  text: "If the label is kept with probability 1 − ε and otherwise replaced by a draw from u, the expected cross-entropy over this label noise equals the cross-entropy with the smoothed target q' = (1 − ε)δ_y + εu, because the cross-entropy is linear in the target."
  assumes: ["the replacement is drawn independently of the input given the label", "the prediction p does not depend on the drawn label"]
  derivation: smoothed-cross-entropy

- id: c-gradient
  type: mathematical
  text: "The gradient of the smoothed cross-entropy with respect to the logits is p − q', whose entries lie in [−1, 1] and sum to 0; with ε = 0 this is the p − q of hard targets."
  assumes: ["p is the softmax of the logits", "q' is a distribution that does not depend on the logits"]
  derivation: smoothed-cross-entropy

- id: c-pe-ls-kl
  type: attributive
  text: "Pereyra et al. state that label smoothing estimates the marginalized effect of label noise during training, and that when the prior label distribution is uniform it is equivalent to adding the KL divergence between the uniform distribution u and the network's predicted distribution to the negative log-likelihood."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3.2", stance: for}

- id: c-pe-reverse
  type: attributive
  text: "Pereyra et al. state that by reversing the direction of the KL divergence, D_KL(p_θ(y|x)‖u), one recovers the confidence penalty, and that this interpretation suggests further confidence regularizers with target distributions other than the uniform one."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3.2", stance: for}

- id: c-pe-penalty
  type: definitional
  text: "The confidence penalty of Pereyra et al. adds the negative entropy to the negative log-likelihood during training, L(θ) = −Σ log p_θ(y|x) − βH(p_θ(y|x)), where β controls the strength of the confidence penalty."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3", stance: for}

- id: c-pe-entropy-grad
  type: attributive
  text: "Pereyra et al. note that the gradient of the entropy term with respect to the i-th logit is p_θ(y_i|x)(−log p_θ(y_i|x) − H(p_θ)), which is the weighted deviation from the mean."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3", stance: for}

- id: c-mu-distill-loss
  type: definitional
  text: "In knowledge distillation as Müller et al. describe it, the cross-entropy H(y, p) is replaced by the weighted sum (1 − β)H(y, p) + βH(p^t(T), p(T)), where p(T) and p^t(T) are the outputs of the student and the teacher after temperature scaling with temperature T."
  evidence:
    - {work: "muller-2019-when-does-label-smoothing-help", role: original, locator: "Section 4", stance: for}

# Derivation: the optimal logits

- id: c-optimum
  type: mathematical
  text: "For a fixed smoothed target q', the smoothed cross-entropy of one example is smallest exactly when p = q', by Gibbs' inequality, and its minimum is the entropy H(q'), which is positive for ε > 0."
  assumes: ["the softmax can produce any distribution with positive entries", "0 < ε ≤ 1 so that every entry of q' is positive"]
  derivation: optimal-logits

- id: c-logit-gap
  type: mathematical
  text: "With uniform smoothing, the logits that minimize the loss put every incorrect logit below the correct one by the same gap log((1 − ε + ε/K)/(ε/K)) = log(1 + K(1 − ε)/ε), while with ε = 0 the loss has no minimizer with finite logits and the gap grows without bound under gradient descent."
  assumes: ["u is uniform over K ≥ 2 classes", "0 < ε < 1 for the finite gap", "the logits are free parameters"]
  derivation: optimal-logits

- id: c-gap-imagenet
  type: mathematical
  text: "For K = 1000 and ε = 0.1, the setting of Szegedy et al. on ImageNet, the optimal logit gap is log 9001, about 9.105, and the largest probability the loss rewards is 0.9001."
  assumes: ["u is uniform over K = 1000 classes", "ε = 0.1"]
  derivation: optimal-logits

- id: c-convention
  type: mathematical
  text: "Spreading ε over the K − 1 incorrect classes, ε/(K − 1) each with 1 − ε on the correct class, gives the same target as uniform smoothing over all K classes with ε' = εK/(K − 1)."
  assumes: ["K ≥ 2", "0 ≤ ε ≤ (K − 1)/K so that ε' ≤ 1"]
  derivation: optimal-logits

