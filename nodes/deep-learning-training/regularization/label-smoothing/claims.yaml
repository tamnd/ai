- id: c-th-ls-compare
  type: empirical
  text: "For label smoothing, an epsilon in [0.05, 0.1] performed best; label smoothing either via epsilon-smoothing, ERL or mixup generally provides a calibration advantage and tempers overconfidence, with the latter generally performing the best in comparison to other methods."
  scope:
    models: "various architectures"
    data: [unknown]
    scale: "unknown"
    setting: "calibration of label smoothing, the entropy confidence penalty and mixup"
  evidence:
    - {work: "thulasidasan-2019-mixup-training-calibration", role: original, locator: "p. 5", stance: for}

- id: c-th-ls-imagenet
  type: empirical
  text: "On the deeper ResNext-101, mixup provides better calibration than the label smoothing models, though this same effect was not visible for the ResNet-50 model; both calibration error and overconfidence show noticeable improvements using label smoothing over the baseline."
  scope:
    models: "ResNet-50 and ResNeXt-101"
    data: [imagenet]
    scale: "unknown"
    setting: "calibration and overconfidence against the baseline"
  evidence:
