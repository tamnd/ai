- id: c-hist-pereyra
  type: historical
  text: "Gabriel Pereyra, George Tucker, Jan Chorowski and Łukasz Kaiser of Google Brain and Geoffrey Hinton of the University of Toronto and Google Brain posted Regularizing Neural Networks by Penalizing Confident Output Distributions as arXiv 1701.06548 in January 2017, under review as a conference paper at ICLR 2017."
  evidence:
