# Evidence: the confidence penalty comparison

- id: c-pe-abstract
  type: attributive
  text: "Pereyra et al. evaluate the confidence penalty and label smoothing on 6 common benchmarks in image classification, language modeling, machine translation and speech recognition, and find that both improve state-of-the-art models without modifying existing hyperparameters."
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "the abstract", stance: for}

- id: c-pe-fig1
  type: empirical
  text: "On the MNIST validation set, a fully-connected 2-layer network with 1024 units trained with dropout gives softmax probabilities that are either 0 or 1, while label smoothing and the confidence penalty both lead to smoother output distributions."
  scope:
    models: "fully-connected network, 2 layers of 1024 units"
    data: [mnist]
    scale: "the validation set"
    setting: "the distribution of the magnitude of the softmax probabilities"
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 3", stance: for}

- id: c-pe-mnist
  type: empirical
  text: "On permutation-invariant MNIST, Pereyra et al. varied the smoothing parameter over 0.05 to 0.5 and found 0.1 to work best, and report test errors of 1.28 ± 0.06% with dropout, 1.23 ± 0.06% with label smoothing and 1.17 ± 0.06% with the confidence penalty."
  scope:
    models: "fully-connected ReLU network, 2 hidden layers of 1024 units"
    data: [mnist]
    scale: "60k training and 10k test images"
    setting: "image classification, SGD with a constant learning rate"
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 4.1.1", stance: for}

- id: c-pe-gradnorm
  type: empirical
  text: "Pereyra et al. observed that label smoothing and the confidence penalty had smaller gradient norms and converged more quickly than models regularized with dropout, and suggest that this is because a model whose output is peaked on a misclassified example receives a large gradient."
  scope:
    models: "fully-connected ReLU network, 2 hidden layers of 1024 units"
    data: [mnist]
    scale: "one training run per method"
    setting: "the norm of the gradient during training"
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 4.1.1", stance: for}

- id: c-pe-cifar
  type: empirical
  text: "On CIFAR-10 without data augmentation, a 40-layer densely connected CNN had test errors of 7.04% with dropout, 6.89% with dropout and label smoothing, for which 0.1 worked best, and 6.77% with dropout and the confidence penalty; with data augmentation the confidence penalty did not improve performance, and neither did dropout."
  scope:
    models: "DenseNet with 40 layers and growth rate 12"
    data: [cifar-10]
    scale: "300 epochs"
    setting: "image classification without data augmentation"
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "p. 5", stance: for}

- id: c-pe-ptb
  type: empirical
  text: "On word-level Penn Treebank the confidence penalty significantly outperformed label noise and label smoothing, with test perplexities of 77.7 with label noise, 76.6 with label smoothing, 76.3 with unigram smoothing and 74.7 with the confidence penalty; 0.1 worked best for label smoothing."
  scope:
    models: "2-layer LSTM with 1500 units and 65% dropout"
    data: [penn-treebank]
    scale: "55 epochs"
    setting: "word-level language modeling"
  evidence:
    - {work: "pereyra-2017-penalizing-confident-outputs", role: original, locator: "Section 4.2", stance: for}

- id: c-pe-wmt
  type: empirical
  text: "On WMT'14 English-to-German, 0.1 worked best for uniform and unigram smoothing and label smoothing slightly outperformed the confidence penalty; without dropout each gave an improvement of just over 1 BLEU point, and combined with dropout the effect of both regularizers was diminished, the test BLEU moving from 23.41 with dropout to 23.52 with dropout and label smoothing."
