# History

- id: c-dangelo-history
  type: historical
  text: "The ℓ2 weight penalty traces back to studies on the stability of solutions for ill-posed problems (Tikhonov, 1943) and was explored in statistics by Hoerl and Kennard (1970) among others; Krogh and Hertz (1991) present one of the earliest systematic studies on weight decay tailored for neural networks."
  evidence:
    - {work: "dangelo-2023-why-weight-decay", role: original, locator: "Section 1.1", stance: for}

- id: c-kh-known
  type: historical
  text: "Krogh and Hertz wrote that it has been known for a long time that a weight decay of this form can improve generalization, but until then not very widely recognized."
  evidence:
    - {work: "krogh-1991-simple-weight-decay", role: original, locator: "Section 1", stance: for}

