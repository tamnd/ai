  text: "Yuxin Wu and Kaiming He of Facebook AI Research posted Group Normalization as arXiv 1803.08494v3 on 11 Jun 2018."
  evidence:
    - {work: "wu-2018-group-normalization", role: original, locator: "the title page", stance: for}

- id: c-hist-ioffe
  type: historical
  text: "Sergey Ioffe and Christian Szegedy of Google posted Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift as arXiv 1502.03167v3 on 2 Mar 2015."
  evidence:
    - {work: "ioffe-2015-batch-normalization", role: original, locator: "the title page", stance: for}

- id: c-hist-layer-norm
  type: historical
  text: "Ba, Kiros and Hinton posted Layer Normalization as arXiv 1607.06450v1 on 21 Jul 2016."
  evidence:
    - {work: "ba-2016-layer-normalization", role: original, locator: "the title page", stance: for}

- id: c-hist-in
  type: historical
  text: "Dmitry Ulyanov, Andrea Vedaldi and Victor Lempitsky wrote Instance Normalization: The Missing Ingredient for Fast Stylization, arXiv 1607.08022v3, 6 Nov 2017."
  evidence:
    - {work: "ulyanov-2016-instance-normalization", role: original, locator: "the title page", stance: for}

- id: c-future
  type: attributive
  text: "Wu and He propose to study GN in recurrent and generative models, where LN and IN are particularly successful, and in reinforcement learning."
  evidence:
    - {work: "wu-2018-group-normalization", role: original, locator: "p. 9", stance: for}
