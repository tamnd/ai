# Limitations

- id: c-conv-boundary
  type: attributive
  text: "In convolutional networks, the hidden units whose receptive fields lie near the boundary of the image are rarely turned on and thus have very different statistics from the rest of the hidden units, and further research is needed to make layer normalization work well in ConvNets."
  evidence:
    - {work: "ba-2016-layer-normalization", role: original, locator: "Section 6.7", stance: for}

- id: c-postln-large-grad
  type: attributive
  text: "For the Post-LN Transformer, the expected gradients of the parameters near the output layer are large, so using a large learning rate on those gradients makes the training unstable."
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "the abstract", stance: for}

