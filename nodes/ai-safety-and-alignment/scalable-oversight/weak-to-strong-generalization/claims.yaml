# The claims of the weak-to-strong generalization page (spec 07). The build computes the labels.

# Setting

- id: c-bu-superhuman
  type: attributive
  text: "Alignment techniques such as RLHF rely on humans being able to supervise model behavior, but future superhuman models will behave in ways too complex for humans to evaluate reliably, so humans will only be able to weakly supervise them."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 1", stance: for}

- id: c-bu-question
  type: attributive
  text: "Burns et al. study an analogy to this problem: whether weak model supervision can elicit the full capabilities of a much stronger model."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 1", stance: for}

- id: c-bu-analogy
  type: definitional
  text: "The analogy is tested by finetuning large (strong) pretrained models on labels generated by small (weak) models."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 2", stance: for}

- id: c-bu-elicit
  type: attributive
  text: "For alignment the weak supervisor does not need to teach the strong model new capabilities, only to elicit what the strong model already knows."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 2", stance: for}

- id: c-bw-definition
  type: definitional
  text: "Bowman et al. define scalable oversight as the problem of supervising systems that potentially outperform us on most skills relevant to the task at hand."
  evidence:
    - {work: "bowman-2022-measuring-progress-scalable-oversight", role: original, locator: "p. 1", stance: for}

- id: c-bu-vs-oversight
  type: attributive
  text: "Scalable oversight methods try to improve the ability of humans to supervise models, for example with critiques or by decomposing problems, whereas Burns et al. study generalization beyond the supervision; their setup can be used to compare scalable oversight methods, generalization-based methods and more."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 5", stance: for}

- id: c-bu-sandwiching
  type: attributive
  text: "The weak-to-strong setup resembles the sandwiching proposal for measuring progress on scalable oversight, which uses weak and strong humans (Cotra, 2021; Bowman, 2022)."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 5", stance: for}

- id: c-bw-sandwiching
  type: definitional
  text: "In the sandwiching paradigm researchers choose settings where a model is more capable than a typical human but less capable than an expert, and non-expert participants try to train or align the model to perform the task."
  evidence:
    - {work: "bowman-2022-measuring-progress-scalable-oversight", role: original, locator: "p. 2", stance: for}

- id: c-bu-weakly-supervised
  type: definitional
  text: "Weak-to-strong learning is a special type of weakly supervised learning, a setting in which models are trained using unreliable labels."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 4", stance: for}

- id: c-bu-instance-dependent
  type: attributive
  text: "Unlike most work on label noise, the errors of the weak supervision are instance-dependent and much harder to address than uniform label noise."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 4", stance: for}

# The method

- id: c-bu-three-steps
  type: definitional
  text: "The weak-to-strong experiment for a pair of models consists of training a weak supervisor, training a strong student on its labels, and training a strong model on ground truth as a ceiling."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 5", stance: for}

- id: c-bu-step-weak
  type: definitional
  text: "The weak supervisor is a small pretrained model finetuned on ground truth labels; its test performance is the weak performance, and its predictions on a held-out set are the weak labels."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 5", stance: for}

- id: c-bu-step-student
  type: definitional
  text: "The strong student is a strong pretrained model finetuned on the weak labels; its test performance is the weak-to-strong performance."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 5", stance: for}

- id: c-bu-step-ceiling
  type: definitional
  text: "A strong model finetuned on ground truth labels gives the strong ceiling performance, which should correspond to everything the strong model knows."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 6", stance: for}

- id: c-bu-split
  type: definitional
  text: "The original dataset is split in half, the weak supervisor is trained on the first half, and its predictions on the other half are the weak labels, which are soft labels."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 28", stance: for}

- id: c-bu-pgr-def
  type: definitional
  text: "The performance gap recovered is PGR = (weak-to-strong - weak) / (strong ceiling - weak), the fraction of the performance gap between the weak and strong ceiling models recovered with weak supervision."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 6", stance: for}

- id: c-bu-pgr-ends
  type: definitional
  text: "PGR is 1 for perfect weak-to-strong generalization and 0 if the weak-to-strong model does no better than the weak supervisor."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 6", stance: for}

- id: c-bu-advantages
  type: attributive
  text: "The setup can be studied with any pair of weak and strong models, for any task of interest, and success would be practically useful even before superhuman models exist."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 6", stance: for}

- id: c-bu-training
  type: empirical
  text: "On the NLP tasks all models are finetuned for 2 epochs with a batch size of 32."
  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["22 NLP classification datasets"]
    scale: "unknown"
    setting: "finetuning weak supervisors, students and ceilings"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 28", stance: for}

- id: c-bu-balanced
  type: empirical
  text: "Classes are rebalanced in datasets where one class is more than 55% of the data, so random guessing corresponds to 50% accuracy on all NLP datasets."
  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["22 NLP classification datasets, converted to binary"]
    scale: "unknown"
    setting: "dataset preparation"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 28", stance: for}

- id: c-bu-conf-motivation
  type: attributive
  text: "Directly training the strong student to imitate the weak supervisor may teach it the supervisor's errors; the aim is for the student to learn the intent of the supervisor but not to imitate its mistakes."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 9", stance: for}

- id: c-bu-conf-def
  type: definitional
  text: "The auxiliary confidence loss is L_conf(f) = (1 - alpha) CE(f(x), f_w(x)) + alpha CE(f(x), hat f_t(x)), with f_w(x) the weak label predictive distribution, f(x) the strong model predictive distribution, alpha a weight and t a threshold."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-harden
  type: definitional
  text: "The hardened strong model predictions are hat f_t(x) = I[f(x) > t] in {0, 1}, with I the indicator function."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-threshold
  type: definitional
  text: "The threshold t is set adaptively so that f(x) > t holds for exactly half of the examples in the batch."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-prior
  type: attributive
  text: "The choice of exactly half reflects the prior over classes and should be computed explicitly from weak model predictions in non-balanced or non-binary settings."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-alpha
  type: empirical
  text: "alpha_max is 0.75 for the largest student models and 0.5 otherwise, and alpha is warmed up linearly from 0 to alpha_max over the first 20% of training."
  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["NLP classification datasets"]
    scale: "students up to GPT-4 compute"
    setting: "finetuning with the auxiliary confidence loss"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-bootstrap-form
  type: definitional
  text: "The loss can be rewritten as the self-bootstrapping loss L_conf(f) = CE(f(x), (1 - alpha) f_w(x) + alpha hat f_t(x)), whose target is a mixture of the weak predictions and the thresholded predictions of the strong student."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-conf-related
  type: attributive
  text: "The loss is related to the bootstrapping methods of Reed et al. (2014) and Arazo et al. (2019) for label noise, and similar to self-training and conditional entropy minimization (Grandvalet and Bengio, 2004)."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 33", stance: for}

- id: c-bu-conf-disagree
  type: attributive
  text: "The additional loss term reinforces the strong model's confidence in its own predictions, even when they disagree with the weak labels."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 10", stance: for}

- id: c-bu-bootstrap-idea
  type: attributive
  text: "Bootstrapping is a long-standing idea in alignment: instead of directly aligning very superhuman models, first align a slightly superhuman model and use it to align an even smarter one."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 8", stance: for}

- id: c-bu-bootstrap-chain
  type: definitional
  text: "Bootstrapping builds a sequence of model sizes M1 -> M2 -> ... -> Mn, uses weak labels from M1 to finetune M2, uses M2 to generate labels for M3, and so on."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 9", stance: for}

- id: c-bu-bootstrap-iterations
  type: empirical
  text: "For each round of bootstrapping Burns et al. run three iterations of weak-to-strong learning, bootstrapping the weak supervision through two intermediate model sizes before finetuning the largest model."
  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["chess puzzles"]
    scale: "unknown"
    setting: "bootstrapping with intermediate model sizes"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 9", stance: for}

# Derivation

- id: c-pgr-endpoints
  type: mathematical
  text: "With P_s != P_w, PGR is an increasing affine function of P_w2s that equals 0 exactly at P_w2s = P_w and 1 exactly at P_w2s = P_s."
  assumes: ["the three performances are measured with one metric on one test set", "the strong ceiling differs from the weak performance"]
  derivation: pgr

- id: c-pgr-undefined
  type: mathematical
  text: "PGR is undefined when P_s = P_w, and for a fixed nonzero numerator its magnitude grows without bound as P_s - P_w goes to 0."
  assumes: ["the three performances are measured with one metric on one test set"]
  derivation: pgr

- id: c-pgr-affine
  type: mathematical
  text: "Replacing every performance P by aP + b with a != 0 leaves PGR unchanged, so accuracy and error rate give the same PGR."
  assumes: ["the three performances are measured with one metric on one test set", "the strong ceiling differs from the weak performance"]
  derivation: pgr

- id: c-pgr-range
  type: mathematical
  text: "With a metric that increases with quality and P_s > P_w, PGR is negative when the student is worse than its supervisor and greater than 1 when it beats the ceiling."
  assumes: ["the three performances are measured with one metric on one test set", "the strong ceiling differs from the weak performance"]
  derivation: pgr

- id: c-pgr-agreement
  type: mathematical
  text: "A student that agrees with its supervisor on every test input has the same performance as the supervisor on any metric of predictions and labels, so its PGR is 0."
  assumes: ["the metric depends only on predictions and ground truth labels", "the strong ceiling differs from the weak performance"]
  derivation: pgr

- id: c-conf-mixture
  type: mathematical
  text: "Binary cross-entropy is affine in its target, so (1 - alpha) CE(p, q_w) + alpha CE(p, h) = CE(p, (1 - alpha) q_w + alpha h)."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-alpha-zero
  type: mathematical
  text: "At alpha = 0 the confidence loss is the cross-entropy to the weak labels, the naive baseline."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-alpha-one
  type: mathematical
  text: "At alpha = 1 the confidence loss is the cross-entropy to the student's own hardened predictions and does not depend on the weak labels."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-minimizer
  type: mathematical
  text: "For a fixed target the per-example loss is minimized at p = (1 - alpha) q_w + alpha h, since dCE/dp = (p - q) / (p (1 - p))."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-gradient
  type: mathematical
  text: "With p = sigmoid(z) the gradient of the per-example loss with respect to the logit z is p - ((1 - alpha) q_w + alpha h)."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-side
  type: mathematical
  text: "For alpha > 1/2 the mixed target is on the side of 1/2 of the hardened label whatever the weak label; for q_w < 1/2 and h = 1 the target exceeds 1/2 exactly when alpha > (1/2 - q_w) / (1 - q_w), which is 0.286 for q_w = 0.3."
  assumes: ["binary classification with probabilities in (0, 1)", "the hardened predictions are constants", "0 <= alpha <= 1"]
  derivation: confidence-loss

- id: c-conf-half
  type: mathematical
  text: "If t is the largest value of the lower half of a batch of B distinct probabilities, exactly floor(B/2) of them exceed t."
  assumes: ["the probabilities in the batch are distinct"]
  derivation: confidence-loss

