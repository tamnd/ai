# Limitations and failure modes

- id: c-bu-infinite
  type: attributive
  text: "In the case of infinite training data, naively fitting the weak labels should result in perfect imitation and a PGR of zero."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 11", stance: for}

- id: c-bu-overfit
  type: empirical
  text: "For larger gaps weak-to-strong performance often increases initially and then starts dropping well before a single epoch has elapsed."
  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["ChatGPT reward modeling data"]
    scale: "large supervisor-student compute gaps"
    setting: "naive finetuning on weak labels, test accuracy over training"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 11", stance: for}

- id: c-bu-early-stop
