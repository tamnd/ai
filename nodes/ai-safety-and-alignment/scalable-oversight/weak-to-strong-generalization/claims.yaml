  scope:
    models: "pretrained GPT-4-family language models (Burns et al.)"
    data: ["NLP classification datasets"]
    scale: "unknown"
    setting: "auxiliary confidence loss against naive finetuning"
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 10", stance: for}

- id: c-bu-imitation-saliency
  type: attributive
  text: "Future models will likely be very good at predicting what humans think and say, so superhuman models may easily imitate weak errors."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 16", stance: for}

- id: c-bu-leakage
  type: attributive
  text: "Superhuman knowledge may be latent rather than observed in pretraining data, latent capabilities may be harder to elicit, and this pretraining leakage could make the results overly optimistic."
  evidence:
    - {work: "burns-2023-weak-to-strong-generalization", role: original, locator: "p. 17", stance: for}

- id: c-bu-not-final
  type: attributive
  text: "Burns et al. view the setup as removing one of the main disanalogies in prior work, not as a final, perfectly analogous setup."
