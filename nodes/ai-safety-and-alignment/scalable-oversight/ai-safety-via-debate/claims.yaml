  evidence:
    - {work: "brown-cohen-2023-doubly-efficient-debate", role: original, locator: "p. 2", stance: for}

# Limitations

- id: c-obfuscated-bc
  type: attributive
  text: "Allowing both provers to be unbounded runs into what Barnes and Christiano (2020) call the obfuscated argument problem, where a dishonest prover can in polynomial time produce an argument that would require the honest prover exponential time to refute."
  evidence:
    - {work: "brown-cohen-2023-doubly-efficient-debate", role: original, locator: "p. 9", stance: for}

- id: c-obfuscated-michael
  type: attributive
  text: "Michael et al. describe obfuscated arguments as long arguments with many individual pieces where neither debater can confidently point out which step contains a mistake, though both know it is incorrect; they do not observe obfuscated arguments to be a significant problem in their setting."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 14", stance: for}

- id: c-fail-gracefully
  type: attributive
  text: "To ameliorate confusing, complex or undecidable debates, Michael et al. elicit probabilities from the judges so that they can express low confidence; in the worst case judges can decide debates only when one side has provided positive proof, which gives up some of the power of the original approach."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 14", stance: for}

- id: c-stalemate
  type: attributive
  text: "Michael et al. have not shown that debate extracts all the knowledge held by debaters: there may be questions where the best strategy by both debaters yields arguments too complex for the judge, leading to a stalemate."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 11", stance: for}

- id: c-honesty-best
  type: attributive
  text: "Irving et al. ask whether honesty is actually the best policy: whether humans can check logical statements containing words they do not understand, and whether an agent can sneak in a statement that appears logical but contains a hidden flaw without the other pointing it out."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 15", stance: for}

- id: c-approx-optimal
  type: attributive
  text: "Optimal play is unachievable for any practical system, so what matters is approximately optimal play, and Irving et al. call the hope that agents near optimal play are honest far from a solid argument."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 17", stance: for}

- id: c-no-convergence
  type: attributive
  text: "Irving et al. know of no theory which says why self play should stably converge to optimal play, and describe bad cycles where both agents learn to be honest, forget how to point out lies, and one agent goes back to lying and wins for a while."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 17", stance: for}

- id: c-michael-nash
  type: attributive
  text: "Michael et al. note that there may be strong strategies for the dishonest debater that break debate at the Nash equilibrium which their human debaters did not find, so their high judge accuracy may partly result from mistakes by the dishonest debater."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 11", stance: for}

- id: c-belief-bias
  type: attributive
  text: "Irving et al. worry about belief bias, and expect that there is some threshold of judge performance beyond which debate is practically limited only by capacity; they list interventions such as majority votes, weighting better judges, instructions, and training judges."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 14", stance: for}

- id: c-michael-no-bias-test
  type: attributive
  text: "In the experiments of Michael et al., judges begin each debate with no strong opinion on the question, so the robustness of debate to strong preexisting views or cognitive biases is not tested."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 11", stance: for}

- id: c-khan-judge-bias
  type: attributive
  text: "Khan et al. found strong biases with LLM judges, and mitigate positional bias by judging each debate twice with the debater order swapped and verbosity bias by strict word limits."
  evidence:
    - {work: "khan-2024-debating-persuasive-llms", role: original, locator: "p. 4", stance: for}

- id: c-stochastic
  type: attributive
  text: "The bisection protocol works only for deterministic simulation: if each step introduces noise, a misaligned Alice could choose the noise so that each step is plausible but the final result has extremely low probability, and Irving et al. leave a natural debate protocol for stochastic simulation open."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 18", stance: for}

- id: c-convincing-dangerous
  type: attributive
  text: "Irving et al. note that training for maximum convincing is not intuitively safe, as it sounds similar to training for deception, but rewarding both agents for acting honestly would let them collude on statements that sound consistent but are both lies."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 18", stance: for}

- id: c-mind-hack
  type: attributive
  text: "A sufficiently strong misaligned AI may be able to convince a human to do dangerous things via a text channel; Irving et al. propose making statements short enough that such a hack needs many of them, so the opponent can win by pointing it out."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 17", stance: for}

- id: c-matched
  type: attributive
  text: "The debate model relies on the agents being approximately matched in strength, since a much stronger Alice may be able to lie in ways that Bob cannot refute; using the same weights for both agents via self play gives this symmetry."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 19", stance: for}

- id: c-khan-limits
  type: attributive
  text: "Khan et al. note that in their setup the difference between strong and weak models is only in access to information, that their models are fine-tuned with RLHF and have a propensity for honesty, and that their results are limited to setups where debaters can provide verified evidence to the judge."
  evidence:
    - {work: "khan-2024-debating-persuasive-llms", role: original, locator: "p. 8", stance: for}

- id: c-michael-limits
  type: attributive
  text: "Michael et al. address only a limited expertise gap, privileged access to a source text, and say it is not clear how their result generalizes to larger knowledge gaps or to differences in reasoning and persuasion skills."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 11", stance: for}

- id: c-bc-fallible
  type: attributive
  text: "Brown-Cohen et al. list as open whether debate can verify computations when the human-judgement oracle gives incorrect answers on some subset of queries, since human judgement is fallible and reward models only approximate it."
  evidence:
    - {work: "brown-cohen-2023-doubly-efficient-debate", role: original, locator: "p. 10", stance: for}

