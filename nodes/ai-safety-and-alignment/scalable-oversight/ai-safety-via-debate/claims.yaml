# The claims of the AI safety via debate page (spec 07). The build computes the labels.

# Setting and the method

- id: c-def
  type: definitional
  text: "Irving et al. propose training agents via self play on a zero sum debate game: given a question or proposed action, two agents take turns making short statements up to a limit, then a human judges which of the agents gave the most true, useful information."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 1", stance: for}

- id: c-motivation
  type: attributive
  text: "One approach to specifying complex goals asks humans to judge during training which agent behaviors are safe and useful, but Irving et al. note that this approach can fail if the task is too complicated for a human to directly judge."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 1", stance: for}

- id: c-game-steps
  type: definitional
  text: "In the simplest version of debate a question is shown to both agents, the two agents state their answers, which may be the same, take turns making statements, the judge sees the debate and decides which agent wins, and the game is zero sum, each agent maximizing their probability of winning."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 3", stance: for}

- id: c-test-time
  type: attributive
  text: "Irving et al. note that at test time it suffices to stop after the two agents state their answers: the debate need not be run, though agents could simulate debates at test time to strengthen answers."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 3", stance: for}

- id: c-central-claim
  type: attributive
  text: "The utility of debate as an approach for AI alignment rests on the central claim that in the debate game it is harder to lie than to refute a lie, which Irving et al. say is an empirical question for any particular setting."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 3", stance: for}

- id: c-hoped-claims
  type: attributive
  text: "If the central claim is true, Irving et al. hope that in all Nash equilibria both agents try to tell the truth in the most convincing manner possible, that approximate Nash equilibria can be found with some version of gradient descent such as self play, and that at Nash equilibria debate agents are approximately as strong as unrestricted AI."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 3", stance: for}

- id: c-unbranched
  type: attributive
  text: "Irving et al. argue that debates can be short because long arguments are usually long only because they branch down many paths, and an argument phrased as a sequential process can be rearranged into a shallow tree by stating the conclusion of the first half and choosing which half to discuss in detail."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 5", stance: for}

- id: c-p-np
  type: attributive
  text: "Replacing the human by a polynomial time algorithm H, using H to answer questions directly gives the class P, which Irving et al. relate to supervised learning, and using H to judge answers gives NP, which they relate to single agent reinforcement learning."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 5", stance: for}

- id: c-hierarchy
  type: attributive
  text: "A debate of n alternating rounds produces a formula of the form exists x0 for all x1 and so on of H(q, x0, ...); a fixed number of rounds n gives the polynomial hierarchy level Sigma_n P, and a polynomial number of rounds gives PSPACE."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 5", stance: for}

- id: c-theorem-pspace
  type: attributive
  text: "Theorem 1 of Irving et al.: for any problem L in PSPACE, one can choose a polynomial time judge so that optimal play in the debate game with polynomially many steps solves L."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 5", stance: for}

- id: c-direct-np
  type: attributive
  text: "In an analogy to complexity theory, debate with optimal play can answer any question in PSPACE given polynomial time judges, while direct judging answers only NP questions."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 1", stance: for}

- id: c-prime-example
  type: attributive
  text: "To count the primes up to x by debate, Alice computes pi(x) and pi(x/2); if she lies about pi(x) she must lie about one of the half ranges, Bob points out which, and the debate continues until the judge checks a single number for primality, having done only addition and subtraction along the way, so that optimal play is for Alice to tell the truth at the start."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 6", stance: for}

- id: c-simulation
  type: attributive
  text: "Given a polynomial time algorithm for one step of a simulation, debate can evolve the simulation for an exponential number of steps n: Alice gives the result after n and n/2 steps, Bob says which half interval is a lie, and they iterate until they disagree about a single step."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 6", stance: for}

- id: c-analogies-only
  type: attributive
  text: "Irving et al. stress that these complexity class arguments are analogies only: they do not expect tractable machine learning algorithms to achieve all of PSPACE, but the analogies show that at least in theory one can be limited by the capacity of the models and the ability to train them, not by the supervisory signal."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 6", stance: for}

- id: c-large-queries
  type: attributive
  text: "To support a question too large to show to a human, such as a 10 gigapixel image or the whole internet, Irving et al. let the agents reveal small parts of the question in their statements."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 6", stance: for}

# The derivation

- id: c-bisect-count
  type: mathematical
  text: "In the bisection debate for counting primes in a range of 2^n numbers, where the judge requires the two half counts to add up to the count being defended, Alice can win against every strategy of Bob if and only if her claimed count is the true count; otherwise the Bob who always challenges a half with a wrong count wins."
  assumes: ["the judge checks that the two half claims add up to the claim being defended, by one subtraction per round", "the range or the number of simulation steps is a power of two"]
  derivation: bisection-debate

- id: c-bisect-rounds
  type: mathematical
  text: "Every play of the bisection debate on 2^n numbers lasts exactly n rounds, and the judge does n subtractions and one primality test."
  assumes: ["the judge checks that the two half claims add up to the claim being defended, by one subtraction per round", "the range or the number of simulation steps is a power of two"]
  derivation: bisection-debate

- id: c-bisect-sim
  type: mathematical
  text: "For a deterministic step function, the bisection debate over 2^k simulation steps is won by Alice against every strategy of Bob if and only if her claimed final state is the true one, and it lasts k rounds with one step checked by the judge."
  assumes: ["the simulation step is deterministic and the judge can check one step", "the range or the number of simulation steps is a power of two"]
  derivation: bisection-debate

- id: c-log-score-proper
  type: mathematical
  text: "For a judge who believes with probability q in (0, 1) that an answer is correct, the expected logarithmic score q log2 p + (1 - q) log2 (1 - p) has the unique maximizer p = q, and a turn penalty that does not depend on p leaves the maximizer unchanged."
  assumes: ["the judge's belief that an answer is correct is q, and the judge reports p"]
  derivation: bisection-debate

# The MNIST experiment

- id: c-mnist-setup
  type: attributive
  text: "In the MNIST experiment the judge is a classifier trained in advance to classify digits from 6 (or 4) revealed nonzero pixels; the two players precommit to their claimed label, then reveal one pixel per turn up to a total of 6 (or 4), one player is prespecified to be honest and the other to lie, and the winner is the player whose claimed class has the higher logit."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 9", stance: for}

- id: c-mnist-mcts
  type: attributive
  text: "The MNIST debate game is played with pure Monte Carlo tree search without a trained heuristic, with 10k rollouts per move and the PUCT rule with c_puct = 1; precommit is modelled by playing 9 different games for the same image, one per possible lie."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 9", stance: for}

- id: c-mnist-result
  type: empirical
  text: "With 6 pixels, debate with precommit turns a 59.4% accurate judge into an 88.9% accurate debate, and with 4 pixels a 48.2% accurate judge becomes an 85.2% accurate debate."
  scope:
    models: "a convolutional MNIST classifier as the judge, with Monte Carlo tree search debaters"
    data: [mnist]
    scale: "the MNIST test set, 10k rollouts per move"
    setting: "sparse-pixel debate with precommitted labels, one honest player and one liar"
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 10", stance: for}

- id: c-mnist-precommit
  type: empirical
  text: "For both 4 and 6 pixels precommit is crucial: the liar does much better if the lie can adapt in different parts of the game tree."
  scope:
    models: "a convolutional MNIST classifier as the judge, with Monte Carlo tree search debaters"
    data: [mnist]
    scale: "the MNIST test set, 10k rollouts per move"
    setting: "sparse-pixel debate with and without precommitted labels"
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 10", stance: for}

- id: c-mnist-second
  type: attributive
  text: "Both versions of the MNIST game give an advantage to the second player to move, since if the first player has a winning strategy the second player can steal it by ignoring the previous move on each turn."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 9", stance: for}

- id: c-mnist-lies
  type: empirical
  text: "Errors of the 6 pixel judge on random masks are distributed somewhat randomly, while successful lies in debate are concentrated on the digits 8 and 9, likely an artifact of restricting the game to nonzero pixels."
  scope:
    models: "a convolutional MNIST classifier as the judge, with Monte Carlo tree search debaters"
    data: [mnist]
    scale: "the MNIST test set"
    setting: "6 pixel debate with precommit"
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 9", stance: for}

- id: c-mnist-no-generalization
  type: attributive
  text: "Since MCTS is run on the test set with full access to the judge, the MNIST experiment models the limit of debate agents with no generalization error, though the judge does have generalization error."
  evidence:
    - {work: "irving-2018-ai-safety-via-debate", role: original, locator: "p. 10", stance: for}

# Human debate experiments

- id: c-michael-setup
  type: attributive
  text: "Michael et al. collect human-written debates on hard reading comprehension questions where the judge has not read the source passage and sees only expert arguments and short quotes selectively revealed by debaters who have access to it; one expert argues for the correct answer and the other for an incorrect answer."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 1", stance: for}

- id: c-michael-consultancy
  type: attributive
  text: "In the consultancy baseline of Michael et al., a single expert argues for one of the two answers, the incorrect one half of the time, which they design as a worst-case variant of RLHF."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 5", stance: for}

- id: c-michael-protocol
  type: attributive
  text: "In the protocol of Michael et al. the debaters are randomly assigned to the two answers, write opening statements simultaneously, then take turns with the judge until the judge decides to end the debate, and part of each turn may be certified quotes from the story, verbatim ground-truth evidence."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 4", stance: for}

- id: c-michael-limits-chars
  type: attributive
  text: "Michael et al. use a character limit of 750 and a quote limit of 250 per turn, so that on average up to 1.8% of the story could be revealed in each round of the debate."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 6", stance: for}

- id: c-michael-score
  type: attributive
  text: "The judge is scored by log2 of the probability assigned to the correct answer minus 0.05 per turn the debate was continued, a strictly proper scoring function that incentivizes the judge to report their true beliefs, while each debater is scored by log2 of the probability the judge assigns to their answer, with no length penalty."
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 5", stance: for}

- id: c-michael-result
  type: empirical
  text: "Debate performs significantly better than consultancy, with 84% judge accuracy compared to consultancy's 74%, and debates are 68% of the length of consultancies."
  scope:
    models: "human debaters and judges, 19 participants"
    data: [quality]
    scale: "413 debates and consultancies across four conditions"
    setting: "QuALITY-hard questions over Project Gutenberg stories, judges without access to the story"
  evidence:
    - {work: "michael-2023-debate-helps-supervise", role: original, locator: "p. 1", stance: for}

- id: c-michael-ai
  type: empirical
  text: "With GPT-4 debaters, AI debate and AI consultancy lie between human debate and human consultancy, at 78% and 80% judge accuracy."
  scope:
    models: "gpt-4-32k debaters and consultants, human judges"
    data: [quality]
