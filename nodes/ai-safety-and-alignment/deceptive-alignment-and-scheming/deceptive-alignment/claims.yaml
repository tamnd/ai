- id: c-sa-natural
  type: attributive
  text: "The Sleeper Agents authors believe it is not plausible that a model with a completely separate backdoored behavior not related to its performance in training would be learned naturally by gradient descent, but think it is potentially plausible that deceptive behavior causally responsible for the model's behavior during training could be learned naturally."
  evidence:
