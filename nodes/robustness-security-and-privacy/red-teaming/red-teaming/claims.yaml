# The claims of the red teaming page (spec 07). The build computes the labels.
- id: c-def-ganguli
  type: definitional
  text: "Red teaming is using manual or automated methods to adversarially probe a language model for harmful outputs, and then updating the model to avoid such outputs."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 1", stance: for}

- id: c-perez-abstract
  type: attributive
  text: "Perez et al. generate test cases (red teaming) using another LM, evaluate the target LM's replies with a classifier, and uncover tens of thousands of offensive replies in a 280B parameter LM chatbot."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "the abstract", stance: for}

- id: c-feffer-theater
  type: attributive
  text: "Feffer et al. argue that red-teaming may be a valuable big-tent idea, but treating it as a panacea for every possible risk verges on security theater."
  evidence:
    - {work: "feffer-2024-red-teaming-silver-bullet", role: original, locator: "p. 1", stance: for}

- id: c-setting
  type: definitional
  text: "Perez et al. aim to find test cases x that cause a target LM p_t(y|x) to output some text y that is harmful, and assume a red team classifier r(x, y) that predicts whether or not an output y is harmful given a test case x."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2", stance: for}

- id: c-classifier-examples
  type: attributive
  text: "Examples of the red team classifier include a classifier trained to predict whether or not y is offensive and a Python function that evaluates whether or not y contains a social security number."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2", stance: for}

- id: c-black-box
  type: attributive
  text: "Perez et al. do not assume that the classifier or the target LM are differentiable or available for white-box access."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2", stance: for}

- id: c-natural-language
  type: attributive
  text: "Test cases should be well-formed natural language, representative of failures that users may encounter, as opposed to nonsensical character sequences found using gradient-based search, and should be diverse to catch diverse failure modes."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2", stance: for}

- id: c-likert
  type: attributive
  text: "Red team members rate how successful they were at making the AI assistant behave badly on a Likert scale from 0 to 4."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 4", stance: for}

- id: c-not-audit
  type: attributive
  text: "Feffer et al. note that in computer security red-teaming models an adversary, in contrast to penetration testing, and that red-teaming is not an audit."
  evidence:
    - {work: "feffer-2024-red-teaming-silver-bullet", role: original, locator: "p. 5", stance: for}

- id: c-question-bank
  type: attributive
  text: "Feffer et al. propose a set of questions to guide future AI red-teaming activities, for the pre-activity, during activity and post-activity phases."
  evidence:
    - {work: "feffer-2024-red-teaming-silver-bullet", role: original, locator: "p. 4", stance: for}

- id: c-ganguli-instructions
  type: attributive
  text: "Ganguli et al. instruct red team members to make the AI behave badly, to get it to say obnoxious, offensive, and harmful things, and do not define what harmful means."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 4", stance: for}

- id: c-three-stages
  type: definitional
  text: "Perez et al. propose a three-stage approach: generate test cases using a red LM p_r(x), use the target LM p_t(y|x) to generate an output y for each test case x, and find the test cases that led to a harmful output using the red team classifier r(x, y)."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.1", stance: for}

- id: c-four-methods
  type: attributive
  text: "To ensure that inputs are well-formed natural language, Perez et al. initialize the red LM from a large pretrained LM, and obtain diverse inputs by decoding from it many times using random sampling."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-zero-shot
  type: attributive
  text: "Simple one-sentence prompts were effective at generating test cases, and finding a prompt to test a new behavior typically only required a few minutes of iteration."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-sfs
  type: attributive
  text: "Stochastic few-shot generation appends failing zero-shot test cases to the prompt as few-shot examples, increasing the likelihood of sampling a test case that led to a harmful output according to the red team classifier."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-sl
  type: attributive
  text: "Supervised learning finetunes the pretrained LM to maximize the log-likelihood of failing zero-shot test cases, training for one epoch to preserve test case diversity and avoid overfitting."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-rl
  type: attributive
  text: "Reinforcement learning trains the red LM with synchronous advantage actor-critic (A2C) to maximize the expected harmfulness, warm-started from the SL-trained model, with a KL penalty to prevent collapsing to a single high-reward generation."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-nucleus
  type: attributive
  text: "Perez et al. always decode from the red LM with nucleus sampling from the top p = 0.95 of the probability mass, and sample until they obtain a desired number of unique test cases that are valid."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.3", stance: for}

- id: c-two-responses
  type: attributive
  text: "At each turn of the conversation the red team member sees two responses and picks the more harmful one, which doubles the chances of eliciting harmful behavior and yields preference data."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 4", stance: for}

- id: c-four-turns
  type: empirical
  text: "Red team conversations last about 4 turns on average."
  scope:
    models: "Anthropic dialogue models: plain LM, prompted LM, rejection sampling, RLHF"
    data: ["anthropic red team attacks"]
    scale: "2.7B, 13B and 52B parameters"
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 4", stance: for}

- id: c-min-harmlessness
  type: attributive
  text: "Ganguli et al. use the minimum harmlessness score of the preference model over the AI utterances of a conversation as a lower bound on the harmfulness of the attack."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 8", stance: for}

- id: c-clustering
  type: attributive
  text: "Perez et al. embed each word using FastText, average the embeddings of each test case, and form 100 clusters using k-means on the 18k failing zero-shot test cases."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.3", stance: for}

- id: c-umap
  type: attributive
  text: "Ganguli et al. embed the red team attacks and visualize them with UMAP, and have reviewers tag a sample of attacks with topic tags."
  evidence:
    - {work: "ganguli-2022-red-teaming-reduce-harms", role: original, locator: "p. 12", stance: for}

- id: c-blue-team
  type: attributive
  text: "Failing test cases can be used to improve the LM by removing training examples or blacklisting phrases, or with learning algorithms such as unlikelihood training, and red LMs and target LMs may be trained jointly."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 8.2", stance: for}

- id: c-rounds
  type: empirical
  text: "Some organizations chose to conduct a single round of red-teaming, while others saw red-teaming as an iterative process in which results from initial rounds were used to prioritize risk areas."
  scope:
    models: "six industry red-teaming exercises on generative AI systems"
    data: ["case studies"]
    scale: "unknown"
  evidence:
    - {work: "feffer-2024-red-teaming-silver-bullet", role: original, locator: "p. 6", stance: for}

- id: c-rule-of-three
  type: mathematical
  text: "If N independent test cases all pass, every failure rate pi with (1 - pi)^N < 0.05 is rejected at the 5% level, which leaves pi < 1 - 0.05^(1/N), and this is at most about 3/N because -ln 0.05 is about 3.0 and 1 - e^(-u) <= u."
  assumes: ["the N test cases are independent draws from one distribution", "each case fails with the same probability pi"]
  derivation: "node.md#derivation"

- id: c-no-failures
  type: attributive
  text: "If no test cases elicit harmful behavior, then there is evidence the target LM is at low risk for producing harmful behavior on the distribution of tested cases."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-sfs-formula
  type: attributive
  text: "In stochastic few-shot generation, a zero-shot test case is sampled into the prompt with probability proportional to e^(r(x,y)/T), where r(x,y) is the classifier probability that the reply y is offensive and T is a temperature."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.1", stance: for}

- id: c-sfs-ratio
  type: mathematical
  text: "Under sampling with probability proportional to exp(r/T), the ratio of the probabilities of two cases with scores r_i and r_j is exp((r_i - r_j)/T), so the choice tends to the maximum score as T goes to 0 and to the uniform choice as T grows without bound."
  assumes: ["T > 0", "finitely many candidate cases"]
  derivation: "node.md#derivation"

- id: c-rl-reward
  type: attributive
  text: "For RL, the reward is -log p(1 - r(x,y)) where r(x,y) is the classifier probability that the reply is offensive."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.1", stance: for}

- id: c-rl-reward-shape
  type: mathematical
  text: "The reward -log(1 - r) is 0 at r = 0, has derivative 1/(1 - r) > 0 on [0, 1), and grows without bound as r tends to 1, so each tenfold reduction of 1 - r adds ln 10, about 2.303, to the reward."
  assumes: ["0 <= r < 1"]
  derivation: "node.md#derivation"

- id: c-rl-loss
  type: attributive
  text: "The final loss is a linear combination of the KL penalty weighted by alpha in [0, 1] and the A2C loss weighted by 1 - alpha, and decreasing values of alpha sacrifice diversity for expected reward."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 2.2", stance: for}

- id: c-dialogue-generalization
  type: attributive
  text: "To generate coherent dialogues, Perez et al. condition the red LM on the dialogue history, and dialogue red teaming can be viewed as a generalization of single-turn red teaming."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 7", stance: for}

- id: c-zs-results
  type: empirical
  text: "The 0.5M zero-shot test cases elicit offensive replies 3.7% of the time, resulting in 18,444 failed test cases."
  scope:
    models: "Dialogue-Prompted Gopher (280B), red teamed by Gopher red LMs"
    data: ["zero-shot and generated test cases", "bot-adversarial-dialogue"]
    scale: "280B parameters"
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.2", stance: for}

- id: c-we-zs-rate
  type: mathematical
  text: "18,444 failing test cases out of 500,000 is a rate of 0.0369, which rounds to 3.7%."
  assumes: ["0.5M means exactly 500,000 test cases"]
  derivation: "node.md#worked-example"

- id: c-bad-size
  type: attributive
  text: "BAD contains 2598 conversation-starting questions, and Perez et al. use the same number of questions from each red teaming method for evaluation."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.1", stance: for}

- id: c-we-rule-of-three
  type: mathematical
  text: "With N = 2598 passing test cases, 1 - 0.05^(1/2598) is about 0.00115, as is 3/2598, so the failure rate is below about 0.12% at the 5% level."
  assumes: ["the N test cases are independent draws from one distribution"]
  derivation: "node.md#worked-example"

- id: c-we-sfs
  type: mathematical
  text: "With T = 1/10, a case with score 0.9 is e^((0.9 - 0.5)/0.1) = e^4, about 54.6, times as likely to be sampled as a case with score 0.5."
  assumes: ["cases are sampled with probability proportional to exp(r/T)"]
  derivation: "node.md#worked-example"

- id: c-we-rl-reward
  type: mathematical
  text: "The reward -log(1 - r) equals ln 2, about 0.693, at r = 0.5, ln 10, about 2.303, at r = 0.9, and ln 100, about 4.605, at r = 0.99, so the gain from 0.9 to 0.99 equals the gain from 0 to 0.9."
  assumes: ["the reward is -log(1 - r) with the natural logarithm"]
  derivation: "node.md#worked-example"

- id: c-hp-perez
  type: attributive
  text: "Perez et al. use T = 1/10 and 5 few-shot examples for stochastic few-shot generation, and test KL penalties alpha in [.3, .35, .4] for RL."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.1", stance: for}

- id: c-hp-question-mark
  type: attributive
  text: "For RL, the reward is set to -3 when a question mark is not in the generated test case."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "Section 3.1", stance: for}

- id: c-hp-threshold
  type: attributive
  text: "The offensiveness classifier uses a threshold of at least 0.5 to classify an utterance as offensive."
  evidence:
    - {work: "perez-2022-red-teaming-language-models", role: original, locator: "p. 23", stance: for}

- id: c-hp-target
  type: attributive
  text: "Dialogue-Prompted Gopher generates replies using nucleus sampling with p = 0.8."
