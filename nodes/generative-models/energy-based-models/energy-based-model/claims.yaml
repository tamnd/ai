# The claims of the energy-based model page (spec 07). The build computes the labels.
- id: c-boltzmann-logprob
  type: attributive
  text: "In the Boltzmann distribution the difference in the log probabilities of two global states is just their energy difference, and the equilibrium distribution is independent of the path followed in reaching equilibrium."
  evidence:
    - {work: "ackley-1985-learning-algorithm-boltzmann-machines", role: original, locator: "p. 6", stance: for}

- id: c-ml-grad
  type: mathematical
  text: "For a model p = exp(-E)/Z with a differentiable energy and a finite partition function, the gradient of log p(x) in the parameters is minus the energy gradient at x plus the expected energy gradient under the model, because the gradient of log Z is that expectation; averaged over the data it vanishes when the data and the model give the energy gradient the same expectation, which for an exponential family is moment matching and is the stationary condition of KL(q || p)."
  assumes: ["the input space is finite, or the integrals defining Z and its derivative converge and can be differentiated under the integral sign", "E is differentiable in the parameters"]
  derivation: ml-gradient

- id: c-boltzmann-energy
  type: attributive
  text: "Each global state of a network of symmetrically connected binary units can be assigned a single number called the energy; if the units make their decisions asynchronously and transmission times are negligible, the system always settles into a local energy minimum, as in Hopfield (1982)."
  evidence:
    - {work: "ackley-1985-learning-algorithm-boltzmann-machines", role: original, locator: "p. 4", stance: for}

- id: c-boltzmann-grad
  type: attributive
  text: "In the Boltzmann machine the derivative of the log probability of a global state in the weight w_ij depends on p_ij, the probability of finding units i and j both on at the same time when the system is at equilibrium."
  evidence:
    - {work: "ackley-1985-learning-algorithm-boltzmann-machines", role: original, locator: "p. 7", stance: for}

- id: c-annealing
  type: attributive
  text: "At low temperatures the bias toward low energy is favourable but the time required to reach equilibrium may be long, and at higher temperatures equilibrium is reached faster; a good way to beat this trade-off is to start at a high temperature and gradually reduce it, which corresponds to annealing a physical system."
  evidence:
    - {work: "ackley-1985-learning-algorithm-boltzmann-machines", role: original, locator: "p. 6", stance: for}

- id: c-rbm-poe
  type: attributive
  text: "Smolensky (1986) introduced a restricted type of Boltzmann machine with one visible layer, one hidden layer and no intralayer connections; in this restricted Boltzmann machine the probability of generating a visible vector is proportional to the product of the probabilities that it would be generated by each hidden unit acting alone, so an RBM is a PoE with one expert per hidden unit, and exact inference is tractable because the states of the hidden units are conditionally independent given the data."
  evidence:
    - {work: "hinton-2002-training-products-experts-contrastive-divergence", role: original, locator: "p. 7", stance: for}

- id: c-rbm-conditionals
  type: mathematical
  text: "In an RBM with energy E(v, h) = -vWh^T - b.v - c.h, summing over the hidden units gives the free energy F(v) = -b.v - sum_j softplus(c_j + (vW)_j), so p(v) = exp(-F(v))/Z costs O(DH) up to Z; the hidden units are independent given the visible units, and the visible units given the hidden units, with p(h_j = 1 | v) = sigmoid(c_j + (vW)_j) and p(v_i = 1 | h) = sigmoid(b_i + (Wh^T)_i)."
  assumes: ["binary units with values 0 and 1", "no connections within the visible layer or within the hidden layer"]
  derivation: rbm-free-energy-and-conditionals

- id: c-cd-def
  type: attributive
  text: "Contrastive divergence runs the Gibbs chain for one full step instead of to equilibrium and updates the parameters to reduce the tendency of the chain to wander away from the initial distribution on that step; because the one-step distribution is one step closer to the equilibrium distribution, the contrastive divergence can never be negative, and the intractable expectation over the equilibrium distribution cancels out."
  evidence:
    - {work: "hinton-2002-training-products-experts-contrastive-divergence", role: original, locator: "p. 4", stance: for}

- id: c-cd-third-term
  type: attributive
  text: "The third term of the gradient of the contrastive divergence is problematic to compute, but extensive simulations show that it can safely be ignored because it is small and it seldom opposes the resultant of the other two terms; the approximate update works very well in practice even when a single reconstruction of each data vector is used in place of the full probability distribution over reconstructions."
  evidence:
    - {work: "hinton-2002-training-products-experts-contrastive-divergence", role: original, locator: "p. 4", stance: for}

- id: c-cd-limit
  type: mathematical
  text: "For an RBM, one block Gibbs step is a Markov chain on the visible vectors whose transition probabilities are all positive and which leaves p(v) invariant, so the distribution after k steps from the data converges to p(v) and the expected CD-k update converges to the exact gradient of the log-likelihood as k grows; for finite k it differs from it."
  assumes: ["finite weights and biases, so every conditional probability lies strictly between 0 and 1", "the expectation is over the Gibbs draws, with the hidden statistics replaced by their conditional means"]
  derivation: cd-k-limit

- id: c-cd1-bias
  type: attributive
  text: "CD-1 is fast, has low variance, and is a reasonable approximation to the likelihood gradient, but it is still significantly different from the likelihood gradient when the mixing rate is low."
  evidence:
    - {work: "tieleman-2008-training-rbms-approximations-likelihood", role: original, locator: "p. 2", stance: for}

- id: c-pcd
  type: attributive
  text: "In Persistent Contrastive Divergence the Markov Chain is not reset between parameter updates; this is still an approximation because the model changes slightly with each parameter update, but with an infinitesimally small learning rate it becomes exact, and in general it seems to work best with small learning rates."
  evidence:
    - {work: "tieleman-2008-training-rbms-approximations-likelihood", role: original, locator: "p. 2", stance: for}

- id: c-pcd-results
  type: attributive
  text: "Tieleman compared Persistent Contrastive Divergence with standard Contrastive Divergence and Pseudo-Likelihood algorithms on test data likelihood and classification error rate, and found that it outperforms the other algorithms and is equally fast and simple."
  evidence:
    - {work: "tieleman-2008-training-rbms-approximations-likelihood", role: original, locator: "p. 1", stance: for}

- id: c-sgld
  type: attributive
  text: "Langevin dynamics take gradient steps but also inject Gaussian noise, with the step sizes and the variances of the injected noise balanced so that the variance of the samples matches that of the posterior; as the step size decreases the discretization error decreases as well, so that the rejection rate of a Metropolis-Hastings correction approaches zero."
  evidence:
    - {work: "welling-2011-bayesian-learning-stochastic-gradient-langevin", role: original, locator: "p. 2", stance: for}

- id: c-du-langevin
  type: attributive
  text: "Du and Mordatch sample from a network energy with Langevin dynamics; as K goes to infinity and the step size goes to 0 the distribution of the samples approaches the distribution defined by the energy function, so samples are generated implicitly by the energy function as opposed to being explicitly generated by a feedforward network."
  evidence:
    - {work: "du-2019-implicit-generation-generalization-energy-based", role: original, locator: "p. 3", stance: for}

- id: c-langevin-variance
  type: mathematical
  text: "For the quadratic energy |x|^2/(2 s^2), whose Gibbs distribution is N(0, s^2 I), the Langevin chain x <- x - (step/2) grad E(x) + N(0, step I) with step < 4 s^2 has a Gaussian stationary distribution with variance s^2 / (1 - step/(4 s^2)) in each coordinate, larger than s^2 and equal to it only in the limit of a vanishing step."
  assumes: ["the noise variance equals the step", "the chain is run long enough for the initial condition to be forgotten"]
  derivation: langevin-stationary-variance

- id: c-du-buffer
  type: attributive
  text: "Du and Mordatch use a sample replay buffer of past generated samples and initialize Langevin dynamics from it 95% of the time and from uniform noise otherwise, which continues to refine past samples, further increasing the number of sampling steps as well as sample diversity."
  evidence:
    - {work: "du-2019-implicit-generation-generalization-energy-based", role: original, locator: "p. 4", stance: for}

- id: c-du-reg
  type: attributive
  text: "To constrain the Lipschitz constant of the energy network Du and Mordatch add spectral normalization to all layers of the model, and they weakly L2 regularize energy magnitudes for both positive and negative samples, since otherwise the difference between positive and negative samples is preserved while the actual values fluctuate to numerically unstable values."
  evidence:
    - {work: "du-2019-implicit-generation-generalization-energy-based", role: original, locator: "p. 4", stance: for}

- id: c-score-z
  type: attributive
  text: "The point in using the score function, the gradient of the log-density with respect to the data, is that it does not depend on the normalization constant Z."
  evidence:
    - {work: "hyvarinen-2005-estimation-non-normalized-score-matching", role: original, locator: "p. 2", stance: for}

- id: c-score-matching
  type: mathematical
  text: "If the data density and the model score are differentiable and the product of the density and the score vanishes at infinity, half the expected squared distance between the model score and the data score equals the expectation over the data of sum_i [d psi_i / d x_i + psi_i^2 / 2] plus a constant that does not depend on the parameters; for the Gaussian energy (x - mu) M (x - mu)^T / 2 the minimizer of the sample objective is the sample mean and the inverse of the sample covariance, the maximum likelihood estimate for every sample."
  assumes: ["the data density q and the model score are continuously differentiable", "q(x) psi(x) goes to 0 as |x| goes to infinity, and the expectations of psi^2 and of the data score squared are finite", "for the Gaussian part, the sample covariance is invertible"]
  derivation: score-matching-integration-by-parts

- id: c-sm-efficiency
  type: attributive
  text: "In Hyvärinen's simulations the error of score matching seemed to go to zero, validating its consistency, and score matching gave slightly larger errors than maximum likelihood, which is to be expected because of the efficiency results of maximum likelihood estimation."
  evidence:
    - {work: "hyvarinen-2005-estimation-non-normalized-score-matching", role: original, locator: "p. 7", stance: for}

- id: c-nce-def
  type: attributive
  text: "Noise-contrastive estimation performs nonlinear logistic regression to discriminate between the observed data and some artificially generated noise, using the model log-density function in the regression nonlinearity; it leads to a consistent estimator of the parameters, works directly for unnormalized models, and estimates the normalization constant just like any other parameter."
  evidence:
    - {work: "gutmann-2010-noise-contrastive-estimation", role: original, locator: "p. 1", stance: for}

- id: c-nce-mle-z
  type: attributive
  text: "The normalization constant cannot be estimated as a parameter by maximum likelihood estimation, because the likelihood can be made arbitrarily large by making Z go to zero."
  evidence:
    - {work: "gutmann-2010-noise-contrastive-estimation", role: original, locator: "p. 2", stance: for}

- id: c-nce-optimum
  type: mathematical
  text: "Over all functions f used in place of the model log-density, the noise-contrastive objective with one noise sample per data point is maximized by f = log q, the data log-density, and has no other maximum if the noise density is positive wherever the data density is; the maximizing density has unit integral without any normalization constraint, so the fitted additive constant is the log-normalizer."
  assumes: ["the expectations are exact, the infinite-sample objective", "the noise density p_n is known and positive wherever q is positive", "f ranges over all measurable functions"]
  derivation: nce-optimum

- id: c-nce-noise
  type: attributive
  text: "The noise distribution should be close to the data distribution, because otherwise the classification problem might be too easy and would not require the system to learn much about the structure of the data; if the noise is equal to the data distribution, the asymptotic covariance of the estimator equals two times the Cramér-Rao bound."
  evidence:
    - {work: "gutmann-2010-noise-contrastive-estimation", role: original, locator: "p. 4", stance: for}

- id: c-jem-def
  type: attributive
  text: "Grathwohl and colleagues re-use the LogSumExp of the logits of any classifier to define the energy of a data point as minus that LogSumExp; unlike typical classifiers, where shifting the logits by an arbitrary scalar does not affect the model at all, in their framework shifting the logits for a data point affects log p(x), so the extra degree of freedom hidden within the logits defines the density over input examples."
  evidence:
    - {work: "grathwohl-2019-your-classifier-secretly-energy-based-model", role: original, locator: "p. 3", stance: for}

- id: c-jem-shift
  type: mathematical
  text: "Adding a constant s(x) to all K logits of a classifier lowers the energy -logsumexp_y f(x)[y] by s(x) and leaves the class probabilities softmax(f(x)) unchanged."
  assumes: ["the logits are finite"]
  derivation: jem-logit-shift

- id: c-params
  type: mathematical
  text: "An RBM with D visible and H hidden units has DH + D + H parameters; one full block Gibbs step on B vectors costs 4BDH FLOPs counting a multiply-add as 2, the free energy of B vectors costs 2BDH, a CD-k update costs 4BDH(k + 1) for its k Gibbs steps and the up passes of the data and of the last sample, and the exact partition function costs 2^D free energies."
  assumes: ["only the products with W are counted, a multiply-add as 2 FLOPs", "the biases, the sigmoids, the softplus and the Bernoulli draws are left out"]
  derivation: parameter-and-flop-count

- id: c-usps
  type: attributive
  text: "An RBM with 500 hidden units and 256 visible units was trained on 8000 16 x 16 real-valued images of handwritten digits from all 10 classes, from the training set on the USPS Cedar ROM, with the pixel intensities normalized to lie between 0 and 1 so that they could be treated as probabilities."
  evidence:
    - {work: "hinton-2002-training-products-experts-contrastive-divergence", role: original, locator: "p. 8", stance: for}

- id: c-jem-biased-sampler
  type: attributive
  text: "In practice the step-size of stochastic gradient Langevin dynamics and the standard deviation of its noise are often chosen separately, leading to a biased sampler which allows for faster training."
  evidence:
    - {work: "grathwohl-2019-your-classifier-secretly-energy-based-model", role: original, locator: "p. 2", stance: for}

- id: c-weight-decay-mixing
  type: attributive
  text: "On an artificially generated data set with an infinite amount of data, all four algorithms Tieleman compared did work best with some weight decay, because CD algorithms are quite dependent on the mixing rate of the Markov Chain defined by the Gibbs sampler, and that mixing rate is higher when the parameters of the model are smaller."
  evidence:
    - {work: "tieleman-2008-training-rbms-approximations-likelihood", role: original, locator: "p. 5", stance: for}

- id: c-jem-results
  type: attributive
  text: "On CIFAR-10, JEM reached 92.9% classification accuracy, an Inception Score of 8.76 and an FID of 38.4, against 95.8% accuracy for the Wide-ResNet trained as an ordinary classifier, an Inception Score of 8.3 and an FID of 37.9 for the energy-based model of Du and Mordatch, and 8.59 and 25.5 for SNGAN."
  evidence:
    - {work: "grathwohl-2019-your-classifier-secretly-energy-based-model", role: original, locator: "p. 4", stance: for}

- id: c-pcd-setup
  type: attributive
  text: "Tieleman split the official MNIST training set of 60,000 cases into a training set of 50,000 cases and a validation set of 10,000 cases, treated the pixel intensities as probabilities to obtain binary data, and used RBMs with 500 hidden units."
  evidence:
    - {work: "tieleman-2008-training-rbms-approximations-likelihood", role: original, locator: "pp. 2 to 3", stance: for}

- id: c-jem-unstable
  type: attributive
  text: "The gradient estimators used to train JEM are quite unstable and are prone to diverging if the sampling and optimization parameters are not tuned correctly; the models used to generate the results regularly diverged throughout training, requiring them to be restarted with lower learning rates or with increased regularization."
  evidence:
    - {work: "grathwohl-2019-your-classifier-secretly-energy-based-model", role: original, locator: "p. 8", stance: for}

- id: c-du-is
  type: attributive
  text: "Du and Mordatch strongly encourage future work to compare solely with the FID score rather than the Inception Score, since Langevin dynamics converges to minima that artificially inflate the Inception Score."
  evidence:
    - {work: "du-2019-implicit-generation-generalization-energy-based", role: original, locator: "p. 5", stance: for}
