# SPDX-License-Identifier: MIT
# The shape contract of the denoiser on the page (spec 08.6): a network that reads a noisy sample of dimension dim,
# adds a sinusoidal embedding of the time step through Wt and a learned embedding of the class, passes the sum through
# a tanh layer of width hidden, and returns the predicted noise as the noisy sample plus a linear read-out. The class
# table has one extra row, the null class that the dropped condition of classifier-free guidance trains. The FLOPs count
# the three matrix products, a multiply-add as 2; the class lookup, biases, the time embedding and tanh are left out.
config:
  dim:     {meaning: "dimension of a sample", symbol: "D", example: 3, sample: [1, 8]}
  hidden:  {meaning: "width of the hidden layer", symbol: "H", example: 5, sample: [1, 16]}
  temb:    {meaning: "width of the sinusoidal time embedding, even", symbol: "E", example: 4, sample: [2, 8]}
  classes: {meaning: "number of classes, not counting the null class", symbol: "C", example: 2, sample: [1, 5]}
axes:
  B: {meaning: "batch of noisy samples", example: 4, sample: [1, 6]}
  D: dim
  H: hidden
  E: temb
  C: classes
blocks:
  - id: embed
    meaning: "the hidden layer tanh(z W1 + emb(t) Wt + emb[y] + b1), with emb[C] the null class"
    eq: [cfg]
    inputs: {z: "(B, D)", t: "(B)", y: "(B)"}
    outputs: {h: "(B, H)"}
    params: "D * H + E * H + (C + 1) * H + H"
    flops_forward: "2 * B * (D * H + E * H)"
  - id: head
    meaning: "the predicted noise z + h W2 + b2"
    eq: [cfg]
    inputs: {h: "(B, H)"}
    outputs: {eps: "(B, D)"}
    params: "H * D + D"
    flops_forward: "2 * B * H * D"
model:
  params: {formula: "embed.params + head.params", symbol: "P", meaning: "the weights, biases and class embeddings of the denoiser"}
  flops_forward: {formula: "embed.flops_forward + head.flops_forward", symbol: "C_f", meaning: "FLOPs of one denoiser call on B samples; a guided step costs two calls, one outside the guidance interval"}
configs:
  mixture: {meaning: "the denoiser of the test, trained on three classes in the plane, one Adam batch", dim: 2, hidden: 64, temb: 16, classes: 3, B: 256}
  imagenet_latent: {meaning: "a denoiser of this form on the 32 x 32 x 4 latent of a 256 x 256 image, ImageNet classes, one image", dim: 4096, hidden: 1024, temb: 256, classes: 1000, B: 1}
