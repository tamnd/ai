# The claims of the flow matching page (spec 07). The build computes the labels.
- id: c-fm-def
  type: attributive
  text: "Lipman and colleagues present Flow Matching as a simulation-free approach for training continuous normalizing flows based on regressing vector fields of fixed conditional probability paths; it is compatible with a general family of Gaussian probability paths for transforming between noise and data samples, which subsumes existing diffusion paths as specific instances."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 1", stance: for}

- id: c-cnf
  type: attributive
  text: "A time-dependent vector field v_t defines a flow phi_t through the ordinary differential equation d/dt phi_t(x) = v_t(phi_t(x)) with phi_0(x) = x; Chen and colleagues suggested modeling the vector field with a neural network, which gives a continuous normalizing flow that reshapes a simple prior density p_0, such as pure noise, into a more complicated one, p_1, via the push-forward equation."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 2", stance: for}

- id: c-icov
  type: mathematical
  text: "If a point moves by dx/dt = v_t(x) and its density is p_t, then d/dt log p_t(x_t) = -div v_t(x_t), the trace of the Jacobian of v_t, so the log-density of a sample at t = 1 is log p_0(x_0) minus the integral of the divergence along its path, with no determinant to compute."
  assumes: ["v_t is uniformly Lipschitz in x and continuous in t", "p_0 is a density"]
  derivation: change-of-variables

- id: c-chen-trace
  type: attributive
  text: "Chen and colleagues state the instantaneous change of variables: for a continuous-in-time transformation dz/dt = f(z(t), t), with f uniformly Lipschitz continuous in z and continuous in t, the change in log probability follows a differential equation, so instead of the log determinant of a discrete normalizing flow only a trace operation is required."
  evidence:
    - {work: "chen-2018-neural-ordinary-differential-equations", role: original, locator: "p. 4", stance: for}

- id: c-fm-intractable
  type: attributive
  text: "The Flow Matching loss regresses the vector field u_t with a neural network, and upon reaching zero loss the learned flow generates p_t; but naively it is intractable to use in practice, since there is no prior knowledge of what an appropriate p_t and u_t are, and generally no closed form u_t that generates the desired p_t."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 3", stance: for}

- id: c-marginal
  type: mathematical
  text: "If every conditional vector field u_t(x | x_1) generates its conditional path p_t(x | x_1), then for any data distribution q the marginal field u_t(x), the average of u_t(x | x_1) weighted by p_t(x | x_1) q(x_1) / p_t(x), generates the marginal path p_t(x), the average of p_t(x | x_1) over q; equivalently u_t(x) is the conditional mean of the conditional field given that the path passes through x at time t."
  assumes: ["p_t(x) > 0 for all x and t", "differentiation and integration over x_1 may be exchanged"]
  derivation: marginal-field

- id: c-cfm-grad
  type: mathematical
  text: "The conditional flow matching loss, which regresses v_t(x) on the conditional field u_t(x | x_1) at points x drawn from p_t(x | x_1), differs from the flow matching loss, which regresses on the marginal field u_t(x), by a constant that does not depend on the network, so the two losses have the same gradient and the same minimizer."
  assumes: ["p_t(x) > 0 for all x and t", "the conditional field has a finite second moment"]
  derivation: cfm-gradient

- id: c-cond-ot
  type: mathematical
  text: "The Gaussian conditional path with mean t x_1 and standard deviation 1 - (1 - sigma_min) t is the push-forward of the noise by x_t = (1 - (1 - sigma_min) t) x_0 + t x_1, whose time derivative x_1 - (1 - sigma_min) x_0 does not depend on t; expressed at the point x it is the field u_t(x | x_1) = (x_1 - (1 - sigma_min) x) / (1 - (1 - sigma_min) t), defined for all t in [0, 1]."
  assumes: ["0 <= sigma_min < 1", "x_0 ~ N(0, I)"]
  derivation: conditional-ot-field

- id: c-ot-straight
  type: attributive
  text: "The conditional flow of the linear path is the optimal transport displacement map between the two Gaussians, and its particles always move in straight line trajectories with constant speed, while sampling trajectories of diffusion paths can overshoot the final sample; the authors note that although the conditional flow is optimal, this by no means implies that the marginal vector field is an optimal transport solution."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 6", stance: for}

- id: c-fm-concurrent
  type: attributive
  text: "Lipman and colleagues write that concurrently to their work Liu and colleagues and Albergo and Vanden-Eijnden arrived at similar conditional objectives for simulation-free training of continuous normalizing flows."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 7", stance: for}

- id: c-fm-results
  type: attributive
  text: "With the same U-Net architecture, Flow Matching with the optimal transport path reached a negative log-likelihood of 2.99 bits per dimension, an FID of 6.35 and 142 function evaluations of the adaptive solver on CIFAR-10, against 3.12, 7.48 and 274 for DDPM, and an FID of 20.9 on ImageNet 128 x 128."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 8", stance: for}

- id: c-fm-train-cost
  type: attributive
  text: "For ImageNet-128, where Dhariwal and Nichol train for 4.36m iterations with batch size 256, the Flow Matching model, 25% larger, used 500k iterations with batch size 1.5k, that is 33% less image throughput."
  evidence:
    - {work: "lipman-2022-flow-matching-generative-modeling", role: original, locator: "p. 8", stance: for}

- id: c-rf-def
  type: attributive
  text: "Rectified flow learns an ordinary differential equation dZ_t = v(Z_t, t) dt whose drift is fitted by least squares to the direction X_1 - X_0 of the linear interpolation X_t = t X_1 + (1 - t) X_0; following X_t directly would be non-causal, because the update requires the final point X_1, and fitting the drift causalizes the paths so that the flow can be simulated without seeing the future."
  evidence:
    - {work: "liu-2022-flow-straight-fast-rectified", role: original, locator: "p. 4", stance: for}

- id: c-rf-noncross
  type: attributive
  text: "The paths of a well defined ordinary differential equation cannot cross each other, while the paths of the interpolation process may intersect; the rectified flow rewires the individual trajectories passing through the intersection points to avoid crossing, while tracing out the same density map as the linear interpolation."
  evidence:
    - {work: "liu-2022-flow-straight-fast-rectified", role: original, locator: "p. 5", stance: for}

- id: c-rf-cost
  type: mathematical
  text: "Let Z solve dZ_t = v(Z_t, t) dt from Z_0 = X_0 with v(x, t) = E[X_1 - X_0 | X_t = x] for the linear interpolation X_t of a coupling (X_0, X_1); then Z_t has the law of X_t at every t, and E c(Z_1 - Z_0) <= E c(X_1 - X_0) for every convex cost c."
  assumes: ["the ODE has a unique solution", "c is convex and the expectations are finite"]
  derivation: reflow-transport-cost

- id: c-rf-reflow
  type: attributive
  text: "Applying the rectification recursively, reflow, decreases transport cost and straightens the paths of the flow, and perfectly straight paths can be simulated exactly with a single Euler step."
  evidence:
    - {work: "liu-2022-flow-straight-fast-rectified", role: original, locator: "p. 5", stance: for}

- id: c-rf-results
  type: attributive
  text: "With one step of reflow the flow becomes nearly straight and gives good results with a single Euler discretization step; for one-step fast diffusion and flow models on CIFAR10 Liu and colleagues report an FID of 4.85 and a recall of 0.51."
  evidence:
    - {work: "liu-2022-flow-straight-fast-rectified", role: original, locator: "p. 4", stance: for}

- id: c-si-def
  type: attributive
  text: "Albergo and Vanden-Eijnden infer the velocity of a continuous-time normalizing flow from the probability current of a time-dependent density that interpolates between base and target in finite time, which leads to a simple quadratic loss for the velocity and avoids costly backpropagation through ODE solvers; an instance of the interpolant is cos(pi t / 2) x_0 + sin(pi t / 2) x_1, and the method is demonstrated up to 128 x 128."
  evidence:
    - {work: "albergo-2022-building-normalizing-flows-stochastic", role: original, locator: "pp. 1, 2", stance: for}

- id: c-tong-def
  type: attributive
  text: "Tong and colleagues introduce generalized conditional flow matching, a family of simulation-free training objectives that, unlike diffusion models and prior training algorithms for continuous normalizing flows, does not require the source distribution to be Gaussian or require evaluation of its density; its optimal transport variant creates simpler flows that are more stable to train and lead to faster inference."
  evidence:
    - {work: "tong-2023-improving-generalizing-flow-minibatch-ot", role: original, locator: "p. 1", stance: for}

- id: c-tong-equiv
  type: attributive
  text: "When the conditional probability path is a Dirac, with sigma = 0, independent conditional flow matching is equivalent to rectified flow, and with the mean cos(pi t / 2) x_0 + sin(pi t / 2) x_1 instead of the linear interpolation it would be equivalent to the variance preserving stochastic interpolant of Albergo and Vanden-Eijnden."
  evidence:
    - {work: "tong-2023-improving-generalizing-flow-minibatch-ot", role: original, locator: "p. 7", stance: for}

- id: c-tong-ot
  type: attributive
  text: "Optimal transport conditional flow matching samples the pair x_0, x_1 jointly from the 2-Wasserstein optimal transport plan instead of independently; as sigma goes to 0 its marginal field solves the dynamic optimal transport problem, and because optimal transport has cubic time and quadratic memory complexity in the number of samples, the plan is computed on each minibatch."
  evidence:
    - {work: "tong-2023-improving-generalizing-flow-minibatch-ot", role: original, locator: "pp. 7, 8", stance: for}

- id: c-tong-sb
  type: attributive
  text: "Schrödinger bridge conditional flow matching, an entropic variant of OT-CFM, pairs the samples by the solution of the entropy-regularized optimal transport problem; the flow still matches the marginals for any choice of the regularization epsilon, and OT-CFM is recovered when epsilon goes to 0 and I-CFM when epsilon goes to infinity."
  evidence:
    - {work: "tong-2023-improving-generalizing-flow-minibatch-ot", role: original, locator: "p. 8", stance: for}

- id: c-sd3-def
  type: attributive
  text: "Esser and colleagues improve noise sampling techniques for training rectified flow models by biasing them towards perceptually relevant scales, and train an 8B rectified flow model for text-to-image synthesis."
  evidence:
    - {work: "esser-2024-scaling-rectified-flow-transformers", role: original, locator: "p. 1", stance: for}

- id: c-sd3-convention
  type: attributive
  text: "Rectified flows define the forward process as straight paths between the data distribution and a standard normal distribution, z_t = (1 - t) x_0 + t epsilon, with the data at t = 0, and the network output directly parameterizes the velocity."
  evidence:
    - {work: "esser-2024-scaling-rectified-flow-transformers", role: original, locator: "p. 3", stance: for}

- id: c-sd3-middle
  type: attributive
  text: "The velocity target is more difficult for t in the middle of [0, 1], since at either end the optimal prediction is the mean of the other distribution; sampling t from a logit-normal distribution, a normal variable with location m and scale s mapped through the standard logistic function, gives more weight to intermediate timesteps."
  evidence:
    - {work: "esser-2024-scaling-rectified-flow-transformers", role: original, locator: "p. 4", stance: for}

- id: c-sd3-results
  type: attributive
  text: "Training each of 61 different formulations, Esser and colleagues observe that rf/lognorm(0.00, 1.00) consistently achieves a good rank and outperforms a rectified flow formulation with uniform timestep sampling, and that only rectified flow formulations with modified timestep sampling perform better than the eps/linear formulation of LDM used previously."
  evidence:
    - {work: "esser-2024-scaling-rectified-flow-transformers", role: original, locator: "pp. 5, 6", stance: for}

- id: c-one-step
  type: mathematical
  text: "Under the independent coupling of noise and data, the marginal field at t = 0 is u_0(x) = E[x_1] - (1 - sigma_min) x, so a single Euler step from t = 0 to t = 1 sends every noise point x to E[x_1] + sigma_min x, and with sigma_min = 0 to the mean of the data."
  assumes: ["x_0 ~ N(0, I) independent of x_1", "the path of c-cond-ot"]
  derivation: one-step-to-mean

- id: c-translation
  type: mathematical
  text: "For noise N(0, 1) and data N(2, 1) in one dimension with sigma_min = 0, the 1-rectified flow is x_t = 2t + x_0 sqrt((1 - t)^2 + t^2), which ends at x_0 + 2, the translation and the optimal transport map, but bends on the way; Euler's method with 1, 2 and 4 steps maps two points one apart at t = 0 to points 0, 0.5 and 0.72 apart, while one midpoint step is exact."
  assumes: ["the marginal field of c-marginal for this pair of Gaussians"]
  derivation: translation-flow

- id: c-params
  type: mathematical
  text: "The velocity network of this page, one tanh hidden layer of H units on D data coordinates and E time features, has (D + E + 1) H + (H + 1) D parameters and costs 2BH(2D + E) FLOPs on B points; an Euler sample of n steps costs n evaluations and a midpoint sample 2n."
  assumes: ["only the matrix products are counted, a multiply-add as 2 FLOPs"]
  derivation: parameter-and-flop-count
