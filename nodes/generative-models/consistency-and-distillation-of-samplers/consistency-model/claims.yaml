# The claims of the consistency model page (spec 07). The build computes the labels.
- id: c-cm-def
  type: attributive
  text: "Consistency models generate samples by directly mapping noise to data: a model learns to map any point on a trajectory of the probability flow ODE to the trajectory's origin, so it supports one-step generation by design, multistep sampling that trades compute for quality, and zero-shot editing such as inpainting, colorization and super-resolution; it can be trained by distilling a pre-trained diffusion model or as a standalone generative model."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "pp. 1, 3", stance: for}

- id: c-cm-boundary
  type: attributive
  text: "All consistency models must meet the boundary condition f(x, eps) = x, which plays a crucial role in their successful training and is the most confining architectural constraint on them; it can be implemented almost for free with a skip connection f = c_skip(t) x + c_out(t) F(x, t), and it precludes the trivial solution f = 0 from arising in training."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 3, Eq. 5; p. 5", stance: for}

- id: c-cm-theorem1
  type: attributive
  text: "If f-theta satisfies the Lipschitz condition, the ODE solver has local error bounded by O((t_{n+1} - t_n)^{p+1}) with p >= 1, and the consistency distillation loss is 0, then f-theta differs from the consistency function of the empirical PF ODE by O((Delta t)^p), with Delta t the maximum of |t_{n+1} - t_n|."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 5, Theorem 1", stance: for}

- id: c-cm-ema
  type: attributive
  text: "Compared with simply setting the target parameters to the online ones, the EMA update and the stop-gradient of the target network greatly stabilize training and improve the final consistency model."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 5", stance: for}

- id: c-cm-ct-estimator
  type: attributive
  text: "Consistency training avoids the pre-trained score model by an unbiased estimator of the score, -E[(x_t - x) / t^2 | x_t], which suffices to replace the diffusion model in consistency distillation with the Euler solver in the limit of infinitely many steps."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 5, Lemma 1", stance: for}

- id: c-cm-cd-config
  type: attributive
  text: "On CIFAR-10 the best configuration of consistency distillation is the LPIPS metric, Heun's solver and N = 18; consistency distillation outperforms progressive distillation across all datasets, sampling steps and metrics tried, except single-step generation on LSUN Bedroom 256x256 with the squared l2 metric."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 7, Figure 3, Figure 4", stance: for}

- id: c-cm-ct-n
  type: attributive
  text: "The convergence of consistency training is highly sensitive to N: smaller N leads to faster convergence but worse samples, larger N to slower convergence but better samples, which motivates growing N and the EMA rate mu during training."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "p. 7", stance: for}

- id: c-cm-results
  type: attributive
  text: "Consistency distillation reached FIDs of 3.55 and 2.93 with one and two steps on CIFAR-10 and 6.20 and 4.70 on ImageNet 64x64, against 2.04 at 35 evaluations and 2.44 at 79 for the EDM teachers; consistency training reached 8.70 and 5.83 on CIFAR-10 and 13.0 and 11.1 on ImageNet 64x64."
  evidence:
    - {work: "song-2023-consistency-models", role: original, locator: "pp. 1 to 2; p. 8, Table 1", stance: for}

- id: c-ict-ema
  type: attributive
  text: "The EMA decay rate of the teacher network should always be zero for consistency training, although it can be nonzero for consistency distillation; with a nonzero rate the limit of the training objective as N grows is not a valid objective for learning the consistency function."
  evidence:
    - {work: "song-2023-improved-techniques-training-consistency", role: original, locator: "pp. 5 to 6, Proposition 1", stance: for}

- id: c-ict-huber
  type: attributive
  text: "Pseudo-Huber metrics, d(x, y) = sqrt(||x - y||^2 + c^2) - c, smoothly bridge the l1 and squared l2 metrics, are continuously twice differentiable, and reduce the variance of the Adam updates relative to the squared l2 metric; c = 0.03 is optimal for CIFAR-10, and c = 0.00054 sqrt(d) is proposed for images of d dimensions."
  evidence:
    - {work: "song-2023-improved-techniques-training-consistency", role: original, locator: "pp. 6 to 7, Eq. 8", stance: for}

- id: c-ict-curriculum
  type: attributive
  text: "FID improves with the number of discretization steps N following a power law until saturation; doubling N after a set number of iterations gives the best of the curricula tried, with N capped at 1281, and sampling noise levels from a discretized lognormal with mean -1.1 and standard deviation 2.0 improves sample quality over the original schedule, which favours high noise levels."
  evidence:
    - {work: "song-2023-improved-techniques-training-consistency", role: original, locator: "pp. 7 to 8, Eq. 9, Eq. 10, Figure 3, Figure 4", stance: for}

- id: c-ict-results
  type: attributive
  text: "Improved consistency training reaches one-step FIDs of 2.51 on CIFAR-10 and 3.25 on ImageNet 64x64, a 3.5x and 4x improvement over prior consistency training, and two-step FIDs of 2.24 and 2.77, surpassing consistency distillation in both one-step and two-step settings."
  evidence:
    - {work: "song-2023-improved-techniques-training-consistency", role: original, locator: "p. 1", stance: for}

- id: c-pd
  type: attributive
  text: "Progressive distillation distils a deterministic diffusion sampler into a model that takes half as many steps and repeats, going from samplers of 8192 steps to 4 steps with an FID of 3.0 on CIFAR-10, and the whole procedure takes no more time than training the original model."
  evidence:
    - {work: "salimans-2022-progressive-distillation-fast-sampling", role: original, locator: "p. 1", stance: for}

- id: c-pd-param
  type: attributive
  text: "As the signal-to-noise ratio goes to zero, small changes in the predicted noise are increasingly amplified in the implied prediction in x-space, which divides by alpha_t, and with a single sampling step the link between noise prediction and x-prediction breaks down completely; predicting x directly, predicting both x and the noise, or predicting v all keep the implied prediction stable and work well with progressive distillation."
  evidence:
    - {work: "salimans-2022-progressive-distillation-fast-sampling", role: original, locator: "p. 5", stance: for}

- id: c-luhman
  type: attributive
  text: "Knowledge distillation of a diffusion sampler into a single-step denoising student, trained to predict the output of a deterministic DDIM sampler from the same initial noise, reached an FID of 9.36 on CIFAR-10 without adversarial training, where the iterative models it distils are 2 to 3 orders of magnitude slower than GANs and VAEs."
  evidence:
    - {work: "luhman-2021-knowledge-distillation-iterative-generative", role: original, locator: "pp. 1 to 2; p. 7", stance: for}

- id: c-meng
  type: attributive
  text: "Guided diffusion models can be distilled in two stages, first one model matching the combined conditional and unconditional outputs, then progressive distillation; in pixel space this gives samples comparable to the original with 4 steps on ImageNet 64x64 and CIFAR-10, up to 256 times faster, and in latent space 1 to 4 steps."
  evidence:
    - {work: "meng-2022-distillation-guided-diffusion-models", role: original, locator: "pp. 1 to 2", stance: for}

- id: c-lcm
  type: attributive
  text: "Latent consistency models view guided reverse diffusion as solving an augmented probability flow ODE in the latent space of a pre-trained latent diffusion model; a 2 to 4 step model at 768x768 distilled from a classifier-free guided Stable Diffusion takes 32 A100 GPU hours to train."
  evidence:
    - {work: "luo-2023-latent-consistency-models-synthesizing", role: original, locator: "p. 1", stance: for}

- id: c-scm
  type: attributive
  text: "Continuous-time consistency models, stabilized by changes to the diffusion parameterization, network architecture and objective, were trained at 1.5B parameters on ImageNet 512x512 and reached two-step FIDs of 2.06 on CIFAR-10, 1.48 on ImageNet 64x64 and 1.88 on ImageNet 512x512, within 10% of the best diffusion models."
  evidence:
    - {work: "lu-2024-simplifying-stabilizing-scaling-continuous", role: original, locator: "p. 1", stance: for}

- id: c-add
  type: attributive
  text: "Adversarial diffusion distillation combines score distillation from a large diffusion model with an adversarial loss to sample in 1 to 4 steps; it outperforms GANs and latent consistency models in a single step and reaches SDXL in four steps."
  evidence:
    - {work: "sauer-2023-adversarial-diffusion-distillation", role: original, locator: "p. 1", stance: for}

- id: c-dmd
  type: attributive
  text: "Distribution matching distillation trains a one-step generator by minimizing an approximate KL divergence whose gradient is the difference of two scores, one of the target and one of the generator's distribution, plus a regression loss, reaching an FID of 2.62 on ImageNet 64x64 and 11.49 on zero-shot COCO-30k."
  evidence:
    - {work: "yin-2023-one-step-diffusion-distribution", role: original, locator: "p. 1", stance: for}

- id: c-edm
  type: attributive
  text: "With its design choices, including Heun's second-order sampler, the EDM diffusion model reached an FID of 1.97 for unconditional CIFAR-10 with 35 network evaluations per image."
  evidence:
    - {work: "karras-2022-elucidating-design-space-diffusion", role: original, locator: "p. 1", stance: for}

- id: c-param-boundary
  type: mathematical
  text: "With c_skip(t) = sigma_d^2 / ((t - eps)^2 + sigma_d^2) and c_out(t) = sigma_d (t - eps) / sqrt(sigma_d^2 + t^2), the model f = c_skip(t) x + c_out(t) F(x, t) satisfies f(x, eps) = x for every network F with finite outputs and every parameter, and is differentiable in t when F is."
  assumes: ["F_theta(x, t) is finite for every x and t, whatever theta", "sigma_data > 0 and 0 < eps < T"]
  derivation: parameterization

- id: c-gauss-cf
  type: mathematical
  text: "For Gaussian data N(mu, s^2 I) and x_t = x_0 + t z, the consistency function of the probability flow ODE is f(x, t) = mu + (x - mu) sqrt((s^2 + eps^2) / (s^2 + t^2)); it satisfies the boundary condition, has zero total derivative along the ODE and maps N(mu, (s^2 + T^2) I) to N(mu, (s^2 + eps^2) I)."
  assumes: ["the data are N(mu, s2 I) with s2 > 0", "the probability-flow ODE dx/dt = -t grad log p_t(x)"]
  derivation: gaussian-consistency-function

- id: c-ct-pair
  type: mathematical
  text: "For x_t = x + t z, grad log p_t(x_t) = -E[(x_t - x) / t^2 | x_t], and one Euler step of the probability flow ODE from x + t_{n+1} z to t_n with the one-sample estimate -(x_t - x) / t^2 in place of the score lands exactly on x + t_n z, so the pair of consistency training is the pair of consistency distillation with an Euler teacher using the one-sample estimate."
  assumes: ["x and z independent, z standard normal", "the data distribution has a finite mean"]
  derivation: score-estimator

- id: c-teacher-ema
  type: mathematical
  text: "For a point-mass dataset at xi and the one-parameter model f_theta(x, sigma) = (sigma_min / sigma) x + (1 - sigma_min / sigma) theta under the squared l2 metric, as the gaps between noise levels shrink the consistency training loss tends to E[(1 - sigma_min / sigma_i)^2] (theta - theta_minus)^2, independent of xi, when theta_minus differs from theta; with theta_minus = stopgrad(theta) the rescaled gradient is proportional to theta - xi and vanishes only at the true consistency function."
  assumes: ["the data are a point mass at xi", "the squared l2 metric and lambda = 1", "the largest gap between noise levels tends to 0"]
  derivation: teacher-ema

- id: c-huber-limits
  type: mathematical
  text: "For c > 0 the Pseudo-Huber metric d = sqrt(r^2 + c^2) - c lies between r^2 / (2 sqrt(r^2 + c^2)) and min(r^2 / (2c), r), so it behaves like r^2 / (2c) for r much smaller than c and like r - c for r much larger; its gradient has norm below 1, it is smooth at r = 0 with second derivative 1/c, and c = 0.00054 sqrt(d) gives 0.0299 for CIFAR-10."
  assumes: ["c > 0", "r is the Euclidean distance"]
  derivation: pseudo-huber

- id: c-pd-target
  type: mathematical
  text: "For a variance-preserving schedule, the target x-tilde = (z_t'' - r z_t) / (alpha_t'' - r alpha_t) with r = sigma_t'' / sigma_t is the unique x-prediction whose single DDIM step from t to t'' lands on the end of the teacher's two DDIM steps; its denominator is positive whenever t'' < t, including at alpha_t = 0; the epsilon link multiplies a prediction error by sigma_t / alpha_t and the v link by sigma_t <= 1."
  assumes: ["alpha_t^2 + sigma_t^2 = 1 with sigma_t / alpha_t increasing in t", "0 <= t'' < t' < t <= 1", "deterministic DDIM steps"]
  derivation: progressive-distillation-target

- id: c-schedules
  type: mathematical
  text: "The schedule of Song and colleagues takes N from s0 = 2 to s1 + 1 = 151 and mu from 0.9 to 0.9^(2/151) = 0.99861; the doubling curriculum with s0 = 10 and s1 = 1280 takes N through 11, 21, ..., 1281; a uniform index over the Karras levels gives log sigma a density proportional to sigma^(1/rho), with median sigma about 2.5, while the lognormal schedule gives each interval its mass under N(-1.1, 2^2) truncated to the range, and the weight 1 / (sigma_{i+1} - sigma_i) decreases in i."
  assumes: ["sigma_min = 0.002, sigma_max = 80, rho = 7"]
  derivation: schedules

- id: c-cost
  type: mathematical
  text: "Heun sampling over N noise levels ending with an Euler step to 0 costs 2N - 1 network evaluations, 35 for N = 18, while k-step consistency sampling costs k; a consistency distillation sample costs two teacher calls plus about four student-equivalent passes; the page's network has P = DH + EH + H + HD + D parameters and C_f = 2B(DH + EH + HD) FLOPs, 834 parameters for the test model and 12,713,984 FLOPs for one CIFAR-10 image."
  assumes: ["every network call costs the same", "a backward pass costs about twice a forward pass"]
  derivation: sampling-cost
