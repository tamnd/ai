# The claims of the diffusion model page (spec 07). The build computes the labels.
- id: c-sd-def
  type: attributive
  text: "Sohl-Dickstein and colleagues describe the essential idea, inspired by non-equilibrium statistical physics, as systematically and slowly destroying structure in a data distribution through an iterative forward diffusion process, then learning a reverse diffusion process that restores structure in data, which yields a flexible and tractable generative model with thousands of layers or time steps."
  evidence:
    - {work: "sohl-dickstein-2015-nonequilibrium-thermodynamics", role: original, locator: "p. 1", stance: for}

- id: c-sd-same-form
  type: attributive
  text: "The paper grounds the construction in the Kolmogorov forward and backward equations, according to which, for many forward diffusion processes the reverse diffusion process can be described using the same functional form, so that a forward process of small Gaussian steps has a reverse process of Gaussian steps whose means and variances are learned."
  evidence:
    - {work: "sohl-dickstein-2015-nonequilibrium-thermodynamics", role: original, locator: "pp. 2, 3", stance: for}

- id: c-ddpm-def
  type: attributive
  text: "Ho, Jain and Abbeel present diffusion probabilistic models as a class of latent variable models inspired by considerations from nonequilibrium thermodynamics, and obtain their best results by training on a weighted variational bound designed according to a connection between diffusion probabilistic models and denoising score matching with Langevin dynamics."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 1", stance: for}

- id: c-forward-marginal
  type: mathematical
  text: "With alpha_t = 1 - beta_t and alpha_bar_t the product of alpha_1 to alpha_t, the forward chain of Gaussian steps q(x_t | x_{t-1}) = N(sqrt(alpha_t) x_{t-1}, beta_t I) has the marginal q(x_t | x_0) = N(sqrt(alpha_bar_t) x_0, (1 - alpha_bar_t) I), so x_t at any step is drawn in one shot as sqrt(alpha_bar_t) x_0 + sqrt(1 - alpha_bar_t) eps."
  assumes: ["0 < beta_t < 1", "the noise of each step is independent of x_0 and of the other steps"]
  derivation: forward-marginal

- id: c-posterior
  type: mathematical
  text: "Conditioned on x_0, the step back is Gaussian, q(x_{t-1} | x_t, x_0) = N(mu_tilde_t, beta_tilde_t I), with a mean that is a fixed combination of x_0 and x_t and the variance beta_tilde_t = (1 - alpha_bar_{t-1}) / (1 - alpha_bar_t) beta_t, so every term of the variational bound is a KL divergence between Gaussians."
  assumes: ["the forward process of c-forward-marginal", "t > 1"]
  derivation: posterior

- id: c-reverse-mean
  type: mathematical
  text: "If the reverse mean is written mu_theta(x_t, t) = (x_t - beta_t / sqrt(1 - alpha_bar_t) eps_theta(x_t, t)) / sqrt(alpha_t), it equals the posterior mean mu_tilde_t exactly when eps_theta returns the noise eps that produced x_t from x_0."
  assumes: ["x_t = sqrt(alpha_bar_t) x_0 + sqrt(1 - alpha_bar_t) eps"]
  derivation: eps-parameterization

- id: c-eps-weight
  type: mathematical
  text: "With the reverse mean in the noise parameterization and a fixed variance sigma_t^2, the KL term L_{t-1} of the bound equals beta_t^2 / (2 sigma_t^2 alpha_t (1 - alpha_bar_t)) times the squared error of the noise prediction, so the bound is a weighted noise-prediction loss and the simple loss drops the weight."
  assumes: ["a reverse step N(mu_theta(x_t, t), sigma_t^2 I) with a fixed sigma_t^2", "t > 1"]
  derivation: eps-parameterization

- id: c-ddpm-dsm
  type: attributive
  text: "Ho and colleagues write that the eps-prediction parameterization both resembles Langevin dynamics and simplifies the diffusion model's variational bound to an objective that resembles denoising score matching, and that it is nonetheless just another parameterization of the reverse step, whose effectiveness they test in an ablation; predicting x_0 led to worse sample quality early in their experiments."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 4", stance: for}

- id: c-ddpm-sigma
  type: attributive
  text: "Ho, Jain and Abbeel set the reverse process variances to untrained time dependent constants; experimentally, the forward variance and the posterior variance of each step had similar results, the first choice being optimal for x_0 ~ N(0, I) and the second for x_0 deterministically set to one point."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 3", stance: for}

- id: c-ddpm-setup
  type: attributive
  text: "The DDPM experiments set T = 1000 and a forward variance increasing linearly from beta_1 = 10^-4 to beta_T = 0.02, chosen to be small relative to data scaled to [-1, 1] and so that the last step's term L_T is close to zero."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "pp. 5, 14", stance: for}

- id: c-ddpm-ablation
  type: attributive
  text: "In the ablation of Ho and colleagues, predicting the posterior mean works well only when trained on the true variational bound, learning the reverse variances leads to unstable training and poorer samples than fixed variances, and predicting the noise does about as well as predicting the mean on the bound but much better with the simplified objective; training on the true bound yields better codelengths, and the simplified objective the best sample quality."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 6", stance: for}

- id: c-ddpm-results
  type: empirical
  text: "The unconditional DDPM trained on the simplified objective reached an Inception score of 9.46 and an FID of 3.17 on CIFAR-10, with a negative log likelihood of at most 3.75 bits per dimension on the test set; the model trained on the true bound reached at most 3.70. On 256 x 256 LSUN the FID was 7.89 for Church and 4.90 for Bedroom."
  scope:
    models: "DDPM with T = 1000, a U-Net noise predictor and fixed reverse variances"
    data: ["CIFAR-10", "LSUN Church 256 x 256", "LSUN Bedroom 256 x 256"]
    setting: "unconditional generation; FID and Inception score on samples, NLL as the variational bound in bits per dimension"
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "pp. 1, 5, 6", stance: for}

- id: c-ddpm-lossy
  type: empirical
  text: "The gap between train and test codelengths was at most 0.03 bits per dimension, and the lossless codelengths were not competitive with other likelihood-based models; treating the bound terms of the reverse steps as rate and the decoder term as distortion, the CIFAR10 model with the best samples had a rate of 1.78 and a distortion of 1.97 bits per dimension, and more than half of the lossless codelength describes imperceptible distortions."
  scope:
    models: "DDPM trained on the simplified objective"
    data: ["CIFAR-10"]
    setting: "codelengths from the variational bound, distortion as RMSE on the 0 to 255 scale"
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "pp. 2, 6", stance: for}

- id: c-tweedie
  type: mathematical
  text: "The minimizer over all functions of the noise-prediction loss at step t is the conditional mean E[eps | x_t], and it equals -sqrt(1 - alpha_bar_t) times the score of the noised data density, grad log q_t(x_t), so a trained noise predictor is a scaled estimate of the score."
  assumes: ["x_t = sqrt(alpha_bar_t) x_0 + sqrt(1 - alpha_bar_t) eps with eps ~ N(0, I) independent of x_0", "q_t is differentiable and the derivative passes under the integral"]
  derivation: tweedie-score

- id: c-ncsn-def
  type: attributive
  text: "Song and Ermon produce samples with Langevin dynamics using gradients of the data distribution estimated with score matching; because the gradients can be ill-defined and hard to estimate when the data reside on low-dimensional manifolds, they perturb the data with different levels of Gaussian noise, jointly estimate the scores for all noise levels, and sample with annealed Langevin dynamics that uses gradients for decreasing noise levels."
  evidence:
    - {work: "song-2019-generative-modeling-gradients-data-distribution", role: original, locator: "p. 1", stance: for}

- id: c-ncsn-noise
  type: attributive
  text: "Song and Ermon argue that because the support of Gaussian noise is the whole space, the perturbed data are not confined to a low-dimensional manifold and score estimation becomes well defined, and that large Gaussian noise fills low-density regions of the unperturbed distribution, which helps both score estimation and the mixing of Langevin dynamics between modes."
  evidence:
    - {work: "song-2019-generative-modeling-gradients-data-distribution", role: original, locator: "pp. 2, 5", stance: for}

- id: c-ncsn-results
  type: empirical
  text: "The noise conditional score network sampled with annealed Langevin dynamics reached an Inception score of 8.87 and an FID of 25.32 on CIFAR-10."
  scope:
    models: "NCSN with annealed Langevin dynamics"
    data: ["CIFAR-10"]
    setting: "unconditional generation"
  evidence:
    - {work: "song-2019-generative-modeling-gradients-data-distribution", role: original, locator: "pp. 1, 2", stance: for}

- id: c-sde-def
  type: attributive
  text: "Song and colleagues describe a stochastic differential equation that transforms a data distribution to a known prior by slowly injecting noise, and a reverse-time SDE that depends only on the time-dependent score of the perturbed data distribution; they derive an equivalent neural ODE, the probability flow, that samples from the same distribution and enables exact likelihood computation."
  evidence:
    - {work: "song-2020-score-based-generative-modeling-sdes", role: original, locator: "pp. 1, 4", stance: for}

- id: c-sde-vp
  type: attributive
  text: "In the SDE view the noise perturbations of score matching with Langevin dynamics and of DDPM are discretizations of two SDEs: the first always gives a process whose variance explodes, the variance exploding SDE, and the second a process of fixed unit variance when the initial distribution has unit variance, the variance preserving SDE; DDPM's ancestral sampling is one discretization of the reverse-time VP SDE."
  evidence:
    - {work: "song-2020-score-based-generative-modeling-sdes", role: original, locator: "pp. 5, 6", stance: for}

- id: c-sde-results
  type: empirical
  text: "With architectural improvements the score SDE models reached an Inception score of 9.89 and an FID of 2.20 for unconditional CIFAR-10 generation and a likelihood of 2.99 bits per dimension, and generated 1024 x 1024 images."
  scope:
    models: "score-based models trained with the continuous objective, VE, VP and sub-VP SDEs"
    data: ["CIFAR-10", "CelebA-HQ 1024 x 1024"]
    setting: "unconditional generation; likelihood with the probability flow ODE"
  evidence:
    - {work: "song-2020-score-based-generative-modeling-sdes", role: original, locator: "p. 1", stance: for}

- id: c-ddim-def
  type: attributive
  text: "Song, Meng and Ermon generalize DDPMs through a class of non-Markovian diffusion processes that lead to the same training objective; their generative processes can be deterministic, which gives implicit models that, by the authors' measurements, produce high quality samples 10 to 50 times faster in wall-clock time than DDPMs."
  evidence:
    - {work: "song-2020-denoising-diffusion-implicit-models", role: original, locator: "p. 1", stance: for}

- id: c-ddim-slow
  type: attributive
  text: "The DDIM paper reports that it takes around 20 hours to sample 50k images of size 32 x 32 from a DDPM, against less than a minute from a GAN, on an Nvidia 2080 Ti GPU, and nearly 1000 hours for 50k images of size 256 x 256, because all T steps have to be performed sequentially."
  evidence:
    - {work: "song-2020-denoising-diffusion-implicit-models", role: original, locator: "pp. 1, 3", stance: for}

- id: c-ddim-marginals
  type: mathematical
  text: "For s < t and any sigma with 0 <= sigma^2 <= 1 - alpha_bar_s, the step x_s = sqrt(alpha_bar_s) x0_hat + sqrt(1 - alpha_bar_s - sigma^2) eps + sigma z, with x0_hat recovered from x_t and the true noise, has the forward marginal N(sqrt(alpha_bar_s) x_0, (1 - alpha_bar_s) I), so a noise predictor trained once serves every sigma and every sub-sequence of steps."
  assumes: ["q(x_t | x_0) = N(sqrt(alpha_bar_t) x_0, (1 - alpha_bar_t) I) for every t, with alpha_bar_0 = 1", "z ~ N(0, I) independent of eps"]
  derivation: ddim-marginals

- id: c-ddim-eta-one
  type: mathematical
  text: "With s = t - 1 and sigma^2 = beta_tilde_t, the DDIM step is the posterior step of DDPM with sigma_t^2 = beta_tilde_t; with sigma = 0 it is a deterministic map from x_t to x_s."
  assumes: ["the step of c-ddim-marginals"]
  derivation: ddim-marginals

- id: c-ddim-latent
  type: attributive
  text: "With the deterministic DDIM sampler, images generated from the same x_T along different sub-sequences of steps share most high-level features, and samples with only 20 steps are already very similar in high-level features to ones with 1000 steps, which the authors read as x_T being an informative latent encoding of the image."
  evidence:
    - {work: "song-2020-denoising-diffusion-implicit-models", role: original, locator: "p. 7", stance: for}

- id: c-dn-guidance
  type: attributive
  text: "Dhariwal and Nichol guide a diffusion model with a classifier of noisy images and a gradient scale s: classifier guided diffusion sampling shifts the mean of each Gaussian transition by s times its covariance times the gradient of the classifier log probability of the class label, and classifier guided DDIM sampling uses the score of the joint distribution, a new epsilon prediction from which the classifier gradient is subtracted."
  evidence:
    - {work: "dhariwal-2021-diffusion-models-beat-gans", role: original, locator: "pp. 7, 8", stance: for}

- id: c-dn-scale
  type: empirical
  text: "Conditioning an unconditional model on the class Pembroke Welsh corgi, a classifier scale of 1.0 gave an FID of 33.0 and samples that were not convincingly of the class, while a scale of 10.0 gave an FID of 12.0 and much more class-consistent images."
  scope:
    models: "an unconditional ImageNet diffusion model with classifier guidance"
    data: ["ImageNet"]
    setting: "samples of a single class, Figure 3"
  evidence:
    - {work: "dhariwal-2021-diffusion-models-beat-gans", role: original, locator: "p. 8", stance: for}

- id: c-dn-results
  type: empirical
  text: "With an improved architecture and classifier guidance, diffusion models reached an FID of 2.97 on ImageNet 128 x 128, 4.59 on 256 x 256 and 7.72 on 512 x 512, matched BigGAN-deep with as few as 25 forward passes per sample, and with upsampling diffusion models reached 3.94 on 256 x 256 and 3.85 on 512 x 512."
  scope:
    models: "the ablated diffusion model with classifier guidance, and with upsampling stages"
    data: ["ImageNet 128 x 128", "ImageNet 256 x 256", "ImageNet 512 x 512"]
    setting: "class-conditional generation"
  evidence:
    - {work: "dhariwal-2021-diffusion-models-beat-gans", role: original, locator: "p. 1", stance: for}

- id: c-cfg-def
  type: attributive
  text: "Ho and Salimans find that guidance can be performed by a pure generative model without a classifier: in classifier-free guidance a conditional and an unconditional diffusion model are trained jointly and their score estimates are combined to trade off sample quality and diversity, as classifier guidance does."
  evidence:
    - {work: "ho-2022-classifier-free-diffusion-guidance", role: original, locator: "p. 1", stance: for}

- id: c-cfg-null
  type: attributive
  text: "Classifier-free guidance uses a single network for both models, giving the unconditional model a null token for the class identifier, and trains it by randomly replacing the condition with the null token with a probability p_uncond set as a hyperparameter."
  evidence:
    - {work: "ho-2022-classifier-free-diffusion-guidance", role: original, locator: "p. 4", stance: for}

- id: c-guidance-implicit
  type: mathematical
  text: "With exact noise predictions, the guided prediction (1 + w) eps*(x_t, c) - w eps*(x_t) equals -sqrt(1 - alpha_bar_t) times the gradient of log q_t(x_t | c) + w log q_t(c | x_t), so it is the noise prediction of the conditional density tilted by the w-th power of an implicit classifier that is never trained."
  assumes: ["exact noise predictions of q_t(x_t | c) and q_t(x_t)", "q_t(c | x_t) > 0"]
  derivation: classifier-free-guidance

- id: c-cfg-not-classifier
  type: attributive
  text: "Ho and Salimans note that the guided prediction contains no classifier gradient and that there may in general be no classifier for which it is the classifier-guided score; it is inspired by the gradient of an implicit classifier proportional to p(z | c) / p(z)."
  evidence:
    - {work: "ho-2022-classifier-free-diffusion-guidance", role: original, locator: "p. 5", stance: for}

- id: c-cfg-results
  type: empirical
  text: "Sweeping the guidance strength on class-conditional ImageNet, FID was minimized by a small amount of guidance, w = 0.1 or 0.3 depending on the resolution, and the Inception score maximized by strong guidance, w >= 4, with a clear trade-off in between; increasing the guidance strength decreased sample variety and increased the fidelity of individual samples."
  scope:
    models: "classifier-free guided diffusion models trained with p_uncond in {0.1, 0.2, 0.5}"
    data: ["ImageNet 64 x 64", "ImageNet 128 x 128"]
    setting: "w from 0 to 4, FID and Inception score on 50000 samples"
  evidence:
    - {work: "ho-2022-classifier-free-diffusion-guidance", role: original, locator: "p. 7", stance: for}

- id: c-params
  type: mathematical
  text: "The noise predictor of the shape contract, one tanh hidden layer of H units on the D data coordinates and an E-dimensional time embedding, has (D + E + 1) H + (H + 1) D parameters and costs 2 B H (2 D + E) FLOPs on B points; an ancestral sample costs T evaluations and a DDIM sample one per step of its sub-sequence."
  assumes: ["the network of the shape contract", "a multiply-add counted as 2 FLOPs, products only"]
  derivation: parameter-and-flop-count

- id: c-history-sd
  type: historical
  text: "Sohl-Dickstein, Weiss, Maheswaranathan and Ganguli posted the diffusion probabilistic model as arXiv 1503.03585 and published it at the 32nd International Conference on Machine Learning in 2015."
  evidence:
    - {work: "sohl-dickstein-2015-nonequilibrium-thermodynamics", role: original, locator: "p. 1", stance: for}

- id: c-history-ddpm
  type: historical
  text: "Ho, Jain and Abbeel published denoising diffusion probabilistic models at the 34th Conference on Neural Information Processing Systems, NeurIPS 2020."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 1", stance: for}

- id: c-ddpm-arch
  type: attributive
  text: "To represent the reverse process DDPM uses a U-Net backbone similar to an unmasked PixelCNN++ with group normalization throughout; the parameters are shared across time, which is given to the network with the Transformer sinusoidal position embedding, and self-attention is used at the 16 x 16 feature map resolution."
  evidence:
    - {work: "ho-2020-denoising-diffusion-probabilistic-models", role: original, locator: "p. 5", stance: for}
