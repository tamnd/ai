    - {work: "wilson-2017-marginal-value-adaptive-gradient-methods", role: original, locator: "Section 1", stance: for}

- id: c-lh-default
  type: attributive
  text: "Loshchilov and Hutter state that adaptive gradient methods such as AdaGrad, RMSProp, Adam and AMSGrad have become a default method of choice for training feed-forward and recurrent neural networks, while state-of-the-art results on CIFAR-10 and CIFAR-100 were still obtained with SGD with momentum."
