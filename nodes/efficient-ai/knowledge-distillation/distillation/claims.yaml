# Limitations and failure modes

- id: c-st-abstract
  type: attributive
  text: "Stanton et al. find that a surprisingly large difference often remains between the predictive distributions of teacher and student, even when the student has the capacity to match the teacher exactly, and identify optimization difficulty as a key reason."
  evidence:
    - {work: "stanton-2021-does-knowledge-distillation-really-work", role: original, locator: "p. 1", stance: for}

- id: c-st-resnet
  type: empirical
  text: "Distilling a ResNet-56 teacher trained on CIFAR-100 into an identical student, enlarging the distillation data with samples from a GAN improved fidelity only modestly, nowhere near 99% test agreement."
  scope:
    models: "ResNet-56 teacher and identical student"
    data: [cifar-100]
    scale: "distillation data enlarged with SN-GAN samples"
