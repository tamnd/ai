- id: c-st-init
  type: empirical
  text: "Stanton et al. initialized the student as a convex combination λθ_t + (1 − λ)θ_r of the teacher's and random weights, and found that for λ ≤ 0.25 the optimizer converged to a sub-optimal value of the distillation loss with a student that significantly disagrees with the teacher, while at λ = 0.375 the final train loss dropped to the optimal value and agreement drastically increased."
  scope:
