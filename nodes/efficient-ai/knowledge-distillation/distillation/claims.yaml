# Variants

- id: c-fn-abstract
  type: attributive
  text: "FitNets train a student that is deeper and thinner than its teacher, using the teacher's intermediate representations as hints as well as its outputs, and add parameters that map a student hidden layer to a prediction of the teacher's hidden layer."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 1", stance: for}

- id: c-fn-hint-loss
  type: definitional
  text: "In FitNets a hint is the output of a teacher hidden layer, a guided layer of the student learns to predict it, and the student up to the guided layer and a regressor r on top of it are trained by minimizing L_HT = ½‖u_h(x; W_Hint) − r(v_g(x; W_Guided); W_r)‖², where u_h and v_g are the teacher and student nested functions up to the hint and guided layers."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 3", stance: for}

- id: c-fn-middle
  type: attributive
  text: "Hints regularize, so the deeper the guided layer the more the student risks being over-regularized; FitNets take the middle layers of both networks."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 3", stance: for}

- id: c-fn-stagewise
  type: definitional
  text: "Training goes in two stages: first the student up to the guided layer is pre-trained to predict the hint, then the whole network is trained with distillation."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 4", stance: for}

- id: c-fn-kd-loss
  type: definitional
  text: "FitNets write the knowledge distillation loss as L_KD(W_S) = H(y_true, P_S) + λH(P_T^τ, P_S^τ), where H is the cross-entropy, P^τ = softmax(a/τ) are the softened outputs of teacher and student, and λ is a tunable parameter that balances the two cross-entropies."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 3", stance: for}

- id: c-db-abstract
  type: attributive
  text: "DistilBERT leverages knowledge distillation during the pre-training phase of a smaller general-purpose language representation model, where most prior work built task-specific models, and introduces a triple loss combining language modeling, distillation and cosine-distance losses."
  evidence:
    - {work: "sanh-2019-distilbert", role: original, locator: "p. 1", stance: for}

- id: c-db-loss
  type: definitional
  text: "DistilBERT's student is trained with a distillation loss over the soft target probabilities of the teacher, written L_ce = Σ_i t_i log(s_i), with a softmax-temperature applied to student and teacher during training and T set to 1 at inference, and the final objective linearly combines it with the masked language modeling loss and a cosine embedding loss that aligns the directions of the student and teacher hidden state vectors."
  evidence:
    - {work: "sanh-2019-distilbert", role: original, locator: "p. 2", stance: for}

- id: c-db-student
  type: definitional
  text: "The student keeps BERT's general architecture with half the layers and without the token-type embeddings and the pooler, and is initialized from the teacher by taking one layer out of two."
  evidence:
    - {work: "sanh-2019-distilbert", role: original, locator: "p. 2", stance: for}

- id: c-st-ensemble
  type: definitional
  text: "Stanton et al. combine the logits z_1, …, z_m of an m-component teacher ensemble into the teacher logits z_t = log(Σ_i σ(z_i)/m), which correspond to the predictive distribution of the ensemble model average."
  evidence:
    - {work: "stanton-2021-does-knowledge-distillation-really-work", role: original, locator: "p. 3", stance: for}

- id: c-hi-specialists
  type: empirical
  text: "Starting from a trained baseline network on JFT, Hinton et al. trained 61 specialist models, each with 300 classes plus a dustbin class, and with them obtained a 4.4% relative improvement in test accuracy overall."
  scope:
    models: "large baseline network with 61 specialist models"
    data: [jft]
    scale: "61 specialists of 300 classes each"
    setting: "image classification with specialists combined with the baseline"
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 7", stance: for}

- id: c-hi-specialists-not-distilled
  type: attributive
  text: "They had not yet found a way to distill the knowledge in the specialists back into the single large net."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 8", stance: for}

# When to use it

- id: c-hi-discussion
  type: attributive
  text: "Hinton et al. report that distilling works very well for transferring knowledge into a smaller, distilled model, from a large, highly regularized model or from an ensemble."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 8", stance: for}

