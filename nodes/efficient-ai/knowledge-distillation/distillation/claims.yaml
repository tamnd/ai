# The claims of the knowledge distillation page (spec 07). The build computes the labels.

# Setting

- id: c-hi-ensemble-cumbersome
  type: attributive
  text: "Hinton et al. open with ensembles: almost any machine learning algorithm improves in performance if many different models are trained on the same data and their predictions averaged, but making predictions with the whole ensemble is cumbersome, and the computation may be too expensive for deployment to a large number of users."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 1", stance: for}

- id: c-hi-larva
  type: attributive
  text: "They compare this to insects, whose larval form is optimized for extracting energy and nutrients and whose adult form for travelling and reproduction: in machine learning, training and deployment have very different requirements, yet usually use very similar models."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 1", stance: for}

- id: c-hi-cumbersome
  type: definitional
  text: "In their account the cumbersome model is either an ensemble of separately trained models or one very large model that a very strong regularizer such as dropout kept in check, and after it has been trained, a different kind of training they call distillation transfers its knowledge to a small model better suited to deployment."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 1", stance: for}

- id: c-hi-caruana-pioneered
  type: historical
  text: "They credit Rich Caruana and his collaborators with pioneering a version of this strategy and with showing convincingly that a single small model can receive the knowledge transferred from a large ensemble."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 1", stance: for}

- id: c-hi-knowledge-mapping
  type: attributive
  text: "Hinton et al. argue that identifying the knowledge of a model with its learned parameter values makes it hard to see how the form of a model could change while the knowledge stays the same, and propose instead to view the knowledge as a learned mapping from input vectors to output vectors."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 1", stance: for}
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-relative-probabilities
  type: attributive
  text: "A model trained to maximize the log probability of the correct answer also assigns probabilities to all the incorrect answers, and even when these are very small some are much larger than others; how the model tends to generalize is told largely by the relative probabilities of the incorrect answers."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-bmw
  type: attributive
  text: "Their example is an image of a BMW: the chance of mistaking it for a garbage truck may be very small, yet that mistake is still many times more probable than taking it for a carrot."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-generalize-like
  type: attributive
  text: "Models are normally trained to fit the training data when the real aim is to generalize to new data; when distilling, the small model can be trained to generalize in the same way as the large one, and if the large one generalizes well because it averages a large ensemble, a small model trained this way typically does much better on test data than one trained in the normal way on the same training set."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-ba-compression
  type: historical
  text: "Ba and Caruana describe model compression as training a compact model to approximate the function learned by a larger, more complex one, and cite Buciluǎ et al., whose small networks had 1000 times fewer parameters and were often just as accurate as the ensembles they mimicked."
  evidence:
    - {work: "ba-2014-do-deep-nets-need-to-be-deep", role: original, locator: "p. 2", stance: for}

- id: c-ba-unlabeled
  type: definitional
  text: "Model compression passes unlabeled data through the large model to collect its scores and trains the smaller mimic model on this synthetically labeled data; the mimic is not trained on the original labels but on the function the larger model learned."
  evidence:
    - {work: "ba-2014-do-deep-nets-need-to-be-deep", role: original, locator: "p. 2", stance: for}

# The method

- id: c-hi-temperature
  type: definitional
  text: "Hinton et al. convert the logit z_i of each class into a probability q_i = exp(z_i/T)/Σ_j exp(z_j/T) with a softmax at temperature T, where T is normally set to 1 and a higher value of T produces a softer probability distribution over classes."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-hi-soft-targets
  type: definitional
  text: "When the teacher is an ensemble, Hinton et al. use the arithmetic or the geometric mean of the members' predictive distributions as the soft targets, and use the class probabilities of the cumbersome model as soft targets for the small model, on the same training set or on a separate transfer set."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-mnist-ratios
  type: attributive
  text: "For tasks like MNIST, where the cumbersome model almost always produces the correct answer with very high confidence, much of the information about the learned function resides in the ratios of very small probabilities in the soft targets: one version of a 2 may be given a probability of 10⁻⁶ of being a 3 and 10⁻⁹ of being a 7, and another version the other way around."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-little-influence
  type: attributive
  text: "With probabilities this close to zero, the similarity structure has very little influence on transfer through the cross-entropy."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-caruana-logits
  type: historical
  text: "Caruana and his collaborators avoid the problem by training the small model on the logits, which are what goes into the final softmax, minimizing the squared difference between the logits of the cumbersome and the small model."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-raise-temperature
  type: definitional
  text: "Hinton et al. instead raise the temperature of the final softmax until the cumbersome model gives a suitably soft set of targets, then train the small model at that same high temperature to match them; matching logits turns out to be a special case of this."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-high-entropy
  type: attributive
  text: "Soft targets of high entropy carry much more information per training case than hard targets, and their gradients vary much less from case to case, so the small model can often be trained on much less data than the cumbersome one, with a much higher learning rate."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-simplest
  type: definitional
  text: "In the simplest form, the distilled model is trained on a transfer set with the teacher's soft targets at a high temperature, the same temperature is used in the student's softmax during training, and after training the student uses a temperature of 1."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-hi-weighted-average
  type: attributive
  text: "When the correct labels are known for some or all of the transfer set, Hinton et al. found it better to take a weighted average of two objectives than to modify the soft targets: the cross-entropy with the soft targets at the high temperature, and the cross-entropy with the correct labels at temperature 1 on the same logits, with the best results generally from a considerably lower weight on the second."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-hi-transfer-set
  type: attributive
  text: "The transfer set can be unlabeled data or the original training set; Hinton et al. found the original training set works well, especially with a small extra term that asks the student to predict the true targets, since a student that cannot match the soft targets exactly does better to err toward the correct answer."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 2", stance: for}

- id: c-hi-t2
  type: attributive
  text: "Hinton et al. state that since the magnitudes of the gradients produced by the soft targets scale as 1/T², it is important to multiply them by T² when using both hard and soft targets, which keeps the relative contributions of the hard and soft targets roughly unchanged if the temperature is changed while experimenting with meta-parameters."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

# Derivation

- id: c-hi-eq2
  type: attributive
  text: "Hinton et al. give the cross-entropy gradient that each transfer case contributes with respect to each logit z_i of the distilled model, when the cumbersome model has logits v_i producing soft target probabilities p_i and transfer training is done at temperature T, as ∂C/∂z_i = (1/T)(q_i − p_i)."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-soft-gradient
  type: mathematical
  text: "For teacher soft targets p = softmax(v/T) and student probabilities q = softmax(z/T), the gradient of the soft cross-entropy C = −Σ_i p_i log q_i with respect to the student logit z_i is (q_i − p_i)/T."
  assumes: ["the teacher logits v and the student logits z are finite vectors of length N ≥ 2", "T > 0", "the teacher distribution p = softmax(v/T) does not depend on z"]
  derivation: soft-target-gradient

- id: c-kl-same-gradient
  type: mathematical
  text: "The KL divergence D_KL(p‖q) equals the soft cross-entropy C minus the teacher entropy H(p), which does not depend on the student logits, so both have the gradient (q − p)/T."
  assumes: ["the teacher logits v and the student logits z are finite vectors of length N ≥ 2", "T > 0", "the teacher distribution p = softmax(v/T) does not depend on z"]
  derivation: soft-target-gradient

- id: c-gradient-sums-to-zero
  type: mathematical
  text: "The entries of the soft gradient (q − p)/T sum to zero, and adding the same constant to every student logit changes neither the soft loss nor its gradient."
  assumes: ["the teacher logits v and the student logits z are finite vectors of length N ≥ 2", "T > 0", "the teacher distribution p = softmax(v/T) does not depend on z"]
  derivation: soft-target-gradient

- id: c-hard-special-case
  type: mathematical
  text: "With T = 1 and a one-hot target y in place of p, the soft gradient is q − y, the gradient of the ordinary cross-entropy."
  assumes: ["T = 1", "the target is a one-hot vector y"]
  derivation: soft-target-gradient

- id: c-full-gradient
  type: mathematical
  text: "The gradient of the loss α T² D_KL(softmax(v/T)‖softmax(z/T)) + (1 − α)(−log softmax(z)_y) with respect to z is α T (q − p) + (1 − α)(softmax(z) − δ_y), with q and p at temperature T."
  assumes: ["the teacher logits v and the student logits z are finite vectors of length N ≥ 2", "T > 0", "the teacher distribution p = softmax(v/T) does not depend on z", "0 ≤ α ≤ 1"]
  derivation: soft-target-gradient

- id: c-softmax-expansion
  type: mathematical
  text: "For fixed logits x and growing T, softmax(x/T)_i = 1/N + (x_i − x̄)/(NT) + O(1/T²), where x̄ is the mean of the logits."
  assumes: ["v and z are fixed finite vectors of length N ≥ 2", "T grows while v and z stay fixed"]
  derivation: high-temperature-limit

- id: c-t2-factor
  type: mathematical
  text: "For fixed logits, q − p is of order 1/T and the soft gradient (q − p)/T of order 1/T², while the gradient of the hard-label term does not depend on T, so multiplying the soft term by T² keeps its gradient of order one as T changes."
  assumes: ["v and z are fixed finite vectors of length N ≥ 2", "T grows while v and z stay fixed"]
  derivation: high-temperature-limit

- id: c-hi-eq4
  type: attributive
  text: "If the temperature is high compared with the magnitude of the logits, Hinton et al. approximate the gradient, and assuming the logits have been zero-meaned separately for each transfer case so that Σ_j z_j = Σ_j v_j = 0, obtain ∂C/∂z_i ≈ (1/(NT²))(z_i − v_i)."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-hi-limit
  type: attributive
  text: "Hinton et al. conclude that in the high temperature limit distillation is equivalent to minimizing ½(z_i − v_i)², provided the logits are zero-meaned separately for each transfer case."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-high-t-limit
  type: mathematical
  text: "With Δ_i = (z_i − z̄) − (v_i − v̄) the difference of the centred logits, T² ∂C/∂z_i = Δ_i/N + O(1/T) as T grows."
  assumes: ["v and z are fixed finite vectors of length N ≥ 2", "T grows while v and z stay fixed"]
  derivation: high-temperature-limit

- id: c-logit-matching
  type: mathematical
  text: "The limit Δ_i/N of the scaled soft gradient is the gradient of (1/(2N)) Σ_k Δ_k², which equals (1/(2N)) Σ_k (z_k − v_k)² when both logit vectors have zero mean, and which is zero exactly when z − v is a constant vector, so in the limit the student matches the teacher's logits up to a shift."
  assumes: ["v and z are fixed finite vectors of length N ≥ 2", "T grows while v and z stay fixed"]
  derivation: high-temperature-limit

- id: c-kl-limit
  type: mathematical
  text: "As T grows, T² D_KL(softmax(v/T)‖softmax(z/T)) tends to (1/(2N)) Σ_i Δ_i², with Δ the difference of the centred logits."
  assumes: ["v and z are fixed finite vectors of length N ≥ 2", "T grows while v and z stay fixed"]
  derivation: high-temperature-limit

- id: c-st-limit
  type: attributive
  text: "Stanton et al. state that as τ → ∞ the gradient of their distillation loss with respect to the student logits approaches that of ‖z_t − z_s‖²/2, assigning equal significance to every class logit regardless of its contribution to the predictive distribution."
  evidence:
    - {work: "stanton-2021-does-knowledge-distillation-really-work", role: original, locator: "p. 3", stance: for}

- id: c-hi-negative-logits
  type: attributive
  text: "Hinton et al. point out that at lower temperatures distillation pays much less attention to matching logits far more negative than the average, which can be an advantage, since the cost function that trained the cumbersome model leaves such logits almost completely unconstrained and they could be very noisy, yet such logits may also carry useful information about what the cumbersome model has learned; which effect dominates is an empirical question."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-hi-intermediate
  type: attributive
  text: "They report that when the student is much too small to capture all of the teacher's knowledge, intermediate temperatures work best, which suggests that ignoring the large negative logits can help."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 3", stance: for}

- id: c-ba-logit-loss
  type: definitional
  text: "Ba and Caruana train shallow mimic networks on the teacher's logits z with the regression objective L(W, β) = (1/2T) Σ_t ‖g(x^(t); W, β) − z^(t)‖², where T is the number of training examples and g(x; W, β) = βf(Wx) is the prediction of the mimic."
  evidence:
    - {work: "ba-2014-do-deep-nets-need-to-be-deep", role: original, locator: "p. 3", stance: for}

- id: c-ba-logit-example
  type: attributive
  text: "Ba and Caruana argue that if a teacher predicts three targets with probabilities [2e−9, 4e−5, 0.9999], a student trained with cross-entropy on these probabilities will focus on the third target and ignore the first and second, while training on the logits [10, 20, 30] still teaches the first and second targets and their relative difference, and the logits [−10, 0, 10] give the same probabilities although the teacher has learned to model the two cases very differently."
  evidence:
    - {work: "ba-2014-do-deep-nets-need-to-be-deep", role: original, locator: "p. 2", stance: for}

# Worked example

- id: c-we-gradient
  type: mathematical
  text: "For teacher logits (3, 1, −4), student logits (1, 0.5, −1.5) and label 0, the soft term T² D_KL at T = 4 is 16 · 0.068488 = 1.095802, the hard cross-entropy is 0.523909, the loss with α = 0.9 is 1.038612, and the soft gradients (q − p)/T are (−0.287889, 0.240081, 0.047808) at T = 1 and (−0.037024, 0.006079, 0.030945) at T = 4."
  assumes: ["v = (3, 1, −4), z = (1, 0.5, −1.5), label 0", "α = 0.9 and T = 4 for the loss"]
  derivation: soft-target-gradient

- id: c-limit-worked
  type: mathematical
  text: "For teacher logits (3, 1, −4) and student logits (1, 0.5, −1.5), the scaled gradient T(q − p) approaches (z − v)/3 = (−0.666667, −0.166667, 0.833333) with an error of about 1.13/T, and T² D_KL approaches (1/6) Σ_i (z_i − v_i)² = 1.75, reaching 1.732200 at T = 100."
  assumes: ["v = (3, 1, −4) and z = (1, 0.5, −1.5)", "T grows"]
  derivation: high-temperature-limit

# Hyperparameters

- id: c-hi-temperature-range
  type: empirical
  text: "On MNIST, Hinton et al. found that once each of the student's two hidden layers had 300 or more units, any temperature above 8 gave fairly similar results, but with only 30 units per layer a temperature between 2.5 and 4 worked significantly better than higher or lower values."
  scope:
    models: "fully connected networks with two hidden layers of ReLUs"
    data: [mnist]
    scale: "60,000 training cases; students with 30 to 800 units per layer"
    setting: "digit classification, distillation from a dropout-regularized teacher"
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 4", stance: for}

- id: c-hi-speech-settings
  type: attributive
  text: "For speech they tried temperatures of 1, 2, 5 and 10, with a relative weight of 0.5 on the cross-entropy with the hard targets."
  evidence:
    - {work: "hinton-2015-distilling-knowledge", role: original, locator: "p. 5", stance: for}

- id: c-st-moderate
  type: attributive
  text: "Stanton et al. note that if the student is much smaller than the teacher, its capacity can be focused on matching the teacher's top-k predictions rather than the full teacher distribution by choosing a moderate temperature, e.g. τ = 4."
  evidence:
    - {work: "stanton-2021-does-knowledge-distillation-really-work", role: original, locator: "p. 3", stance: for}

- id: c-fn-anneal
  type: definitional
  text: "FitNets anneal the weight λ of the teacher cross-entropy with a linear decay during training, so that examples on which the teacher is very confident have a stronger effect at first and their importance decreases as λ decays."
  evidence:
    - {work: "romero-2015-fitnets", role: original, locator: "p. 5", stance: for}

