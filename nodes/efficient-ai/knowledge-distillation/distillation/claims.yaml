- id: c-st-augmentation
  type: empirical
  text: "Of the augmentation policies Stanton et al. tried, even the best for fidelity, Mixup with τ = 4, achieved only a modest 86% test agreement, and the Baseline policy with τ = 4 achieved a competitive 84.5%."
