# Limitations and failure modes

- id: c-le-limit
  type: attributive
  text: "Latency improves through more concurrency at the cost of more arithmetic operations, so the method does not help where additional computation is not available."
  evidence:
    - {work: "leviathan-2023-fast-inference-speculative-decoding", role: original, locator: "p. 8", stance: for}

- id: c-ch-numerics
  type: attributive
  text: "Chen et al. note that their samples are not identical to those of standard sampling, because of numerics and random seeds, but come from the same distribution."
  evidence:
    - {work: "chen-2023-accelerating-llm-decoding-speculative-sampling", role: original, locator: "p. 6", stance: for}

- id: c-ch-7b
  type: attributive
  text: "Chen et al. note that a 7B draft would provide only a modest speedup with its optimal topology, without full utilisation of the hardware during drafting."
  evidence:
    - {work: "chen-2023-accelerating-llm-decoding-speculative-sampling", role: original, locator: "p. 6", stance: for}

- id: c-me-draft
  type: attributive
  text: "Cai et al. note that a separate draft model is challenging to obtain and maintain, and harder still to integrate into a distributed system."
  evidence:
    - {work: "cai-2024-medusa-multiple-decoding-heads", role: original, locator: "p. 1", stance: for}

