# Limitations

- id: c-ws-barrier
  type: attributive
  text: "The uniform soup outperforms every individual model only when all individual models achieve high accuracy; there can be an error barrier between fine-tuned models, mainly when fine-tuning with high learning rates."
  evidence:
    - {work: "wortsman-2022-model-soups", role: original, locator: "p. 6", stance: for}

- id: c-ws-calib
  type: attributive
  text: "While ensembles improve model calibration, model soups do not have the same effect."
  evidence:
    - {work: "wortsman-2022-model-soups", role: original, locator: "p. 8", stance: for}

- id: c-ws-22k
  type: attributive
  text: "For an ImageNet22k pre-trained model the greedy soup still provides improvements on ImageNet, but these are less substantial than when fine-tuning CLIP and ALIGN."
  evidence:
    - {work: "wortsman-2022-model-soups", role: original, locator: "p. 8", stance: for}

- id: c-il-limit
  type: attributive
  text: "Task vectors are restricted to models with the same architecture, since they depend on element-wise operations on model weights, and Ilharco et al. perform arithmetic only on models fine-tuned from the same pre-trained initialization."
  evidence:
    - {work: "ilharco-2023-task-arithmetic", role: original, locator: "p. 8", stance: for}

- id: c-mr-far
  type: attributive
  text: "Since the Fisher information is a local property of a single parameter value, Fisher merging might be less performant for models whose parameters are far apart in parameter space."
  evidence:
    - {work: "matena-2022-fisher-merging", role: original, locator: "p. 4", stance: for}

- id: c-yu-rescale
  type: attributive
  text: "The rescale operation is crucial to DARE: dropping 30% or 40% of delta parameters without rescaling noticeably leads to worse results."
  evidence:
    - {work: "yu-2024-dare-super-mario", role: original, locator: "p. 2", stance: for}

- id: c-yu-cpt
  type: attributive
  text: "Once models undergo continuous pre-training, the delta parameters can rapidly reach around 0.03, making DARE infeasible."
  evidence:
    - {work: "yu-2024-dare-super-mario", role: original, locator: "p. 2", stance: for}

- id: c-yu-ft
  type: attributive
  text: "Dropping only 10% of the fine-tuned parameters, the combination of pre-trained and delta parameters, leads to a catastrophic decrease in performance, even approaching zero."
  evidence:
    - {work: "yu-2024-dare-super-mario", role: original, locator: "p. 2", stance: for}

- id: c-il-free
  type: attributive
  text: "Task arithmetic has no extra cost at inference time in terms of memory or compute, since it only does element-wise operations on model weights."
  evidence:
    - {work: "ilharco-2023-task-arithmetic", role: original, locator: "p. 2", stance: for}
