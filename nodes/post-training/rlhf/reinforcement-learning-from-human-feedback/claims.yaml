    models: "7 reward models from 160M to 13B parameters"
    data: [tldr]
    scale: "8k to 64k comparisons"
    setting: "reward model validation accuracy"
  evidence:
    - {work: "stiennon-2020-learning-summarize-human-feedback", role: original, locator: "Section 4.3", stance: for}

