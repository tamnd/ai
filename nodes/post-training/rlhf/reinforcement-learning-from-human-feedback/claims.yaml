  scope:
    models: "Anthropic language models from 13M to 52B parameters"
    data: [anthropic-hh]
    scale: "preference models and RLHF policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "the abstract", stance: for}

- id: c-bai-sqrt-kl
  type: empirical
  text: "Bai et al. identify a roughly linear relation between the RL reward and the square root of the KL divergence between the policy and its initialization."
  scope:
    models: "Anthropic language models from 13M to 52B parameters"
    data: [anthropic-hh]
    scale: "preference models and RLHF policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "the abstract", stance: for}

- id: c-bai-sqrt-kl-why
  type: attributive
  text: "Bai et al. explain the relation by a series expansion: D_KL(pi + delta pi || pi) begins at quadratic order in delta pi, while the reward varies linearly in delta pi, so in the small-delta-pi region reward is proportional to the square root of D_KL, which suggests that most of RLHF training remains in the small-delta-pi regime."
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "Section 4.3", stance: for}

- id: c-dpo-reward-kl
  type: empirical
  text: "In the sentiment setting, Rafailov et al. find that DPO produces by far the most efficient reward-KL frontier, achieving the highest reward while still achieving low KL, and that its reward/KL tradeoff strictly dominates PPO, even when PPO can access ground truth rewards."
  scope:
    models: "GPT-2-large policies"
    data: [imdb]
    scale: "22 runs, target KL in {3, 6, 9, 12} for PPO and beta in {0.05, 0.1, 1, 5}"
    setting: "controlled sentiment generation with a sentiment classifier as the reward"
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "Section 6.1", stance: for}

- id: c-dpo-abstract
  type: empirical
  text: "Rafailov et al. report that DPO is stable, performant and computationally lightweight, eliminating the need for sampling from the LM during fine-tuning, and that it matches or improves response quality in summarization and single-turn dialogue while being substantially simpler to implement and train."
  scope:
    models: "GPT-2 and Pythia-2.8B policies"
    data: [imdb, tldr, anthropic-hh]
    scale: "up to 6B parameters"
    setting: "controlled sentiment generation, summarization and single-turn dialogue"
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "the abstract", stance: for}

# Limitations

- id: c-alignment-tax
  type: empirical
  text: "During RLHF fine-tuning, Ouyang et al. observe performance regressions compared to GPT-3 on public NLP datasets, notably SQuAD, DROP, HellaSwag and WMT 2015 French to English translation, an example of an alignment tax; mixing PPO updates with updates that increase the log likelihood of the pretraining distribution (PPO-ptx) greatly reduces the regressions without compromising labeler preference scores."
  scope:
    models: "InstructGPT and GPT-3, 1.3B, 6B and 175B"
    data: [squad, drop, hellaswag, wmt-2015-fr-en]
    scale: "unknown"
    setting: "public NLP datasets after RLHF fine-tuning"
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "Section 1", stance: for}

- id: c-bai-tax
  type: empirical
  text: "Bai et al. find that smaller models experience severe alignment taxes, with performance on a wide variety of evaluations declining after RLHF training, while their 13B and 52B RLHF-trained models perform better at zero-shot NLP evaluations and the same at few-shot evaluations."
  scope:
    models: "Anthropic language models from 13M to 52B parameters"
    data: [anthropic-hh]
    scale: "preference models and RLHF policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "Section 1.1", stance: for}

- id: c-stiennon-overopt
  type: empirical
  text: "Stiennon et al. find that under light optimization against the reward model the policies improve according to labelers, but as they optimize further, true preferences fall off compared to the prediction, and eventually the reward model becomes anti-correlated with human preferences."
  scope:
    models: "GPT-3-style models of 1.3B and 6.7B parameters"
    data: [tldr, cnn-dailymail]
    scale: "64k human comparisons"
    setting: "summarization of Reddit posts"
  evidence:
    - {work: "stiennon-2020-learning-summarize-human-feedback", role: original, locator: "Section 4.3", stance: for}

- id: c-gao-setup
  type: definitional
  text: "Gao et al. use a synthetic setup in which a fixed gold-standard reward model plays the role of humans, providing labels used to train a proxy reward model, and study how the gold reward model score changes as they optimize against the proxy reward model using reinforcement learning or best-of-n sampling."
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "the abstract", stance: for}

- id: c-gao-forms
  type: empirical
  text: "With d the square root of D_KL(pi || pi_init), Gao et al. find empirically that the gold reward model score follows R_bon(d) = d(alpha_bon - beta_bon d) for best-of-n sampling and R_RL(d) = d(alpha_RL - beta_RL log d) for reinforcement learning, with coefficients that vary smoothly with the number of proxy reward model parameters."
  scope:
    models: "proxy reward models from 3M to 3B parameters, and policies optimized against them"
    data: [unknown]
    scale: "100,000 synthetic comparisons, 10% held out"
    setting: "synthetic labels from the 6B reward model of Ouyang et al. as the gold reward model, best-of-n and PPO"
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "Section 1", stance: for}

- id: c-gao-kl-penalty
  type: empirical
  text: "In the reinforcement learning setup of Gao et al., using a KL penalty increases the proxy reward model score that can be achieved for a given KL divergence, but this does not correspond to a measurable improvement in the gold RM score-KL frontier; they note this result could be particularly sensitive to hyperparameters."
  scope:
    models: "proxy reward models from 3M to 3B parameters, and policies optimized against them"
    data: [unknown]
    scale: "100,000 synthetic comparisons, 10% held out"
    setting: "synthetic labels from the 6B reward model of Ouyang et al. as the gold reward model, best-of-n and PPO"
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "Section 1", stance: for}

- id: c-gao-early-stopping
  type: empirical
  text: "Gao et al. observe that the KL penalty only causes the gold RM score to converge earlier, so that its effect on the gold score is akin to early stopping."
  scope:
    models: "proxy reward models from 3M to 3B parameters, and policies optimized against them"
    data: [unknown]
    scale: "100,000 synthetic comparisons, 10% held out"
    setting: "synthetic labels from the 6B reward model of Ouyang et al. as the gold reward model, best-of-n and PPO"
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "Section 3.6", stance: for}

- id: c-bai-tension
  type: empirical
  text: "Bai et al. found many RLHF policies reproducing the same exaggerated responses to all remotely sensitive questions, which they attribute to over-optimizing for harmlessness while under-optimizing helpfulness."
  scope:
    models: "Anthropic language models from 13M to 52B parameters"
    data: [anthropic-hh]
    scale: "preference models and RLHF policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "Section 4.4", stance: for}

- id: c-instructgpt-labelers
  type: attributive
  text: "Ouyang et al. hire a team of 40 contractors to label their data, and align to the stated preferences of a specific group of people, the labelers and researchers, rather than any broader notion of human values."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "Section 1", stance: for}

- id: c-casper-taxonomy
  type: attributive
  text: "Casper et al. divide the open problems of RLHF into challenges with collecting human feedback, training the reward model, and training the policy, plus challenges with jointly learning a reward model and policy, and distinguish relatively tractable challenges from fundamental limitations."
  evidence:
    - {work: "casper-2023-open-problems-rlhf", role: original, locator: "Section 3", stance: for}

- id: c-casper-central
  type: attributive
  text: "Casper et al. describe RLHF as the central method used to finetune state-of-the-art large language models, and emphasize its limitations and the importance of a multi-layered approach to the development of safer AI systems."
  evidence:
    - {work: "casper-2023-open-problems-rlhf", role: original, locator: "the abstract", stance: for}

- id: c-rlhf-unstable
  type: attributive
  text: "Rafailov et al. describe RLHF as a complex and often unstable procedure, first fitting a reward model that reflects the human preferences, and then fine-tuning the large unsupervised LM using reinforcement learning to maximize this estimated reward without drifting too far from the original model."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "the abstract", stance: for}

# Variants

- id: c-christiano-rl
  type: definitional
  text: "Christiano et al. note that the reward estimate may be non-stationary, which led them to policy gradient methods; they use advantage actor-critic (A2C) for Atari games and trust region policy optimization (TRPO) for simulated robotics tasks."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "Section 2.2.1", stance: for}

- id: c-christiano-ensemble
  type: definitional
  text: "Christiano et al. fit an ensemble of predictors, each trained on triples sampled from the data with replacement, normalize each independently and average them, and hold out a fraction of 1/e of the data as a validation set for each predictor."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "Section 2.2.3", stance: for}

