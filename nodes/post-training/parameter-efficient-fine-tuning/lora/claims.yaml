# The claims of the LoRA page (spec 07). The build computes the labels.

# The method

- id: c-lora
  type: definitional
  text: "LoRA freezes the pretrained weights and represents the update of a pretrained weight matrix W0 of size d by k with a low-rank decomposition W0 + BA, where B is d by r, A is r by k and the rank r is much smaller than min(d, k); only A and B are trained."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-init
  type: definitional
  text: "Hu et al. initialize A with random Gaussian values and B with zero, so that the update BA is zero at the beginning of training."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-scale
  type: definitional
  text: "The update is scaled by alpha / r, where alpha is a constant in r; Hu et al. set alpha to the first r they try and do not tune it, which reduces the need to retune hyperparameters when r changes."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-attention-only
  type: definitional
  text: "In their Transformer experiments Hu et al. adapt only the attention weights and freeze the MLP modules, treating each of Wq, Wk and Wv as a single d_model by d_model matrix."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.2", stance: for}

- id: c-hypothesis
  type: attributive
  text: "Inspired by the finding of Aghajanyan et al. that pretrained language models have a low intrinsic dimension, Hu et al. hypothesize that the updates to the weights also have a low intrinsic rank during adaptation."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-generalizes-ft
  type: attributive
  text: "Hu et al. argue that applying LoRA to all weight matrices and training all biases roughly recovers the expressiveness of full fine-tuning when the rank r is set to the rank of the pretrained weight matrices."
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

# Mathematics

- id: c-zero-init-start
  type: mathematical
  text: "With B = 0 the update s B A is the zero matrix, so at the start of training the adapted layer computes the same function as the pretrained layer."
  assumes: ["B is initialized to the zero matrix", "the scale s is finite"]
  derivation: lora-gradients

- id: c-merge
  type: mathematical
  text: "For every input x, W0 x + s B A x = (W0 + s B A) x, so a trained adapter can be merged into a single matrix of the shape of W0 that has the inference cost of the original layer, and subtracting s B A recovers W0."
  assumes: ["the adapted layer is linear in its input", "exact arithmetic; in floating point the merge and the unmerge hold up to rounding"]
  derivation: merge-and-rank

- id: c-rank-bound
  type: mathematical
  text: "The update s B A has rank at most r, because the rank of a product is at most the rank of each factor and B has r columns."
  assumes: ["B has r columns and A has r rows"]
  derivation: merge-and-rank

- id: c-count
  type: mathematical
  text: "An adapter of rank r on a d by k weight matrix has r(d + k) trainable entries, a fraction r(1/d + 1/k) of the dk entries of the matrix."
  assumes: ["one adapter, a pair B of size d by r and A of size r by k, on a d by k matrix", "nothing else is trained"]
  derivation: parameter-count

- id: c-gpt3-counts
  type: mathematical
  text: "With adapters on Wq and Wv of all 96 layers of GPT-3 175B, where d_model = 12,288, the number of trainable parameters is 4,718,592 r: about 4.7M for r = 1, 18.9M for r = 4 and 37.7M for r = 8."
  assumes: ["adapters on Wq and Wv of all 96 layers", "each adapted matrix is 12,288 by 12,288"]
  derivation: parameter-count

- id: c-checkpoint-size
  type: mathematical
  text: "The adapter of GPT-3 175B with r = 4 on Wq and Wv has 18,874,368 entries, which take 37,748,736 bytes, about 36 MiB, in FP16, about one in 9,300 of the 175 billion parameters."
  assumes: ["adapters on Wq and Wv of all 96 layers with r = 4", "each adapted matrix is 12,288 by 12,288", "an FP16 entry takes 2 bytes"]
  derivation: parameter-count

- id: c-grads
  type: mathematical
  text: "For a layer Y = X W0^T + s X A^T B^T with output gradient G, the gradients are dL/dB = s G^T X A^T, dL/dA = s B^T G^T X and dL/dX = G (W0 + s B A)."
  assumes: ["the layer is Y = X W0^T + 1 b0^T + s X A^T B^T", "the loss is a differentiable scalar function of Y", "W0 and b0 are constants"]
  derivation: lora-gradients
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-grad-projection
  type: mathematical
  text: "The adapter sees the gradient G_W = G^T X that full fine-tuning would give for the weight only through two products: G_W A^T for B and B^T G_W for A."
  assumes: ["the layer is Y = X W0^T + 1 b0^T + s X A^T B^T", "the loss is a differentiable scalar function of Y"]
  derivation: lora-gradients
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "Section 4.1", stance: for}

- id: c-first-step
  type: mathematical
  text: "Because B = 0 at initialization, the gradient with respect to A is zero at the first step, so the first gradient step changes only B, and A starts to move from the second step on."
  assumes: ["B is initialized to the zero matrix", "plain gradient descent, or any optimizer whose step is zero for a zero gradient at the first step"]
  derivation: lora-gradients

- id: c-double-quant
  type: mathematical
  text: "With a blocksize of 64, QLoRA's double quantization reduces the memory of quantization constants from 32/64 = 0.5 bits to 8/64 + 32/(64 x 256) = 0.127 bits per parameter, a reduction of 0.373 bits per parameter."
  assumes: ["first-level constants are 32-bit, one per block of 64 weights", "second-level quantization stores them in 8 bits, with one 32-bit constant per block of 256 first-level constants"]
  evidence:
    - {work: "dettmers-2023-qlora", role: original, locator: "Section 3", stance: for}

# Evidence

- id: c-abstract-10000
  type: empirical
  text: "Compared with GPT-3 175B fine-tuned with Adam, LoRA can reduce the number of trainable parameters by 10,000 times and the GPU memory requirement by 3 times."
  scope:
    models: "GPT-3 175B with LoRA on the query and value projections, against full fine-tuning, BitFit, prefix tuning and adapters"
    data: [wikisql, multinli, samsum]
    scale: "175B parameters, 96 layers, d_model = 12,288"
    setting: "fine-tuning on each task, validation accuracy and ROUGE"
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "the abstract", stance: for}

- id: c-on-par
  type: empirical
  text: "LoRA performs on par with or better than fine-tuning in model quality on RoBERTa, DeBERTa, GPT-2 and GPT-3, despite having fewer trainable parameters, a higher training throughput and, unlike adapters, no additional inference latency."
  scope:
    models: "RoBERTa base and large, DeBERTa XXL, GPT-2 medium and large, GPT-3 175B"
    data: [glue, e2e-nlg, webnlg, dart, wikisql, multinli, samsum]
    scale: "125M to 175B parameters"
    setting: "fine-tuning on each task"
  evidence:
    - {work: "hu-2021-lora-low-rank-adaptation", role: original, locator: "the abstract", stance: for}

- id: c-gpt3-table4
  type: empirical
  text: "On GPT-3 175B, LoRA with 4.7M trainable parameters reaches 73.4% on WikiSQL and 91.7% on MultiNLI-matched, and with 37.7M reaches 74.0% and 91.6%, against 73.8% and 89.5% for full fine-tuning of 175,255.8M parameters."
  scope:
    models: "GPT-3 175B with LoRA on the query and value projections, against full fine-tuning, BitFit, prefix tuning and adapters"
