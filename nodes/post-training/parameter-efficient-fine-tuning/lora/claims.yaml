# Variants

- id: c-qlora
  type: empirical
  text: "QLoRA backpropagates gradients through a frozen 4-bit quantized pretrained model into LoRA adapters and reduces memory enough to fine-tune a 65B-parameter model on a single 48GB GPU while preserving full 16-bit fine-tuning task performance."
  scope:
    models: "LLaMA and T5 models"
    data: [unknown]
    scale: "up to 65B parameters, one 48GB GPU"
    setting: "instruction fine-tuning"
  evidence:
    - {work: "dettmers-2023-qlora", role: original, locator: "the abstract", stance: for}

- id: c-dora
  type: empirical
  text: "DoRA decomposes the pretrained weight into a magnitude and a direction, uses LoRA for the directional update, and consistently outperforms LoRA on fine-tuning LLaMA, LLaVA and VL-BART on commonsense reasoning, visual instruction tuning and image and video-text understanding."
  scope:
    models: "LLaMA, LLaVA and VL-BART"
    data: [unknown]
    scale: "unknown"
    setting: "fine-tuning on downstream tasks"
  evidence:
    - {work: "liu-2024-dora-weight-decomposed-low-rank-adaptation", role: original, locator: "the abstract", stance: for}

- id: c-lora-plus
  type: empirical
  text: "Updating A and B with the same learning rate does not allow efficient feature learning in models of large width; setting different learning rates for A and B with a fixed ratio, LoRA+, improves performance by 1% to 2% and fine-tuning speed by up to about 2 times at the same cost."
  scope:
    models: "GPT-2, RoBERTa and Llama models"
    data: [glue, mnli, flan-v2]
    scale: "unknown"
    setting: "fine-tuning with Adam"
  evidence:
    - {work: "hayou-2024-lora-plus", role: original, locator: "p. 1", stance: for}

- id: c-rslora
  type: attributive
  text: "Kalajdzievski states a proof that LoRA adapters should be divided by the square root of the rank, and reports that dividing by the rank slows learning and stunts the performance of higher-rank adapters."
  evidence:
    - {work: "kalajdzievski-2023-rank-stabilization-lora", role: original, locator: "the abstract", stance: for}

# Learning and forgetting

- id: c-learns-less-forgets-less
  type: empirical
  text: "In the standard low-rank settings, LoRA substantially underperforms full fine-tuning on the target domain, programming or mathematics, but better maintains the base model's performance on tasks outside the target domain."
  scope:
    models: "Llama-2-7B with LoRA and with full fine-tuning"
    data: [starcoder-python, openwebmath, magicoder-evol-instruct, metamathqa]
    scale: "7B parameters; about 20B tokens of continued pretraining or about 100K prompt-response pairs"
    setting: "continued pretraining and instruction fine-tuning on code and math, with forgetting measured on HellaSwag, WinoGrande and ARC-Challenge"
  evidence:
    - {work: "biderman-2024-lora-learns-less-forgets-less", role: original, locator: "the abstract", stance: for}
  exp: [mnist-split-1k, mnist-split-5k]
  small_scale: "yes"
  small_scale_note: "The trade-off does not need a large language model: an MLP pretrained on MNIST digits 0 to 4 and fine-tuned on digits 5 to 9 shows it on a CPU in minutes, with LoRA, full fine-tuning and a retrained head as arms."

- id: c-forgets-less-than-reg
  type: empirical
  text: "LoRA mitigates forgetting more than common regularization techniques such as weight decay and dropout, and it helps maintain more diverse generations."
  scope:
    models: "Llama-2-7B with LoRA and with full fine-tuning"
    data: [starcoder-python, openwebmath, magicoder-evol-instruct, metamathqa]
