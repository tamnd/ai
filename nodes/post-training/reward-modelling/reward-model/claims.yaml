# The claims of the reward-model page (spec 07). The build computes the labels.

# Setting

- id: c-sti-head
  type: attributive
  text: "Stiennon et al. build a reward model by starting from a supervised baseline and adding a randomly initialized linear head that outputs a scalar value, trained to predict which of two summaries a human judged better with the loss −E[log σ(r(x, y_i) − r(x, y_{1−i}))], where y_i is the preferred summary."
  evidence:
    - {work: "stiennon-2020-learning-summarize-human-feedback", role: original, locator: "p. 6", stance: for}

- id: c-ou-arch
  type: attributive
  text: "InstructGPT's reward model starts from the SFT model with the final unembedding layer removed and is trained to take in a prompt and response and output a scalar reward."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 8", stance: for}

- id: c-ou-6b
  type: attributive
  text: "InstructGPT uses only 6B reward models, which saves a lot of compute, because 175B reward model training could be unstable and thus less suitable for use as the value function during RL."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 8", stance: for}

- id: c-as-head
  type: attributive
  text: "Askell et al.'s preference models consist of a value head that predicts a single scalar score on top of the final token of a context, with larger scores indicating more desirable samples."
  evidence:
    - {work: "askell-2021-general-language-assistant", role: original, locator: "p. 15", stance: for}

- id: c-ll-init
  type: attributive
  text: "Llama 2 initializes its reward models from pretrained chat model checkpoints, so that both the chat model and the reward model benefit from knowledge acquired in pretraining."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 10", stance: for}

- id: c-ll-head
  type: attributive
  text: "Starting the reward model from the chat model prevents an information mismatch between the two that could result in favoring hallucinations; the reward model's architecture is that of the pretrained model with the classification head for next-token prediction replaced by a regression head that outputs a scalar reward."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 11", stance: for}

- id: c-rb-impl
  type: attributive
  text: "For language models a reward model is often implemented by appending a linear layer that predicts one logit, or by removing the final decoding layers and replacing them with a linear layer; a win between two completions is r(x, y1) > r(x, y2)."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 4", stance: for}

# The method

- id: c-rb-bt
  type: attributive
  text: "Training a reward model means training a classifier to predict the human preference probability between two answers, as modeled by a Bradley-Terry model, by optimizing the maximum likelihood loss."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 4", stance: for}

- id: c-rm-bt
  type: mathematical
  text: "Under the Bradley-Terry model, P(y_w preferred to y_l | x) = exp(r_w) / (exp(r_w) + exp(r_l)) = σ(r_w − r_l), so the negative log-likelihood of one comparison is log(1 + exp(r_l − r_w)) = −log σ(r_w − r_l)."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic

- id: c-rm-grad
  type: mathematical
  text: "The gradient of −log σ(r_w − r_l) is −σ(r_l − r_w) with respect to r_w and +σ(r_l − r_w) with respect to r_l: the two sum to zero, and their size is the probability the model gives to the wrong order."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic

- id: c-ou-rank
  type: attributive
  text: "InstructGPT labelers rank between K = 4 and K = 9 responses, which produces K choose 2 comparisons for each prompt shown to a labeler."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 8", stance: for}

- id: c-ou-batch
  type: attributive
  text: "Because comparisons within a labeling task are very correlated, shuffling them into one dataset made the reward model overfit in a single pass; InstructGPT instead trains on all comparisons from a prompt as a single batch element, which needs a single forward pass per completion and achieves much improved validation accuracy and log loss."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 8", stance: for}

- id: c-rm-ranked
  type: mathematical
  text: "For K ranked responses the per-prompt loss averages −log σ(r_i − r_j) over the K(K − 1)/2 pairs with i ranked above j; scoring the K responses once needs K forward passes, against K(K − 1) when every pair is a separate example, 9 against 72 for K = 9, and 64 prompts with K = 9 give 64 × 36 = 2,304 comparisons."
  assumes: ["each response is scored once per prompt and the scores are reused across pairs"]
  derivation: reward-model-arithmetic

- id: c-ou-2304
  type: attributive
  text: "InstructGPT's reward model batch holds 64 prompts with K = 4 to 9 completions each and ties dropped, so a single batch could contain up to 2,304 comparisons."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "pp. 41 to 42", stance: for}

- id: c-ch-noise
  type: attributive
  text: "Christiano et al. assume a 10% chance that the human responds uniformly at random, because human raters have a constant probability of making an error, which does not decay to 0 as the reward difference becomes extreme."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "p. 5", stance: for}

- id: c-rm-noise
  type: mathematical
  text: "With a probability ε that the label is a uniformly random answer, the modelled preference probability is ε/2 + (1 − ε)σ(Δ), which stays between ε/2 and 1 − ε/2; with ε = 0.1 the loss of one comparison is at most −log 0.05 ≈ 3.00, and its derivative in Δ tends to 0 as Δ → −∞, so a confidently contradicted label stops pulling."
  assumes: ["the label is a random answer with probability ε and otherwise follows the Bradley-Terry model"]
  derivation: reward-model-arithmetic

- id: c-ll-margin
  type: attributive
  text: "Llama 2 adds a margin to the binary ranking loss, −log σ(r(x, y_c) − r(x, y_r) − m(r)), where the margin m(r) is a discrete function of the preference rating, large for pairs with distinct responses and smaller for similar ones."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 11", stance: for}

- id: c-ll-margin-values
  type: attributive
  text: "The small margin variant of Llama 2 uses margins 1, 2/3, 1/3 and 0 and the large variant 3, 2, 1 and 0 for responses rated significantly better, better, slightly better and negligibly better or unsure."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 52", stance: for}

- id: c-rm-margin
  type: mathematical
  text: "The margin loss −log σ(Δ − m) is the Bradley-Terry loss with the reward difference shifted by m: it equals log 2 at Δ = m and keeps pushing Δ up until Δ is well above m; at Δ = 1 with m = 1 it is log 2 ≈ 0.693, against −log σ(1) ≈ 0.313 without a margin."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic

- id: c-as-pmp
  type: attributive
  text: "Askell et al. improve sample efficiency with a preference model pre-training (PMP) stage that first trains on large public datasets that encode human preference information, such as Stack Exchange, Reddit and Wikipedia edits, before finetuning on smaller datasets encoding more specific human preferences."
  evidence:
    - {work: "askell-2021-general-language-assistant", role: original, locator: "p. 4", stance: for}

- id: c-as-format
  type: attributive
  text: "Given a context C with a binary label A or B, Askell et al. create a preference modeling pair C:A > C:B, where B denotes the incorrect label."
  evidence:
    - {work: "askell-2021-general-language-assistant", role: original, locator: "p. 15", stance: for}

- id: c-as-eoc
  type: attributive
  text: "Appending a special end-of-context token to each sequence to unambiguously delineate the end of the passage sometimes improves performance."
  evidence:
    - {work: "askell-2021-general-language-assistant", role: original, locator: "p. 15", stance: for}

# Normalization and combination

- id: c-ch-norm
  type: attributive
  text: "Christiano et al. normalize the rewards produced by the reward predictor to have zero mean and constant standard deviation, since the position of the rewards is underdetermined by the learning problem."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "p. 5", stance: for}

- id: c-st-norm
  type: attributive
  text: "At the end of training, Stiennon et al. normalize the reward model outputs so that the reference summaries from their dataset achieve a mean score of 0."
  evidence:
    - {work: "stiennon-2020-learning-summarize-human-feedback", role: original, locator: "p. 6", stance: for}

- id: c-ou-norm
  type: attributive
  text: "Since the RM loss is invariant to shifts in reward, InstructGPT normalizes the reward model using a bias so that the labeler demonstrations achieve a mean score of 0 before doing RL."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 9", stance: for}

- id: c-rm-shift
  type: mathematical
  text: "Adding any function c(x) of the prompt alone to the reward leaves every pairwise preference probability and the loss unchanged, while multiplying the reward by a constant other than 1 changes them; so comparisons determine reward differences within a prompt but not the level of the reward."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic

- id: c-ga-recenter
  type: attributive
  text: "Because RM scores are translation-invariant, Gao et al. recenter each RM so that the average reward of the initial policy is 0."
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "p. 4", stance: for}

- id: c-ll-two
  type: attributive
  text: "Because helpfulness and safety sometimes trade off, which can make it challenging for a single reward model to perform well on both, Llama 2 trains two separate reward models, a Helpfulness RM and a Safety RM."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 10", stance: for}

- id: c-ll-mix
  type: attributive
  text: "The Llama 2 Safety reward model is trained on all Meta Safety and Anthropic Harmless data mixed with helpfulness data in a 90/10 proportion; the 10% of helpfulness data is especially beneficial for accuracy on samples where both responses were deemed safe."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 12", stance: for}

- id: c-ll-combine
  type: attributive
  text: "Llama 2's RL reward uses the Safety RM score when the prompt is tagged as potentially unsafe or that score is below 0.15, and the Helpfulness RM score otherwise; the threshold corresponds to a precision of 0.89 and a recall of 0.55 on the Meta Safety test set."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 15", stance: for}

- id: c-ll-whiten
  type: attributive
  text: "Llama 2 whitens the combined score after reversing the sigmoid with the logit function, to increase stability and balance properly with the KL penalty term."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 15", stance: for}

# Ensembles

- id: c-ch-ens
  type: attributive
  text: "Christiano et al. fit an ensemble of predictors, each trained on |D| triples sampled from D with replacement, and define the reward estimate by independently normalizing each predictor and then averaging the results."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "p. 5", stance: for}

- id: c-co-mean
  type: attributive
  text: "Mean optimization over an ensemble is not conservative: if at least one member overestimates the reward, even while the others estimate it accurately, the policy can exploit the faulty reward model."
  evidence:
    - {work: "coste-2024-reward-model-ensembles", role: original, locator: "p. 4", stance: for}

- id: c-co-wco
  type: attributive
  text: "Worst-case optimization creates a conservative estimate by choosing the lowest reward from the ensemble at every step."
  evidence:
    - {work: "coste-2024-reward-model-ensembles", role: original, locator: "p. 4", stance: for}

- id: c-co-uwo
  type: attributive
  text: "Uncertainty-weighted optimization combines the average reward across the ensemble with the intra-ensemble variance weighted by a coefficient λ, penalizing responses on which the reward models disagree."
  evidence:
    - {work: "coste-2024-reward-model-ensembles", role: original, locator: "p. 4", stance: for}

- id: c-rm-ens
  type: mathematical
  text: "For member rewards R_1, …, R_k the worst-case reward min R_i and the uncertainty-weighted reward mean − λ·var (population variance, λ ≥ 0) are both at most the mean; for (1.0, 1.2, 3.0) the mean is 1.733, the minimum 1.0, the variance 0.809, and the uncertainty-weighted reward with λ = 0.5 is 1.329."
  assumes: ["the variance is the population variance of the k member rewards"]
  derivation: reward-model-arithmetic

- id: c-co-seed
  type: attributive
  text: "Coste et al. build an ensemble from proxy reward models trained with identical data and hyperparameters but different random seeds, which change the initialization of the scalar reward head and the data shuffling order."
  evidence:
    - {work: "coste-2024-reward-model-ensembles", role: original, locator: "p. 5", stance: for}

