- id: c-rm-calib
  type: mathematical
  text: "If comparisons follow the Bradley-Terry model, a pair with reward difference Δ is labelled in the order of the rewards with probability σ(|Δ|): 0.731 at |Δ| = 1, 0.881 at 2 and 0.953 at 3; no reward model can beat the true reward's accuracy on such labels, so label noise sets a ceiling on accuracy."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic

- id: c-hh-top
