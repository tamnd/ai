    setting: "best-of-n and PPO against single reward models and ensembles"
  evidence:
    - {work: "coste-2024-reward-model-ensembles", role: original, locator: "p. 5", stance: for}

- id: c-ei-pretrain
  type: empirical
  text: "Reward ensembles whose members vary by pretraining seed generalize better than ensembles differing only by fine-tuning seed, and both outperform individual reward models."
  scope:
    models: "T5 reward models and a T5-large policy"
    data: ["TL;DR summarization, helpfulness and XSum/NLI factuality preferences"]
    scale: "T5-base to T5-XL reward models, ensembles of five"
    setting: "RLHF and best-of-n reranking against single reward models and ensembles"
  evidence:
    - {work: "eisenstein-2024-helping-or-herding", role: original, locator: "p. 1", stance: for}

- id: c-rb-ceiling
  type: attributive
  text: "Validation sets from earlier RLHF work, such as Anthropic's Helpful and Harmless data and OpenAI's Learning to Summarize, have ceilings on accuracy between 60 and 70% due to inter-annotator disagreement."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 2", stance: for}

- id: c-rb-score
  type: attributive
  text: "RewardBench counts a prompt as a win when the reward model scores the verified chosen completion above the verified rejected one, and reports accuracy as the percentage of wins in each subset."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 5", stance: for}

- id: c-rb-sections
  type: attributive
  text: "RewardBench has five sections: Chat, Chat Hard (trick questions and subtly different instruction responses), Safety, Reasoning (code and math) and Prior Sets drawn from existing preference test sets."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 5", stance: for}

- id: c-rb-weight
  type: attributive
  text: "The final RewardBench score is the weighted average of the section scores, with Prior Sets at 0.5 weight."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 6", stance: for}

- id: c-rb-dpo-reward
  type: attributive
  text: "To score a DPO model as a reward model, RewardBench compares log π(y|x)/π_ref(y|x) between the two completions, which requires the reference model's probabilities."
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 4", stance: for}

- id: c-rb-dpo
  type: empirical
  text: "DPO models, while more plentiful due to the method's simplicity, fail to generalize to popular preference data test sets and present a higher variance in performance than classifier reward models."
  scope:
    models: "over 80 public reward models: classifiers and DPO-trained models"
    data: ["RewardBench: Chat, Chat Hard, Safety, Reasoning and Prior Sets"]
    scale: "400M to 70B parameters"
    setting: "accuracy of ranking the chosen above the rejected response"
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 2", stance: for}

- id: c-rb-reasoning
  type: empirical
  text: "Reasoning accuracy ranges from 35%, well below random, to 97%; much of the data is code in which only one or two tokens differ between the chosen and rejected samples."
  scope:
    models: "over 80 public reward models: classifiers and DPO-trained models"
    data: ["RewardBench: Chat, Chat Hard, Safety, Reasoning and Prior Sets"]
    scale: "400M to 70B parameters"
    setting: "accuracy of ranking the chosen above the rejected response"
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 8", stance: for}

- id: c-rb-shape
  type: empirical
  text: "Few reward models give Gaussian scores across RewardBench, fewer are centred around 0, and none of those tested are centred Gaussians."
  scope:
    models: "over 80 public reward models: classifiers and DPO-trained models"
    data: ["RewardBench: Chat, Chat Hard, Safety, Reasoning and Prior Sets"]
    scale: "400M to 70B parameters"
    setting: "accuracy of ranking the chosen above the rejected response"
  evidence:
    - {work: "lambert-2024-rewardbench", role: original, locator: "p. 7", stance: for}

# Hyperparameters

- id: c-ou-hparams
  type: attributive
  text: "The InstructGPT reward model was trained for a single epoch at a learning rate of 9e-6 with a cosine schedule dropping to 10% of its initial value and a batch size of 64 prompts; changes of up to 50% in the learning rate gave similar performance, but multiple epochs quickly overfit."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 41", stance: for}

- id: c-ou-init
  type: attributive
  text: "The final InstructGPT reward model was initialized from a 6B GPT-3 model fine-tuned on public NLP datasets, mostly for historical reasons, with similar results when initializing from the GPT-3 or SFT models."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 41", stance: for}

- id: c-ll-hparams
  type: attributive
  text: "Llama 2 trains its reward models for one epoch, since training longer can lead to over-fitting, with a maximum learning rate of 5 × 10−6 for the 70B model and 1 × 10−5 for the rest."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 12", stance: for}

- id: c-hh-epoch
  type: attributive
  text: "Bai et al. apply preference model pretraining before finetuning on their human feedback data and typically train preference models for a single epoch."
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "p. 13", stance: for}

- id: c-ch-reg
  type: attributive
  text: "Christiano et al. hold out 1/e of the data as a validation set for each predictor and adjust an ℓ2 regularization coefficient to keep the validation loss between 1.1 and 1.5 times the training loss."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "p. 5", stance: for}

# Limitations

- id: c-st-length
  type: attributive
  text: "Stiennon et al.'s 6.7B reward model is biased towards longer summaries, preferring improving edits that make a summary shorter only 62.6% of the time, against 76.4% for humans."
  evidence:
    - {work: "stiennon-2020-learning-summarize-human-feedback", role: original, locator: "p. 8", stance: for}

- id: c-ch-offline
  type: attributive
  text: "Training the reward predictor offline performs poorly: because the occupancy distribution is nonstationary, the predictor captures only part of the true reward, and on Pong the agent learned to avoid losing points without scoring, giving extremely long volleys."
  evidence:
    - {work: "christiano-2017-deep-rl-human-preferences", role: original, locator: "p. 9", stance: for}

- id: c-hh-robust
  type: empirical
  text: "When RLHF policies are trained against one of two preference models fitted to halves of the data, training is robust up to about 150k samples, after which the training preference model assigns a higher mean reward than the held-out one."
  scope:
    models: "Anthropic preference models with preference-model pre-training"
    data: ["Anthropic helpfulness and red-teaming comparisons"]
    scale: "13M to 52B parameters"
    setting: "preference-model training, calibration and RLHF robustness tests"
  evidence:
    - {work: "bai-2022-training-helpful-harmless-assistant", role: original, locator: "p. 7", stance: for}

- id: c-ei-under
  type: empirical
  text: "Reward models are underspecified: models that perform similarly in distribution can give very different rewards when used in alignment, because of distribution shift, and aligning to one does not improve the reward measured by another trained on the same data."
  scope:
    models: "T5 reward models and a T5-large policy"
    data: ["TL;DR summarization, helpfulness and XSum/NLI factuality preferences"]
    scale: "T5-base to T5-XL reward models, ensembles of five"
    setting: "RLHF and best-of-n reranking against single reward models and ensembles"
  evidence:
    - {work: "eisenstein-2024-helping-or-herding", role: original, locator: "p. 1", stance: for}

- id: c-ei-shared
  type: empirical
  text: "Even ensembles of differently pretrained reward models do not eliminate reward hacking, because all members of the ensemble exhibit similar error patterns."
  scope:
    models: "T5 reward models and a T5-large policy"
    data: ["TL;DR summarization, helpfulness and XSum/NLI factuality preferences"]
    scale: "T5-base to T5-XL reward models, ensembles of five"
    setting: "RLHF and best-of-n reranking against single reward models and ensembles"
  evidence:
    - {work: "eisenstein-2024-helping-or-herding", role: original, locator: "p. 1", stance: for}

- id: c-ei-examples
  type: empirical
  text: "Policy optimization amplifies shared errors: summarization models produce outputs that are too short when tuned for factuality and too verbose when tuned for summarization quality, and assistant models overuse formulaic answer formats when tuned for helpfulness."
  scope:
    models: "T5 reward models and a T5-large policy"
    data: ["TL;DR summarization, helpfulness and XSum/NLI factuality preferences"]
    scale: "T5-base to T5-XL reward models, ensembles of five"
    setting: "RLHF and best-of-n reranking against single reward models and ensembles"
  evidence:
    - {work: "eisenstein-2024-helping-or-herding", role: original, locator: "p. 3", stance: for}

- id: c-ll-shift
  type: attributive
  text: "A margin in the ranking loss pushes the reward model towards more extreme scores, and a larger margin makes this distribution shift more significant, which suggests investing in reward calibration because PPO can be sensitive to changes in the reward distribution."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 52", stance: for}

- id: c-sk-def
  type: attributive
  text: "Skalse et al. call a proxy reward unhackable if increasing the expected proxy return can never decrease the expected true return."
  evidence:
    - {work: "skalse-2022-defining-characterizing-reward-hacking", role: original, locator: "p. 1", stance: for}

- id: c-sk-all
  type: attributive
  text: "For the set of all stochastic policies, two reward functions can only be unhackable if one of them is constant."
  evidence:
    - {work: "skalse-2022-defining-characterizing-reward-hacking", role: original, locator: "p. 1", stance: for}

- id: c-sk-robot
  type: attributive
  text: "In Skalse et al.'s cleaning-robot example, with true reward [1, 1, 1] for three rooms the proxy [1, 0, 0] is hackable while [1, 1, 0] is not, and the proxy [1, 1, 1] is unhackable for the true reward [1, 1.5, 2] but hackable for [1, 1.5, 3]."
  evidence:
    - {work: "skalse-2022-defining-characterizing-reward-hacking", role: original, locator: "pp. 2 to 3", stance: for}

- id: c-rm-robot
  type: mathematical
  text: "Enumerating the eight deterministic cleaning policies confirms the four cases; for proxy [1, 1, 1] and true reward [1, 1.5, 3], cleaning attic and bedroom has proxy return 2 against 1 for the kitchen alone, but true return 2.5 against 3."
  assumes: ["policies are the eight subsets of rooms and the return is the sum of the rewards of the rooms cleaned"]
  derivation: reward-model-arithmetic

- id: c-sk-aux
  type: attributive
  text: "Skalse et al. conclude that reward functions learned by reward modeling are perhaps best viewed as auxiliaries to policy learning, rather than specifications that should be optimized."
  evidence:
    - {work: "skalse-2022-defining-characterizing-reward-hacking", role: original, locator: "p. 2", stance: for}

# Best-of-n and overoptimization

- id: c-ga-forms
  type: attributive
  text: "Gao et al. find that the gold reward follows R_bon(d) = d(α_bon − β_bon d) for best-of-n sampling and R_RL(d) = d(α_RL − β_RL log d) for reinforcement learning, where d is the square root of the KL divergence from the initial policy."
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "p. 2", stance: for}

- id: c-ga-coef
  type: attributive
  text: "The α and β coefficients vary smoothly with the number of proxy reward model parameters, following approximate logarithmic trends, which allows prediction of the attained gold reward."
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "p. 2", stance: for}

- id: c-ga-bonkl
  type: attributive
  text: "Gao et al. compute the KL distances for best-of-n (BoN) analytically as KL_bon = log n − (n − 1)/n."
  evidence:
    - {work: "gao-2023-scaling-laws-reward-model-overoptimization", role: original, locator: "p. 4", stance: for}

- id: c-rm-bonkl
  type: mathematical
  text: "If the n samples have distinct rewards almost surely, the best-of-n distribution has KL divergence log n − (n − 1)/n from the base policy: 0.636 nats for n = 4, 1.835 for n = 16 and 3.175 for n = 64."
  assumes: ["the reward of a sample from the base policy has a continuous distribution"]
  derivation: reward-model-arithmetic

- id: c-rm-we
  type: mathematical
  text: "For three ranked responses with rewards 2.0, 0.5 and 0.0, the pair losses are 0.201413, 0.126928 and 0.474077 and the ranked loss is their mean, 0.267473; its gradients with respect to the three rewards are −0.100543, −0.065038 and 0.165581."
  assumes: ["comparisons follow the Bradley-Terry model with reward r", "rewards are real numbers"]
  derivation: reward-model-arithmetic
