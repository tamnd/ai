# Limitations and failure modes

- id: c-az-deterministic
  type: attributive
  text: "Azar et al. consider two actions $y$ and $y'$ where $y$ is always preferred: the Bradley-Terry model would then require $r(y) - r(y')$ to go to $+\\infty$, and the optimal policy would give $\\pi^*(y') = 0$ irrespective of the constant $\\tau$ used for the KL regularisation, so the regularisation becomes weaker and weaker the more deterministic the preferences."
  evidence:
    - {work: "azar-2023-general-theoretical-paradigm", role: original, locator: "p. 4", stance: for}

- id: c-az-finite-data
  type: attributive
  text: "In the finite-data regime this becomes overfitting: even when the true preference probability is 0.8, a few samples can give an empirical estimate of 1, and the empirical optimal policy then sets the probability of the dispreferred response to 0 for any regularization strength."
  evidence:
    - {work: "azar-2023-general-theoretical-paradigm", role: original, locator: "p. 4", stance: for}

- id: c-az-rlhf-robust
  type: attributive
  text: "They argue that standard RLHF is more robust here because the reward model is underfit and regularized in practice, and that DPO, in avoiding the training of a reward function, loses the regularization toward the reference that the underfit reward provides."
  evidence:
    - {work: "azar-2023-general-theoretical-paradigm", role: original, locator: "p. 4", stance: for}

- id: c-xu-subset
  type: attributive
  text: "Xu et al. prove that the policies PPO can reach from a reward model trained on a preference dataset form a proper subset of the policies that minimize the DPO loss on the same dataset."
  evidence:
    - {work: "xu-2024-is-dpo-superior-to-ppo", role: original, locator: "p. 3", stance: for}
    - {work: "xu-2024-is-dpo-superior-to-ppo", role: original, locator: "p. 4", stance: for}

- id: c-xu-counterexample
  type: attributive
  text: "Their counter-example has three actions, a reference policy that gives the third no probability and a dataset with a single comparison of the first two; DPO can minimize the loss with a policy that puts 0.9 on the third action, which PPO cannot produce because the reference forces it to give that action zero probability."
  evidence:
    - {work: "xu-2024-is-dpo-superior-to-ppo", role: original, locator: "p. 3", stance: for}
    - {work: "xu-2024-is-dpo-superior-to-ppo", role: original, locator: "p. 4", stance: for}

- id: c-xu-shift
  type: empirical
  text: "They report that DPO's performance is significantly affected by the distribution shift between the model's outputs and the preference dataset."
  scope:
    models: "language models fine-tuned with DPO"
    data: [synthetic-preferences, preference-datasets]
    scale: "synthetic and real preference data"
    setting: "distribution shift between model outputs and preference data"
  evidence:
    - {work: "xu-2024-is-dpo-superior-to-ppo", role: original, locator: "p. 2", stance: for}

- id: c-ra-limits
  type: attributive
  text: "Rafailov et al. evaluated models of up to 6B parameters, and list scaling to much larger models, out-of-distribution generalization and reward over-optimization in the direct setting as open questions."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 10", stance: for}

# Variants

- id: c-az-psipo
  type: attributive
  text: "Azar et al. derive a general objective, $\\Psi$PO, written in terms of pairwise preferences, of which RLHF and DPO are special cases, and take $\\Psi$ to be the identity to obtain IPO."
  evidence:
    - {work: "azar-2023-general-theoretical-paradigm", role: original, locator: "p. 1", stance: for}

- id: c-az-ipo-loss
  type: definitional
  text: "which regresses the gap between the log-likelihood ratios of policy and reference to $1/(2\\tau)$, so it always regularizes toward $\\pi_{\\mathrm{ref}}$."
  evidence:
    - {work: "azar-2023-general-theoretical-paradigm", role: original, locator: "p. 5", stance: for}
