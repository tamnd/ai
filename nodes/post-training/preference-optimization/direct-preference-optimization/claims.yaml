# The claims of the direct preference optimization page (spec 07). The build computes the labels.

# Setting

- id: c-ra-three-phases
  type: attributive
  text: "Rafailov et al. describe the RLHF pipeline as three phases: supervised fine-tuning (SFT), preference sampling and reward learning, and RL optimization."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 3", stance: for}

- id: c-ra-pairs
  type: definitional
  text: "The SFT model is prompted with $x$ to produce a pair of answers, human labelers express a preference for one of them, the preferred completion $y_w$ over the dispreferred $y_l$, and the preferences are assumed to come from a latent reward model $r^*(x, y)$ to which there is no access."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 3", stance: for}

- id: c-ra-reward-nll
  type: definitional
  text: "and a reward model $r_\\phi$ is fit to a static dataset of comparisons by minimizing the negative log-likelihood $-\\mathbb E \\log\\sigma(r_\\phi(x, y_w) - r_\\phi(x, y_l))$, a binary classification problem."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 3", stance: for}

- id: c-ra-reward-init
  type: attributive
  text: "The reward model is typically initialized from the SFT model, adding a linear layer on the final transformer layer that gives a single scalar prediction of the reward."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 3", stance: for}

- id: c-ra-objective
  type: definitional
  text: "where $\\beta$ is a parameter that controls how far the policy deviates from the base reference policy $\\pi_{\\mathrm{ref}}$, in practice the initial SFT model."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 3", stance: for}
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}

- id: c-ra-constraint-why
  type: attributive
  text: "They explain the constraint as important because it prevents the model deviating too far from where the reward model is accurate, maintains generation diversity, and prevents mode collapse onto single high-reward answers."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}

- id: c-ra-ppo-reward
  type: attributive
  text: "Sampling text is a discrete operation, so this objective cannot be differentiated through, and the standard approach optimizes it with PPO, using $r_\\phi(x, y) - \\beta(\\log\\pi_\\theta(y\\mid x) - \\log\\pi_{\\mathrm{ref}}(y\\mid x))$ as the reward."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}

- id: c-ra-rlhf-complex
  type: attributive
  text: "They call RLHF a complex and often unstable procedure: it first fits a reward model to the human preferences, then fine-tunes the language model with reinforcement learning to maximize that estimated reward while not drifting far from the original model."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 1", stance: for}

# The method

- id: c-ra-implicit-reward
  type: attributive
  text: "The authors read this as fitting an implicit reward model, $\\hat r_\\theta(x, y) = \\beta\\log(\\pi_\\theta(y\\mid x)/\\pi_{\\mathrm{ref}}(y\\mid x))$, whose optimal policy is $\\pi_\\theta$ itself."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-ra-pipeline
  type: definitional
  text: "The pipeline is to sample completions from $\\pi_{\\mathrm{ref}}$ for every prompt, label them with human preferences to build the dataset, and optimize $\\pi_\\theta$ to minimize the loss for the given $\\pi_{\\mathrm{ref}}$, $\\mathcal D$ and $\\beta$."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-ra-ref-init
  type: attributive
  text: "For public preference datasets, which were sampled from some SFT model, the authors set $\\pi_{\\mathrm{ref}} = \\pi^{\\mathrm{SFT}}$ when that model is available; when it is not, they train $\\pi_{\\mathrm{ref}}$ by maximum likelihood on the preferred completions, so that it is closer to the unknown distribution that produced the data."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-ra-code
  type: attributive
  text: "The PyTorch code for the DPO loss provided in the paper takes the policy and reference model logprobs with the indices of the preferred and dispreferred completions, computes the losses as `-F.logsigmoid(beta * (pi_logratios - ref_logratios))`, and returns them with the rewards `beta * (pi_logps - ref_logps).detach()`."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 19", stance: for}
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 20", stance: for}

# Derivation

- id: c-ra-gibbs
  type: attributive
  text: "Rafailov et al. derive it by reorganizing the objective as the minimization of $\\mathbb D_{\\mathrm{KL}}(\\pi\\,\\Vert\\,\\pi^*) - \\log Z(x)$, where the partition function does not depend on $\\pi$, and use Gibbs' inequality: the KL divergence is minimized at 0 if and only if the two distributions are identical."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 16", stance: for}

- id: c-optimal-policy
  type: mathematical
  text: "For a finite set of responses, $\\pi^* \\propto \\pi_{\\mathrm{ref}}\\exp(r/\\beta)$ maximizes $\\mathbb E_\\pi[r] - \\beta\\,\\mathbb D_{\\mathrm{KL}}(\\pi\\Vert\\pi_{\\mathrm{ref}})$, the maximum is $\\beta\\log Z(x)$, and any other policy falls short of it by exactly $\\beta\\,\\mathbb D_{\\mathrm{KL}}(\\pi\\Vert\\pi^*)$."
  assumes: ["for each prompt the responses range over a finite set", "pi_ref(y|x) > 0 for every response", "the reward is finite", "beta > 0", "the policy class is unrestricted"]
  derivation: kl-constrained-optimum

- id: c-ra-z-expensive
  type: attributive
  text: "Even with the true reward, $Z(x)$ is expensive to estimate, which makes the closed form hard to use directly."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}

- id: c-reward-reparam
  type: mathematical
  text: "Every reward is thus a scaled log-ratio of its optimal policy to the reference plus a term that depends only on the prompt."
  assumes: ["for each prompt the responses range over a finite set", "pi_ref(y|x) > 0 for every response", "the reward is finite", "beta > 0", "the policy class is unrestricted"]
  derivation: kl-constrained-optimum

- id: c-ra-cancels
  type: attributive
  text: "Because a Bradley-Terry probability depends only on the reward difference between the two completions, substituting eq-reward-reparam into eq-bradley-terry makes the partition function cancel, so the human preference probability can be expressed with only the optimal policy $\\pi^*$ and the reference policy."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 4", stance: for}

- id: c-dpo-is-nll
  type: mathematical
  text: "Explicitly, $p^*(y_1\\succ y_2\\mid x) = \\sigma\\big(\\beta\\log\\frac{\\pi^*(y_1\\mid x)}{\\pi_{\\mathrm{ref}}(y_1\\mid x)} - \\beta\\log\\frac{\\pi^*(y_2\\mid x)}{\\pi_{\\mathrm{ref}}(y_2\\mid x)}\\big)$, and the maximum-likelihood objective for a parametrized policy $\\pi_\\theta$ under this model is eq-dpo-loss."
  assumes: ["preferences follow the Bradley-Terry model with a finite latent reward", "pi* is the optimal policy of the KL-constrained objective for that reward", "beta > 0"]
  derivation: partition-cancels

- id: c-shift-invariance
  type: mathematical
  text: "Rewards that differ by any function of the prompt alone give the same Bradley-Terry preferences and the same optimal policy, so the loss cannot tell them apart and does not need to."
  assumes: ["preferences follow the Bradley-Terry model with a finite latent reward", "pi* is the optimal policy of the KL-constrained objective for that reward", "beta > 0"]
  derivation: partition-cancels

- id: c-ra-lemmas
  type: attributive
  text: "Rafailov et al. call two rewards equivalent when their difference is a function of $x$ alone, and prove two lemmas: equivalent rewards give identical preference distributions under Plackett-Luce, Bradley-Terry included, and identical optimal policies for the KL-constrained problem."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-ra-theorem1
  type: attributive
  text: "Their Theorem 1 states that, under mild assumptions, every reward class consistent with the Plackett-Luce and Bradley-Terry models can be represented with the reparameterization $r(x, y) = \\beta\\log(\\pi(y\\mid x)/\\pi_{\\mathrm{ref}}(y\\mid x))$ for some model $\\pi$ and a given reference model."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 6", stance: for}

- id: c-ra-plackett-luce
  type: attributive
  text: "The same substitution works for the Plackett-Luce model over rankings of $K$ responses, where $Z(x)$ again cancels."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 16", stance: for}

- id: c-ra-gradient
  type: attributive
  text: "The gradient increases the likelihood of $y_w$ and decreases that of $y_l$, and weights each example by how much higher the implicit reward rates the dispreferred completion, that is, by how incorrectly it orders the pair, scaled by $\\beta$."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-gradient-form
  type: mathematical
  text: "For one pair, the derivative of the loss in $\\log\\pi_\\theta(y_w\\mid x)$ is $-\\beta\\,\\sigma(\\hat r_l - \\hat r_w)$ and in $\\log\\pi_\\theta(y_l\\mid x)$ is $+\\beta\\,\\sigma(\\hat r_l - \\hat r_w)$; the weight lies between 0 and 1, is $\\tfrac12$ when the two implicit rewards are equal and goes to 0 as the margin $\\hat r_w - \\hat r_l$ grows."
  assumes: ["log pi_theta(y|x) is differentiable in theta", "the reference log-probabilities do not depend on theta", "beta > 0"]
  derivation: dpo-gradient

- id: c-ra-naive-degenerate
  type: empirical
  text: "The authors found the weighting important: without the coefficient, a naive version of the method can make the language model degenerate."
  scope:
    models: "GPT-J and Pythia-2.8B language models"
    data: [reddit-tldr]
    scale: "up to 6B parameters"
    setting: "unlikelihood, a probability-ratio objective without the DPO weight, on summarization"
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 5", stance: for}

- id: c-ra-no-baseline
  type: attributive
  text: "They relate this to actor-critic RLHF, where a normalization term, interpretable as a soft value function of $\\pi_{\\mathrm{ref}}$, must be estimated with a learned value function or a baseline to keep the policy gradient's variance down, whereas the DPO reward needs no baseline at all."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 6", stance: for}

# Worked example

- id: c-we-pair
  type: mathematical
  text: "With these log-probabilities and $\\beta = 0.1$, the DPO loss is $\\log(1 + e^{-0.2}) = 0.598139$, and the derivative in the policy log-probability of the chosen response is $-0.1\\,\\sigma(-0.2) = -0.045017$."
  assumes: ["log pi_theta(y|x) is differentiable in theta", "the reference log-probabilities do not depend on theta", "beta > 0"]
  derivation: dpo-gradient

- id: c-we-optimal
  type: mathematical
  text: "With three responses, $\\pi_{\\mathrm{ref}} = (0.5, 0.3, 0.2)$, rewards $r = (1, 0, -1)$ and $\\beta = 0.5$, eq-optimal-policy gives $Z = 0.5e^2 + 0.3 + 0.2e^{-2} = 4.021595$ and $\\pi^* = (0.918672, 0.074597, 0.006730)$; with $\\beta = 10$ it gives $(0.534647, 0.290261, 0.175093)$, close to the reference."
  assumes: ["for each prompt the responses range over a finite set", "pi_ref(y|x) > 0 for every response", "the reward is finite", "beta > 0", "the policy class is unrestricted"]
  derivation: kl-constrained-optimum

- id: c-we-bt
  type: mathematical
  text: "The Bradley-Terry probability that the first response beats the second is $\\sigma(1) = 0.731059$, both from the rewards and from the log-ratios $0.5\\log(\\pi^*/\\pi_{\\mathrm{ref}})$, which equal $r - 0.5\\log Z$."
  assumes: ["preferences follow the Bradley-Terry model with a finite latent reward", "pi* is the optimal policy of the KL-constrained objective for that reward", "beta > 0"]
  derivation: partition-cancels

# Hyperparameters

- id: c-ra-hparams
  type: attributive
  text: "By default the authors train with $\\beta = 0.1$, 64 pairs per batch and RMSprop at a learning rate of 1e-6, reached by a linear warm-up over the first 150 steps; their TL;DR summarization runs raise $\\beta$ to 0.5 and keep the rest."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 20", stance: for}

- id: c-ra-sweep
  type: attributive
  text: "In the sentiment experiments they swept $\\beta \\in \\{0.05, 0.1, 1, 5\\}$ and, for PPO, a target KL in $\\{3, 6, 9, 12\\}$."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 8", stance: for}

- id: c-ra-beta-untuned
  type: attributive
  text: "They note that they did not meaningfully tune $\\beta$ in the summarization experiments, so the results there may underestimate DPO's potential."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 9", stance: for}

# Cost

- id: c-ra-lightweight
  type: attributive
  text: "Rafailov et al. describe DPO as stable, performant and computationally lightweight, since it needs neither sampling from the language model while fine-tuning nor significant hyperparameter tuning."
  evidence:
    - {work: "rafailov-2023-direct-preference-optimization", role: original, locator: "p. 1", stance: for}

