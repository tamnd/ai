  scope:
    models: "Anthropic language models up to 52B parameters"
    data: [anthropic-hh, anthropic-red-team]
    scale: "182,831 red-team and 135,296 helpfulness prompts; RL policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 2", stance: for}

- id: c-hhh-trend
  type: empirical
  text: "On 438 binary comparison questions, the trends suggest that models larger than 52B will be competitive with preference models trained on human feedback."
