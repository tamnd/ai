# Limitations

- id: c-goodhart
  type: empirical
  text: "RL-CAI models can be over-trained, resulting in Goodharting behavior where models are overly harsh in responding to harmful prompts or include boilerplate language such as 'you are valid, valued, and cared for' in their responses to most red teaming prompts."
  scope:
    models: "Anthropic language models up to 52B parameters"
    data: [anthropic-hh, anthropic-red-team]
    scale: "182,831 red-team and 135,296 helpfulness prompts; RL policies up to 52B"
    setting: "helpful and harmless dialogue assistants"
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 4.3", stance: for}

- id: c-goodhart-fixes
  type: attributive
  text: "Strategies that qualitatively led to more diverse and higher quality responses were rewriting the principles to avoid over-reactive or overly accusatory responses, ensembling over 16 principles, and soft or clamped preference labels."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 4.3", stance: for}

- id: c-lee-qualitative
  type: empirical
  text: "Lee et al. observed that RLHF summaries sometimes hallucinated when RLAIF did not, and that RLAIF sometimes produced less fluent summaries, but in a blind evaluation on 70 examples the difference in scores was not statistically significant."
  scope:
    models: "PaLM 2 XS policies and reward models; PaLM 2 L, S and XS labelers"
    data: [tldr, openai-human-preferences, anthropic-hh]
    scale: "3-4k downsampled training examples per task for labeling experiments"
    setting: "summarization, helpful dialogue and harmless dialogue"
  evidence:
    - {work: "lee-2023-rlaif-vs-rlhf", role: original, locator: "p. 8", stance: for}

- id: c-still-human
  type: attributive
  text: "Bai et al. still relied on human supervision in the form of helpfulness labels, and state that their ultimate goal is not to remove human supervision entirely but to make it more efficient, transparent and targeted."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 6", stance: for}

- id: c-adhoc
  type: attributive
  text: "Bai et al. chose their principles in a fairly ad hoc and iterative way for research purposes, and believe that in the future principles should be redeveloped and refined by a larger set of stakeholders and adapted to the intended usage and location of deployment."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 1", stance: for}

- id: c-ouyang-labelers
  type: attributive
  text: "Ouyang et al. hire a team of 40 contractors to label their data, and align to the stated preferences of a specific group of people, the labelers and researchers, rather than any broader notion of human values."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "Section 1", stance: for}

- id: c-lee-bias
  type: attributive
  text: "Lee et al. warn that AI feedback may transfer biases from off-the-shelf LLMs to the generated preferences and on to RL-trained policies, and that in high-stakes domains such as medicine, law and employment, human experts trained to assign preferences by strict policies should be considered the gold standard."
  evidence:
    - {work: "lee-2023-rlaif-vs-rlhf", role: original, locator: "p. 9", stance: for}

- id: c-red-teamers
  type: attributive
  text: "Bai et al. note that their method may remove the need for an army of human red teamers to do the rather unsavory work of trying to trick AI systems into generating harmful content."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 6.2", stance: for}

- id: c-obscure
  type: attributive
  text: "Bai et al. note that scaling supervision could have downsides and dangers, since it means further automating and quite possibly obscuring decision making, and use chain-of-thought reasoning to make decision making more legible."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 1", stance: for}

- id: c-less-testing
  type: attributive
  text: "By reducing the need for human feedback, constitutional methods make it easier to train and deploy AI systems that have not been thoroughly tested and observed by humans, which could lead developers to deploy models with unforeseen failure modes."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 6.2", stance: for}

- id: c-dual-use
  type: attributive
  text: "Bai et al. note a dual use: passing from prompting to RLHF to constitutional methods lowers the barrier to training AI models that behave as their creators intend, which also makes it easier to train pernicious systems, and the supervised methods may be particularly accessible since they need no efficient RL implementation."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 6.2", stance: for}

- id: c-lee-misuse
  type: attributive
  text: "Lee et al. note that RLAIF could be employed to train models to generate convincing misinformation or hateful and abusive content, and see careful governance of the access and usage of powerful LLMs as the best mitigation."
  evidence:
    - {work: "lee-2023-rlaif-vs-rlhf", role: original, locator: "Section 7", stance: for}

# Variants

- id: c-keep-critiques
  type: attributive
  text: "Bai et al. used critiqued revisions for their main results because they may provide more transparency into the model's reasoning process."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 3.5", stance: for}

- id: c-lee-d-rlaif
  type: definitional
  text: "In d-RLAIF, motivated by the reward model becoming stale as the policy is trained, the LLM is prompted to rate a generation from 1 to 10, the likelihoods of the score tokens are normalized, the weighted score s = sum_i i P(i) is computed and normalized to [-1, 1], and used as the reward in RL."
  evidence:
    - {work: "lee-2023-rlaif-vs-rlhf", role: original, locator: "p. 4", stance: for}

- id: c-future
  type: attributive
  text: "Bai et al. propose iterated online training with AI supervision, updating the preference model with new AI feedback to keep it on the policy's distribution, and expect constitutional methods could change a model's writing style, tone or personality, or its responses to specific categories of questions."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 6", stance: for}

- id: c-related
  type: attributive
  text: "Bai et al. describe their work as an extension of RLHF, similar to LaMDA, InstructGPT and Sparrow, with self-critique methods very similar to their supervised step, and note that Sparrow's decomposition of harmlessness into areas has some commonality with their principles."
  evidence:
    - {work: "bai-2022-constitutional-ai", role: original, locator: "Section 5", stance: for}

