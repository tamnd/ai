# Limitations

- id: c-fl-small
  type: empirical
  text: "Instruction tuning substantially improves held-out performance for the two models on the order of 100B parameters, but for 8B and smaller models it hurts performance on held-out tasks."
  scope:
    models: "LaMDA-PT, a decoder-only language model"
    data: ["62 public text datasets in twelve task clusters, ten templates each"]
    scale: "422M to 137B parameters"
    setting: "instruction tuning on all clusters but one, zero-shot evaluation on the held-out cluster"
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 7", stance: for}

- id: c-fl-capacity
  type: attributive
  text: "Wei et al. suggest that for small models, learning the roughly 40 tasks used during instruction tuning fills the entire model capacity."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 7", stance: for}

- id: c-fl-lm-tasks
  type: attributive
  text: "Instruction tuning does not improve performance for many language modeling tasks, such as commonsense reasoning or coreference resolution tasks formulated as sentence completions."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 6", stance: for}

- id: c-fc-cot
  type: empirical
  text: "Instruction finetuning without chain-of-thought data severely degrades performance on chain-of-thought evaluations, and adding just nine chain-of-thought datasets to the mixture improves performance on all evaluations."
  scope:
    models: "PaLM, U-PaLM and T5"
    data: ["Muffin, T0-SF, NIV2 and CoT mixtures, 1,836 tasks; MMLU, BBH, TyDiQA and MGSM held out"]
    scale: "80M to 540B parameters"
    setting: "instruction finetuning with and without exemplars and chain-of-thought"
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 2", stance: for}

- id: c-fc-express
  type: attributive
  text: "One explanation Chung et al. give for the small gain after 282 tasks is that most of the gains come from the model learning to better express knowledge it already knows from pretraining."
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 6", stance: for}

- id: c-co-diversity
  type: attributive
  text: "Longpre et al. caution against concluding that scaling beyond 1800 tasks would bring increased returns without also paying attention to task diversity and quality."
  evidence:
    - {work: "longpre-2023-flan-collection", role: original, locator: "p. 7", stance: for}

- id: c-si-quality
  type: empirical
  text: "In a sample of Self-Instruct data, 92% of instructions describe a valid task, 79% of inputs suit their instruction, 58% of outputs are correct and acceptable, and 54% of examples have all fields valid."
  scope:
    models: "GPT-3 (davinci) fine-tuned on its own generated instructions"
