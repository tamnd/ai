# The claims of the instruction-tuning page (spec 07). The build computes the labels.

# Setting

- id: c-fl-define
  type: attributive
  text: "Wei et al. call finetuning language models on a collection of datasets described via instructions instruction tuning, and report that it substantially improves zero-shot performance on unseen tasks."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 1", stance: for}

- id: c-t0-question
  type: attributive
  text: "Sanh et al. ask whether the zero-shot generalization of large language models, hypothesized to be a consequence of implicit multitask learning in pretraining, can instead be directly induced by explicit multitask learning."
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 1", stance: for}

- id: c-ni-dataset
  type: attributive
  text: "Natural Instructions is a dataset of 61 distinct tasks, their human-authored instructions and 193k task instances, with the instructions obtained from the crowdsourcing instructions used to create existing NLP datasets and mapped to a unified schema."
  evidence:
    - {work: "mishra-2022-cross-task-generalization", role: original, locator: "p. 1", stance: for}

- id: c-ni-schema
  type: attributive
  text: "The unified schema of Natural Instructions covers the most important elements of task descriptions, such as definition, constraints, positive and negative examples."
  evidence:
    - {work: "mishra-2022-cross-task-generalization", role: original, locator: "p. 2", stance: for}

- id: c-ig-sft
  type: attributive
  text: "The supervised fine-tuning stage of InstructGPT fine-tunes GPT-3 on labeler demonstrations with supervised learning, for 16 epochs with a cosine learning rate decay and residual dropout of 0.2, selecting the final model by its reward-model score on the validation set."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 8", stance: for}

- id: c-ig-13k
  type: attributive
  text: "The InstructGPT SFT dataset contains about 13k training prompts, from the API and written by labelers."
  evidence:
    - {work: "ouyang-2022-training-language-models-follow-instructions", role: original, locator: "p. 7", stance: for}

# The method

- id: c-fl-62
  type: attributive
  text: "Wei et al. aggregate 62 text datasets that are publicly available on Tensorflow Datasets into a single mixture, each categorized into one of twelve task clusters of the same task type."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 3", stance: for}

- id: c-fl-templates
  type: attributive
  text: "For each dataset Wei et al. manually compose ten unique templates that use natural language instructions to describe the task."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 3", stance: for}

- id: c-t0-p3
  type: attributive
  text: "The Public Pool of Prompts (P3) contains 2073 prompts for 177 datasets, 11.7 prompts per dataset on average."
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 5", stance: for}

- id: c-t0-encdec
  type: attributive
  text: "T0 is an encoder-decoder model that generates the target through standard maximum likelihood training; unlike decoder-only language models such as GPT-3, it is never trained to generate the input."
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 6", stance: for}

- id: c-fl-mix
  type: attributive
  text: "FLAN limits the number of training examples per dataset to 30k and follows the examples-proportional mixing scheme with a mixing rate maximum of 3k, meaning that a dataset receives no additional sampling weight for examples in excess of 3,000."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 4", stance: for}

- id: c-t0-mix
  type: attributive
  text: "T0 combines and shuffles all examples from all training datasets, which is equivalent to sampling in proportion to dataset size, but treats any dataset with over 500'000 examples as having 500'000 divided by its number of templates."
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 6", stance: for}

- id: c-fc-mixtures
  type: attributive
  text: "Chung et al. scale to 1,836 finetuning tasks from 473 datasets and 146 task categories by combining four mixtures: Muffin (80 tasks), T0-SF (193 tasks), NIV2 (1554 tasks) and CoT."
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 3", stance: for}

- id: c-co-inversion-def
  type: attributive
  text: "Input inversion gives a model the answer y of a supervised task and trains it to generate the question x, an easy method to enrich the task variety given a limited set of data sources."
  evidence:
    - {work: "longpre-2023-flan-collection", role: original, locator: "p. 7", stance: for}

- id: c-si-pipeline
  type: attributive
  text: "Self-Instruct starts from 175 seed tasks, each with one instruction and one instance, and at each step samples 8 task instructions from the pool as in-context examples for generating new ones."
  evidence:
    - {work: "wang-2023-self-instruct", role: original, locator: "p. 3", stance: for}

- id: c-si-rouge
  type: attributive
  text: "Self-Instruct adds a new instruction to the task pool only when its ROUGE-L similarity with every existing instruction is less than 0.7."
  evidence:
    - {work: "wang-2023-self-instruct", role: original, locator: "p. 4", stance: for}

- id: c-si-52k
  type: attributive
  text: "Run on GPT-3, the iterative Self-Instruct process yields about 52k instructions paired with about 82K instance inputs and target outputs."
  evidence:
    - {work: "wang-2023-self-instruct", role: original, locator: "p. 2", stance: for}

- id: c-li-data
  type: attributive
  text: "The LIMA training set has 750 top questions and answers from community forums such as Stack Exchange and wikiHow, sampled for quality and diversity, and 250 hand-written prompts and responses in a uniform assistant style."
  evidence:
    - {work: "zhou-2023-lima", role: original, locator: "p. 2", stance: for}

- id: c-li-eot
  type: attributive
  text: "LIMA marks the end of each utterance with a special end-of-turn token, which halts generation like EOS but avoids conflation with any other meaning the pretrained model gave the existing EOS token."
  evidence:
    - {work: "zhou-2023-lima", role: original, locator: "p. 4", stance: for}

# Hyperparameters

- id: c-fl-hparams
  type: attributive
  text: "FLAN is finetuned for 30k gradient steps with a batch size of 8,192 tokens, the Adafactor optimizer at a learning rate of 3e-5, input and target lengths of 1024 and 256, and packing of several examples into one sequence separated by an EOS token."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 4", stance: for}

- id: c-t0-hparams
  type: attributive
  text: "T0 truncates inputs and targets to 1024 and 256 tokens and uses Adafactor with a learning rate of 1e-3 and a dropout rate of 0.1, following standard practice for fine-tuning T5."
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 6", stance: for}

- id: c-li-hparams
  type: attributive
  text: "LIMA is fine-tuned for 15 epochs with AdamW (beta1 = 0.9, beta2 = 0.95, weight decay 0.1), with no warmup and a learning rate decaying linearly from 1e-5 to 1e-6."
  evidence:
    - {work: "zhou-2023-lima", role: original, locator: "p. 4", stance: for}

# Cost

- id: c-fl-time
  type: attributive
  text: "FLAN's instruction tuning takes around 60 hours on a TPUv3 with 128 cores."
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 4", stance: for}

- id: c-fc-compute
  type: attributive
  text: "Chung et al. use 0.2% of the pre-training compute to instruction-finetune Flan-PaLM 540B, approximately 512 v4 TPU chips for 37 hours."
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 4", stance: for}

- id: c-fc-table
  type: attributive
  text: "For Flan-PaLM 540B, Table 2 of Chung et al. lists 2.5E+24 pre-training FLOPs and 5.6E+21 finetuning FLOPs."
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 5", stance: for}

- id: c-fc-tokens
  type: attributive
  text: "The PaLM pre-training data consists of 780B tokens, while instruction finetuning uses 1.4B tokens, 0.2% of the pre-training tokens."
  evidence:
    - {work: "chung-2022-scaling-instruction-finetuned", role: original, locator: "p. 6", stance: for}

# Evidence

- id: c-fl-gpt3
  type: empirical
  text: "FLAN, a 137B model instruction tuned on over 60 NLP datasets, surpasses zero-shot 175B GPT-3 on 20 of 25 datasets evaluated."
  scope:
    models: "LaMDA-PT, a decoder-only language model"
    data: ["62 public text datasets in twelve task clusters, ten templates each"]
    scale: "422M to 137B parameters"
    setting: "instruction tuning on all clusters but one, zero-shot evaluation on the held-out cluster"
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 1", stance: for}

- id: c-fl-clusters
  type: empirical
  text: "With NLI, closed-book QA and commonsense reasoning held out, average performance on the held-out clusters improves as instruction-tuning clusters are added, except for sentiment analysis, and does not appear to saturate at seven clusters."
  scope:
    models: "LaMDA-PT, a decoder-only language model"
    data: ["62 public text datasets in twelve task clusters, ten templates each"]
    scale: "422M to 137B parameters"
    setting: "instruction tuning on all clusters but one, zero-shot evaluation on the held-out cluster"
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 6", stance: for}

- id: c-fl-instructions
  type: empirical
  text: "Finetuning without templates, or with only the dataset name in place of instructions, performs substantially worse than FLAN on held-out clusters, indicating that training with instructions is crucial for zero-shot performance on unseen tasks."
  scope:
    models: "LaMDA-PT, a decoder-only language model"
    data: ["62 public text datasets in twelve task clusters, ten templates each"]
    scale: "422M to 137B parameters"
    setting: "instruction tuning on all clusters but one, zero-shot evaluation on the held-out cluster"
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 7", stance: for}

- id: c-fl-fewshot
  type: empirical
  text: "Few-shot exemplars at inference improve instruction-tuned FLAN on all task clusters over zero-shot FLAN, and lower the standard deviation across templates."
  scope:
    models: "LaMDA-PT, a decoder-only language model"
    data: ["62 public text datasets in twelve task clusters, ten templates each"]
    scale: "422M to 137B parameters"
    setting: "instruction tuning on all clusters but one, zero-shot evaluation on the held-out cluster"
  evidence:
    - {work: "wei-2022-finetuned-language-models-zero-shot", role: original, locator: "p. 8", stance: for}

- id: c-t0-gpt3
  type: empirical
  text: "T0 matches or exceeds GPT-3 on 9 of 11 held-out datasets despite being about 16 times smaller, and improves over a large baseline language model on 13 of 14 BIG-bench tasks."
  scope:
    models: "T5+LM, an LM-adapted T5 encoder-decoder"
    data: ["P3 prompts for the training datasets; 11 held-out datasets in four tasks and 14 BIG-bench tasks"]
    scale: "3B and 11B parameters"
    setting: "multitask prompted fine-tuning, zero-shot evaluation on held-out tasks with many prompts each"
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 3", stance: for}

- id: c-t0-baseline
  type: empirical
  text: "Multitask prompted training gives significant gains over the T5+LM baseline, the same model without it, on all held-out datasets."
  scope:
    models: "T5+LM, an LM-adapted T5 encoder-decoder"
    data: ["P3 prompts for the training datasets; 11 held-out datasets in four tasks and 14 BIG-bench tasks"]
    scale: "3B and 11B parameters"
    setting: "multitask prompted fine-tuning, zero-shot evaluation on held-out tasks with many prompts each"
  evidence:
    - {work: "sanh-2022-multitask-prompted-training", role: original, locator: "p. 7", stance: for}

- id: c-t0-prompts
  type: empirical
  text: "Training on more prompts per dataset consistently improves the median and decreases the variability of performance on held-out tasks; prompts from more datasets generally improve the median but do not consistently decrease the variability."
  scope:
    models: "T5+LM, an LM-adapted T5 encoder-decoder"
    data: ["P3 prompts for the training datasets; 11 held-out datasets in four tasks and 14 BIG-bench tasks"]
    scale: "3B and 11B parameters"
    setting: "multitask prompted fine-tuning, zero-shot evaluation on held-out tasks with many prompts each"
  evidence:
