- id: c-it-rates
  type: mathematical
  text: "Under examples-proportional mixing with a cap K, dataset m with e_m examples is sampled with rate min(e_m, K) divided by the sum of min(e_n, K) over all datasets, so every dataset with at least K examples gets the same rate."
  assumes: ["datasets are sampled independently with fixed rates"]
  derivation: instruction-tuning-arithmetic

- id: c-it-epochs
  type: mathematical
  text: "After S sampled examples, every dataset smaller than the cap is passed over S divided by the sum of min(e_n, K) times, the same number for all of them, and a dataset with e_m > K is passed over fewer times, S K / (e_m times that sum)."
  assumes: ["datasets are sampled independently with fixed rates", "sampling is uniform within a dataset"]
  derivation: instruction-tuning-arithmetic

- id: c-it-example
  type: mathematical
  text: "For datasets of 1,000, 3,000 and 100,000 examples and K = 3,000, the rates are 1/7, 3/7 and 3/7 instead of about 1.0%, 2.9% and 96.2% without the cap; after 70,000 samples the three datasets are passed over 10, 10 and 0.3 times."
  assumes: ["datasets are sampled independently with fixed rates"]
  derivation: instruction-tuning-arithmetic

- id: c-it-t0rule
  type: mathematical
  text: "T0's rule, which counts a dataset with more than 500,000 examples as 500,000 divided by its number of templates, is not monotone in dataset size: with 10 templates a dataset of 500,000 examples counts as 500,000 and one of 500,001 as 50,000."
  assumes: ["the effective size is e for e ≤ 500,000 and 500,000/T above"]
  derivation: instruction-tuning-arithmetic

- id: c-it-chain
  type: mathematical
  text: "For an autoregressive model, the sum of per-token negative log-likelihoods over the response positions of a prompt-response sequence equals −log p(response | prompt), and the loss over all positions adds −log p(prompt)."
  assumes: ["the model factorizes the sequence probability by the chain rule"]
  derivation: instruction-tuning-arithmetic

- id: c-it-grad
  type: mathematical
  text: "The gradient of the masked mean token loss with respect to the logits at position t is m_t (softmax(z_t) − onehot(y_t)) divided by the number of unmasked tokens, which is zero at every prompt position."
  assumes: ["the loss is the masked mean of per-token cross-entropies over the logits z_t"]
  derivation: instruction-tuning-arithmetic

- id: c-it-weights
  type: mathematical
  text: "Averaging the loss over all response tokens in a batch weights each sequence in proportion to its number of response tokens, while averaging per sequence first weights them equally; for responses of 10 and 90 tokens the weights are 0.1 and 0.9 against 0.5 and 0.5."
  assumes: ["the loss is the masked mean of per-token cross-entropies over the logits z_t"]
  derivation: instruction-tuning-arithmetic

