- id: c-6x
  type: attributive
  text: "NVIDIA writes that H100 provides approximately 6x compute performance improvement over A100, from its 132 SMs, from each H100 SM being 2x faster thanks to its new 4th Generation Tensor Core, and from another 2x improvement from the new FP8 format and associated Transformer Engine."
  evidence:
    - {work: "nvidia-2023-h100-architecture-whitepaper", role: original, locator: "p. 28", stance: for}

- id: c-a100-tdp
  type: definitional
