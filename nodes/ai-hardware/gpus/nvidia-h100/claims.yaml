- id: c-a100-mem
  type: definitional
  text: "In NVIDIA's comparison of A100 and H100, the NVIDIA A100 has 40 GB of memory on a 5120-bit HBM2 interface, with a memory bandwidth of 1555 GB/sec."
  evidence:
