# The claims of the chinese-room page (spec 07). The build computes the labels.
- id: c-published-1980
  type: historical
  text: "Searle's article Minds, brains, and programs was published in The Behavioral and Brain Sciences in 1980."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "the title page", stance: for}

- id: c-target-schank
  type: attributive
  text: "Searle considers the work of Roger Schank and his colleagues at Yale on programs that answer questions about stories, such as a story in which a man is served a burned hamburger in a restaurant."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 417", stance: for}

- id: c-room-setup
  type: attributive
  text: "Searle imagines that he is locked in a room and given batches of Chinese writing and rules in English that let him identify the Chinese symbols entirely by their shapes."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 418", stance: for}

- id: c-no-understanding
  type: attributive
  text: "Searle says that he does not understand a word of the Chinese stories, although his answers are indistinguishable from those of native Chinese speakers."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 418", stance: for}

- id: c-not-sufficient
  type: attributive
  text: "Searle argues that the computer and the program do not provide sufficient conditions of understanding, since they are functioning and there is no understanding."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 418", stance: for}

- id: c-never-sufficient
  type: attributive
  text: "Searle argues that instantiating a computer program is never by itself a sufficient condition of intentionality."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 417", stance: for}

- id: c-causal-powers
  type: attributive
  text: "Searle argues that any mechanism capable of producing intentionality must have causal powers equal to those of the brain."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 417", stance: for}

- id: c-machines-can-think
  type: attributive
  text: "To the question whether a machine could think, Searle answers that only a machine could think, namely brains and machines with internal causal powers equivalent to those of brains."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 417", stance: for}

- id: c-syntax-no-semantics
  type: attributive
  text: "Searle says that formal symbol manipulations by themselves have only a syntax but no semantics."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 422", stance: for}

- id: c-simulation
  type: attributive
  text: "Searle says that no one supposes that a computer simulation of a fire will burn the neighborhood down."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 423", stance: for}

- id: c-axioms-1990
  type: attributive
  text: "Searle states as an axiom that syntax by itself is neither constitutive of nor sufficient for semantics."
  evidence:
    - {work: "searle-1990-brains-mind-computer-program-sciam", role: original, locator: "p. 27", stance: for}

- id: c-conclusion-1990
  type: attributive
  text: "Searle concludes that programs are neither constitutive of nor sufficient for minds."
  evidence:
    - {work: "searle-1990-brains-mind-computer-program-sciam", role: original, locator: "p. 27", stance: for}

- id: c-room-axiom3
  type: attributive
  text: "Searle says that the Chinese room demonstrated that having the symbols by themselves is not sufficient for having the semantics."
  evidence:
    - {work: "searle-1990-brains-mind-computer-program-sciam", role: original, locator: "p. 27", stance: for}

- id: c-axiom4
  type: attributive
  text: "Searle adds the axiom that brains cause minds, and concludes that any other system capable of causing minds would have to have causal powers at least equivalent to those of brains."
  evidence:
    - {work: "searle-1990-brains-mind-computer-program-sciam", role: original, locator: "p. 29", stance: for}

- id: c-reductio
  type: attributive
  text: "Cole summarizes the narrow argument as a reductio ad absurdum against strong AI, and says that it is not directed at weak AI."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 3", stance: for}

- id: c-strong-weak
  type: attributive
  text: "Searle distinguishes weak AI, on which the computer is a tool in the study of the mind and to which, at least as far as this article is concerned, he has no objection, from strong AI, on which the appropriately programmed computer really is a mind."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 417", stance: for}

- id: c-bbs-commentary
  type: historical
  text: "Searle's article in the journal was published along with comments and criticisms by 27 cognitive science researchers, followed by Searle's replies."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: review, locator: "Section 3", stance: for}

- id: c-labels
  type: attributive
  text: "Cole says that Searle discussed responses to the argument that he had come across in giving the argument in talks at various places."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.1", stance: for}

- id: c-place-labels
  type: attributive
  text: "The replies carry the names Berkeley, Stanford and Yale."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-antecedents
  type: attributive
  text: "Cole traces the historical background of the argument to Leibniz' mill, Turing's paper machine and the Chinese nation."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 2", stance: for}

- id: c-most-common
  type: attributive
  text: "Cole quotes Searle as calling the systems reply perhaps the most common reply."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.1", stance: for}

- id: c-systems-reply
  type: attributive
  text: "The systems reply, as Searle states it, holds that the individual in the room does not understand, but is part of a whole system with rules, scratch paper and data banks, and the system does understand."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 419", stance: for}

- id: c-systems-proponents
  type: attributive
  text: "Cole says that Ned Block was one of the first to press the systems reply, along with Jack Copeland, Daniel Dennett, Douglas Hofstadter, Jerry Fodor, John Haugeland, Ray Kurzweil and Georges Rey."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.1", stance: for}

- id: c-systems-answer
  type: attributive
  text: "Searle answers that if the individual memorizes the rules and the data banks and does all the calculations in his head, even outdoors, he still understands nothing of the Chinese, and neither does the system."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 419", stance: for}

- id: c-virtual-mind
  type: attributive
  text: "Cole reports that Minsky and Sloman and Croucher suggested a virtual mind reply when the argument first appeared: running the program may create a mind distinct from the person who runs it."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.1.1", stance: for}

- id: c-virtual-mind-views
  type: attributive
  text: "Cole reports that Maudlin points out a virtual mind reply, that Perlis, Chalmers and Block have apparently endorsed versions of it, and that Penrose is a critic of it and Harnad dismisses it."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.1.1", stance: for}

- id: c-robot-reply
  type: attributive
  text: "The robot reply, as Searle states it, puts a computer inside a robot that does something like perceiving, walking, moving about and hammering nails, and holds that the robot would have genuine understanding and other mental states."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 420", stance: for}

- id: c-robot-proponents
  type: attributive
  text: "Cole lists Boden, Crane, Dennett, Fodor, Harnad, Moravec and Rey among those who endorse versions of the robot reply."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.2", stance: for}

- id: c-robot-answer
  type: attributive
  text: "Searle answers that the robot reply tacitly concedes that cognition is not solely formal symbol manipulation, and that if he runs the program inside the robot he is the robot's homunculus and understands nothing except the rules."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 420", stance: for}

- id: c-fodor-robot
  type: attributive
  text: "Fodor grants that instantiating the same program as the brain is not by itself sufficient for propositional attitudes, but finds Searle's treatment of the robot reply unconvincing, given the right kinds of causal linkages."
  evidence:
    - {work: "fodor-1980-searle-only-brains-bbs", role: original, locator: "p. 431", stance: for}

- id: c-crane
  type: attributive
  text: "Cole reports that Crane argues that if Searle in the room also started acting in the world of Chinese people, it is plausible that he would before long come to realize what the symbols mean."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.2", stance: for}

- id: c-brain-sim-reply
  type: attributive
  text: "The brain simulator reply, as Searle states it, holds that of a machine whose program simulates the actual sequence of neuron firings at the synapses of the brain of a native Chinese speaker we would have to say that it understood the stories, or else deny that native Chinese speakers understand them."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 420", stance: for}

- id: c-brain-sim-answer
  type: attributive
  text: "Searle answers with a man who operates water pipes with valves, each water connection corresponding to a synapse; neither the man nor the water pipes understand Chinese, because the simulation has only the formal structure of the neuron firings."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-hofstadter
  type: attributive
  text: "Hofstadter argues that once we accept that a tangle of cells gives rise to an I, a water-pipe I should seem no more weird."
  evidence:
    - {work: "hofstadter-1980-reductionism-religion-bbs", role: original, locator: "p. 433", stance: for}

- id: c-pylyshyn
  type: attributive
  text: "Pylyshyn asks what Searle's view implies if the cells of a brain are replaced one by one with chips that keep the same input-output function."
  evidence:
    - {work: "pylyshyn-1980-causal-power-machines-bbs", role: original, locator: "p. 442", stance: for}

- id: c-combination
  type: attributive
  text: "The combination reply, as Searle states it, takes the previous three replies together: a robot with a brain-shaped computer programmed with all the synapses of a human brain, whose behavior is indistinguishable from human behavior, is a system to which we would have to ascribe intentionality."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-combination-rey
  type: attributive
  text: "Cole reports that Rey argues that it is reasonable to attribute intentionality to such a system as a whole."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.3", stance: for}

- id: c-combination-answer
  type: attributive
  text: "Searle agrees that it would be rational and indeed irresistible to accept that such a robot had intentionality, as long as we knew nothing more about it."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-combination-withdraw
  type: attributive
  text: "Searle says that as soon as we knew that the behavior was the result of a formal program, and that the actual causal properties of the physical substance were irrelevant, we would abandon the assumption of intentionality."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-spouse
  type: attributive
  text: "Cole remarks that on Searle's answer one would presumably cease to attribute intentionality even to a spouse who was revealed to hide a silicon secret."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.3", stance: for}

- id: c-other-minds
  type: attributive
  text: "The other minds reply, as Searle states it, holds that we know that other people understand Chinese only by their behavior, so if a computer passes the behavioral tests we must attribute cognition to it."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421", stance: for}

- id: c-other-minds-answer
  type: attributive
  text: "Searle answers that the problem is not how he knows that other people have cognitive states, but what it is that he is attributing when he attributes cognitive states to them."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 421, p. 422", stance: for}

- id: c-other-minds-counter
  type: attributive
  text: "Cole reports critics who argue that if the evidence that humans understand is the same as the evidence that a robot understands, presuppositions about our own species are not relevant, since presuppositions are sometimes false."
  evidence:
    - {work: "cole-2024-chinese-room-sep", role: original, locator: "Section 4.4", stance: for}

- id: c-many-mansions
  type: attributive
  text: "The many mansions reply, as Searle states it, holds that eventually we will be able to build devices that have whatever causal processes are essential for intentionality, and that will be artificial intelligence."
  evidence:
