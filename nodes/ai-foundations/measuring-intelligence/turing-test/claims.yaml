# The claims of the turing-test page (spec 07). The build computes the labels.
- id: c-proposed-1950
  type: historical
  text: "Turing proposed the imitation game in Computing Machinery and Intelligence, published in Mind in 1950."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "the title page", stance: for}

- id: c-replaces-question
  type: attributive
  text: "Turing replaces the question Can machines think? with the question whether the interrogator will decide wrongly as often when a machine takes the part of A in the imitation game."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}

- id: c-gallup
  type: attributive
  text: "Turing says that if the meaning of the words machine and think is found by examining how they are commonly used, the answer must be sought in a statistical survey such as a Gallup poll, and that this is absurd."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}

- id: c-original-game
  type: attributive
  text: "The imitation game is played with a man A, a woman B and an interrogator C in a room apart, whose object is to determine which of the other two is the man and which is the woman."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}

- id: c-typewritten
  type: attributive
  text: "So that tones of voice may not help the interrogator, Turing asks that the answers be written or typewritten, and the third player B tries to help the interrogator."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}

- id: c-machine-takes-a
  type: attributive
  text: "Turing asks what will happen when a machine takes the part of A in this game, and whether the interrogator will decide wrongly as often as when the game is played between a man and a woman."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 1", stance: for}

- id: c-sharp-line
  type: attributive
  text: "Turing says the new problem has the advantage of drawing a fairly sharp line between the physical and the intellectual capacities of a man."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 2", stance: for}

- id: c-beauty
  type: attributive
  text: "Turing does not wish to penalise the machine for its inability to shine in beauty competitions, nor to penalise a man for losing in a race against an aeroplane."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 2", stance: for}

- id: c-digital-only
  type: attributive
  text: "Turing permits only digital computers to take part in the game, and in view of their universality fixes attention on one particular digital computer with adequate storage, suitable speed and an appropriate programme playing the part of A."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 5", stance: for}

- id: c-prediction
  type: attributive
  text: "Turing believes that in about fifty years it will be possible to programme computers with a storage capacity of about 10^9 to play the imitation game so well that an average interrogator will not have more than 70 percent chance of making the right identification after five minutes of questioning."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 6", stance: for}
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.2", stance: for}

- id: c-too-meaningless
  type: attributive
  text: "Turing believes the original question is too meaningless to deserve discussion, and that at the end of the century one will be able to speak of machines thinking without expecting to be contradicted."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 6", stance: for}

- id: c-two-claims
  type: attributive
  text: "Oppy and Dowe separate the Turing Test Claim, that the imitation game provides a good test for the presence of intelligence, from the Thinking Machine Claim, that an appropriately programmed computer could pass it."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.3", stance: for}

- id: c-searle-machine-claim
  type: attributive
  text: "Oppy and Dowe say that some objections, such as the argument of Searle, are objections to the Thinking Machine Claim but not to the Turing Test Claim."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.3", stance: for}

- id: c-underspecified
  type: attributive
  text: "Oppy and Dowe say the Turing Test is greatly underspecified, with relevant variables including the length of the questioning, the skills of the interrogator, the skills of the third player and the number of independent sessions."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.4", stance: for}

- id: c-probabilistic-verdicts
  type: attributive
  text: "Oppy and Dowe suggest that judges could provide probabilistic answers instead of Yes/No verdicts, which preserves the character of the test and gives scope for greater statistical sophistication."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.4", stance: for}
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.4", stance: for}

- id: c-nine-objections
  type: attributive
  text: "Turing answers the theological objection, the heads in the sand objection, the mathematical objection, the argument from consciousness, arguments from various disabilities, Lady Lovelace's objection, the argument from continuity in the nervous system, the argument from informality of behaviour and the argument from extrasensory perception."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 6", stance: for}
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 2", stance: for}

- id: c-polite-convention
  type: attributive
  text: "Turing replies to the argument from consciousness that it leads to the solipsist point of view, and that instead of arguing it is usual to have the polite convention that everyone thinks."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 6", stance: for}

- id: c-child-machine
  type: attributive
  text: "Lady Lovelace states that the Analytical Engine has no pretensions to originate anything, and Turing proposes, instead of a programme to simulate the adult mind, one which simulates the child's, subjected to an appropriate course of education."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 6", stance: for}
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 7", stance: for}

- id: c-win-rate
  type: attributive
  text: "Jones and Bergen define the win rate as the proportion of the time that an interrogator selected the model as the human witness, and the interrogator accuracy as its complement."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "Section 2.1", stance: for}

- id: c-jb-eliza-check
  type: attributive
  text: "Jones and Bergen note that the criterion requires confirming a null result, and use ELIZA as a manipulation check, whose win rate was significantly below chance."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "Section 3.1", stance: for}

- id: c-sample-dialogue
  type: attributive
  text: "In Turing's sample dialogue, asked for a sonnet on the subject of the Forth Bridge the witness answers Count me out on this one, and asked to add 34957 to 70764 it pauses about 30 seconds and answers 105621."
  evidence:
    - {work: "turing-1950-computing-machinery-intelligence", role: original, locator: "Section 2", stance: for}

- id: c-loebner-1991
  type: historical
  text: "On November 8, 1991, the first attempt on the Loebner Prize was held at Boston's Computer Museum, billed as the first actual administration of the Turing test."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "p. 1", stance: for}

- id: c-loebner-setup
  type: attributive
  text: "There were ten agents, of which six were computer programs, and ten judges selected from the general public through a newspaper employment advertisement."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "p. 2", stance: for}

- id: c-loebner-rules
  type: attributive
  text: "Conversation was limited to a single specified topic, and a rule precluded the use of trickery or guile by the judges."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "p. 2", stance: for}

- id: c-loebner-result
  type: attributive
  text: "The two human confederates were ranked more human-like than the six contestants, Joseph Weintraub's program on whimsical conversation won, five judges ranked it as human, and there were eight misclassifications of computers as humans."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "p. 4", stance: for}

- id: c-shieber-verdict
  type: attributive
  text: "Shieber argues that the competition has no clear purpose, that its design prevents any useful outcome, and that it is inappropriate given the current level of technology."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "the abstract", stance: for}

- id: c-loebner-problematic
  type: attributive
  text: "Shieber says the two rules limiting the topic and tenor of the discussion were quite problematic."
  evidence:
    - {work: "shieber-1994-lessons-restricted-turing-test", role: original, locator: "p. 2", stance: for}

- id: c-jb-design
  type: attributive
  text: "Jones and Bergen recruited 126 participants from the UCSD psychology undergraduate subject pool and 158 participants from Prolific, with the Prolific study as a replication."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "Section 1.3", stance: for}

- id: c-jb-setup
  type: attributive
  text: "In two randomised, controlled, and pre-registered Turing tests, participants had 5 minute conversations simultaneously with another human participant and one of the systems ELIZA, GPT-4o, LLaMa-3.1-405B and GPT-4.5."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "the abstract", stance: for}

- id: c-jb-rates
  type: attributive
  text: "When prompted to adopt a humanlike persona, GPT-4.5 was judged to be the human 73% of the time and LLaMa-3.1 56%, while ELIZA and GPT-4o had win rates of 23% and 21%."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "the abstract", stance: for}

- id: c-jb-no-persona
  type: attributive
  text: "Jones and Bergen found that the same systems did not robustly pass without the PERSONA prompt."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "Section 3.1", stance: for}

- id: c-jb-12pct
  type: attributive
  text: "Only 12% of participants quizzed witnesses on knowledge and reasoning questions of the kind Turing envisioned, and far more focussed on social, emotional and cultural aspects."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "Section 3.3", stance: for}

- id: c-jb-first
  type: attributive
  text: "Jones and Bergen say the results constitute the first empirical evidence that any artificial system passes a standard three-party Turing test."
  evidence:
    - {work: "jones-2025-llms-pass-turing-test", role: original, locator: "the abstract", stance: for}

- id: c-searle-adequacy
  type: attributive
  text: "Searle says that he can pass the Turing test and fool native Chinese speakers, but that precisely one of the points at issue is the adequacy of the Turing test, since two systems could both pass it while only one understands."
  evidence:
    - {work: "searle-1980-minds-brains-programs-bbs", role: original, locator: "p. 419", stance: for}

- id: c-blockhead
  type: attributive
  text: "Block's Blockhead looks just like a human being but is controlled by a game-of-life look-up tree with a programmed response for every discriminable input at each stage of its life."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.2", stance: for}

- id: c-blockhead-sufficiency
  type: attributive
  text: "If Blockhead is logically possible and not intelligent, it is a counterexample to the claim that the Turing Test provides a logically sufficient condition for the ascription of intelligence."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.2", stance: for}

- id: c-blockhead-replies
  type: attributive
  text: "Oppy and Dowe say one can deny that Blockhead is a logical possibility, or claim that Blockhead would be intelligent."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.2", stance: for}

- id: c-french
  type: attributive
  text: "French argues that nothing without a human subcognitive substrate could pass the test, and that questions about associative priming and ratings games would separate human beings from machines."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.1", stance: for}

- id: c-harnad-ttt
  type: attributive
  text: "Harnad claims a better test is a Total Turing Test that requires responses to all of our inputs, a robot with something like human sensorimotor capabilities."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.3.1", stance: for}

- id: c-lovelace-test
  type: attributive
  text: "Bringsjord et al. propose the Lovelace Test: an artificial agent produces an output, the output results from processes it can repeat, and its designer cannot explain how it produced the output by appeal to its architecture, knowledge-base and core functions."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.3.2", stance: for}

- id: c-hayes-ford
  type: attributive
  text: "Hayes and Ford attack the Turing Test as a research goal for AI, claiming among other things that it sets out to confirm a null hypothesis."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.4", stance: for}

- id: c-hayes-ford-sep
  type: attributive
  text: "Oppy and Dowe say Hayes and Ford are right to worry about the suggestion that the Turing Test provides the defining goal for research in AI, and that there is no reason to think Turing supposed it did."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 5.4", stance: for}

- id: c-standard-reading
  type: attributive
  text: "Copeland, Piccinini and Moor argue that Turing intended the standard interpretation, in which the computer is to pretend to be a human being and the other participant is a human being of unspecified gender."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.1", stance: for}

- id: c-sterrett
  type: attributive
  text: "Oppy and Dowe cite Sterrett for a dissenting view about the interpretation of the imitation game."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.1", stance: for}

- id: c-probabilistic-support
  type: attributive
  text: "Oppy and Dowe say Turing thought passing the test would provide probabilistic support for the hypothesis of intelligence."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 4.4", stance: for}

- id: c-prediction-2000
  type: attributive
  text: "Most commentators contend that Turing's prediction was mistaken for the year 2000, while Copeland argues that about fifty years is not exactly fifty years and that Turing elsewhere predicted at least 100 years for an unrestricted test."
  evidence:
    - {work: "oppy-2021-turing-test-sep", role: original, locator: "Section 3.2", stance: for}

- id: c-descartes
  type: attributive
  text: "The Turing Test is sometimes said to be prefigured in Descartes' Discourse on the Method; Copeland finds an anticipation in the 1668 writings of de Cordemoy, and Abramson presents archival evidence that Turing was aware of Descartes' language test."
  evidence:
