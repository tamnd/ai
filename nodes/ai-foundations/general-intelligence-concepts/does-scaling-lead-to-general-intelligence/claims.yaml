# Position: the question is not well posed

- id: c-blili-consensus
  type: attributive
  text: "Blili-Hamelin et al. argue that the popular use of the term AGI gives the illusion of a shared understanding of what AGI is, while there are vastly different opinions on what the term refers to."
  evidence:
    - {work: "blili-hamelin-2025-stop-treating-agi", role: original, locator: "p. 2", stance: for}

- id: c-blili-goals
  type: attributive
  text: "Blili-Hamelin et al. argue that the AI research community should prioritize specificity in scientific, engineering and societal goals, and stop treating AGI as the north-star goal of AI research."
  evidence:
    - {work: "blili-hamelin-2025-stop-treating-agi", role: original, locator: "the abstract", stance: for}

- id: c-blili-generality
  type: attributive
  text: "Blili-Hamelin et al. list many different notions of generality at play in machine learning, among them the variety of tasks and whether the evaluation data was seen or unseen during training."
  evidence:
    - {work: "blili-hamelin-2025-stop-treating-agi", role: original, locator: "p. 5", stance: for}

- id: c-raji
  type: attributive
  text: "Raji et al. argue that benchmarks framed as general measures of progress, due to their instantiation in particular data, metrics and practice, cannot possibly capture anything representative of the claims to general applicability made about them."
  evidence:
    - {work: "raji-2021-everything-whole-wide-world-benchmark", role: original, locator: "Section 1", stance: for}

- id: c-legg-single
  type: attributive
  text: "Legg and Hutter find strong similarities between many proposed definitions of intelligence, which leads them to believe that a single general and encompassing definition for arbitrary systems is possible."
  evidence:
    - {work: "legg-2007-collection-definitions-intelligence", role: original, locator: "pp. 1 to 2", stance: for}

# What would settle it

- id: c-chollet-arc
  type: attributive
  text: "Chollet proposes the Abstraction and Reasoning Corpus (ARC), built on priors close to innate human priors, and argues that it can measure a human-like form of general fluid intelligence and enables fair comparisons between AI systems and humans."
  evidence:
    - {work: "chollet-2019-measure-of-intelligence", role: original, locator: "the abstract", stance: for}

- id: c-arc2-humans
  type: empirical
  text: "In human testing for ARC-AGI-2, 407 unique participants in 515 sessions made 13,405 total test pair attempts, of which 8,277 (62%) were successfully solved."
  scope:
    models: "not applicable"
    data: [arc-agi-2]
    scale: "407 participants"
    setting: "controlled human testing sessions between November 2024 and May 2025"
  evidence:
    - {work: "chollet-2025-arc-agi-2", role: original, locator: "Section 4.3, Section 4.1", stance: for}

- id: c-arc2-selection
  type: attributive
  text: "A candidate ARC-AGI-2 task advanced from human testing only if at least two independent participants solved one or more of its test pairs within their first two attempts."
  evidence:
    - {work: "chollet-2025-arc-agi-2", role: original, locator: "Section 5", stance: for}

- id: c-morris-bench
