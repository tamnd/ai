# The claims of the does-scaling-lead-to-general-intelligence page (spec 07). The build computes the labels.

# The question: terms and definitions

- id: c-power-law
  type: empirical
  text: "For Transformer language models, the cross-entropy loss scales as a power law with model size, dataset size and the amount of compute used for training, with some trends spanning more than seven orders of magnitude."
  scope:
    models: "decoder-only Transformer language models"
    data: [webtext2]
    scale: "768 to 1.5 billion non-embedding parameters; 22 million to 23 billion tokens"
    setting: "autoregressive language modeling, cross-entropy loss"
  evidence:
    - {work: "kaplan-2020-scaling-laws", role: original, locator: "the abstract, p. 7", stance: for}

- id: c-def-chollet
  type: attributive
  text: "Chollet defines the intelligence of a system as a measure of its skill-acquisition efficiency over a scope of tasks, with respect to priors, experience and generalization difficulty."
  evidence:
    - {work: "chollet-2019-measure-of-intelligence", role: original, locator: "p. 27", stance: for}

- id: c-def-legg
  type: attributive
  text: "Legg and Hutter adopt the informal definition that intelligence measures an agent's ability to achieve goals in a wide range of environments."
  evidence:
    - {work: "legg-2007-collection-definitions-intelligence", role: original, locator: "p. 9", stance: for}

- id: c-def-collection
  type: attributive
  text: "Legg and Hutter present a collection of 70-odd informal definitions of intelligence, which they call the largest and most well referenced collection they know of."
  evidence:
    - {work: "legg-2007-collection-definitions-intelligence", role: original, locator: "the abstract", stance: for}

- id: c-def-openai
  type: attributive
  text: "Morris et al. report that the OpenAI charter defines AGI as highly autonomous systems that outperform humans at most economically valuable work."
  evidence:
    - {work: "morris-2024-levels-of-agi", role: original, locator: "Section 2", stance: for}

- id: c-def-marcus
  type: attributive
  text: "Morris et al. quote Marcus's description of AGI as any intelligence that is flexible and general, with resourcefulness and reliability comparable to or beyond human intelligence."
  evidence:
    - {work: "morris-2024-levels-of-agi", role: original, locator: "Section 2", stance: for}

- id: c-def-levels
  type: attributive
  text: "Morris et al. propose levels of AGI by performance and generality, in which a Competent AGI performs at least at the 50th percentile of skilled adult humans on most cognitive tasks."
  evidence:
    - {work: "morris-2024-levels-of-agi", role: original, locator: "Section 3", stance: for}

- id: c-def-emerging
  type: attributive
  text: "Morris et al. posit that, as of September 2023, frontier language models such as ChatGPT, Bard and Llama 2 would be considered Level 1 general AI, which they call Emerging AGI."
  evidence:
    - {work: "morris-2024-levels-of-agi", role: original, locator: "Section 3", stance: for}

# Why it matters

- id: c-why-morris
  type: attributive
  text: "Morris et al. argue that the concept of AGI is important because it maps onto goals for, predictions about, and risks of AI."
  evidence:
    - {work: "morris-2024-levels-of-agi", role: original, locator: "p. 1", stance: for}

- id: c-why-villalobos
  type: attributive
  text: "Villalobos et al. study how progress in language modeling can continue when human-generated text datasets cannot be scaled any further."
  evidence:
    - {work: "villalobos-2024-run-out-of-data", role: original, locator: "the abstract", stance: for}

# Position: scaling current methods is the main route

- id: c-gwern-hypothesis
  type: attributive
  text: "Branwen states the scaling hypothesis as the view that intelligence is simple neural units and learning algorithms applied to diverse experiences at a currently unreachable scale."
  evidence:
    - {work: "gwern-2020-scaling-hypothesis", role: original, locator: "p. 1", stance: for}

- id: c-gwern-more
  type: attributive
  text: "Branwen writes that, on the scaling hypothesis, as increasing computational resources permit running such algorithms at the necessary scale, neural networks will get ever more intelligent."
  evidence:
    - {work: "gwern-2020-scaling-hypothesis", role: original, locator: "p. 1", stance: for}

- id: c-gwern-blessings
  type: attributive
  text: "Branwen reads the meta-learning of GPT-3 as a demonstration of the blessings of scale, in which simple neural networks become more generalizable and more human-like when made very large and trained on very large datasets with very large compute."
  evidence:
    - {work: "gwern-2020-scaling-hypothesis", role: original, locator: "p. 1", stance: for}

- id: c-sutton-lesson
  type: attributive
  text: "Sutton writes that the biggest lesson that can be read from 70 years of AI research is that general methods that leverage computation are ultimately the most effective, by a large margin."
  evidence:
    - {work: "sutton-2019-bitter-lesson", role: original, locator: "p. 1", stance: for}

- id: c-sutton-search-learning
  type: attributive
  text: "Sutton names search and learning as the two methods that seem to scale arbitrarily with increased computation."
  evidence:
    - {work: "sutton-2019-bitter-lesson", role: original, locator: "p. 1", stance: for}

- id: c-sutton-chess
  type: attributive
  text: "Sutton cites computer chess, where the methods that defeated the world champion Kasparov in 1997 were based on massive, deep search, and computer Go, where efforts to avoid search proved irrelevant once search was applied effectively at scale."
  evidence:
    - {work: "sutton-2019-bitter-lesson", role: original, locator: "p. 1", stance: for}

- id: c-sutton-meta
  type: attributive
  text: "Sutton argues that the contents of minds are irredeemably complex, so researchers should build in only the meta-methods that can find and capture this complexity."
  evidence:
    - {work: "sutton-2019-bitter-lesson", role: original, locator: "p. 1", stance: for}

- id: c-noema-already
  type: attributive
  text: "Agüera y Arcas and Norvig argue that the most important parts of artificial general intelligence have already been achieved by the current generation of advanced large language models."
  evidence:
    - {work: "aguera-y-arcas-2023-agi-already-here", role: original, locator: "p. 1", stance: for}

- id: c-noema-novel
  type: attributive
  text: "Agüera y Arcas and Norvig write that frontier models perform competently even on novel tasks they were not trained for."
  evidence:
    - {work: "aguera-y-arcas-2023-agi-already-here", role: original, locator: "p. 1", stance: for}

- id: c-bubeck-agi
  type: attributive
  text: "Bubeck et al. argue that GPT-4, trained using an unprecedented scale of compute and data, could reasonably be viewed as an early, yet still incomplete, version of an AGI system."
  evidence:
    - {work: "bubeck-2023-sparks-agi", role: original, locator: "the abstract", stance: for}

- id: c-bubeck-paradigm
  type: attributive
  text: "Bubeck et al. also discuss the possible need for pursuing a new paradigm that moves beyond next-word prediction."
  evidence:
    - {work: "bubeck-2023-sparks-agi", role: original, locator: "the abstract", stance: for}

- id: c-brown-fewshot
  type: empirical
  text: "Scaling up language models greatly improves task-agnostic, few-shot performance, sometimes reaching competitiveness with prior fine-tuning approaches, for GPT-3, an autoregressive language model with 175 billion parameters."
  scope:
    models: "GPT-3 and smaller models of the same family"
    data: [unknown]
    scale: "up to 175 billion parameters"
    setting: "few-shot learning from demonstrations given as text, without gradient updates"
  evidence:
    - {work: "brown-2020-language-models-few-shot", role: original, locator: "the abstract", stance: for}

- id: c-emergent-def
  type: attributive
  text: "Wei et al. consider an ability to be emergent if it is not present in smaller models but is present in larger models, so that it cannot be predicted by extrapolating the performance of smaller models."
  evidence:
    - {work: "wei-2022-emergent-abilities", role: original, locator: "the abstract", stance: for}

- id: c-wei-question
  type: attributive
  text: "Wei et al. write that emergence raises the question of whether further scaling could potentially endow even larger language models with new emergent abilities."
  evidence:
    - {work: "wei-2022-emergent-abilities", role: original, locator: "p. 6", stance: for}

- id: c-wei-beyond
  type: attributive
  text: "Wei et al. also write that new architectures, higher-quality data or improved training procedures may unlock abilities in smaller models, and that other approaches beyond scaling will likely play a key role."
  evidence:
    - {work: "wei-2022-emergent-abilities", role: original, locator: "Section 5.2, p. 10", stance: for}

- id: c-altmeyer
  type: attributive
  text: "Altmeyer et al. argue and empirically demonstrate that the finding of meaningful patterns in the latent spaces of models cannot be seen as evidence in favor of AGI."
  evidence:
    - {work: "altmeyer-2024-stop-unscientific-agi-claims", role: original, locator: "the abstract", stance: for}

- id: c-mitchell-fallacy
  type: attributive
  text: "Mitchell names as a first fallacy the assumption that narrow intelligence is on a continuum with general intelligence, under which advances on a specific AI task are described as a first step towards more general AI."
  evidence:
    - {work: "mitchell-2021-why-ai-harder", role: original, locator: "pp. 3 to 4", stance: for}

- id: c-chollet-buy
  type: attributive
  text: "Chollet argues that unlimited priors or unlimited training data allow experimenters to buy arbitrary levels of skill for a system, in a way that masks the system's own generalization power."
  evidence:
    - {work: "chollet-2019-measure-of-intelligence", role: original, locator: "the abstract", stance: for}

- id: c-chollet-moredata
  type: attributive
  text: "Chollet argues that adding more training data can augment skill in a specific vertical or task without affecting generalization whatsoever."
  evidence:
    - {work: "chollet-2019-measure-of-intelligence", role: original, locator: "p. 19", stance: for}

- id: c-mirage
  type: empirical
  text: "For a fixed task and model family, nonlinear or discontinuous metrics produce apparent emergent abilities, whereas linear or continuous metrics produce smooth, continuous, predictable changes in model performance."
  scope:
    models: "the InstructGPT/GPT-3 family and multiple vision networks"
    data: [big-bench]
    scale: "unknown"
    setting: "analysis of fixed model outputs under different metrics"
  evidence:
    - {work: "schaeffer-2023-emergent-abilities-mirage", role: original, locator: "the abstract", stance: for}

# Position: scaling together with other methods

- id: c-silver-imitation
  type: attributive
  text: "Silver and Sutton argue that imitating humans is enough to reproduce many human capabilities to a competent level, but that this approach in isolation has not and likely cannot achieve superhuman intelligence across many important topics and tasks."
  evidence:
    - {work: "silver-2025-era-of-experience", role: original, locator: "p. 1", stance: for}

- id: c-silver-limit
  type: attributive
  text: "Silver and Sutton write that in key domains such as mathematics, coding and science, the knowledge extracted from human data is rapidly approaching a limit."
  evidence:
    - {work: "silver-2025-era-of-experience", role: original, locator: "p. 1", stance: for}

- id: c-silver-experience
  type: attributive
  text: "Silver and Sutton argue that agents should learn continually from their own experience, data generated by the agent interacting with its environment, and that experience will become the dominant medium of improvement."
  evidence:
    - {work: "silver-2025-era-of-experience", role: original, locator: "p. 1", stance: for}

- id: c-snell-motivation
  type: attributive
  text: "Snell et al. describe enabling LLMs to improve their outputs by using more test-time computation as a critical step towards building generally self-improving agents."
  evidence:
    - {work: "snell-2024-scaling-test-time-compute", role: original, locator: "the abstract", stance: for}

- id: c-snell-4x
  type: empirical
  text: "A compute-optimal strategy that allocates test-time compute adaptively per prompt improves the efficiency of test-time compute scaling by more than 4x compared with a best-of-N baseline."
  scope:
    models: "PaLM 2-S* (Codey) base model"
    data: [math]
    scale: "one model; test-time compute budgets varied"
    setting: "search against process-based verifier reward models and sequential revisions on MATH"
  evidence:
    - {work: "snell-2024-scaling-test-time-compute", role: original, locator: "the abstract, Section 4", stance: for}

- id: c-snell-14x
  type: empirical
  text: "In a FLOPs-matched evaluation, on problems where a smaller base model attains somewhat non-trivial success rates, test-time compute can be used to outperform a 14x larger model."
  scope:
    models: "PaLM 2-S* (Codey) base model, against a model with about 14 times more parameters"
    data: [math]
    scale: "FLOPs-matched comparison of pretraining and test-time compute"
    setting: "MATH benchmark, compute-optimal test-time scaling"
  evidence:
    - {work: "snell-2024-scaling-test-time-compute", role: original, locator: "the abstract, Section 4", stance: for}

- id: c-snell-hard
  type: empirical
  text: "Test-time and pretraining compute are not 1-to-1 exchangeable: on challenging questions outside a base model's capabilities, or under higher inference requirement, pretraining is likely more effective for improving performance."
  scope:
    models: "PaLM 2-S* (Codey) base model"
    data: [math]
    scale: "FLOPs-matched comparison of pretraining and test-time compute"
    setting: "MATH benchmark, questions binned by difficulty"
  evidence:
    - {work: "snell-2024-scaling-test-time-compute", role: original, locator: "Section 7", stance: for}

- id: c-r1-rl
  type: empirical
  text: "The reasoning abilities of LLMs can be incentivized through pure reinforcement learning, without human-labeled reasoning trajectories, and the trained model surpasses counterparts trained by supervised learning on human demonstrations on verifiable tasks such as mathematics and coding competitions."
  scope:
    models: "DeepSeek-R1-Zero and DeepSeek-R1, built on DeepSeek-V3-Base"
    data: [unknown]
    scale: "unknown"
    setting: "reinforcement learning with rewards from verifiable answers"
  self_reported: true
  evidence:
    - {work: "deepseek-2025-r1", role: original, locator: "the abstract", stance: for}

- id: c-r1-aime
  type: empirical
  text: "During reinforcement learning, the average pass@1 score of DeepSeek-R1-Zero on AIME 2024 rose from an initial 15.6% to 77.9%."
  scope:
    models: "DeepSeek-R1-Zero, built on DeepSeek-V3-Base"
    data: [aime-2024]
    scale: "unknown"
    setting: "reinforcement learning with a reward based only on the correctness of final answers"
