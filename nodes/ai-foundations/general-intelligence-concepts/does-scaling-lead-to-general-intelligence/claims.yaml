    data: [arc-agi-2, arc-agi-1]
    scale: "unknown"
    setting: "Semi-Private Evaluation sets, as of May 14, 2025"
  evidence:
    - {work: "chollet-2025-arc-agi-2", role: original, locator: "Section 6", stance: for}

- id: c-arc2-noise
  type: attributive
  text: "The ARC-AGI-2 authors write that accuracies below 5% are generally not treated as meaningful, as they likely result from noise-level heuristics or incidental pattern fits."
  evidence:
    - {work: "chollet-2025-arc-agi-2", role: original, locator: "Section 6", stance: for}

# Position: scaling is not enough

- id: c-lecun-position
  type: attributive
  text: "LeCun describes a debate on whether human-level AI can be attained by scaling up large language model architectures, and states that he does not believe that scaling is enough, for two main reasons."
  evidence:
    - {work: "lecun-2022-path-autonomous-machine-intelligence", role: original, locator: "Section 8.3.1", stance: for}

- id: c-lecun-tokens
  type: attributive
  text: "LeCun's first reason is that current models operate on tokenized data and are generative, which works well for text but is less suitable for continuous, high dimensional signals such as video."
  evidence:
    - {work: "lecun-2022-path-autonomous-machine-intelligence", role: original, locator: "Section 8.3.1", stance: for}

- id: c-lecun-reasoning
  type: attributive
  text: "LeCun's second reason is that current models are only capable of very limited forms of reasoning."
  evidence:
    - {work: "lecun-2022-path-autonomous-machine-intelligence", role: original, locator: "Section 8.3.1", stance: for}

- id: c-lecun-arch
  type: attributive
  text: "LeCun proposes an architecture for autonomous intelligent agents that combines a configurable predictive world model, behavior driven through intrinsic motivation, and hierarchical joint embedding architectures trained with self-supervised learning."
  evidence:
    - {work: "lecun-2022-path-autonomous-machine-intelligence", role: original, locator: "the abstract", stance: for}

- id: c-marcus-2018
  type: attributive
  text: "Marcus presents ten concerns for deep learning and argues that deep learning must be supplemented by other techniques if we are to reach artificial general intelligence."
  evidence:
    - {work: "marcus-2018-deep-learning-critical-appraisal", role: original, locator: "the abstract", stance: for}

- id: c-marcus-data
  type: attributive
  text: "Among his concerns, Marcus argues that deep learning thus far is data hungry, and that it is shallow and has limited capacity for transfer."
  evidence:
    - {work: "marcus-2018-deep-learning-critical-appraisal", role: original, locator: "pp. 6 to 7", stance: for}

- id: c-marcus-2020
  type: attributive
  text: "Marcus contrasts an emphasis on general-purpose learning, ever-larger training sets and more compute with his proposal of a hybrid, knowledge-driven, reasoning-based approach centered around cognitive models."
  evidence:
    - {work: "marcus-2020-next-decade-ai", role: original, locator: "the abstract", stance: for}

- id: c-chollet-local
  type: attributive
  text: "Chollet argues that solving any given task by leveraging unlimited priors or unlimited data does not bring us any closer to broad AI or general AI, and describes deep learning models as local-generalization systems."
  evidence:
    - {work: "chollet-2019-measure-of-intelligence", role: original, locator: "p. 20", stance: for}

- id: c-lake-2017
  type: attributive
  text: "Lake et al. argue that human-like learning and thinking machines should build causal models of the world, ground learning in intuitive theories of physics and psychology, and harness compositionality and learning-to-learn."
  evidence:
    - {work: "lake-2017-building-machines-learn-think", role: original, locator: "the abstract", stance: for}

- id: c-arc-scaling-era
  type: attributive
  text: "Chollet et al. write that from 2020 to early 2024 AI research was dominated by the scaling up of deep learning systems, which increased task-specific skills but did not improve the ability to tackle tasks without training data available at training time."
  evidence:
    - {work: "chollet-2024-arc-prize-2024-report", role: original, locator: "Section 1.2", stance: for}

- id: c-arc-new-ideas
  type: attributive
  text: "The ARC Prize report concludes that ARC-AGI remains undefeated and that new ideas are still needed to build AGI."
  evidence:
    - {work: "chollet-2024-arc-prize-2024-report", role: original, locator: "Section 5", stance: for}

- id: c-villalobos
  type: forecast
  text: "Villalobos et al. forecast that, if current LLM development trends continue, models will be trained on datasets roughly equal in size to the available stock of public human text data between 2026 and 2032, or slightly earlier if models are overtrained."
  as_of: 2024-06-04
  evidence:
    - {work: "villalobos-2024-run-out-of-data", role: original, locator: "the abstract", stance: for}

- id: c-villalobos-stock
  type: forecast
  text: "Villalobos et al. put the median year of full use of the stock at 2028, when models would be trained on dataset sizes approaching the total effective stock of text in the indexed web, around 4e14 tokens."
  as_of: 2024-06-04
  evidence:
    - {work: "villalobos-2024-run-out-of-data", role: original, locator: "Fig. 1", stance: for}

- id: c-villalobos-escape
  type: attributive
  text: "Villalobos et al. argue that synthetic data generation, transfer learning from data-rich domains and data efficiency improvements might support further progress."
  evidence:
    - {work: "villalobos-2024-run-out-of-data", role: original, locator: "the abstract", stance: for}

