  evidence:
    - {work: "deepseek-2025-r1", role: original, locator: "Section 1, Section 2.3", stance: for}

- id: c-r1-limit
  type: attributive
  text: "DeepSeek-AI write that for complex tasks that cannot be effectively evaluated by a reliable reward model, scaling up pure RL methods remains an open challenge."
  evidence:
    - {work: "deepseek-2025-r1", role: original, locator: "Section 6", stance: for}

- id: c-arc-2024-score
  type: empirical
  text: "During ARC Prize 2024, the top score on the ARC-AGI private evaluation set increased from 33% to 55.5%, with techniques that include deep learning-guided program synthesis and test-time training."
  scope:
    models: "entries to the ARC Prize 2024 competition"
    data: [arc-agi-1]
    scale: "unknown"
    setting: "ARC-AGI-1 private evaluation set, Kaggle competition of 2024"
  evidence:
    - {work: "chollet-2024-arc-prize-2024-report", role: original, locator: "the abstract", stance: for}

- id: c-arc-greenblatt
  type: empirical
  text: "Ryan Greenblatt reached 42% on the ARC-AGI-Pub leaderboard with an LLM-guided program synthesis approach in which GPT-4o searches thousands of Python programs per task."
  scope:
    models: "GPT-4o inside a program search"
    data: [arc-agi-1]
    scale: "thousands of programs per task"
    setting: "ARC-AGI-Pub leaderboard, 2024"
  evidence:
    - {work: "chollet-2024-arc-prize-2024-report", role: original, locator: "Section 3", stance: for}

- id: c-arc-ttt
  type: definitional
  text: "In the test-time training of ARC Prize 2024 entries, an LLM is fine-tuned on a given ARC-AGI task specification to recombine its prior knowledge into a new model adapted to the task at hand."
  evidence:
    - {work: "chollet-2024-arc-prize-2024-report", role: original, locator: "Section 3", stance: for}

- id: c-kambhampati-obfuscation
  type: empirical
  text: "GPT4 reached 30% empirical accuracy on generated plans in the Blocks World domain, and its performance fell precipitously when the names of the actions and objects in the planning problems were obfuscated."
  scope:
    models: "GPT-3, GPT-3.5 and GPT-4"
    data: [blocks-world]
    scale: "unknown"
    setting: "plan generation for classical planning problems"
  evidence:
    - {work: "kambhampati-2024-llms-reason-plan", role: original, locator: "p. 2", stance: for}

- id: c-kambhampati-modulo
  type: attributive
  text: "Kambhampati argues that LLMs generate potential answers that still need to be checked by external verifiers, and advocates LLM-Modulo frameworks that pair them with sound external verifiers."
  evidence:
    - {work: "kambhampati-2024-llms-reason-plan", role: original, locator: "pp. 2 to 3", stance: for}

- id: c-arc2-scores
  type: empirical
  text: "On the ARC-AGI-2 Semi-Private Evaluation set, as of May 14, 2025, the top performing models listed score at most 3.0%, as o3 (Medium) does, against 53.0% for the same model on ARC-AGI-1."
  scope:
