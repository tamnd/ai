# The claims of the BLEU page (spec 07). The build computes the labels.
- id: c-score-range
  type: mathematical
  text: "Corpus BLEU is between 0 and 1 (0 and 100 in sacreBLEU), and it is 1 only when every clipped n-gram count equals its total and the hypotheses are at least as long as the effective reference length."
  assumes: ["the modified precisions p_1 to p_K are pooled over the test set", "uniform weights 1/K", "the brevity penalty of eq-brevity-penalty"]
  derivation: "derivations/brevity-penalty.md"
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "Section 3, the range of the metric", stance: for}

- id: c-bp-range
  type: mathematical
  text: "For a test set with c > 0 hypothesis tokens, the brevity penalty is in (0, 1], it is 1 exactly when c >= r, it is continuous at c = r, and it tends to 0 as c tends to 0 with r fixed."
  assumes: ["c > 0 for the range and the limit", "r > 0 is the effective reference length", "BP = 1 if c >= r and exp(1 - r/c) otherwise"]
  derivation: "derivations/brevity-penalty.md"
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "Sections 2.2.2 and 2.3", stance: for}

- id: c-zero-precision
  type: mathematical
  text: "Without smoothing, BLEU is 0 when any modified precision p_n with n <= K is 0, whatever the other precisions are."
  assumes: ["no smoothing", "BLEU is the geometric mean of p_1 to p_K times BP"]
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "Section 2.1.3 and footnote 5", stance: for}

- id: c-clipping-example
  type: mathematical
  text: "The candidate 'the the the the the the the' against the references 'The cat is on the mat.' and 'There is a cat on the mat.' has the standard unigram precision 7/7 and the modified unigram precision 2/7."
  assumes: ["case folding", "the clip is the largest count of the word in any one reference"]
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "Section 2.1, Example 2", stance: for}

- id: c-more-references
  type: empirical
  text: "BLEU scores computed against more references are higher than scores of the same output against fewer references."
  scope:
    models: "a human translator (Papineni et al.) and the WMT17 English to Finnish system online-B (Post)"
    data: [papineni-2002-chinese-english-test, wmt17-newstest2017-en-fi]
    scale: "unknown"
    setting: "corpus BLEU with four against two references (Papineni et al.) and two against one reference (Post)"
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "Section 3: 0.3468 against four references, 0.2571 against two", stance: for}
    - {work: "post-2018-call-for-clarity-wmt", role: original, locator: "Section 2.1: online-B, 22.04 with one reference and 25.25 with two", stance: for}

- id: c-tokenization-changes
  type: empirical
  text: "Changing the tokenization of the references alone changed BLEU by up to 1.8 points, and by about 1 point on average, on WMT17 systems."
  scope:
    models: "WMT17 submissions"
    data: [wmt17-newstest2017]
    scale: "the language pairs of Table 1 of Post (2018)"
    setting: "the same system output, scored against references under different user-supplied tokenizations"
  evidence:
    - {work: "post-2018-call-for-clarity-wmt", role: original, locator: "Section 2.2 and Table 1", stance: for}

- id: c-small-differences
  type: empirical
  text: "BLEU differences of 1 to 2 points between two systems agree with the human judgement of which system is better only about half of the time."
  scope:
    models: "the systems submitted to the WMT19 news translation task"
    data: [wmt19-newstest2019]
    scale: "unknown"
    setting: "pairs of systems compared by BLEU difference and by direct assessment"
  evidence:
    - {work: "mathur-2020-tangled-up-in-bleu-acl", role: original, locator: "Sections 5 and 6", stance: for}

- id: c-permutations
  type: mathematical
  text: "Some hypothesis translations have more than 10^73 permutations of their n-grams that receive the same BLEU."
  assumes: ["the pieces of a hypothesis between its bigram mismatch sites are permuted", "the hypotheses of the second best system by BLEU in the 2005 NIST MT evaluation"]
  evidence:
    - {work: "callison-burch-2006-re-evaluating-bleu-eacl", role: original, locator: "Section 3.1", stance: for}

- id: c-nist-2005-rank
  type: empirical
  text: "In the 2005 NIST Arabic to English evaluation, the entry ranked first by human judges was ranked sixth by BLEU."
  scope:
    models: "the entries of the 2005 NIST MT evaluation, Arabic to English"
    data: [nist-mt05-arabic-english]
    scale: "unknown"
    setting: "human adequacy and fluency judgements against corpus BLEU"
  evidence:
    - {work: "callison-burch-2006-re-evaluating-bleu-eacl", role: original, locator: "Section 4", stance: for}

- id: c-reiter-review
  type: attributive
  text: "Reiter (2018) reviewed 284 correlations from 34 papers and concluded that BLEU is supported for the diagnostic evaluation of machine translation systems, but not for evaluating individual texts, for tasks other than machine translation, or for testing scientific hypotheses."
  evidence:
    - {work: "reiter-2018-structured-review-bleu-cl", role: original, locator: "the abstract and Section 5", stance: for}

- id: c-pairwise-accuracy
  type: empirical
  text: "Over 3,344 pairs of systems, BLEU ordered the pair as human judges did 74.6 percent of the time, chrF 75.6 percent and COMET 83.4 percent."
  scope:
    models: "the production and research translation systems of the study"
    data: [kocmi-2021-human-judgements]
    scale: "3,344 system pairs over 101 languages"
    setting: "pairwise accuracy against human judgements"
  evidence:
    - {work: "kocmi-2021-ship-or-not-wmt", role: original, locator: "Table 2 and Section 5.1", stance: for}

- id: c-wmt22-stop
  type: attributive
  text: "The WMT22 metrics shared task recommended that the field stop using BLEU, because neural metrics were better and more robust."
  evidence:
    - {work: "freitag-2022-wmt22-metrics-wmt", role: original, locator: "the title and Section 9", stance: for}

- id: c-smoothing-methods
  type: attributive
  text: "Chen and Cherry (2014) compared seven smoothing methods for sentence-level BLEU, including the epsilon of method 1, the add-one of Lin and Och (2004) as method 2 and the geometric sequence of NIST mteval-v13a as method 3."
  evidence:
    - {work: "chen-2014-smoothing-sentence-bleu-wmt", role: original, locator: "Section 2.2", stance: for}

- id: c-introduced-2002
  type: historical
  text: "Papineni, Roukos, Ward and Zhu of IBM introduced BLEU in IBM Research Report RC22176 (2001) and published it at ACL 2002."
  evidence:
    - {work: "papineni-2002-bleu-acl", role: original, locator: "the title page and Section 1", stance: for}
    - {work: "lin-2004-orange-coling", role: original, locator: "the references, Papineni et al. 2001", stance: for}

- id: c-sacrebleu-2018
  type: historical
  text: "Post (2018) released sacreBLEU, which computes BLEU on detokenized text with its own tokenizer and reports a signature of the options."
  evidence:
    - {work: "post-2018-call-for-clarity-wmt", role: original, locator: "Section 3", stance: for}
