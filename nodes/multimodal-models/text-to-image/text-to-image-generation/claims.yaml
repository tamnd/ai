# Derivation

- id: c-d-tokens
  type: mathematical
  text: "A 256 × 256 RGB image has 196,608 values; a 32 × 32 grid of 1,024 tokens cuts the image context by 196,608 / 1,024 = 192, and with up to 256 caption tokens a DALL-E sequence has at most 1,280 tokens."
  assumes: ["one token per grid cell", "the caption is padded to 256 tokens"]
  derivation: text-to-image-arithmetic

- id: c-d-bits
  type: mathematical
  text: "A grid of 1,024 tokens over 8,192 codes holds at most 13,312 bits, against 1,572,864 bits for the 8-bit 256 × 256 RGB image."
  assumes: ["8 bits per colour value", "log2 8192 = 13"]
  derivation: text-to-image-arithmetic

- id: c-d-cfg
  type: mathematical
  text: "Parti's G(z) + λ(G(z,c) − G(z)) equals Imagen's wε_c + (1 − w)ε_u with w = λ, and because the x-prediction (z − σε)/α is affine in ε and the weights sum to 1, guided noise gives the guided x-prediction w x̂_c + (1 − w) x̂_u."
  assumes: ["α and σ do not depend on the condition"]
  derivation: text-to-image-arithmetic

- id: c-d-implicit
  type: mathematical
  text: "Guidance on logits l_u + λ(l_c − l_u) samples in proportion to p(x | c) · p(c | x)^(λ − 1), the conditional model reweighted by an implicit classifier."
  assumes: ["p_c and p_u are the softmaxes of l_c and l_u", "Bayes' rule p(x|c)/p(x) = p(c|x)/p(c)"]
  derivation: text-to-image-arithmetic

- id: c-d-range
  type: mathematical
  text: "If both x-predictions lie in [−1, 1], the guided x-prediction lies in [−(2w − 1), 2w − 1] for w ≥ 1, and the bound is reached when they disagree in sign; at w = 8 a pixel with x̂_c = 0.9 and x̂_u = 0 becomes 7.2."
  assumes: ["w ≥ 1"]
  derivation: text-to-image-arithmetic

- id: c-d-toy
  type: mathematical
  text: "In the numpy model with Gaussian images and exact denoisers, at t = 0.5 static thresholding pins 54% of 4,096 pixels at ±1 for w = 4 and 76% for w = 8, while dynamic thresholding at p = 99.5 pins 0.5% at both."
  assumes: ["the data, seed and schedule of the check file"]
  derivation: text-to-image-arithmetic

- id: c-d-pool
  type: mathematical
  text: "A generator that sees only the mean of the caption's word embeddings gives a caption and its attribute-swapped twin the same distribution, so it is right on at most half of such pairs; with 4 cells and 6 colours the ceiling is 7/72 ≈ 0.097."
  assumes: ["targets are uniform over the 1,296 images", "every caption names each position once"]
  derivation: text-to-image-arithmetic

- id: c-d-bestn
  type: mathematical
  text: "Best-of-N with a perfect scorer is right with probability 1 − (1 − p)^N; doubling N gains most near N = ln 2 / (−ln(1 − p)), about 6.6 for p = 0.1, and from N = 32 to 512 adds under 3.5 points at p = 0.1."
  assumes: ["samples are independent", "the scorer always finds a correct sample when there is one"]
  derivation: text-to-image-arithmetic

- id: c-d-pca
  type: mathematical
  text: "Keeping 319 of 1,024 principal components shortens the AR prior's sequence by 1,024 / 319 = 3.21."
  assumes: ["one token per kept component"]
  derivation: text-to-image-arithmetic

- id: c-d-budget
  type: mathematical
  text: "Batch 2,048 for 2.5M steps is 5.12 billion examples per Imagen model, about 6.0 passes over 860M pairs; DALL-E's batch 1,024 for 430,000 updates is 440.32M examples, about 1.76 passes over 250M pairs."
  assumes: ["pairs are sampled uniformly"]
  derivation: text-to-image-arithmetic

- id: c-d-powersgd
  type: mathematical
  text: "PowerSGD's compression rate 1 − 5r/(8 d_model) is 83.3%, 85.1% and 85.9% for (r, d_model) = (512, 1,920), (640, 2,688) and (896, 3,968)."
  assumes: ["the rate formula DALL-E gives"]
  derivation: text-to-image-arithmetic
