- id: c-pa-p2
  type: attributive
  text: "PartiPrompts is a set of over 1600 English prompts, each associated with one of 12 categories and one of 11 challenge aspects."
  evidence:
    - {work: "yu-2022-scaling-autoregressive-models-content-rich", role: original, locator: "pp. 4 and 12", stance: for}

- id: c-cb-set
  type: attributive
  text: "T2I-CompBench consists of 6,000 compositional text prompts from 3 categories, attribute binding, object relationships and complex compositions, and 6 sub-categories."
  evidence:
