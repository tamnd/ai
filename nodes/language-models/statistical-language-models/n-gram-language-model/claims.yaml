# The claims of the n-gram language model page (spec 07). The build computes the labels.
- id: c-brown-lm
  type: definitional
  text: "Brown et al. write the probability of a string as the product Pr(w1) Pr(w2 | w1) ... Pr(wk | w1 ... wk−1), call w1 ... wk−1 the history and wk the prediction, and call a computational mechanism for obtaining these conditional probabilities a language model."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 2", stance: for}

- id: c-brown-ngram
  type: definitional
  text: "In an n-gram language model, two histories are treated as equivalent if they end in the same n − 1 words."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 3", stance: for}

- id: c-brown-perplexity
  type: definitional
  text: "The perplexity of a language model with respect to a sample of text is the reciprocal of the geometric average of the probabilities of the predictions in the sample."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 3", stance: for}

- id: c-brown-parameters
  type: attributive
  text: "Brown et al. count V^n − 1 independent parameters for an n-gram model over a vocabulary of V words, and note that the IBM Tangora speech recognition system, with a vocabulary of about 20,000 words, employs a 3-gram language model with over eight trillion parameters."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 3", stance: for}

- id: c-brown-sequential-ml
  type: definitional
  text: "Brown et al. call estimating each order-n parameter by the relative frequency of the n-gram among the n-grams with the same history sequential maximum likelihood estimation."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 3", stance: for}

- id: c-brown-sparsity
  type: empirical
  text: "In 365,893,263 words of running text, of the 1.773 × 10^16 possible 3-grams only 75,349,888 occurred and 53,737,350 of these occurred only once; from Turing's formula, Brown et al. expect maximum likelihood estimates to be 0 for 14.7 percent of the 3-grams and for 2.2 percent of the 2-grams in a new sample of English text."
  scope:
    models: "maximum likelihood 2-gram and 3-gram estimates"
    data: ["IBM English training text"]
    scale: "365,893,263 words, vocabulary 260,741"
    setting: "counts of n-gram types by frequency (Table 1)"
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 4", stance: for}

- id: c-brown-interpolated
  type: attributive
  text: "Brown et al. combine the estimates of 1-, 2- and 3-gram models by the interpolated estimation of Jelinek and Mercer (1980), choosing the weights with the help of the EM algorithm to maximize the probability of held-out data; they divide the weights into 1,782 sets according to the 2-gram counts and estimate them from a held-out sample of 4,630,934 words."
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 4", stance: for}

- id: c-brown-244
  type: empirical
  text: "The Brown corpus, which contains 1,014,312 words and is not included in the training or held-out data, has a perplexity of 244 with respect to the interpolated 3-gram model of Brown et al."
  scope:
    models: "interpolated 3-gram model"
    data: ["Brown corpus"]
    scale: "trained on 365,893,263 words"
    setting: "test-set perplexity"
  evidence:
    - {work: "brown-1992-class-based-n-gram-models", role: original, locator: "p. 4", stance: for}

- id: c-chen-ml-poor
  type: attributive
  text: "Chen and Goodman note that the maximum likelihood estimate is a poor one when the amount of training data is small compared to the size of the model, which is generally the case in language modeling, and that Gale and Church argued additive smoothing generally performs poorly."
  evidence:
    - {work: "chen-1996-empirical-study-smoothing", role: original, locator: "p. 2", stance: for}

- id: c-chen-comparison
  type: empirical
  text: "In an extensive empirical comparison of smoothing techniques measured by the cross-entropy of test data, additive smoothing performs poorly and the methods katz and interp-held-out consistently perform well, while performance varies widely with respect to training set size and n-gram order."
  scope:
    models: "bigram and trigram models with additive, Katz, Church-Gale, Jelinek-Mercer and new smoothing methods"
    data: ["Brown corpus", "Wall Street Journal"]
    scale: "many training data sizes"
    setting: "test-set cross-entropy"
  evidence:
    - {work: "chen-1996-empirical-study-smoothing", role: original, locator: "p. 1", stance: for}
    - {work: "chen-1996-empirical-study-smoothing", role: original, locator: "p. 5", stance: for}

- id: c-goodman-continuation
  type: definitional
  text: "Kneser-Ney smoothing uses a modified backoff distribution based on the number of contexts each word occurs in, rather than the number of occurrences of the word; the word Francisco is common but occurs in exceedingly few contexts, so its probability of occurring in a new one is very low."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 8", stance: for}

- id: c-goodman-interpolated
  type: attributive
  text: "Goodman reports that backoff smoothing methods, which use lower order distributions only when the higher order count is missing, do not do well on low counts such as one counts and two counts, while interpolated models always combine both the higher-order and the lower order distribution and typically work better."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 8", stance: for}

- id: c-goodman-modified
  type: attributive
  text: "Modified Kneser-Ney smoothing, proposed by Chen and Goodman, uses multiple discounts, one for one counts, another for two counts, and another for three or more counts, and typically works slightly better than Interpolated Kneser-Ney."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 8", stance: for}

- id: c-goodman-uniform
  type: attributive
  text: "To avoid zero probabilities, Goodman always smooths the unigram distribution of a Kneser-Ney model with the uniform distribution over the vocabulary."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 9", stance: for}

- id: c-goodman-combination
  type: empirical
  text: "Combining language modeling techniques gives up to a 50% perplexity reduction over a Katz smoothed trigram on 100,000 words of training data, which is one bit of entropy; the improvement declines to 41% on 284,000,000 words, and on a similar large set without punctuation the reduction is 38% with an 8.9% word error rate reduction."
  scope:
    models: "a combination of Kneser-Ney smoothing, higher orders, skipping, clustering, caching and sentence mixtures"
    data: ["North American Business news (NAB)"]
    scale: "100,000 to 284,000,000 words of training data"
    setting: "test-set perplexity against a Katz trigram with no count cutoffs"
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 1", stance: for}

- id: c-goodman-plateau
  type: empirical
  text: "Goodman examines n-gram orders up to 20-grams and finds that even for the largest models, performance has plateaued by 5 to 7 grams."
  scope:
    models: "Kneser-Ney smoothed n-gram models"
    data: ["North American Business news (NAB)"]
    scale: "up to 284,000,000 words of training data"
    setting: "test-set perplexity as a function of order"
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 1", stance: for}

- id: c-goodman-entropy
  type: attributive
  text: "Goodman notes that a 10% perplexity reduction, from 100 to 90, corresponds to a reduction from 6.64 bits to 6.49 bits, which is only a 2% entropy reduction."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 51", stance: for}

- id: c-goodman-marginals
  type: attributive
  text: "Goodman proves that any modeling technique that does not preserve known marginal distributions can be improved by preserving those distributions, and cites Chen and Goodman for the result that the smoothing technique that uses absolute discounting, interpolation, and preserves marginals is Interpolated Kneser-Ney smoothing."
  evidence:
    - {work: "goodman-2001-bit-of-progress-language-modeling", role: original, locator: "p. 60", stance: for}

- id: c-heafield-padding
  type: definitional
  text: "In the estimation of Heafield et al., words near the beginning of a sentence form N-grams padded by the marker <s>, possibly repeated multiple times, and the end of sentence marker </s> is appended to each sentence and acts like a normal token."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 2", stance: for}

- id: c-heafield-adjusted
  type: definitional
  text: "Heafield et al. replace the counts c with adjusted counts a: a(w1 ... wn) is c(w1 ... wn) if n = N or w1 = <s>, and otherwise the number of words v with c(v w1 ... wn) > 0."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 3", stance: for}

- id: c-heafield-discounts
  type: definitional
  text: "For each length n, Heafield et al. collect the number t_n,k of n-grams with adjusted count k in [1, 4] and compute closed-form estimates of the discounts D_n(k) = k − (k + 1) t_n,1 t_n,k+1 / ((t_n,1 + 2 t_n,2) t_n,k) for k in [1, 3], with D_n(0) = 0 and D_n(k) = D_n(3) for k ≥ 3."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 3", stance: for}

- id: c-heafield-normalisation
  type: definitional
  text: "Normalization computes the pseudo probability u, the adjusted count a(w1 ... wn) less its discount Dn(a(w1 ... wn)) over the denominator, the sum of a(w1 ... wn−1 x) over x, and the backoff b, whose terms |{x : a(w1 ... wn−1 x) = i}| for i in [1, 3] are collected in the same pass as the denominator."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 3", stance: for}

- id: c-heafield-interpolation
  type: definitional
  text: "The interpolation step computes the final probability p(wn | w1 ... wn−1) = u(wn | w1 ... wn−1) + b(w1 ... wn−1) p(wn | w2 ... wn−1); the recursion terminates when unigrams are interpolated with the uniform distribution, and the unknown word counts as part of the vocabulary with count zero, so its probability is b(ε)/|vocabulary|."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 3", stance: for}

- id: c-heafield-scale
  type: empirical
  text: "Using one machine with 140 GB RAM for 2.8 days, Heafield et al. built an unpruned model on 126 billion tokens, which improved machine translation by 0.8 BLEU point over constrained systems; on 302 million tokens their estimation used 7.7% of the RAM and 14.0% of the wall time of SRILM."
  scope:
    models: "interpolated modified Kneser-Ney 5-gram"
    data: ["ClueWeb09", "WMT 2013 translation tasks"]
    scale: "126 billion tokens"
    setting: "disk-based streaming estimation on one machine"
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 1", stance: for}

- id: c-heafield-mapreduce
  type: attributive
  text: "Heafield et al. report that the MapReduce estimation of Kneser-Ney models by Brants et al. took 400 machines for two days on 31 billion words."
  evidence:
    - {work: "heafield-2013-scalable-modified-kneser-ney", role: original, locator: "p. 1", stance: for}

- id: c-kenlm-probing
  type: empirical
  text: "Compared with the widely-used SRILM, the PROBING data structure of KenLM, which uses linear probing hash tables, is 2.4 times as fast while using 57% of the memory, and the TRIE data structure is a trie with bit-level packing and sorted records."
  scope:
    models: "backoff n-gram language model queries"
    data: ["English Gigaword"]
    scale: "perplexity queries over 4 billion tokens"
    setting: "time and memory of each data structure against SRILM"
  evidence:
    - {work: "heafield-2011-kenlm", role: original, locator: "p. 1", stance: for}

- id: c-brants-scale
  type: empirical
  text: "Brants et al. train language models on up to 2 trillion tokens, resulting in language models having up to 300 billion n-grams, and propose Stupid Backoff, which is inexpensive to train on large data sets and approaches the quality of Kneser-Ney smoothing as the amount of training data increases."
  scope:
    models: "5-gram language models in statistical machine translation"
    data: ["web text", "news"]
    scale: "up to 2 trillion tokens, 300 billion n-grams"
    setting: "MapReduce training and distributed serving"
  evidence:
    - {work: "brants-2007-large-language-models-machine-translation", role: original, locator: "p. 1", stance: for}

- id: c-brants-stupid
  type: definitional
  text: "Stupid Backoff does not generate normalized probabilities: it applies no discounting and directly uses the relative frequency f(h w)/f(h) when the n-gram was seen, and otherwise α times the score of the shorter context, with a single α heuristically set to 0.4; the recursion ends at unigrams with f(w)/N, N being the size of the training corpus."
  evidence:
    - {work: "brants-2007-large-language-models-machine-translation", role: original, locator: "p. 2", stance: for}
    - {work: "brants-2007-large-language-models-machine-translation", role: original, locator: "p. 3", stance: for}

- id: c-brants-coverage
  type: empirical
  text: "The fraction of 5-grams in the test data that are known to the language model grows from 0.06 for 13 million tokens to 0.56 for 2 trillion tokens; perplexities cannot be calculated for language models with Stupid Backoff because their scores are not normalized probabilities."
  scope:
    models: "5-gram language models"
    data: ["NIST Arabic-English MT evaluation set", "target", "ldcnews", "webnews", "web"]
    scale: "13 million to 2 trillion training tokens"
    setting: "5-gram coverage of the test data"
  evidence:
    - {work: "brants-2007-large-language-models-machine-translation", role: original, locator: "p. 8", stance: for}

- id: c-brants-bleu
  type: empirical
  text: "With Kneser-Ney smoothing the BLEU score improves from 0.3559 for 13 million tokens to 0.3832 for 237 million tokens, where Stupid Backoff with α = 0.4 is around 1 BP worse; with more data the gap narrows from 0.85 BP to a not significant 0.24 BP, and a Stupid Backoff model on web data surpasses every Kneser-Ney model, each trained on less data, by at least 0.82 BP."
  scope:
    models: "5-gram language models with Kneser-Ney smoothing and Stupid Backoff in a phrase-based translation system"
    data: ["NIST Arabic-English MT evaluation set", "target", "ldcnews", "webnews", "web"]
    scale: "13 million to 2 trillion training tokens"
    setting: "BLEU of machine translation output"
  evidence:
    - {work: "brants-2007-large-language-models-machine-translation", role: original, locator: "p. 9", stance: for}

- id: c-teh-hpy
  type: attributive
  text: "According to Teh, an approximation to the hierarchical Pitman-Yor language model recovers the exact formulation of interpolated Kneser-Ney, and reports cross entropy results superior to interpolated Kneser-Ney and comparable to modified Kneser-Ney."
  evidence:
    - {work: "teh-2006-hierarchical-pitman-yor-language-model", role: original, locator: "p. 1", stance: for}

- id: c-teh-modified
  type: attributive
  text: "Since the discounts in a hierarchical Pitman-Yor language model are limited to between 0 and 1, Teh concludes that modified Kneser-Ney is not an approximation of the hierarchical Pitman-Yor language model."
  evidence:
    - {work: "teh-2006-hierarchical-pitman-yor-language-model", role: original, locator: "p. 6", stance: for}

- id: c-chelba-baselines
  type: empirical
  text: "In Table 1 of the One Billion Word Benchmark, the Interpolated KN 5-gram with 1.1B n-grams (KN) has 1.76 Num. Params [billions] and perplexity 67.6, the Katz 5-gram with 1.1B n-grams 79.9, and the Recurrent NN-1024 + MaxEnt 9-gram 51.3."
  scope:
    models: "n-gram and neural language models"
    data: ["One Billion Word Benchmark"]
    scale: "about 0.8 billion training words, vocabulary of 793,471 words"
    setting: "test-set perplexity (Table 1)"
  evidence:
    - {work: "chelba-2013-one-billion-word-benchmark", role: original, locator: "p. 2", stance: for}

- id: c-chelba-pruning
  type: empirical
  text: "Pruned to 15M n-grams, the interpolated Kneser-Ney 5-gram has perplexity 243.2 against 127.5 for the Katz 5-gram pruned to 15M n-grams."
  scope:
    models: "entropy-pruned 5-gram language models"
    data: ["One Billion Word Benchmark"]
    scale: "15M n-grams after pruning"
    setting: "test-set perplexity (Table 1)"
  evidence:
    - {work: "chelba-2013-one-billion-word-benchmark", role: original, locator: "p. 2", stance: for}

- id: c-chelba-pruning-rate
  type: attributive
  text: "Chelba et al. note that under pruning Kneser-Ney smoothing degrades much more rapidly than Katz, calling for a discerning choice in a given application."
  evidence:
    - {work: "chelba-2013-one-billion-word-benchmark", role: original, locator: "p. 3", stance: for}

- id: c-chelba-combination
  type: empirical
  text: "The baseline unpruned Kneser-Ney 5-gram model achieves perplexity 67.6, and a combination of techniques leads to 35% reduction in perplexity, or 10% reduction in cross-entropy (bits), over that baseline."
  scope:
    models: "interpolation of n-gram, MaxEnt and recurrent neural network language models"
    data: ["One Billion Word Benchmark"]
    scale: "about 0.8 billion training words"
    setting: "test-set perplexity"
  evidence:
    - {work: "chelba-2013-one-billion-word-benchmark", role: original, locator: "p. 1", stance: for}

- id: c-jozefowicz
  type: empirical
  text: "Large LSTM language models improve the single-model perplexity on the One Billion Word Benchmark from 51.3 down to 30.0, while an ensemble of models improves perplexity from 41.0 down to 23.7."
  scope:
    models: "LSTM language models with character CNN inputs"
    data: ["One Billion Word Benchmark"]
    scale: "about 0.8 billion training words"
    setting: "test-set perplexity"
  evidence:
    - {work: "jozefowicz-2016-exploring-limits-language-modeling", role: original, locator: "p. 1", stance: for}

- id: c-bengio-curse
  type: attributive
  text: "Bengio et al. note the curse of dimensionality in statistical language modeling, and that n-gram approaches obtain generalization by concatenating very short overlapping sequences seen in the training set."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 1", stance: for}

- id: c-bengio-limits
  type: attributive
  text: "Bengio et al. name two weaknesses of n-gram models: they do not take into account contexts farther than 1 or 2 words, and they do not take into account the similarity between words."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 2", stance: for}

- id: c-bengio-result
  type: empirical
  text: "A neural network language model obtains a test perplexity difference of about 24% on Brown and about 8% on AP News against the best of the smoothed n-gram models."
  scope:
    models: "multi-layer perceptron language model against interpolated and Kneser-Ney n-grams"
    data: ["Brown corpus", "AP News"]
    scale: "800,000 training words of Brown and 13,994,528 of AP News"
    setting: "test-set perplexity"
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 12", stance: for}

- id: c-infini-scale
  type: empirical
  text: "Liu et al. train an n-gram language model on 5 trillion tokens, serve infinity-gram probabilities with millisecond-level latency from suffix arrays, and find that the infinity-gram has a next-token prediction accuracy of 47% on human-written text."
  scope:
    models: "infinity-gram"
    data: ["RedPajama", "Pile", "Dolma", "Pile-val"]
    scale: "5 trillion tokens indexed"
    setting: "next-token agreement with human-written text from Pile-val"
  evidence:
    - {work: "liu-2024-infini-gram", role: original, locator: "p. 1", stance: for}

- id: c-infini-definition
  type: definitional
  text: "The infinity-gram backs off only when the denominator is zero, so the effective n is equal to one plus the length of the prompt's longest suffix that appears in the training data; unlike Katz backoff, it is a valid distribution by construction and does not require discounting."
  evidence:
    - {work: "liu-2024-infini-gram", role: original, locator: "p. 3", stance: for}

- id: c-infini-table
  type: attributive
  text: "Liu et al. note that n-gram count tables grow almost exponentially with n, and that the 5-gram count table for a 1.4-trillion-token corpus would consume 28 TB of disk space."
  evidence:
    - {work: "liu-2024-infini-gram", role: original, locator: "p. 3", stance: for}

- id: c-infini-interpolation
  type: empirical
  text: "Heuristically interpolating between the estimates made by the infinity-gram and neural language models can reduce perplexity by up to 73% compared to the neural models alone, even when the neural model is as large as 70B."
  scope:
    models: "infinity-gram interpolated with neural language models up to 70B parameters"
    data: ["Pile"]
    scale: "neural models up to 70B parameters"
    setting: "perplexity of the interpolated model"
  evidence:
    - {work: "liu-2024-infini-gram", role: original, locator: "p. 2", stance: for}

- id: c-infini-effective-n
  type: empirical
  text: "On human-written text, over 90% of tokens have an effective n of at least 5, and the median effective n is 7 (mean 9.1)."
  scope:
    models: "infinity-gram"
    data: ["Pile-train", "Pile-val"]
    scale: "Pile-train as the reference data"
    setting: "effective n of tokens of human-written text"
  evidence:
    - {work: "liu-2024-infini-gram", role: original, locator: "p. 6", stance: for}

- id: c-kn-normalised
  type: mathematical
  text: "With discounts 0 ≤ D(k) ≤ k, interpolated Kneser-Ney gives non-negative probabilities that sum to exactly one over the vocabulary for every context, seen or not, and all are positive when every discount is."
  assumes: ["every n-gram entry of order above 1 has its suffix as an entry", "the recursion ends in the uniform distribution over the vocabulary"]
  derivation: kn-normalisation

- id: c-kn-continuation
  type: mathematical
  text: "For an interpolated bigram with absolute discount 0 < D ≤ 1, the only lower-order distribution that keeps the observed marginal of the predicted word is the share of distinct bigram types that end in each word."
  assumes: ["the marginal is weighted by the context counts of the training data", "one discount for all counts"]
  derivation: kn-continuation

- id: c-gt-leave-one-out
  type: mathematical
  text: "The share n1/N of tokens whose n-gram occurred once equals the share of tokens whose n-gram would be unseen if that token were held out, and for independent draws its expectation exceeds the expected unseen probability mass by at most 1/N."
  assumes: ["independent draws from a fixed distribution for the expectation"]
  derivation: good-turing-leftover

- id: c-gt-brown-numbers
  type: mathematical
  text: "Dividing the counts of n-grams seen once by the 365,893,263 words of Brown et al.'s Table 1 gives 14.69% for 3-grams and 2.20% for 2-grams."
  assumes: ["the counts of Table 1 of Brown et al. (1992)", "the share is taken over all 365,893,263 words"]
  derivation: good-turing-leftover

- id: c-perplexity-bits
  type: mathematical
  text: "Perplexity equals 2 to the cross-entropy in bits per token, so cutting perplexity by a fraction r removes log2(1/(1 − r)) bits whatever the start: 100 to 90 is 6.64 to 6.49 bits, and 67.6 to 43.8 removes 10.3% of the cross-entropy."
  assumes: ["perplexity is the reciprocal geometric mean of the token probabilities"]
  derivation: perplexity-entropy

- id: c-infinigram-valid
  type: mathematical
  text: "Choosing the longest suffix that occurs followed by a token, before looking at the next word, and dividing by the number of such occurrences gives a distribution; dividing by all occurrences loses mass whenever the suffix also ends a document."
  assumes: ["counts are taken over a fixed tokenized corpus of documents"]
  derivation: infinigram-normalisation

- id: c-backoff-not-normalised
  type: mathematical
  text: "Backing off separately for each next word without discounting, as naive backoff and Stupid Backoff do, can give scores that sum to more than one."
  assumes: ["the backoff factor is positive"]
  derivation: infinigram-normalisation

- id: c-ikn-hpy
  type: mathematical
  text: "With strengths zero, one discount in (0, 1] per order and at most one table per word in each restaurant, the predictive probability of the hierarchical Pitman-Yor language model equals interpolated Kneser-Ney with continuation counts at every lower order; keeping raw counts for n-grams that start with <s> falls outside this correspondence."
  assumes: ["the seating arrangement that puts at most one table per word in each restaurant", "the same vocabulary and padding for both models"]
  derivation: ikn-as-hpy
