- id: c-bengio-decay
  type: attributive
  text: "A weight decay penalty of 10^−4 was used in the Brown experiments and 10^−5 in the AP News experiments, selected by a few trials on validation perplexity."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 12", stance: for}

- id: c-bengio-bottleneck
  type: attributive
  text: "Bengio et al. identify the computation of the activations of the output layer as the computational bottleneck of the neural implementation."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 7", stance: for}

- id: c-mikolov13-cost
  type: attributive
  text: "Mikolov et al. write the cost of one example of the feedforward model as Q = N × D + N × D × H + H × V, with N context words, D-dimensional features, H hidden units and V words, and call H × V the dominating term; with binary tree representations of the vocabulary the number of output units to evaluate falls to around log2 V, and most of the complexity is then caused by the term N × D × H."
  evidence:
    - {work: "mikolov-2013-efficient-estimation-word-representations", role: original, locator: "p. 3", stance: for}

- id: c-mikolov13-huffman
  type: attributive
  text: "With a Huffman tree only about log2(unigram perplexity(V)) outputs need evaluation, which for a vocabulary of one million words gives about two times speedup in evaluation over a balanced tree."
  evidence:
    - {work: "mikolov-2013-efficient-estimation-word-representations", role: original, locator: "p. 3", stance: for}

