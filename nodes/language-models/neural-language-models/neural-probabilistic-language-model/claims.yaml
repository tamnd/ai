# The claims of the neural probabilistic language model page (spec 07). The build computes the labels.
- id: c-bengio-curse
  type: attributive
  text: "Bengio et al. note that learning the joint probability function of sequences of words is intrinsically difficult because of the curse of dimensionality: a word sequence on which the model will be tested is likely to be different from all the word sequences seen during training."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 1", stance: for}

- id: c-bengio-free-parameters
  type: attributive
  text: "Modelling the joint distribution of 10 consecutive words in a natural language with a vocabulary of size 100,000 has potentially 10^50 − 1 free parameters."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 1", stance: for}

- id: c-bengio-idea
  type: definitional
  text: "Bengio et al. summarise the approach in three steps: associate with each word in the vocabulary a distributed word feature vector in R^m, express the joint probability function of word sequences in terms of the feature vectors of these words, and learn simultaneously the word feature vectors and the parameters of that probability function."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 3", stance: for}

- id: c-bengio-generalise
  type: attributive
  text: "\"Similar\" words are expected to have a similar feature vector, and because the probability function is a smooth function of these feature values, the presence of one sentence in the training data increases the probability of its combinatorial number of neighbours in sentence space."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 4", stance: for}

- id: c-bengio-model
  type: definitional
  text: "The network computes the unnormalised log-probabilities y = b + Wx + U tanh(d + Hx), with the hyperbolic tangent applied element by element and W optionally zero (no direct connections), and a softmax output layer guarantees positive probabilities summing to 1."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 7", stance: for}
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 6", stance: for}

- id: c-bengio-two-layers
  type: attributive
  text: "Bengio et al. note that there are really two hidden layers: the shared word features layer C, which has no non-linearity, and the ordinary hyperbolic tangent hidden layer."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 6", stance: for}

- id: c-bengio-objective
  type: definitional
  text: "Training looks for the parameters that maximise the training corpus penalised log-likelihood L = (1/T) Σ_t log f(w_t, w_t−1, ..., w_t−n+1; θ) + R(θ), where in the experiments R is a weight decay penalty applied only to the weights of the network and to C, not to the biases."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 6", stance: for}

- id: c-bengio-schedule
  type: attributive
  text: "Bengio et al. train by stochastic gradient ascent with the learning rate ε_t = ε_0 / (1 + rt) after t updates, with ε_0 = 10^−3 and r = 10^−8."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 11", stance: for}

- id: c-bengio-output-gradient
  type: attributive
  text: "Bengio et al. set ∂L/∂y_j ← 1_{j==w_t} − p_j, update b_j ← b_j + ε ∂L/∂y_j, and back-propagate through the hidden layer with ∂L/∂o_k ← (1 − a_k^2) ∂L/∂a_k."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 10", stance: for}

- id: c-softmax-gradient
  type: mathematical
  text: "The gradient of the negative log-likelihood with respect to a logit is the model probability minus the indicator of the target, so it sums to zero over the vocabulary and is non-zero for every word, and the factor at a tanh unit is 1 − a^2."
  assumes: ["the output is a softmax of real logits", "a = tanh(o) for the hidden unit"]
  derivation: softmax-gradient

- id: c-bengio-mixture-reason
  type: attributive
  text: "The interpolated n-gram was used to form a mixture with the networks since they appear to make \"errors\" in very different ways."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 12", stance: for}

- id: c-param-count
  type: mathematical
  text: "The network of Eq. 1 has |V|(1 + nm + h) + h(1 + (n − 1)m) free parameters with direct connections and |V|(1 + m + h) + h(1 + (n − 1)m) without them; the AP News network with |V| = 17,964, h = 60, n = 6 and m = 100 has 11,904,264 parameters, 95.2 MB as 8-byte floats."
  assumes: ["the parameters are b, d, U, W, H and C of Eq. 1", "8 bytes per parameter for the size"]
  derivation: parameter-count

- id: c-bengio-param-formula
  type: attributive
  text: "Bengio et al. give the same number of free parameters and call |V|(nm + h) the dominating factor."
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 7", stance: for}

- id: c-output-share
  type: mathematical
  text: "In that network the weighted sums of the output units take 99.7% of the multiply-adds of one example, and the output terms |V|(nm + h) are 99.6% of the parameters."
  assumes: ["the cost of one example is counted in multiply-adds of the weighted sums", "the AP News network with direct connections"]
  derivation: parameter-count

- id: c-tree-normalised
  type: mathematical
  text: "With each word a leaf of a binary tree and the probability of the word the product of sigmoid branch probabilities along its path, the probabilities sum to one over the vocabulary for every hidden vector with no sum over the vocabulary, and one word costs one sigmoid per node on its path."
  assumes: ["a full binary tree with one leaf per word", "branch probabilities sigmoid(z) and sigmoid(−z) at each node"]
  derivation: tree-softmax

- id: c-huffman-depth
  type: mathematical
  text: "A balanced tree has leaf depths floor(log2 |V|) or ceil(log2 |V|), and a Huffman tree built from the word frequencies q has mean depth between the unigram entropy H(q) in bits and H(q) + 1; for |V| = 10,000 a balanced tree needs 13 or 14 sigmoids per word against 10,000 softmax terms."
  assumes: ["the tree is fixed before training", "the mean depth is weighted by the same frequencies q that built the Huffman tree"]
  derivation: tree-softmax

- id: c-nce-limit
  type: mathematical
  text: "With k noise samples from P_n, the noise-contrastive gradient with respect to the score of word w is k P_n(w) / (P(w) + k P_n(w)) times P_d(w) − P(w); the factor tends to 1 as k grows, which leaves the maximum-likelihood gradient for a normalised model, the gap falls like 1/k, and P = P_d is a stationary point for every k."
  assumes: ["the expected NCE objective over the data and noise distributions", "P_n(w) > 0 for every word"]
  derivation: nce-gradient

- id: c-mixture-bound
  type: mathematical
  text: "By concavity of the logarithm, a mixture with fixed weight w has perplexity at most PP_p^w PP_q^(1 − w), so a half-half mixture is no worse than the geometric mean of the two perplexities; for Bengio et al.'s MLP9 at 276 and the trigram at 336 that bound is 304.5, and the reported mixture MLP10 reaches 252."
  assumes: ["the mixture weight is fixed, not tuned on the test text", "the test perplexities of Table 1 of Bengio et al. (2003)"]
  derivation: mixture-bound

- id: c-bengio-more-context
  type: empirical
  text: "On Brown, going from 2 words of context to 4 words brought improvements to the neural network, not to the n-grams."
  scope:
    models: "neural probabilistic language models and n-gram models"
    data: ["Brown corpus"]
    scale: "800,000 training words, |V| = 16,383"
    setting: "validation and test perplexity (Table 1)"
  evidence:
    - {work: "bengio-2003-neural-probabilistic-language-model", role: original, locator: "p. 12", stance: for}

- id: c-bengio-m
