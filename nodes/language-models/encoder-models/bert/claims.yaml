# The claims of the BERT page (spec 07). The build computes the labels.
- id: c-name
  type: definitional
  text: "BERT stands for Bidirectional Encoder Representations from Transformers, a language representation model designed to pre-train deep bidirectional representations from unlabeled text by jointly conditioning on both left and right context in all layers."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "the abstract", stance: for}

- id: c-finetune
  type: attributive
  text: "Devlin et al. write that the pre-trained BERT model can be fine-tuned with just one additional output layer to create state-of-the-art models for a wide range of tasks, without substantial task-specific architecture modifications."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "the abstract", stance: for}

- id: c-two-steps
  type: definitional
  text: "BERT has two steps, pre-training on unlabeled data over different pre-training tasks, and fine-tuning, in which all of the parameters are fine-tuned using labeled data from the downstream task."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 3", stance: for}

- id: c-open-sourced
  type: historical
  text: "Google open sourced BERT with source code built on top of TensorFlow and a number of pre-trained language representation models."
  evidence:
    - {work: "google-2018-open-sourcing-bert-blog", role: original, locator: "p. 1", stance: for}

- id: c-30-minutes
  type: attributive
  text: "Google wrote that with this release anyone could train a state-of-the-art question answering system in about 30 minutes on a single Cloud TPU, or in a few hours using a single GPU."
  evidence:
    - {work: "google-2018-open-sourcing-bert-blog", role: original, locator: "p. 1", stance: for}

- id: c-arch
  type: definitional
  text: "BERT's model architecture is a multi-layer bidirectional Transformer encoder based on the original implementation described in Vaswani et al. (2017)."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 3", stance: for}

- id: c-transformer
  type: definitional
  text: "The Transformer is a network architecture based solely on attention mechanisms, dispensing with recurrence and convolutions entirely."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "the abstract", stance: for}

- id: c-sizes
  type: definitional
  text: "BERT-Base has L=12 layers, hidden size H=768 and A=12 self-attention heads with 110M parameters in total, and BERT-Large has L=24, H=1024 and A=16 with 340M parameters."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 3", stance: for}

- id: c-ffn
  type: definitional
  text: "The feed-forward size of BERT is 4H, which is 3072 for H = 768 and 4096 for H = 1024."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 3", stance: for}

- id: c-gpt-size
  type: attributive
  text: "Devlin et al. chose BERT-Base to have the same model size as OpenAI GPT for comparison; the BERT Transformer uses bidirectional self-attention, while the GPT Transformer uses constrained self-attention where every token can only attend to context to its left."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 3", stance: for}

- id: c-wordpiece
  type: definitional
  text: "BERT uses WordPiece embeddings with a 30,000 token vocabulary, and the first token of every sequence is a special classification token ([CLS]) whose final hidden state is the aggregate sequence representation for classification tasks."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-pairs
  type: definitional
  text: "BERT packs sentence pairs into a single sequence, separates them with a special token ([SEP]), and adds a learned embedding to every token indicating whether it belongs to sentence A or sentence B."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-input-sum
  type: definitional
  text: "The input representation of a token in BERT is the sum of the corresponding token, segment and position embeddings."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-gnmt-wordpieces
  type: historical
  text: "Wu et al. divide words into a limited set of common sub-word units, wordpieces, to improve the handling of rare words in Google's neural machine translation system."
  evidence:
    - {work: "wu-2016-google-neural-machine-translation", role: original, locator: "the abstract", stance: for}

- id: c-data
  type: historical
  text: "BERT is pre-trained on the BooksCorpus (800M words) and English Wikipedia (2,500M words), and only the text passages of Wikipedia are used, ignoring lists, tables and headers."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 5", stance: for}

- id: c-doc-level
  type: attributive
  text: "Devlin et al. call it critical to use a document-level corpus rather than a shuffled sentence-level corpus such as the Billion Word Benchmark, in order to extract long contiguous sequences."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 5", stance: for}

- id: c-bookcorpus
  type: historical
  text: "Zhu et al. collected the BookCorpus, a corpus of 11,038 books from the web, which are free books written by yet unpublished authors."
  evidence:
    - {work: "zhu-2015-aligning-books-movies", role: original, locator: "p. 3", stance: for}

- id: c-ml-data
  type: historical
  text: "The multilingual BERT models were trained on the top 100 languages with the largest Wikipedias, with the entire Wikipedia dump of each language, excluding user and talk pages."
  evidence:
    - {work: "google-research-bert-multilingual", role: original, locator: "p. 1", stance: for}

- id: c-ml-smoothing
  type: historical
  text: "To balance high-resource and low-resource languages, Google sampled the multilingual data with exponentially smoothed weighting with S=0.7, so that English is under-sampled and a language like Icelandic is over-sampled."
  evidence:
    - {work: "google-research-bert-multilingual", role: original, locator: "p. 1", stance: for}

- id: c-ml-vocab
  type: historical
  text: "The multilingual models use a 110k shared WordPiece vocabulary and no marker to denote the input language, so that zero-shot training can work."
  evidence:
    - {work: "google-research-bert-multilingual", role: original, locator: "p. 1", stance: for}

- id: c-mlm
  type: definitional
  text: "In the masked language model (MLM) task, BERT masks 15% of all WordPiece tokens in each sequence at random and predicts only the masked words, a procedure often referred to as a Cloze task."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-mismatch
  type: attributive
  text: "Devlin et al. note that masking creates a mismatch between pre-training and fine-tuning, since the [MASK] token does not appear during fine-tuning."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-80-10-10
  type: definitional
  text: "Of the 15% of token positions chosen for prediction, BERT replaces the token with the [MASK] token 80% of the time, a random token 10% of the time, and the unchanged token 10% of the time."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-nsp
  type: definitional
  text: "In next sentence prediction (NSP), 50% of the time sentence B is the actual next sentence that follows A (IsNext), and 50% of the time it is a random sentence from the corpus (NotNext)."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-nsp-acc
  type: attributive
  text: "Devlin et al. report that the final model achieves 97%-98% accuracy on NSP."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-cls-meaning
  type: attributive
  text: "Devlin et al. write that the vector C is not a meaningful sentence representation without fine-tuning, since it was trained with NSP."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 4", stance: for}

- id: c-batch
  type: historical
  text: "BERT was trained with a batch size of 256 sequences (256 sequences * 512 tokens = 128,000 tokens/batch) for 1,000,000 steps, approximately 40 epochs over the 3.3 billion word corpus."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 13", stance: for}

- id: c-optim
  type: historical
  text: "BERT was trained with Adam with a learning rate of 1e-4, β1 = 0.9, β2 = 0.999, L2 weight decay of 0.01, learning rate warmup over the first 10,000 steps and linear decay, a dropout probability of 0.1 on all layers, and a gelu activation following OpenAI GPT."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 13", stance: for}

- id: c-loss
  type: definitional
  text: "The training loss of BERT is the sum of the mean masked LM likelihood and the mean next sentence prediction likelihood."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 13", stance: for}

- id: c-tpus
  type: historical
  text: "Training of BERT-Base was performed on 4 Cloud TPUs in Pod configuration (16 TPU chips total) and training of BERT-Large on 16 Cloud TPUs (64 TPU chips total), and each pre-training took 4 days to complete."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 13", stance: for}

- id: c-seq128
  type: historical
  text: "To speed up pre-training, BERT was trained with a sequence length of 128 for 90% of the steps, and with sequences of 512 for the rest 10% of the steps to learn the positional embeddings."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 13", stance: for}

- id: c-ft-cheap
  type: attributive
  text: "Devlin et al. write that fine-tuning is relatively inexpensive compared to pre-training, and that all of the results of the paper can be replicated in at most 1 hour on a single Cloud TPU, or a few hours on a GPU."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 5", stance: for}

- id: c-ft-hparams
  type: attributive
  text: "For fine-tuning, Devlin et al. found batch sizes of 16 and 32, Adam learning rates of 5e-5, 3e-5 and 2e-5, and 2, 3 or 4 epochs to work well across all tasks."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Appendix A.3", stance: for}

- id: c-strubell-cost
  type: attributive
  text: "Strubell et al. estimate that training BERT-base on V100x64 hardware for 79 hours emits 1438 lbs of CO2e and costs between $3751 and $12,571 in cloud compute."
  evidence:
    - {work: "strubell-2019-energy-policy", role: original, locator: "p. 4", stance: for}

- id: c-strubell-flight
  type: attributive
  text: "Strubell et al. write that training BERT on GPU is roughly equivalent to a trans-American flight."
  evidence:
    - {work: "strubell-2019-energy-policy", role: original, locator: "p. 4", stance: for}

- id: c-rel-repo
  type: historical
  text: "The google-research/bert repository released TensorFlow code for the BERT model architecture and pre-trained checkpoints for both the lowercase and cased version of BERT-Base and BERT-Large from the paper."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-cased
  type: definitional
  text: "In the BERT models, Uncased means that the text has been lowercased before WordPiece tokenization and accent markers stripped, and Cased means that the true case and accent markers are preserved."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-multi
  type: historical
  text: "On November 3rd, 2018, Google made a multilingual BERT-Base model of 102 languages and a Chinese BERT-Base model available."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-multi-cased
  type: historical
  text: "On November 23rd, 2018, Google uploaded a multilingual model that does not perform any normalization on the input, covers 104 languages and additionally includes Thai and Mongolian."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-pytorch
  type: historical
  text: "On November 5th, 2018, third-party PyTorch and Chainer versions of BERT became available, and Google was not involved in the creation or maintenance of the PyTorch version."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-squad2
  type: historical
  text: "On November 15th, 2018, Google released code changes to reproduce its 83% F1 SQuAD 2.0 system."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-tfhub
  type: historical
  text: "On February 7th, 2019, BERT was uploaded to TensorFlow Hub."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-wwm
  type: historical
  text: "On May 31st, 2019, Google released Whole Word Masking models, which always mask all of the tokens corresponding to a word at once with the same overall masking rate, and only for BERT-Large."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-wwm-scores
  type: attributive
  text: "The README reports SQuAD 1.1 F1/EM of 92.8/86.7 and Multi NLI accuracy of 87.07 for BERT-Large, Uncased (Whole Word Masking), against 91.0/84.3 and 86.05 for the original model."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-small
  type: historical
  text: "On March 11th, 2020, Google released 24 smaller BERT models, English only, uncased and trained with WordPiece masking, referenced in Well-Read Students Learn Better."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-rel-small-use
  type: attributive
  text: "Google writes that the smaller BERT models are intended for environments with restricted computational resources, and are most effective in the context of knowledge distillation."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-turc
  type: attributive
  text: "Turc et al. show that pre-training remains important in the context of smaller architectures, and make 24 pre-trained miniature BERT models publicly available."
  evidence:
    - {work: "turc-2019-well-read-students", role: original, locator: "the abstract", stance: for}

- id: c-rel-small-glue
  type: attributive
  text: "The README gives GLUE scores of 64.2 for BERT-Tiny, 65.8 for BERT-Mini, 71.2 for BERT-Small and 73.5 for BERT-Medium."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-res-abstract
  type: attributive
  text: "Devlin et al. report new state-of-the-art results on eleven natural language processing tasks, including a GLUE score of 80.5% (7.7% point absolute improvement), MultiNLI accuracy of 86.7% (4.6% absolute improvement), SQuAD v1.1 Test F1 of 93.2 (1.5 point absolute improvement) and SQuAD v2.0 Test F1 of 83.1 (5.1 point absolute improvement)."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "the abstract", stance: for}

- id: c-res-glue
  type: attributive
  text: "On the GLUE test sets, Devlin et al. report averages of 79.6 and 82.1 for the two BERT models, against 75.1 for OpenAI GPT, and exclude the problematic WNLI set from the average."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Section 4.1", stance: for}

- id: c-res-board
  type: attributive
  text: "Devlin et al. report that on the official GLUE leaderboard BERT-Large obtains a score of 80.5, compared to 72.8 for OpenAI GPT."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Section 4.1", stance: for}

- id: c-res-large
  type: attributive
  text: "Devlin et al. find that BERT-Large significantly outperforms BERT-Base across all tasks, especially those with very little training data."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Section 4.1", stance: for}

- id: c-res-unstable
  type: attributive
  text: "Devlin et al. found that fine-tuning BERT-Large was sometimes unstable on small datasets, so they ran several random restarts and selected the best model on the Dev set."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Section 4.1", stance: for}

- id: c-res-squad1
  type: attributive
  text: "On SQuAD 1.1, Devlin et al. report a test score of 87.4 EM and 93.2 F1 for an ensemble of BERT-Large models also fine-tuned on TriviaQA."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 7", stance: for}

- id: c-res-squad2
  type: attributive
  text: "On SQuAD 2.0, Devlin et al. report 80.0 EM and 83.1 F1 on the test set for a single BERT-Large model, a +5.1 F1 improvement over the previous best system."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 7", stance: for}

- id: c-res-swag
  type: attributive
  text: "On SWAG, Devlin et al. report a test accuracy of 86.3 for BERT-Large, which outperforms the ESIM+ELMo baseline by +27.1% and OpenAI GPT by 8.3%."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 7", stance: for}

- id: c-abl-nsp
  type: attributive
  text: "Devlin et al. show that removing NSP hurts performance significantly on QNLI, MNLI and SQuAD 1.1."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 8", stance: for}

- id: c-abl-ltr
  type: attributive
  text: "Devlin et al. report that a left-to-right model trained without NSP performs worse than the MLM model on all tasks, with MRPC accuracy falling from 86.5 to 77.5 and SQuAD F1 from 87.9 to 77.8."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 8", stance: for}

- id: c-abl-size
  type: attributive
  text: "Devlin et al. report that larger models lead to a strict accuracy improvement across all four datasets of Table 6, even for MRPC which only has 3,600 labeled training examples."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 8", stance: for}

- id: c-res-ner
  type: attributive
  text: "On CoNLL-2003 named entity recognition, Devlin et al. report a test F1 of 92.8 for fine-tuned BERT-Large, and the best feature-based method, which concatenates the token representations from the top four hidden layers, is only 0.3 F1 behind fine-tuning the entire model."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "p. 9", stance: for}

- id: c-lic-models
  type: historical
  text: "Google released the pre-trained BERT models under the same license as the source code, Apache 2.0."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-lic-file
  type: historical
  text: "The license of the code is the Apache License, Version 2.0, January 2004."
  evidence:
    - {work: "google-research-bert-license", role: original, locator: "p. 1", stance: for}

- id: c-hw
  type: attributive
  text: "Google writes that all of the code in the repository works out-of-the-box with CPU, GPU and Cloud TPU."
  evidence:
    - {work: "google-research-bert-readme", role: original, locator: "p. 1", stance: for}

- id: c-may
  type: attributive
  text: "May et al. extend the Word Embedding Association Test to measure bias in sentence encoders, test several encoders including ELMo and BERT, and observe mixed results including suspicious patterns of sensitivity that suggest the test's assumptions may not hold in general."
  evidence:
    - {work: "may-2019-social-biases-sentence-encoders", role: original, locator: "the abstract", stance: for}

- id: c-bandy
  type: attributive
  text: "Bandy and Vincent find evidence that BookCorpus likely violates copyright restrictions for many books, contains thousands of duplicated books, and exhibits significant skews in genre representation."
  evidence:
    - {work: "bandy-2021-bookcorpus-datasheet", role: original, locator: "the abstract", stance: for}

- id: c-search
  type: historical
  text: "Google announced that it applies BERT models to both ranking and featured snippets in Search, and that in ranking BERT would help Search better understand one in 10 searches in the U.S. in English."
  evidence:
    - {work: "google-2019-understanding-searches-bert", role: original, locator: "p. 1", stance: for}

- id: c-search-tpu
  type: attributive
  text: "Google wrote that some models it can build with BERT are so complex that they push the limits of traditional hardware, so for the first time it used the latest Cloud TPUs to serve search results."
  evidence:
    - {work: "google-2019-understanding-searches-bert", role: original, locator: "p. 1", stance: for}

- id: c-rogers
  type: attributive
  text: "Rogers et al. present a survey of over 150 studies of the BERT model, and write that BERT is still a must-have baseline."
  evidence:
    - {work: "rogers-2020-primer-bertology", role: original, locator: "p. 1", stance: for}

- id: c-tenney
  type: attributive
  text: "Tenney et al. find that BERT represents the steps of the traditional NLP pipeline in an interpretable and localizable way, in the expected sequence: POS tagging, parsing, NER, semantic roles, then coreference."
  evidence:
    - {work: "tenney-2019-bert-rediscovers-pipeline", role: original, locator: "the abstract", stance: for}

- id: c-clark-heads
  type: attributive
  text: "Clark et al. find that BERT's attention heads attend to delimiter tokens and specific positional offsets, and that some heads attend to the direct objects of verbs, determiners of nouns, objects of prepositions and coreferent mentions with remarkably high accuracy."
  evidence:
    - {work: "clark-2019-what-does-bert-look-at", role: original, locator: "the abstract", stance: for}

- id: c-pires
  type: attributive
  text: "Pires et al. show that Multilingual BERT, pre-trained from monolingual corpora in 104 languages, is surprisingly good at zero-shot cross-lingual model transfer, and that transfer works best between typologically similar languages."
  evidence:
    - {work: "pires-2019-how-multilingual-bert", role: original, locator: "the abstract", stance: for}

- id: c-roberta
  type: attributive
  text: "Liu et al. find in a replication study that BERT was significantly undertrained, and can match or exceed the performance of every model published after it."
  evidence:
    - {work: "liu-2019-roberta", role: original, locator: "the abstract", stance: for}

- id: c-roberta-mods
  type: historical
  text: "RoBERTa modifies BERT pre-training by training the model longer, with bigger batches, over more data, removing the next sentence prediction objective, training on longer sequences, and dynamically changing the masking pattern."
  evidence:
    - {work: "liu-2019-roberta", role: original, locator: "p. 1", stance: for}

- id: c-albert
  type: historical
  text: "ALBERT presents two parameter-reduction techniques to lower memory consumption and increase the training speed of BERT, and a self-supervised loss that focuses on modeling inter-sentence coherence."
  evidence:
    - {work: "lan-2020-albert", role: original, locator: "p. 1", stance: for}

- id: c-albert-18x
  type: attributive
  text: "Lan et al. report that an ALBERT configuration similar to BERT-large has 18x fewer parameters and can be trained about 1.7x faster."
  evidence:
    - {work: "lan-2020-albert", role: original, locator: "p. 2", stance: for}

- id: c-distilbert
  type: attributive
  text: "Sanh et al. use knowledge distillation during pre-training to reduce the size of a BERT model by 40%, while retaining 97% of its language understanding capabilities and being 60% faster."
  evidence:
    - {work: "sanh-2019-distilbert", role: original, locator: "the abstract", stance: for}

- id: c-electra
  type: attributive
  text: "Clark et al. propose replaced token detection as a more sample-efficient pre-training task than masked language modeling, and train a model on one GPU for 4 days that outperforms GPT (trained using 30x more compute) on GLUE."
  evidence:
    - {work: "clark-2020-electra", role: original, locator: "the abstract", stance: for}

- id: c-modernbert
  type: attributive
  text: "Warner et al. write that encoder-based pipelines currently rely on older models, and quite often on the original BERT itself as their backbone, with sequence lengths limited to 512 tokens."
  evidence:
    - {work: "warner-2024-modernbert", role: original, locator: "p. 1", stance: for}

- id: c-mccoy
  type: attributive
  text: "McCoy et al. find that models trained on MNLI, including BERT, perform very poorly on the HANS evaluation set, suggesting that they have adopted fallible syntactic heuristics."
  evidence:
    - {work: "mccoy-2019-right-for-wrong-reasons", role: original, locator: "the abstract", stance: for}

- id: c-niven
  type: attributive
  text: "Niven and Kao show that BERT's peak performance of 77% on the Argument Reasoning Comprehension Task is entirely accounted for by exploitation of spurious statistical cues in the dataset, and that on an adversarial dataset all models achieve random accuracy."
  evidence:
    - {work: "niven-2019-probing-arguments", role: original, locator: "the abstract", stance: for}

- id: c-ettinger
  type: attributive
  text: "Ettinger finds that BERT struggles with challenging inference and role-based event prediction, and shows clear insensitivity to the contextual impacts of negation."
