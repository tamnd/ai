# The architecture scene (spec 12.6), first written by aik viz shapes from shapes.yaml.
# It sets the layout and the controls only; every shape and count comes from shapes.yaml.
title: T5
controls:
  - name: vocab
    choices: [2, 12, 13, 32000]
  - name: d_model
    choices: [1, 6, 8, 512, 768, 1024]
  - name: n_heads
    choices: [1, 2, 3, 8, 12, 16, 32, 128]
  - name: d_kv
    choices: [1, 3, 4, 64, 128]
  - name: d_ff
    choices: [1, 8, 16, 2048, 3072, 4096, 16384, 65536]
  - name: n_layers
    choices: [1, 2, 6, 12, 24]
  - name: buckets
    choices: [4, 8, 10, 32]
  - name: max_distance
    choices: [6, 16, 20, 128]
  - name: B
    choices: [1, 2, 3]
  - name: S
    choices: [1, 6, 7, 512]
  - name: T
    choices: [1, 5, 6, 512]
presets:
  - example
  - t5_small
  - t5_base
  - t5_large
  - t5_3b
  - t5_11b
stack:
  - embed
  - rel
  - enc_layer
  - dec_layer
  - head
