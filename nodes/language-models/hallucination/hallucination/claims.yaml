# Evidence: detection and self-knowledge

- id: c-sc-idea
  type: attributive
  text: "SelfCheckGPT leverages the idea that if an LLM has knowledge of a given concept, sampled responses are likely to be similar and contain consistent facts, whereas for hallucinated facts stochastically sampled responses are likely to diverge and contradict one another."
  evidence:
    - {work: "manakul-2023-selfcheckgpt", role: original, locator: "p. 1", stance: for}

- id: c-sc-zero
  type: attributive
  text: "SelfCheckGPT is a sampling-based approach that can be used to fact-check the responses of black-box models in a zero-resource fashion, without an external database."
  evidence:
    - {work: "manakul-2023-selfcheckgpt", role: original, locator: "p. 1", stance: for}

- id: c-sc-labels
  type: empirical
  text: "Of the 1908 annotated sentences, 761 (39.9%) were labelled major-inaccurate, 631 (33.1%) minor-inaccurate, and 516 (27.0%) accurate."
  scope:
    models: "GPT-3 (text-davinci-003)"
    data: ["238 WikiBio articles, 1908 generated sentences annotated by hand"]
    scale: "one model"
    setting: "sentence-level detection from the agreement of sampled passages"
  evidence:
    - {work: "manakul-2023-selfcheckgpt", role: original, locator: "p. 5", stance: for}

- id: c-sc-prob
  type: empirical
  text: "Probability measures from the LLM generating the texts are strong baselines for assessing factuality: factual sentences can be identified with an AUC-PR of 53.97, significantly better than the random baseline of 27.04, with the AUC-PR for hallucination detection also increasing from 72.96 to 83.21."
  scope:
    models: "GPT-3 (text-davinci-003)"
    data: ["238 WikiBio articles, 1908 generated sentences annotated by hand"]
    scale: "one model"
    setting: "sentence-level detection from the agreement of sampled passages"
  evidence:
    - {work: "manakul-2023-selfcheckgpt", role: original, locator: "p. 6", stance: for}

- id: c-sc-prompt
  type: empirical
  text: "SelfCheckGPT-Prompt considerably outperforms the grey-box approaches, including GPT-3's output probabilities, as well as other black-box approaches."
  scope:
    models: "GPT-3 (text-davinci-003)"
    data: ["238 WikiBio articles, 1908 generated sentences annotated by hand"]
    scale: "one model"
    setting: "sentence-level detection from the agreement of sampled passages"
  evidence:
    - {work: "manakul-2023-selfcheckgpt", role: original, locator: "p. 7", stance: for}

- id: c-ku-def
  type: attributive
  text: "Kuhn et al. introduce semantic entropy, an entropy which incorporates linguistic invariances created by shared meanings, because different sentences can mean the same thing."
