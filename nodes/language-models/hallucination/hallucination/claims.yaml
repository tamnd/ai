# Scope

- id: c-my-gamed
  type: attributive
  text: "Entailment is a referenceless measure, so it can easily be gamed, since the first sentence of any source document is always entailed by the whole document, and entailment-based measures for evaluation need to be coupled with reference-based measures like ROUGE."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 8", stance: for}

- id: c-gk-proxy
  type: empirical
  text: "Gekhman et al. measure test performance as a proxy for hallucinations, since in a closed-book QA setup with disjoint train/test splits the model has to use its pre-existing knowledge to answer test questions."
  scope:
    models: "PaLM 2-S"
    data: ["ENTITYQUESTIONS, Wikidata triplets converted to closed-book QA"]
    scale: "one model"
    setting: "fine-tuning with a controlled share of examples the model does not know, test accuracy as a proxy for hallucination"
  evidence:
    - {work: "gekhman-2024-fine-tuning-new-knowledge", role: original, locator: "p. 4", stance: for}

# Explanations

- id: c-my-noise
  type: attributive
  text: "Models are usually agnostic to the noises or artifacts of the training data, such as reference divergence, making them vulnerable to hallucinations."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 3", stance: for}

- id: c-tq-two
  type: attributive
  text: "One explanation of the inverse scaling on TruthfulQA is that larger models produce more imitative falsehoods because they are better at learning the training distribution; another is that the questions adversarially exploit weaknesses in larger models not arising from imitation of the training distribution."
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "p. 3", stance: for}

- id: c-tq-scaling
  type: attributive
  text: "Lin et al. suggest that scaling up models alone is less promising for improving truthfulness than fine-tuning using training objectives other than imitation of text from the web."
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "p. 1", stance: for}

- id: c-kv-goodturing
  type: attributive
  text: "If the maximum probability of any fact is bounded, the probability of generating a hallucination is close to the fraction of facts that occur exactly once in the training data, a Good-Turing estimate, even assuming ideal training data without errors."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 1", stance: for}

- id: c-kv-mf
  type: attributive
  text: "The Good-Turing estimate of the missing mass is the fraction of samples that appear exactly once in the training data, which Kalai and Vempala call the MonoFacts estimator."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 4", stance: for}

- id: c-kv-corollary
  type: attributive
  text: "Under a regularity assumption on the factoid distribution, the simplest bound of Kalai and Vempala implies that for any algorithm, with probability at least 99% over training sets, the hallucination rate is at least the monofact estimate minus a miscalibration rate, minus a term proportional to the number of facts over the number of possible hallucinations, minus a term proportional to one over the square root of n."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 4", stance: for}

- id: c-kv-5w
  type: attributive
  text: "If half of the 5W (Who-Ate-What-When-Where-Why) posts occur exactly once, a calibrated-factoid model would hallucinate on about half of its generations on 5W factoids."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 5", stance: for}

- id: c-kv-once
  type: attributive
  text: "There is no statistical reason that pretraining will lead to hallucination on facts that tend to appear more than once in the training data, like references to publications such as articles and books, or on systematic facts like arithmetic calculations."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 1", stance: for}

- id: c-kv-post
  type: attributive
  text: "Models pretrained to be sufficiently good predictors, that is calibrated, may require post-training to mitigate hallucinations on the type of arbitrary facts that tend to appear once in the training set."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 1", stance: for}

- id: c-kz-binary
  type: attributive
  text: "Kalai et al. argue that hallucinations originate as errors in binary classification: if incorrect statements cannot be distinguished from facts, then hallucinations in pretrained language models will arise through natural statistical pressures."
  evidence:
