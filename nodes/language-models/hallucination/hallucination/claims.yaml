# The claims of the hallucination page (spec 07). The build computes the labels.

# The finding

- id: c-my-prone
  type: attributive
  text: "Maynez et al. analyzed limitations of neural text generation models for abstractive document summarization and found that these models are highly prone to hallucinate content that is unfaithful to the input document."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 1", stance: for}

- id: c-my-def
  type: attributive
  text: "Maynez et al. define a summary as being hallucinated if it has a span of words that is not supported by the input document, and do not categorize paraphrases or any information that can be inferred from the document as hallucinations."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 3", stance: for}

- id: c-my-kinds
  type: attributive
  text: "Intrinsic hallucinations use terms or concepts from the document but misrepresent information from the document, while extrinsic hallucinations are model generations that ignore the source material altogether."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 3", stance: for}

- id: c-my-factual
  type: attributive
  text: "A summary S of a document D contains a factual hallucination if it contains information not found in D that is factually correct."
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 3", stance: for}

- id: c-tq-imitative
  type: attributive
  text: "Lin et al. call false answers that a model's training objective incentivizes imitative falsehoods: for GPT-3 a false answer is an imitative falsehood if it has high likelihood on GPT-3's training distribution."
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "p. 1", stance: for}

- id: c-kv-bound
  type: attributive
  text: "Kalai and Vempala prove that there is an inherent statistical lower bound on the rate that pretrained language models hallucinate certain types of facts, having nothing to do with the transformer LM architecture or data quality."
  evidence:
    - {work: "kalai-2024-calibrated-must-hallucinate", role: original, locator: "p. 1", stance: for}

# Evidence: summarization

- id: c-my-setup
  type: empirical
  text: "Maynez et al. randomly sampled 500 articles from the test set and elicited judgments from three different annotators for each of 2500 (500x5) document-summary pairs."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 5", stance: for}

- id: c-my-70
  type: empirical
  text: "Intrinsic and extrinsic hallucinations happen frequently, in more than 70% of single-sentence summaries, and over 90% of extrinsic hallucinations were erroneous."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 2", stance: for}

- id: c-my-gold
  type: empirical
  text: "The BBC gold summaries often have extrinsic hallucinations due to the dataset artifact that gold summaries are introductory sentences prefacing each article."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 6", stance: for}

- id: c-my-intrinsic
  type: empirical
  text: "The percentage of system summaries with intrinsic hallucination was much higher than in gold summaries (7.4% vs others), which revealed the models' tendency to misrepresent information in the document due to the lack of document-level understanding and inference."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 6", stance: for}

- id: c-my-bert
  type: empirical
  text: "In total, 34.7% of the BertS2S abstracts were faithful (26.9%) and/or factual (+7.8%), 7.4% absolute better than the next-best model (PtGen), and even so over 90% of BertS2S hallucinations are erroneous."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 7", stance: for}

- id: c-my-entail
  type: empirical
  text: "Textual entailment scores are best correlated with both faithful (moderate, 0.40 ≤ |rs| ≤ 0.59) and factual (weak, 0.20 ≤ |rs| ≤ 0.39) human scores."
  scope:
    models: "PtGen, TConvS2S, TranS2S, BertS2S and the reference summaries"
    data: ["500 articles sampled from the XSum test set"]
    scale: "five summaries for each of 500 BBC articles"
    setting: "three trained annotators mark each unsupported span as intrinsic or extrinsic"
  evidence:
    - {work: "maynez-2020-faithfulness-factuality-summarization", role: original, locator: "p. 8", stance: for}

# Evidence: TruthfulQA

- id: c-tq-bench
  type: attributive
  text: "The TruthfulQA benchmark comprises 817 questions that span 38 categories, including health, law, finance and politics, crafted so that some humans would answer falsely due to a false belief or misconception."
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "p. 1", stance: for}

- id: c-tq-truthful
  type: attributive
  text: "Lin et al. define an answer to a question as truthful iff it avoids asserting a false statement, so a model is perfectly truthful if it answers 'No comment' for every question, and in practice they want answers that are both truthful and informative."
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "p. 4", stance: for}

- id: c-tq-best
  type: empirical
  text: "The human participant produced 94% true answers, 87% of them both true and informative, while the model with the most true answers (GPT-3-175B with helpful prompt) produced 58% true answers and 21% true and informative answers, and gave false and informative answers 42% of the time (compared to 6% for the human participant)."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.1", stance: for}

- id: c-tq-inverse
  type: empirical
  text: "Larger models generally do worse than smaller models in the same family: the GPT-Neo/J model with the most parameters is 17% less truthful than a model 60x smaller."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.2", stance: for}

- id: c-tq-mc
  type: empirical
  text: "In the multiple-choice task GPT-Neo/J 6B was 12% less truthful than GPT-Neo/J 125M, and no models significantly outperformed random guessing."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.2", stance: for}

- id: c-tq-informative
  type: empirical
  text: "While larger models were less truthful, they were more informative."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.2", stance: for}

- id: c-tq-controls
  type: empirical
  text: "On matched control questions, made by editing 1-3 words of a TruthfulQA question to turn it into a straightforward trivia or common-sense question, truthfulness improves with model size for all model families."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.3", stance: for}

- id: c-tq-judge
  type: empirical
  text: "The fine-tuned GPT-judge model is able to predict human evaluations of truthfulness with 90-96% validation accuracy."
  scope:
    models: "GPT-3, GPT-Neo/J, GPT-2 and UnifiedQA"
    data: ["TruthfulQA, 817 questions in 38 categories"]
    scale: "GPT-Neo/J 125M to 6B, GPT-3 up to 175B"
    setting: "zero-shot answers under several prompts, judged by humans"
  evidence:
    - {work: "lin-2022-truthfulqa", role: original, locator: "Section 4.4", stance: for}

# Evidence: long-form factual precision

- id: c-fs-def
  type: attributive
  text: "FActScore breaks a generation into a series of atomic facts, short statements that each contain one piece of information, and computes the percentage of atomic facts supported by a reliable knowledge source."
  evidence:
    - {work: "min-2023-factscore", role: original, locator: "p. 1", stance: for}

- id: c-fs-scores
  type: empirical
  text: "On people biographies InstructGPT and ChatGPT achieve FActScores of 42.5% and 58.3%, and PerplexityAI, which uses a commercial search engine, attains a FActScore of 71.5%."
  scope:
    models: "InstructGPT, ChatGPT and PerplexityAI"
    data: ["biographies of people from Wikipedia"]
    scale: "commercial models of unpublished size"
    setting: "human annotation of atomic facts against Wikipedia"
  evidence:
    - {work: "min-2023-factscore", role: original, locator: "p. 4", stance: for}

- id: c-fs-abstain
  type: empirical
  text: "ChatGPT and PerplexityAI often abstain from answering, which presumably improves their factual precision."
  scope:
    models: "InstructGPT, ChatGPT and PerplexityAI"
    data: ["biographies of people from Wikipedia"]
    scale: "commercial models of unpublished size"
    setting: "human annotation of atomic facts against Wikipedia"
