- id: c-ha-gap
  type: mathematical
  text: "For n independent draws from a distribution p over facts, the expected fraction of draws whose fact appears exactly once exceeds the expected missing mass by the sum over facts of p_i² (1 − p_i)^(n−1), which lies between 0 and 1/n."
  assumes: ["the training facts are n independent draws from a fixed distribution"]
  derivation: hallucination-arithmetic

- id: c-ha-uniform
  type: mathematical
  text: "With N equally likely facts and n = N draws, the expected missing mass is (1 − 1/N)^N, about 1/e ≈ 0.368 for large N; a generator that reproduces the facts it has seen and spreads the missing mass evenly over the unseen true facts and a hundred false factoids for every true fact hallucinates on about 36.7% of its generations."
  assumes: ["the training facts are n independent draws from a fixed distribution", "the generator cannot tell unseen true facts from false factoids"]
  derivation: hallucination-arithmetic

- id: c-ha-toy
  type: mathematical
  text: "A generator that reproduces the observed facts at their observed frequencies and spreads a mass equal to the monofact fraction MF evenly over U unseen true facts and M false factoids hallucinates at the rate MF · M / (M + U), which tends to MF when M is much larger than U."
  assumes: ["the generator cannot tell unseen true facts from false factoids"]
  derivation: hallucination-arithmetic

- id: c-ha-score
  type: mathematical
  text: "Under a confidence target t, where a correct answer earns 1 point, an error costs t/(1 − t) points and an abstention earns 0, answering with probability q of being right has expected score (q − t)/(1 − t), which is positive exactly when q > t; with t = 0 answering is never worse than abstaining."
  assumes: ["the grader's scores are fixed in advance and the model's probability of being right is q"]
  derivation: hallucination-arithmetic

- id: c-ha-penalty
  type: mathematical
  text: "The penalty t/(1 − t) is 1 for t = 0.5, 3 for t = 0.75 and 9 for t = 0.9; a penalty of 2 corresponds to t = 2/3."
  assumes: ["the penalty for an error under a target t is t/(1 − t)"]
  derivation: hallucination-arithmetic

- id: c-ha-ab
  type: mathematical
  text: "Under binary grading, a model that guesses on the questions where it is unsure, with probability q_j of being right on question j, scores the sum of the q_j more than a model that abstains on them, and makes the sum of the 1 − q_j errors more."
  assumes: ["the grader's scores are fixed in advance and the model's probability of being right is q"]
  derivation: hallucination-arithmetic
