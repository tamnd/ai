id: epsilon-sweep
claims: [c-sweep-scope]
question: "How does the exploratory action probability affect online return and greedy paths on the local cliff task?"
scale_note:
  here: "Tabular Q-learning on the four-by-twelve cliff grid, 150 episodes per seed, ten seeds per arm."
  source: "Sutton and Barto Section 6.5 describes epsilon-greedy Q-learning."
replicates: null
arms:
  - {id: epsilon_zero, config: {alpha: 0.5, epsilon: 0.0, gamma: 0.9}}
  - {id: epsilon_tenth, config: {alpha: 0.5, epsilon: 0.1, gamma: 0.9}}
  - {id: epsilon_third, config: {alpha: 0.5, epsilon: 0.3, gamma: 0.9}}
base_config:
  task: four-by-twelve cliff walking
  episodes: 150
  max_steps_per_episode: 1000
  online_return_window: last 50 episodes
seeds: {n: 10, base: 0}
data: []
budget: cpu-small
framework: numpy
uses_impl: ../../impl/numpy/q_learning.py
metrics: [online_return, greedy_reaches_goal_fraction, greedy_edge_path_fraction]
