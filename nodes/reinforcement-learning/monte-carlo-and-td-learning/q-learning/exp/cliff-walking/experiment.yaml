id: cliff-walking
claims: [c-cliff]
question: "On the cliff walking gridworld of Sutton and Barto (2018, Example 6.6), with epsilon-greedy behaviour and epsilon = 0.1, does Sarsa get a higher sum of rewards per episode than Q-learning, while the greedy policy of Q-learning takes the shorter path along the edge of the cliff?"
scale_note:
  here: "Tabular Q-learning and Sarsa on the 4 by 12 cliff grid, undiscounted, epsilon = 0.1, alpha = 0.5, 500 episodes per seed, 30 seeds. The online return is the mean sum of rewards per episode over episodes 101 to 500."
  source: "Sutton and Barto (2018, p. 132) show the same task and the same epsilon, with the sum of rewards during each episode over 500 episodes."
replicates: null
arms:
  - {id: q-learning, config: {method: q-learning}}
  - {id: sarsa, config: {method: sarsa}}
base_config:
  grid: {rows: 4, cols: 12}
  rewards: {step: -1, cliff: -100}
  gamma: 1.0
  alpha: 0.5
  epsilon: 0.1
  episodes: 500
  skip_episodes: 100
  q_init: 0.0
seeds: {n: 30, base: 20261114}
budget: cpu-small
framework: numpy
uses_impl: ../../impl/numpy/q_learning.py
metrics: [online_return, greedy_path_length, greedy_edge_path, falls_per_episode]
