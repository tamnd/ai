# Variants and descendants

- id: c-memnn-components
  type: definitional
  text: "Weston, Chopra and Bordes proposed networks with a long-term memory and four learned components, an input feature map, a generalization step that updates the memory, an output map and a response."
  evidence:
    - {work: "weston-2015-memory-networks", role: original, locator: "Section 2", stance: for}

- id: c-kv
  type: definitional
  text: "Key-value memory networks are based on the end-to-end memory network architecture and define the memory slots as pairs of vectors, a key compared with the question and a value that is read, using a different matrix R_j to update the query on each hop."
  evidence:
    - {work: "miller-2016-key-value-memory-networks", role: original, locator: "Section 3", stance: for}

- id: c-kv-hashing
  type: definitional
  text: "In the first step of a key-value memory network, key hashing, the question is used to preselect a small subset of the memories, with an inverted index that finds the keys sharing at least one word with the question."
  evidence:
    - {work: "miller-2016-key-value-memory-networks", role: original, locator: "Section 3", stance: for}

- id: c-babi-impact
  type: attributive
  text: "Weston et al. list the weakly supervised MemN2N, the dynamic memory networks of Kumar et al. and the Neural Reasoner as algorithms that the bAbI tasks influenced."
  evidence:
    - {work: "weston-2015-towards-ai-complete-question-answering", role: original, locator: "p. 10", stance: for}

- id: c-vaswani
  type: attributive
  text: "Vaswani et al. describe end-to-end memory networks as based on a recurrent attention mechanism instead of sequence-aligned recurrence, performing well on simple-language question answering and language modeling."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 2", stance: for}

- id: c-code
  type: historical
  text: "Sukhbaatar et al. released the source code of MemN2N."
  evidence:
    - {work: "sukhbaatar-2015-end-to-end-memory-networks", role: original, locator: "Section 4.3", stance: for}

