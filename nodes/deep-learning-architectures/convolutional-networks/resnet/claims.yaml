# Why it works

- id: c-propagation
  type: mathematical
  text: "If both the shortcut and the function after the addition are identities, so that x_{l+1} = x_l + F(x_l), then x_L = x_l + Σ_{i=l}^{L-1} F(x_i) for any deeper unit L, and ∂E/∂x_l = ∂E/∂x_L (1 + ∂/∂x_l Σ_{i=l}^{L-1} F(x_i)): the gradient of the deeper unit reaches the shallower one directly, added to the terms through the residual functions."
  assumes: ["x_{l+1} = x_l + F(x_l, W_l) for every unit between l and L", "F is differentiable", "the gradient is written for a scalar loss E, with vectors treated by Jacobians"]
  derivation: residual-gradient

- id: c-scaled-shortcut
  type: mathematical
  text: "If each shortcut is scaled, x_{l+1} = λ_l x_l + F(x_l), the direct term of the gradient becomes the product of the λ_i from l to L - 1, which grows or shrinks exponentially with depth when all λ_i are above or below 1."
  assumes: ["x_{l+1} = λ_l x_l + F(x_l, W_l) with scalar λ_l", "the same assumptions as c-propagation"]
  derivation: residual-gradient

- id: c-paths
  type: mathematical
  text: "Unrolled, a stack of n residual units with identity shortcuts is a sum over 2^n paths, one for each subset of the residual functions it goes through, and C(n, k) of them go through exactly k residual functions."
  assumes: ["x_{i+1} = x_i + F_i(x_i) for n units", "the expansion is of the product of the Jacobians (I + J_i), or of linear residual functions"]
  derivation: residual-gradient

- id: c-preact
  type: empirical
  text: "The pre-activation residual unit, with the identity mappings as the skip connections and after-addition activation, makes training easier and improves generalization: a 1001-layer ResNet reaches 4.62% error on CIFAR-10, with improved results on CIFAR-100 and with a 200-layer ResNet on ImageNet."
  scope:
    models: "residual networks of up to 1001 layers with pre-activation units, and a 200-layer ResNet on ImageNet"
    data: [cifar-10, cifar-100, imagenet]
    scale: "up to 1001 layers"
    setting: "image classification"
  evidence:
    - {work: "he-2016-identity-mappings", role: original, locator: "p. 1", stance: for}

- id: c-preact-fig1
  type: empirical
  text: "Trained on CIFAR-10, the 1001-layer ResNet with the original unit reaches 7.61% test error and the one with the proposed pre-activation unit 4.92%, and the proposed one also reaches a lower training loss."
  scope:
    models: "ResNet-1001 with the original and with the pre-activation unit"
    data: [cifar-10]
