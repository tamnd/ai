- id: c-ensembles
  type: empirical
  text: "Residual networks can be seen as a collection of many paths of differing length that show ensemble-like behavior, and most of the gradient in a residual network with 110 layers comes from paths that are only 10 to 34 layers deep."
  scope:
    models: "a 110-layer residual network"
    data: [cifar-10]
    scale: "110 layers"
    setting: "gradient magnitude by path length during training"
  evidence:
    - {work: "veit-2016-residual-networks-ensembles", role: original, locator: "the abstract", stance: for}

- id: c-lesion
  type: empirical
  text: "Deleting any layer of a trained VGG network reduces its performance to chance levels, while removing the residual module of a single block of a trained residual network leads to no noticeable change except for the downsampling blocks, which have a modest impact."
  scope:
    models: "a 15-layer VGG network and a 110-layer pre-activation residual network on CIFAR-10, and a 200-layer residual network on ImageNet"
    data: [cifar-10, imagenet]
    scale: "15 to 200 layers"
    setting: "deleting individual layers or modules at test time"
  evidence:
    - {work: "veit-2016-residual-networks-ensembles", role: original, locator: "Section 4.1", stance: for}


- id: c-shattered
  type: empirical
  text: "The correlation between the gradients of a feedforward network at nearby inputs decays exponentially with depth, so the gradients resemble white noise, while with skip connections it decays sublinearly."
  scope:
    models: "feedforward rectifier networks with and without batch normalization, and residual networks"
    data: [synthetic]
    scale: "up to about 200 layers"
    setting: "gradients of networks at initialization with respect to their inputs, by analysis and measurement on a grid of inputs"
  evidence:
    - {work: "balduzzi-2017-shattered-gradients", role: original, locator: "the abstract", stance: for}

- id: c-loss-landscape
  type: empirical
  text: "Without skip connections, the loss surface of CIFAR-10 networks goes from nearly convex at 20 layers to chaotic at 56 and 110 layers; with skip connections it does not, and the 0.1-level contour is almost the same at 20 and 110 layers."
  scope:
    models: "ResNet-20, -56 and -110 with and without shortcut connections"
    data: [cifar-10]
    scale: "20 to 110 layers"
    setting: "filter-normalized random two-dimensional slices of the training loss around the minimizer"
  evidence:
    - {work: "li-2018-visualizing-loss-landscape", role: original, locator: "Section 6", stance: for}

- id: c-linear-no-spurious
  type: attributive
  text: "Hardt and Ma prove that arbitrarily deep linear residual networks have no spurious local optima, a result that is substantially more delicate for linear feedforward networks in their standard parameterization."
  evidence:
    - {work: "hardt-2017-identity-matters", role: original, locator: "the abstract", stance: for}

# Training tricks and descendants

- id: c-zero-gamma
  type: attributive
  text: "Goyal et al. initialize the scale γ of the last batch normalization of each residual block to 0, so that the signals initially propagate through the identity shortcuts; they found it eases optimization at the start of training and improves all their models, most for large minibatches."
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "Section 5.1", stance: for}

- id: c-one-hour
  type: empirical
  text: "With a learning rate scaled linearly in the minibatch size and a warmup, ResNet-50 trains with a minibatch of 8192 on 256 GPUs in one hour and matches the accuracy of small-minibatch training."
  scope:
    models: "ResNet-50 with the stride on the 3x3 convolutions"
    data: [imagenet]
    scale: "minibatches of 256 to 8192, 90 epochs"
    setting: "distributed synchronous SGD on 256 GPUs"
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "the abstract", stance: for}

- id: c-v15
  type: definitional
  text: "The ResNet-50 variant used by Goyal et al. has the stride-2 convolutions on the 3x3 layers instead of on the 1x1 layers as in the original."
  evidence:
    - {work: "goyal-2017-accurate-large-minibatch-sgd", role: original, locator: "Section 5.1", stance: for}

- id: c-resnet-b
  type: definitional
  text: "ResNet-B, a tweak that first appeared in a Torch implementation of ResNet, switches the strides of the first two convolutions of the downsampling block, because the 1x1 convolution with a stride of 2 ignores three-quarters of the input feature map."
  evidence:
    - {work: "he-2019-bag-of-tricks", role: original, locator: "Section 4.2", stance: for}


- id: c-bag-of-tricks
  type: empirical
  text: "A set of training refinements and small model tweaks raises the top-1 validation accuracy of ResNet-50 on ImageNet from 75.3% to 79.29%."
  scope:
    models: "ResNet-50 and the tweaks ResNet-B, -C and -D"
    data: [imagenet]
    scale: "ResNet-50"
    setting: "ImageNet 2012 classification with cosine learning rate decay, label smoothing, distillation and mixup"
  evidence:
    - {work: "he-2019-bag-of-tricks", role: original, locator: "the abstract", stance: for}

- id: c-strikes-back
  type: empirical
  text: "Trained with a procedure that integrates later advances in optimization and data augmentation, a vanilla ResNet-50 reaches 80.4% top-1 accuracy at resolution 224 by 224 on ImageNet without extra data or distillation."
  scope:
    models: "ResNet-50"
    data: [imagenet]
    scale: "ResNet-50 at 224 by 224"
    setting: "ImageNet 2012 classification, evaluation on the validation set"
  evidence:
    - {work: "wightman-2021-resnet-strikes-back", role: original, locator: "the abstract", stance: for}

- id: c-training-matters
  type: empirical
  text: "Training and scaling strategies may matter more than architectural changes: improved training alone raises a canonical ResNet from 79.0% to 82.2% top-1 on ImageNet, and the resulting ResNet-RS models are 1.7 to 2.7 times faster than EfficientNets on TPUs at similar accuracy."
  scope:
    models: "ResNet and ResNet-RS of 50 to 420 layers, against EfficientNets"
    data: [imagenet]
    scale: "up to 192M parameters"
    setting: "ImageNet 2012 classification, training time per step on TPUs"
  evidence:
    - {work: "bello-2021-revisiting-resnets", role: original, locator: "the abstract", stance: for}

- id: c-convnext
  type: empirical
  text: "Gradually modernizing a standard ResNet toward the design of a vision Transformer gives a family of pure ConvNet models, ConvNeXt, which achieves 87.8% ImageNet top-1 accuracy."
  scope:
    models: "the ConvNeXt family, derived from ResNet-50 and ResNet-200"
    data: [imagenet]
    scale: "ConvNeXt-T to ConvNeXt-XL"
    setting: "ImageNet classification; the 87.8% is after pre-training on ImageNet-22K"
  evidence:
    - {work: "liu-2022-convnet-2020s", role: original, locator: "the abstract", stance: for}

- id: c-convnext-recipe
  type: empirical
  text: "A modern training recipe by itself increases the ImageNet top-1 accuracy of ResNet-50 from 76.1% to 78.8%."
  scope:
    models: "ResNet-50"
    data: [imagenet]
    scale: "ResNet-50"
    setting: "ImageNet-1K classification with 300 epochs, AdamW and modern data augmentation"
  evidence:
    - {work: "liu-2022-convnet-2020s", role: original, locator: "Section 2.1", stance: for}


- id: c-fixup
  type: empirical
  text: "Fixup, an initialization that solves the exploding and vanishing gradient problem at the beginning of training by properly rescaling a standard initialization, makes training residual networks as stable as training with normalization, even for networks with 10,000 layers."
  scope:
    models: "residual networks without normalization, of up to 10,000 layers"
    data: [cifar-10, imagenet]
    scale: "up to 10,000 layers"
    setting: "image classification and machine translation"
  evidence:
    - {work: "zhang-2019-fixup", role: original, locator: "the abstract", stance: for}


- id: c-stochastic-depth
  type: empirical
  text: "Stochastic depth trains short networks and uses deep ones at test time: for each mini-batch it drops a random subset of residual blocks and bypasses them with the identity, which reduces training time and lets residual networks grow beyond 1200 layers with better test error (4.91% on CIFAR-10)."
  scope:
    models: "residual networks of 110 to 1202 layers trained with stochastic depth"
    data: [cifar-10, cifar-100, svhn, imagenet]
    scale: "110 to 1202 layers"
    setting: "image classification"
  evidence:
    - {work: "huang-2016-stochastic-depth", role: original, locator: "the abstract", stance: for}

- id: c-wide
  type: empirical
  text: "Decreasing depth and increasing width works better: a 16-layer wide residual network outperforms in accuracy and efficiency all previous deep residual networks, including thousand-layer ones."
  scope:
    models: "wide residual networks against thin and deep ResNets"
    data: [cifar-10, cifar-100, svhn, imagenet]
    scale: "16 to 1001 layers"
    setting: "image classification"
  evidence:
    - {work: "zagoruyko-2016-wide-residual-networks", role: original, locator: "the abstract", stance: for}

- id: c-resnext
  type: empirical
  text: "Aggregating a set of transformations of the same topology in each block exposes cardinality, the size of the set, as a dimension besides depth and width; at equal complexity, increasing cardinality improves accuracy, and it is more effective than going deeper or wider when capacity grows."
  scope:
    models: "ResNeXt against ResNet of 50 and 101 layers"
    data: [imagenet]
    scale: "50 and 101 layers, at the complexity of the ResNet counterparts"
    setting: "ImageNet-1K classification"
  evidence:
    - {work: "xie-2017-aggregated-residual-transformations", role: original, locator: "the abstract", stance: for}

- id: c-densenet
  type: definitional
  text: "DenseNet connects each layer to every other layer in a feed-forward fashion, so a block of L layers has L(L + 1)/2 direct connections, and each layer takes the feature maps of all preceding layers as its input."
  evidence:
    - {work: "huang-2017-densely-connected-convolutional-networks", role: original, locator: "the abstract", stance: for}

- id: c-vgg
  type: historical
  text: "Before ResNet, VGG nets showed that pushing the depth to 16 to 19 weight layers with very small 3x3 convolution filters gives a significant improvement on the prior configurations."
  evidence:
    - {work: "simonyan-2015-very-deep-convolutional-networks", role: original, locator: "the abstract", stance: for}

- id: c-bn
  type: definitional
  text: "Batch normalization normalizes each activation over the mini-batch and then applies a learned scale and shift; with it, an image classifier reaches the same accuracy with 14 times fewer training steps."
  evidence:
    - {work: "ioffe-2015-batch-normalization", role: original, locator: "the abstract", stance: for}

