# The claims of the ResNet page (spec 07). The build computes the labels.

# The architecture

- id: c-resnet
  type: definitional
  text: "A residual network lets a few stacked layers fit a residual mapping F(x) := H(x) - x instead of the desired mapping H(x), and recasts the output as F(x) + x, which a shortcut connection that performs the identity mapping adds to the output of the stacked layers."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 3.1", stance: for}

- id: c-block
  type: definitional
  text: "He et al. define the building block as y = F(x, {W_i}) + x; for two layers F = W_2 σ(W_1 x), with σ the ReLU and the biases omitted. The operation F + x is performed by a shortcut connection and element-wise addition, on two feature maps channel by channel, and the second nonlinearity is applied after the addition."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "p. 3", stance: for}


- id: c-projection
  type: definitional
  text: "The dimensions of x and F must be equal in the identity block; if they are not, as when the input and output channels change, a linear projection W_s by the shortcut connections matches the dimensions, y = F(x, {W_i}) + W_s x. The identity mapping is sufficient for addressing the degradation problem, so W_s is only used when matching dimensions."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "p. 3", stance: for}


- id: c-single-layer
  type: attributive
  text: "He et al. use a residual function F of two or three layers; if F has only a single layer, the block is similar to a linear layer y = W_1 x + x, for which they have not observed advantages."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "p. 3", stance: for}


- id: c-design-rules
  type: definitional
  text: "The plain baselines of He et al. follow two rules inspired by VGG nets: layers with the same output feature map size have the same number of filters, and when the feature map size is halved the number of filters is doubled so as to preserve the time complexity per layer; downsampling is done by convolutions with a stride of 2, and the network ends with global average pooling and a 1000-way fully connected layer."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 3.3", stance: for}

- id: c-bottleneck
  type: definitional
  text: "For ResNet-50, -101 and -152, each residual function is a stack of three layers, 1x1, 3x3 and 1x1 convolutions, where the 1x1 layers reduce and then restore the dimensions and leave the 3x3 layer a bottleneck with smaller input and output dimensions; He et al. adopt it because of concerns on the training time they can afford."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}

- id: c-table1
  type: definitional
  text: "ResNet-50, ResNet-101 and ResNet-152 have a 7x7 convolution with stride 2 and a 3x3 max pooling with stride 2, then four stages of 3, 4, 6 and 3; 3, 4, 23 and 3; and 3, 8, 36 and 3 bottleneck blocks with 256, 512, 1024 and 2048 output channels, then average pooling and a 1000-way fully connected layer with softmax."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Table 1", stance: for}

- id: c-options
  type: definitional
  text: "He et al. compare three kinds of shortcut: (A) zero-padding for increasing dimensions, with all shortcuts parameter-free; (B) projections for increasing dimensions and identity elsewhere; (C) projections everywhere. ResNet-50, -101 and -152 use option B."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}

- id: c-training-recipe
  type: definitional
  text: "On ImageNet, He et al. adopt batch normalization right after each convolution and before activation, initialize the weights as in their earlier work on rectifiers, and train from scratch with SGD, a mini-batch size of 256, a learning rate that starts from 0.1 and is divided by 10 when the error plateaus, a weight decay of 0.0001 and a momentum of 0.9, without dropout."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 3.4", stance: for}


- id: c-he-init
  type: definitional
  text: "The initialization of He et al. for rectifier networks draws each weight from a zero-mean Gaussian with standard deviation sqrt(2 / n_l), where n_l = k^2 c is the number of connections of a response, and initializes the biases to 0."
  evidence:
    - {work: "he-2015-delving-deep-rectifiers", role: original, locator: "Section 2.2", stance: for}


- id: c-cifar-arch
  type: definitional
  text: "The CIFAR-10 networks of He et al. take 32x32 images; the first layer is 3x3 convolutions, then a stack of 6n layers with 3x3 convolutions on the feature maps of sizes 32, 16 and 8, with 2n layers for each feature map size and 16, 32 and 64 filters, and the network ends with a global average pooling, a 10-way fully-connected layer and softmax, so there are 6n + 2 stacked weighted layers; identity shortcuts are used in all cases, so the residual models have exactly the same depth, width and number of parameters as the plain ones."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "p. 7", stance: for}

# The degradation problem and its fix


- id: c-degradation
  type: empirical
  text: "As the depth of a plain network increases, accuracy saturates and then degrades, and the degradation is not caused by overfitting: adding more layers to a suitably deep plain model leads to a higher training error."
  scope:
    models: "plain convolutional networks with batch normalization: 18 and 34 layers on ImageNet, 20 to 56 layers on CIFAR-10"
    data: [imagenet, cifar-10]
    scale: "18 to 56 layers"
    setting: "image classification trained from scratch with SGD and momentum"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.2", stance: for}
    - {work: "srivastava-2015-highway-networks", role: replication, locator: "Section 3.1", stance: for}
  exp: [mnist-depth-22, mnist-depth-32]
  small_scale: "yes"
  small_scale_note: "He et al. themselves point to the same effect on MNIST: fully connected plain networks of a few dozen layers with batch normalization show it on a CPU in seconds."

- id: c-shortcuts-fix-degradation
  type: empirical
  text: "Adding identity shortcuts removes the degradation: the 34-layer residual network has a considerably lower training error than the 34-layer plain network with the same parameters, and reduces the top-1 error by 3.5%."
  scope:
    models: "plain and residual convolutional networks of 18 and 34 layers with batch normalization and option A shortcuts"
    data: [imagenet]
    scale: "18 and 34 layers, 1.8 and 3.6 billion FLOPs"
    setting: "ImageNet 2012 classification from scratch, 10-crop testing on the validation set"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.2", stance: for}
  exp: [mnist-depth-22, mnist-depth-32]
  small_scale: "yes"
  small_scale_note: "The comparison needs only a plain and a residual network of the same depth and width; fully connected networks on MNIST show it, as the highway networks of Srivastava et al. did."

- id: c-depth-gains
  type: empirical
  text: "With residual learning the situation is reversed: the 34-layer ResNet is better than the 18-layer ResNet by 2.8% top-1 and has a lower training error, so accuracy is gained from increased depth."
  scope:
    models: "residual convolutional networks of 18 and 34 layers with option A shortcuts"
    data: [imagenet]
    scale: "18 and 34 layers"
    setting: "ImageNet 2012 classification from scratch, 10-crop testing on the validation set"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}
  small_scale: "partial"
  small_scale_note: "The MNIST experiments of this page report it as a secondary test; at their budget of a few hundred steps the deep residual network is not expected to beat the shallow one."

- id: c-table2
  type: empirical
  text: "The top-1 errors on the ImageNet validation set with 10-crop testing are 27.94% for plain-18, 28.54% for plain-34, 27.88% for ResNet-18 and 25.03% for ResNet-34."
  scope:
    models: "plain and residual convolutional networks of 18 and 34 layers with option A shortcuts"
    data: [imagenet]
    scale: "18 and 34 layers"
    setting: "ImageNet 2012 classification from scratch, 10-crop testing on the validation set"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Table 2", stance: for}

- id: c-faster-convergence
  type: empirical
  text: "The 18-layer plain and residual networks are comparably accurate, but the 18-layer ResNet converges faster: when the network is not overly deep, SGD still finds good solutions for the plain network, and the residual one eases the optimization early in training."
  scope:
    models: "plain and residual convolutional networks of 18 layers"
    data: [imagenet]
    scale: "18 layers"
    setting: "ImageNet 2012 classification from scratch"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}

- id: c-more-iterations
  type: empirical
  text: "He et al. trained the plain networks for three times more iterations and still observed the degradation, so it cannot be feasibly addressed by simply training longer."
  scope:
    models: "plain convolutional networks of 18 and 34 layers"
    data: [imagenet]
    scale: "18 and 34 layers"
    setting: "ImageNet 2012 classification from scratch"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}

- id: c-not-vanishing
  type: attributive
  text: "He et al. argue that the degradation of their plain networks is unlikely to be caused by vanishing gradients, since batch normalization keeps the forward signals at non-zero variance and they verified that the backward gradients have healthy norms; they conjecture that deep plain networks may have exponentially low convergence rates."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}

- id: c-construction-argument
  type: attributive
  text: "He et al. note that there exists a solution by construction to a deeper model: the added layers are identity mapping and the other layers are copied from the learned shallower model, so a deeper model should produce no higher training error than its shallower counterpart; the degradation suggests that solvers might have difficulties in approximating identity mappings by multiple nonlinear layers."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 3.1", stance: for}


- id: c-identity-construction
  type: mathematical
  text: "A residual block whose last batch normalization has scale 0 and shift 0 computes the identity on non-negative inputs, such as the output of a ReLU, so a residual network with more blocks of the same width can compute every function that a shallower one computes."
  assumes: ["the block computes relu(BN(F(x)) + x) with the identity shortcut", "the input x of the block is the output of a ReLU, so x >= 0", "the added blocks keep the width of the stage"]
  derivation: identity-construction

- id: c-hypothesis
  type: attributive
  text: "He et al. hypothesize that it is easier to optimize the residual mapping than the original, unreferenced mapping: if an identity mapping were optimal, it would be easier to push the residual to zero than to fit an identity by a stack of nonlinear layers."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 1", stance: for}

- id: c-small-responses
  type: empirical
  text: "The outputs of the 3x3 layers of ResNets, after batch normalization and before the nonlinearity, have generally smaller standard deviations than those of their plain counterparts, and deeper ResNets have smaller responses, so each layer tends to modify the signal less."
  scope:
    models: "plain and residual networks of 20, 56 and 110 layers"
    data: [cifar-10]
    scale: "20 to 110 layers"
    setting: "CIFAR-10 classification"
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.2", stance: for}

# Counts

- id: c-no-extra-parameters
  type: mathematical
  text: "An identity shortcut adds no parameter and no multiply-add, only an element-wise addition, so a residual network has the same parameters, depth, width and cost as its plain counterpart."
  assumes: ["the shortcut is the identity: the dimensions of x and F(x) are equal"]
  derivation: parameter-count

- id: c-params
  type: mathematical
  text: "ResNet-50, ResNet-101 and ResNet-152 for 1000 classes have 25,557,032, 44,549,160 and 60,192,808 parameters, counting the weights of the convolutions, the scale and shift of each batch normalization and the weights and biases of the fully connected layer."
  assumes: ["option B shortcuts: a 1x1 projection with batch normalization in the first block of each stage", "the convolutions have no bias", "the running statistics of batch normalization are not counted", "1000 classes"]
  derivation: parameter-count

- id: c-bottleneck-projection-doubles
  type: mathematical
  text: "Replacing the identity shortcut of a 256-64-256 bottleneck block with a projection nearly doubles its size and cost: the three convolutions have 69,632 weights and the projection would add 65,536, because it connects the two 256-dimensional ends."
  assumes: ["the block of Figure 5 of He et al. (2016): 1x1 from 256 to 64, 3x3 at 64, 1x1 from 64 to 256", "the projection is a 1x1 convolution from 256 to 256 channels"]
  derivation: parameter-count

- id: c-cifar-params
  type: mathematical
  text: "The CIFAR-10 network of 6n + 2 layers has 464 + 4,672 n + 13,952 + 18,560 (n - 1) + 55,552 + 73,984 (n - 1) + 650 parameters: 269,722 for the 20 layers of n = 3 and 19,421,274 for the 1202 layers of n = 200, the 0.27M and 19.4M of Table 6 of He et al. (2016)."
  assumes: ["option A shortcuts with no parameters", "3x3 convolutions without bias, each followed by batch normalization with a scale and a shift", "a fully connected layer with a bias to 10 classes"]
  derivation: parameter-count

- id: c-flops
  type: mathematical
  text: "A bottleneck ResNet of base width w with N blocks, on an R by R image and with K classes, takes (w^2 R^2 / 16)(17 N + 19) + 147 w R^2 / 4 + 32 w K multiply-adds: 3.86, 7.57 and 11.28 billion for ResNet-50, -101 and -152 at 224 by 224, against the 3.8, 7.6 and 11.3 billion of Table 1 of He et al. (2016)."
  assumes: ["the stride of 2 of stages 2 to 4 is in the first 1x1 convolution, as in the paper", "the projections are counted; batch normalization, ReLU, poolings and additions are not", "R is a multiple of 32"]
  derivation: flop-count

- id: c-stage-invariance
  type: mathematical
  text: "Every bottleneck block but the first of a stage costs the same 17 w^2 R^2 / 16 multiply-adds in all four stages, because doubling the channels squares to four times the cost per position while halving the feature map gives four times fewer positions; so the cost of a ResNet grows linearly in the number of blocks, whichever stage they are added to."
  assumes: ["the design rule of He et al. (2016): the number of filters doubles when the feature map size halves", "the mid width of stage s is w 2^s and its output width 4 w 2^s"]
  derivation: flop-count

- id: c-stride-cost
  type: mathematical
  text: "Moving the stride of 2 from the first 1x1 convolution to the 3x3 convolution of each downsampling block, as in the ResNet-50 of Goyal et al. (2017) and ResNet-B of He et al. (2019), keeps the parameters and raises the cost of ResNet-50 from 3.86 to 4.09 billion multiply-adds at 224 by 224, because the first 1x1 convolution then runs on four times more positions; a 1x1 convolution with stride 2 reads only one position in four."
  assumes: ["ResNet-50 at 224 by 224 as in c-flops", "the stride is moved in the three downsampling blocks of stages 2 to 4"]
  derivation: flop-count

- id: c-complexity
  type: attributive
  text: "He et al. count 3.6 billion FLOPs (multiply-adds) for their 34-layer plain and residual networks, 18% of the 19.6 billion of VGG-19, and 11.3 billion for ResNet-152, which is 8 times deeper than VGG nets but still lower in complexity than VGG-16 and VGG-19 (15.3 and 19.6 billion)."
  evidence:
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 3.3", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "Section 4.1", stance: for}
    - {work: "he-2016-deep-residual-learning", role: original, locator: "the abstract", stance: for}

