  - {metric: train_error, at: final, compare: {treatment: res-32, control: plain-32}, direction: lower, test: mann-whitney, alpha: 0.01, min_effect: {kind: relative, value: 0.5}, note: "the shortcuts remove most of it"}
secondary:
