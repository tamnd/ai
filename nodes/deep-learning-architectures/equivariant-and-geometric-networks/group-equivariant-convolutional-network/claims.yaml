# The claims of the group-equivariant-convolutional-network page (spec 07). The build computes the labels.

# Equivariance and the planar correlation

- id: c-equivariance-more-useful
  type: attributive
  text: "Cohen and Welling argue that in deep learning general equivariance is more useful than invariance, because it is impossible to determine if features are in the right spatial configuration if they are invariant."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 2", stance: for}

- id: c-planar-translation
  type: mathematical
  text: "The planar correlation of a stack of maps with a stack of filters commutes with translations: correlating a shifted image gives the shifted output."
  assumes: ["the correlation sums over Z^2 and the channels", "the image and the filters have finite support"]
  derivation: group-correlation-equivariance

- id: c-planar-rotation
  type: mathematical
  text: "The correlation of an image turned by r with a filter equals the output of the original image with the filter turned back by r, turned by r; so unless the filter is invariant to the rotation, a planar correlation is not rotation equivariant."
  assumes: ["rotations by 90 degrees about the origin, a bijection of Z^2", "the image and the filters have finite support"]
  derivation: group-correlation-equivariance

- id: c-cnn-rotated-copies
  type: attributive
  text: "Cohen and Welling note that if an ordinary CNN learns rotated copies of the same filter, the stack of feature maps is equivariant, although individual feature maps are not."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 5, eq. 9", stance: for}

- id: c-cohen-weight-sharing
  type: attributive
  text: "Cohen and Welling describe G-convolutions as a layer with a substantially higher degree of weight sharing than regular convolution layers, which increases the expressive capacity of the network without increasing the number of parameters."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "the abstract", stance: for}

# The layers

- id: c-p4
  type: definitional
  text: "The group p4 consists of all compositions of translations and rotations by 90 degrees about any center of rotation in a square grid."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 4.2", stance: for}

- id: c-lift-equivariant
  type: mathematical
  text: "The lifting correlation, which reads the filter at g^-1 y for a group element g, is equivariant: correlating a transformed image gives the transformed p4 map, for every filter and every element of the group."
  assumes: ["G acts on the plane by g x = R^r x + t", "the image and the filters have finite support"]
  derivation: group-correlation-equivariance

- id: c-gconv-equivariant
  type: mathematical
  text: "The group correlation of a feature map on G with a filter on G, summing f(h) psi(g^-1 h) over h in G, is equivariant to every element of G, for every filter."
  assumes: ["G is a discrete group", "the feature maps and the filters have finite support"]
  derivation: group-correlation-equivariance

- id: c-pointwise-commutes
  type: mathematical
  text: "A pointwise nonlinearity commutes with the action of the group on feature maps."
  assumes: ["the nonlinearity acts on each value alone", "the group acts on feature maps by moving values"]
  derivation: nonlinearity-and-pooling

- id: c-bias-per-map
  type: mathematical
  text: "Adding a bias commutes with the action of p4 when the bias has one value per G-feature map, shared by its 4 rotation planes, and not when its values differ between planes."
  assumes: ["the action on p4 maps turns every plane and moves plane r - 1 to plane r"]
  derivation: nonlinearity-and-pooling

- id: c-cohen-bias
  type: attributive
  text: "Cohen and Welling write that a G-conv layer should have only one bias per G-feature map, not one per spatial feature plane, and that batch normalization should use a single scale and bias parameter per G-feature map in order to preserve equivariance."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 6.1", stance: for}

- id: c-cohen-residual
  type: attributive
  text: "Cohen and Welling note that the sum of two G-equivariant feature maps is also G-equivariant, so G-conv layers can be used in highway networks and residual networks."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 6.1", stance: for}

- id: c-cohen-pooling
  type: attributive
  text: "Cohen and Welling state that non-strided max pooling over a window moved by the group commutes with the action of the group."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 6.3, eq. 16 and 17", stance: for}

- id: c-cohen-subsampling
  type: attributive
  text: "Cohen and Welling generalize the stride of pooling to subsampling on a subgroup H of G, and note that the subsampled feature map is then equivariant to H but not to G."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 6.3", stance: for}

- id: c-stride-even-grid
  type: mathematical
  text: "Subsampling with stride 2, keeping the pixels with even indices, commutes with rotation by 90 degrees about the centre of an n by n grid when n is odd, and not when n is even."
  assumes: ["rotation about the centre maps index (i, j) to (n - 1 - j, i)"]
  derivation: nonlinearity-and-pooling

- id: c-coset-pooling
  type: mathematical
  text: "The maximum of a p4 map over its 4 rotation planes at each position is a planar map that turns with the input: pooling a turned p4 map gives the turned pooled map."
  assumes: ["the action on p4 maps turns every plane and moves plane r - 1 to plane r"]
  derivation: nonlinearity-and-pooling

- id: c-stacking
  type: mathematical
  text: "A composition of maps equivariant to G is equivariant to G, so any stack of lifting correlations, group correlations, shared biases, pointwise nonlinearities and window poolings is equivariant."
  assumes: ["each layer is equivariant to G"]
  derivation: group-correlation-equivariance

- id: c-cohen-stack
  type: attributive
  text: "Cohen and Welling write that since all layer types are equivariant, they can freely stack them into deep networks and expect G-conv parameter sharing to be effective at arbitrary depth."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 6.3", stance: for}

- id: c-model-invariant
  type: mathematical
  text: "The network made of a lifting layer, ReLU, a group correlation, ReLU, coset pooling over rotations, the mean over the plane and a linear head has logits invariant to rotations of the input by multiples of 90 degrees, and to cyclic translations when the correlations wrap around."
  assumes: ["rotations about the centre of the n by n grid", "biases shared by the rotation planes of each map"]
  derivation: nonlinearity-and-pooling

# Parameters and cost

- id: c-params
  type: mathematical
  text: "A p4 network with a lifting layer from C0 to C1 channels, a group correlation from C1 to C2 channels, k by k filters and a linear head of M classes has C1 C0 k^2 + C1 + 4 C2 C1 k^2 + C2 + M C2 + M parameters."
  assumes: ["one bias per G-feature map", "the group filters are functions on p4 restricted to a k by k window"]
  derivation: parameter-and-flop-count

- id: c-weight-sharing
  type: mathematical
  text: "A planar CNN with as many planar maps as the p4 network, 4 C1 and 4 C2, has 4 times as many convolution weights and the same FLOPs."
  assumes: ["the same filter side, padding and grid"]
  derivation: parameter-and-flop-count

- id: c-sqrt-rule
  type: mathematical
  text: "A group layer with a stabilizer of |S| elements matches the weights of a planar layer of C' channels with C' / sqrt(|S|) channels, and then has sqrt(|S|) times as many planar maps and costs |S| times the FLOPs."
  assumes: ["layers with as many channels in as out", "the same filter side and grid"]
  derivation: parameter-and-flop-count

- id: c-cohen-sqrt
  type: attributive
  text: "Cohen and Welling divide the number of filters by sqrt(4) = 2 in each p4 layer and by roughly sqrt(8), about 3, in each p4m layer, so that the number of parameters is left approximately invariant while the size of the internal representation is increased."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 8", stance: for}

- id: c-filter-bank
  type: mathematical
  text: "The p4 group correlation equals one planar correlation of the 4 C_in input planes with the augmented bank F+[o, r, c, s] = L_r W[o, c, s - r mod 4], reshaped to (4 C_out, 4 C_in, k, k)."
  assumes: ["every element of p4 is a translation times a rotation about the origin", "L is an action"]
  derivation: split-filter-bank

- id: c-bank-permutation
  type: mathematical
  text: "Each filter of the augmented p4 bank is a permutation of the entries of a stored filter, so the bank holds each stored weight exactly 4 times and building it needs no arithmetic."
  assumes: ["the filter side k is odd, so that rotation about the centre maps the k by k array onto itself"]
  derivation: split-filter-bank

- id: c-bank-cost
  type: mathematical
  text: "A p4 group correlation costs as many FLOPs as a planar correlation with 4 C_out output and 4 C_in input planes, and a lifting layer as one with 4 C_out outputs and C_in inputs."
  assumes: ["the cost of building the bank is not counted, being a permutation"]
  derivation: split-filter-bank

- id: c-cohen-cost
  type: attributive
  text: "Cohen and Welling write that the computational cost of their algorithm is roughly equal to that of a planar convolution with a filter bank of the same size as the augmented filter bank, because the cost of the filter transformation, a permutation of the entries of each filter, is negligible."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Sections 7 and 7.1", stance: for}

- id: c-flops
  type: mathematical
  text: "The forward pass of the p4 network over B images of n by n with 'same' padding costs 2 B n^2 k^2 (4 C1 C0 + 16 C2 C1) + 2 B C2 M FLOPs, counting a multiply-add as two and leaving out biases, ReLUs and poolings."
  assumes: ["'same' padding keeps the grid at n by n", "a multiply-add counts as 2 FLOPs"]
  derivation: parameter-and-flop-count

- id: c-shared-gradient
  type: mathematical
  text: "The gradient of the loss with respect to a stored weight of a p4 filter is the sum of the gradients of its 4 copies in the augmented bank, each turned back by the rotation that placed it."
  assumes: ["the bank is built from the stored weights by eq-bank"]
  derivation: split-filter-bank

# Inductive biases

- id: c-linear-invariant-average
  type: mathematical
  text: "A linear map invariant to a finite group G depends on its input only through the group average of the input; for the cyclic shifts of an image that is the mean of each channel."
  assumes: ["G is finite and acts linearly", "the map is linear and invariant"]
  derivation: linear-invariant-is-group-average

- id: c-bronstein-average
  type: mathematical
  text: "A linear G-invariant function depends on its input only through the G-average, which for images and translation would entail using only the average RGB color of the input."
  assumes: ["G is a group with a Haar measure acting linearly on the signals", "the function is linear and G-invariant"]
  evidence:
    - {work: "bronstein-2021-geometric-deep-learning", role: review, locator: "Section 3.5", stance: for}

- id: c-why-equivariant-layers
  type: mathematical
  text: "A linear equivariant map followed by a pointwise nonlinearity is equivariant, and its group average is an invariant that is not in general a function of the group average of the input."
  assumes: ["G is finite and acts by moving values", "the nonlinearity acts on each value alone"]
  derivation: linear-invariant-is-group-average

- id: c-bronstein-blueprint
  type: definitional
  text: "The geometric deep learning blueprint of Bronstein et al. is an architecture whose main building blocks are a local equivariant map, a global invariant map and a coarsening operator."
  evidence:
    - {work: "bronstein-2021-geometric-deep-learning", role: review, locator: "Section 3.5", stance: for}

- id: c-kondor
  type: attributive
  text: "Kondor and Trivedi prove that, given some natural constraints, convolutional structure is not just a sufficient but also a necessary condition for equivariance to the action of a compact group."
  evidence:
    - {work: "kondor-2018-generalization-equivariance-convolution", role: original, locator: "the abstract", stance: for}

- id: c-premature-invariance
  type: empirical
  text: "On rotated MNIST, a network that follows each p4 correlation with coset pooling over rotations has a test error of 3.21%, against 2.28% for the P4CNN that pools over rotations only after the last layer and 5.03% for the planar baseline."
  scope:
    models: "the P4CNNRotationPooling, the P4CNN and the Z2CNN of Cohen and Welling, seven convolution layers each"
    data: ["rotated MNIST"]
    setting: "supervised classification, 10000 training and 50000 test digits, the test error"
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 8.1, Table 1", stance: for}

- id: c-cifar-not-symmetric
  type: attributive
  text: "Cohen and Welling note that CIFAR is not actually symmetric, since objects typically appear upright, yet G-convolutions substantially increase accuracy on it, indicating that a full symmetry is not needed for them to be beneficial."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 9", stance: for}

# Evidence

- id: c-mnist-rot
  type: empirical
  text: "On rotated MNIST the P4CNN has a test error of 2.28%, against 5.03% for a planar CNN of the same depth and about the same number of parameters and 3.98% for the model of Schmidt and Roth (2012)."
  scope:
    models: "the P4CNN and the Z2CNN of Cohen and Welling, and the model of Schmidt and Roth (2012)"
    data: ["rotated MNIST"]
    setting: "supervised classification, 10000 training and 50000 test digits, the test error"
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 8.1, Table 1", stance: for}

- id: c-cifar
  type: empirical
  text: "On CIFAR-10 without and with moderate augmentation, the test errors are 9.44% and 8.86% for a planar All-CNN-C, 8.84% and 7.67% with p4 and 7.59% and 7.04% with p4m convolutions, and 9.45% and 5.61% for a planar ResNet44 against 6.46% and 4.94% with p4m."
  scope:
    models: "All-CNN-C and a 44-layer ResNet, with planar, p4 or p4m convolutions and about the same number of parameters"
    data: ["CIFAR-10"]
    setting: "supervised classification, with and without flips and small translations, the test error"
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Table 2", stance: for}

- id: c-wide-resnet
  type: empirical
  text: "A 26-layer wide ResNet trained with moderate augmentation has a test error of 5.27% on CIFAR-10 with planar convolutions and 4.19% with p4m convolutions, comparable to the 4.17% of a wide ResNet of 36.5 M parameters against its 7.2 M."
  scope:
    models: "a 26-layer ResNet with planar or p4m convolutions, and the wide ResNet of Zagoruyko and Komodakis (2016)"
    data: ["CIFAR-10"]
    setting: "supervised classification with flips and small translations, the test error"
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 8", stance: for}

- id: c-weiler-mnist
  type: empirical
  text: "On rotated MNIST the test error falls from 2.28% for the P4CNN to 0.682% for an E(2)-steerable CNN equivariant to 16 rotations and reflections, restricted to the 16 rotations at a later depth."
  scope:
    models: "the P4CNN and the E(2)-steerable CNNs of Weiler and Cesa"
    data: ["rotated MNIST"]
    setting: "supervised classification, the test error of the final runs"
  evidence:
    - {work: "weiler-2019-general-e2-equivariant-steerable-cnns", role: original, locator: "Table 5", stance: for}

- id: c-weiler-cifar
  type: empirical
  text: "Equivariant wide ResNets 28/10 of about the same number of parameters reach test errors of 2.91% on CIFAR-10 and 16.22% on CIFAR-100, against 3.87% and 18.80% for the planar model, and 2.05% and 14.30% with AutoAugment, against 2.6% and 17.1%."
  scope:
    models: "wide ResNets 28/10 with planar or E(2)-steerable convolutions"
    data: ["CIFAR-10", "CIFAR-100"]
    setting: "supervised classification, with and without AutoAugment, the test error"
  evidence:
    - {work: "weiler-2019-general-e2-equivariant-steerable-cnns", role: original, locator: "Section 3.5, Table 6", stance: for}

# Limitations

- id: c-discrete-only
  type: attributive
  text: "Cohen and Welling write that one limitation of their method is that it only works for discrete groups, since convolution on continuous groups is well defined but may be hard to approximate in an equivariant manner."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 9", stance: for}

- id: c-enumeration
  type: attributive
  text: "Cohen and Welling note the challenge, identified by Gens and Domingos, that a full enumeration of transformations in a group may not be feasible if the group is large."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 9", stance: for}

# Variants

- id: c-weiler-def
  type: attributive
  text: "Weiler and Cesa give a general description of E(2)-equivariant convolutions in the framework of steerable CNNs, whose kernel constraints depend on group representations and reduce to constraints under irreducible representations."
  evidence:
    - {work: "weiler-2019-general-e2-equivariant-steerable-cnns", role: original, locator: "the abstract", stance: for}

- id: c-zaheer-invariant
  type: mathematical
  text: "A function on sets whose elements come from a countable universe is invariant to the permutation of the elements if and only if it can be decomposed as rho(sum over x of phi(x)) for suitable transformations phi and rho."
  assumes: ["the elements come from a countable universe"]
  evidence:
    - {work: "zaheer-2017-deep-sets", role: original, locator: "Section 2, Theorem 2", stance: for}

- id: c-zaheer-equivariant
  type: mathematical
  text: "A layer x -> sigma(Theta x) on R^M is permutation equivariant if and only if Theta = lambda I + gamma 1 1^T for real lambda and gamma."
  assumes: ["Theta is an M by M matrix and sigma acts on each value alone"]
  evidence:
    - {work: "zaheer-2017-deep-sets", role: original, locator: "Section 2, Lemma 3", stance: for}

- id: c-satorras
  type: attributive
  text: "Satorras et al. introduce E(n) equivariant graph neural networks, equivariant to rotations, translations, reflections and permutations, which do not require computationally expensive higher-order representations in intermediate layers."
  evidence:
    - {work: "satorras-2021-en-equivariant-graph-neural-networks", role: original, locator: "the abstract", stance: for}

- id: c-cohen-augmentation
  type: attributive
  text: "Cohen and Welling report that G-CNNs benefit from data augmentation in the same way as convolutional networks, as long as the augmentation comes from a group larger than G."
  evidence:
    - {work: "cohen-2016-group-equivariant-convolutional-networks", role: original, locator: "Section 9", stance: for}

