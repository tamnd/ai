- id: c-s4-lra-original
  type: empirical
  text: "S4 (original) in Table 10 scores 58.35 on ListOps, 76.02 on Text, 87.09 on Retrieval, 87.26 on Image, 86.05 on Pathfinder and 88.10 on Path-X, an Avg of 80.48."
  scope:
