# The claims of the structured state space model page (spec 07). The build computes the labels.

# The model and its two views

- id: c-ssm-definition
  type: definitional
  text: "The state space model x'(t) = A x(t) + B u(t), y(t) = C x(t) + D u(t) maps a 1-D input signal u(t) to an N-D latent state x(t) before projecting to a 1-D output signal y(t), and in a deep SSM A, B, C and D are parameters learned by gradient descent."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.1", stance: for}

- id: c-d-skip
  type: attributive
  text: "Gu, Goel and Ré omit the parameter D in their exposition, because the term D u can be viewed as a skip connection and is easy to compute."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.1", stance: for}

- id: c-zoh
  type: mathematical
  text: "Zero-order hold computes the right-hand side in closed form, assuming a constant input over each step Δ, and gives the discrete model x_k = Ā x_{k-1} + B̄ u_k with Ā = e^{Δ A} and B̄ = A^{-1}(e^{Δ A} - I) B for invertible A."
  assumes: ["A and B are constant in time", "the input is constant on each step", "A is invertible for the closed form of B̄"]
  derivation: discretization
  evidence:
    - {work: "gu-2020-hippo", role: original, locator: "page 21", stance: for}

- id: c-bilinear
  type: mathematical
  text: "The bilinear method converts the state matrix A into an approximation Ā = (I - Δ/2 · A)^{-1}(I + Δ/2 · A), with B̄ = (I - Δ/2 · A)^{-1} Δ B."
  assumes: ["A and B are constant in time", "I - Δ/2 A is invertible"]
  derivation: discretization
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.3", stance: for}

- id: c-stability
  type: mathematical
  text: "If every eigenvalue of A has a negative real part, then every eigenvalue of Ā has modulus less than 1 under both zero-order hold and the bilinear rule, for every step size Δ > 0; the bilinear rule maps the imaginary axis to the unit circle and the right half-plane outside it."
  assumes: ["Δ > 0", "A is constant in time"]
  derivation: discretization

- id: c-rules-agree
  type: mathematical
  text: "For a scalar a, the bilinear Ā minus the zero-order-hold Ā is (Δ a)^3 / 12 plus terms of order Δ^4, so the two rules agree to second order in the step size."
  assumes: ["a is a fixed scalar", "Δ tends to 0"]
  derivation: discretization

- id: c-convolution-view
  type: mathematical
  text: "With the initial state x_{-1} = 0 and time-invariant Ā, B̄, C, unrolling the recurrence x_k = Ā x_{k-1} + B̄ u_k, y_k = C x_k writes it as a discrete convolution y = K * u with the convolution kernel K = (C B̄, C Ā B̄, ..., C Ā^{L-1} B̄)."
  assumes: ["x_{-1} = 0", "Ā, B̄ and C do not depend on the position or on the input"]
  derivation: recurrence-convolution
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.4", stance: for}

- id: c-causal
  type: mathematical
  text: "The output of the discrete SSM at position k does not depend on the inputs after position k."
  assumes: ["x_{-1} = 0", "the recurrence runs forward in time"]
  derivation: recurrence-convolution

- id: c-impulse
  type: mathematical
  text: "The response of the discrete SSM to a unit impulse at position 0 is the kernel K, plus D at position 0."
  assumes: ["x_{-1} = 0", "time-invariant parameters"]
  derivation: recurrence-convolution

- id: c-diagonal-kernel
  type: mathematical
  text: "When Ā is diagonal with entries ā_n, the kernel is K_l = sum_n C_n B̄_n ā_n^l, the product of the vector C ∘ B̄ with a Vandermonde matrix."
  assumes: ["Ā is diagonal"]
  derivation: recurrence-convolution
  evidence:
    - {work: "gu-2022-diagonal-state-space-models-s4d", role: original, locator: "equation 7", stance: for}

- id: c-conjugation
  type: mathematical
  text: "Conjugation is an equivalence relation on SSMs: (A, B, C) ∼ (V^{-1} A V, V^{-1} B, C V)."
  assumes: ["V is invertible"]
  derivation: recurrence-convolution
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.1", stance: for}

- id: c-mode-costs
  type: mathematical
  text: "For a diagonal state matrix with N entries, one step of the recurrence costs O(N) operations and O(N) state per channel; the kernel of length L costs O(N L) by direct summation, and the causal convolution of length L by the FFT costs O(L log L)."
  assumes: ["Ā is diagonal", "the convolution is computed with an FFT of length 2L"]
  derivation: recurrence-convolution

# HiPPO and S4

- id: c-hippo-framework
  type: attributive
  text: "Gu, Dao, Ermon, Rudra and Ré introduce HiPPO as a framework for the online compression of continuous signals and discrete time series by projection onto polynomial bases, which, given a measure of the importance of each time in the past, produces an optimal solution to an online function approximation problem."
  evidence:
    - {work: "gu-2020-hippo", role: original, locator: "the abstract", stance: for}

- id: c-hippo-legs
  type: definitional
  text: "The scaled Legendre measure LegS of HiPPO assigns uniform weight to all of the history [0, t], and its continuous-time dynamics are d/dt c(t) = -(1/t) A c(t) + (1/t) B f(t) with A_nk = (2n+1)^{1/2}(2k+1)^{1/2} if n > k, n + 1 if n = k, 0 if n < k, and B_n = (2n+1)^{1/2}."
  evidence:
    - {work: "gu-2020-hippo", role: original, locator: "Section 3", stance: for}

- id: c-hippo-timescale
  type: mathematical
  text: "The HiPPO-LegS operator is timescale-equivariant: for any scalar α > 0, if h(t) = f(α t), then hippo(h)(t) = hippo(f)(α t)."
  assumes: ["the LegS measure"]
  evidence:
    - {work: "gu-2020-hippo", role: original, locator: "Section 3", stance: for}

- id: c-hippo-in-s4
  type: definitional
  text: "S4 calls the matrix A_nk = -(2n+1)^{1/2}(2k+1)^{1/2} if n > k, -(n+1) if n = k, 0 if n < k the HiPPO matrix."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.2", stance: for}

- id: c-s4-init
  type: definitional
  text: "An S4 layer is parameterized by first initializing an SSM with A set to the HiPPO matrix."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.4", stance: for}

- id: c-hippo-smnist
  type: attributive
  text: "Gu, Goel and Ré report that the LSSL found that changing an SSM from a random matrix A to the HiPPO matrix improved its performance on sequential MNIST from 60% to 98%."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 2.2", stance: for}

- id: c-lssl-cost
  type: attributive
  text: "Gu, Goel and Ré state that computing the latent state of the LSSL takes O(N^2 L) operations and O(N L) space for state dimension N and length L."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 1", stance: for}

- id: c-hippo-nplr
  type: mathematical
  text: "The HiPPO matrix of S4 equals S - P P^T with P_n = (n + 1/2)^{1/2} and S = -I/2 + J for a skew-symmetric J, so it is a normal matrix plus a rank-one matrix, and the eigenvalues of the normal part all have real part -1/2."
  assumes: ["the HiPPO matrix of equation (2) of S4"]
  derivation: hippo-nplr

- id: c-s4-nplr
  type: mathematical
  text: "All HiPPO matrices have a normal plus low-rank (NPLR) representation A = V Λ V^* - P Q^T for unitary V, diagonal Λ and low-rank P, Q, and the HiPPO matrix of equation (2) is NPLR with r = 1."
  assumes: ["the HiPPO matrices of Gu et al. (2020): LegS, LegT and LagT"]
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.2", stance: for}

- id: c-hippo-eigs
  type: mathematical
  text: "The N by N HiPPO matrix of S4 is lower triangular with eigenvalues -1, -2, ..., -N."
  assumes: ["the HiPPO matrix of equation (2) of S4"]
  derivation: hippo-nplr

- id: c-hippo-conditioning
  type: mathematical
  text: "In our computation with numpy.linalg.eig, the matrix of unit-norm eigenvectors of the HiPPO matrix has condition number about 7.7e4 for N = 8 and 8.3e10 for N = 16."
  assumes: ["the HiPPO matrix of equation (2) of S4", "eigenvectors normalized to unit length", "double precision"]
  derivation: hippo-nplr

- id: c-hippo-diag-unstable
  type: attributive
  text: "Gu, Goel and Ré show that the HiPPO matrix is diagonalized by a matrix with entries of magnitude up to about 2^{4N/3}, which makes the naive diagonalization numerically infeasible."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.1", stance: for}

- id: c-s4-recurrence-cost
  type: mathematical
  text: "For a state matrix in diagonal plus low-rank form, one step of the bilinear recurrence of S4 can be computed in O(N) operations, for any step size."
  assumes: ["A is diagonal plus low rank", "the bilinear discretization"]
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.3", stance: for}

- id: c-s4-kernel-cost
  type: mathematical
  text: "For a state matrix in diagonal plus low-rank form, computing the S4 convolution kernel reduces to 4 Cauchy multiplies, which take Õ(N + L) operations and O(N + L) space."
  assumes: ["A is diagonal plus low rank", "the kernel is computed through its truncated generating function at the roots of unity"]
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.3", stance: for}

- id: c-s4-layer
  type: definitional
  text: "An S4 layer has 5N trainable parameters Λ, P, Q, B and C for a diagonal Λ, handles H features with H independent copies of itself, and mixes them with a position-wise linear layer, with nonlinear activations between layers."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.4", stance: for}

- id: c-s4-pp-fix
  type: attributive
  text: "Gu, Goel and Ré note that follow-up work found this version of S4 can suffer numerical instabilities when A has eigenvalues in the right half-plane, and changed the parameterization from Λ - P Q^* to Λ - P P^*."
  evidence:
    - {work: "gu-2021-structured-state-spaces-s4", role: original, locator: "Section 3.4", stance: for}

- id: c-s4-lra
  type: empirical
  text: "In Table 4, S4 scores 59.60 on ListOps, 86.82 on Text, 90.90 on Retrieval, 88.65 on Image, 94.20 on Pathfinder and 96.35 on Path-X, an Avg of 86.09, against an Avg of at most 59.37 for the Transformer variants and other models in the table."
