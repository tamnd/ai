# Diagonal variants and linear RNNs

- id: c-dss
  type: empirical
  text: "The Diagonal State Space model, with a diagonal state matrix and no low-rank correction, matches the performance of S4 on Long Range Arena and on speech classification on Speech Commands."
  scope:
    models: "DSS and S4"
    data: [long-range-arena, speech-commands]
    scale: "unknown"
    setting: "the benchmarks of the S4 paper"
  evidence:
    - {work: "gupta-2022-diagonal-state-spaces", role: original, locator: "the abstract", stance: for}

- id: c-s4d-limit
  type: attributive
  text: "Gu, Gupta, Goel and Ré explain why DSS works by showing that the diagonal restriction of the S4 matrix recovers the same kernel in the limit of infinite state dimension."
  evidence:
    - {work: "gu-2022-diagonal-state-space-models-s4d", role: original, locator: "the abstract", stance: for}

- id: c-s4d
  type: empirical
  text: "S4D, a diagonal version of S4 whose kernel computation takes two lines of code, performs comparably to S4 in almost all settings and averages 85% on Long Range Arena."
  scope:
    models: "S4D and S4"
    data: [long-range-arena]
    scale: "unknown"
    setting: "the controlled study of the S4D paper"
  evidence:
    - {work: "gu-2022-diagonal-state-space-models-s4d", role: original, locator: "the abstract", stance: for}

- id: c-s4d-lin
  type: definitional
  text: "The S4D-Lin initialization sets A_n = -1/2 + i π n."
  evidence:
    - {work: "gu-2022-diagonal-state-space-models-s4d", role: original, locator: "Section 4", stance: for}

- id: c-lru
  type: empirical
  text: "A deep RNN with a linear recurrence, complex diagonal recurrent matrices, an exponential parameterization and a normalization of the hidden activations, the Linear Recurrent Unit, matches deep SSMs on all tasks of Long Range Arena."
  scope:
    models: "the Linear Recurrent Unit and deep SSMs"
    data: [long-range-arena]
    scale: "unknown"
    setting: "the deep architecture of Orvieto et al. (2023) with MLP blocks between recurrent layers"
  evidence:
    - {work: "orvieto-2023-resurrecting-recurrent-neural-networks", role: original, locator: "Section 1", stance: for}

- id: c-lru-linear
  type: empirical
  text: "Replacing SSM layers with vanilla RNN layers with tanh or ReLU lowers the performance on Long Range Arena, and removing the nonlinearity in the recurrence gives a substantial gain in test accuracy."
  scope:
    models: "deep RNNs in the architecture of deep SSMs"
    data: [long-range-arena]
    scale: "unknown"
    setting: "the ablations of Section 3.1"
  evidence:
    - {work: "orvieto-2023-resurrecting-recurrent-neural-networks", role: original, locator: "Section 1", stance: for}

- id: c-lru-discretization
  type: attributive
  text: "Orvieto et al. conclude that the success of diagonal SSMs comes from linear recurrences and complex diagonal exponential matrices with the normalization and initialization induced by discretization, while the parameter sharing and the continuous-time interpretation of discretization do not necessarily contribute."
  evidence:
    - {work: "orvieto-2023-resurrecting-recurrent-neural-networks", role: original, locator: "Section 4", stance: for}

# Selection

- id: c-mamba-selection
  type: definitional
  text: "The selective SSM of Mamba makes Δ, B and C functions of the input, so the model changes from time-invariant to time-varying and loses the equivalence to convolutions."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Section 3.2", stance: for}

- id: c-selective-gate
  type: mathematical
  text: "With N = 1, A = -1, B = 1, s_Δ = Linear(x) and τ_Δ = softplus, the selective SSM recurrence takes the form h_t = (1 - g_t) h_{t-1} + g_t x_t with g_t = σ(Linear(x_t))."
  assumes: ["zero-order hold", "Δ_t = softplus(z_t)"]
  derivation: selective-scan
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Section 3.5.1", stance: for}

- id: c-selective-no-kernel
  type: mathematical
  text: "When the step size depends on the input, the map from u to y is not linear in u, so no convolution kernel K gives y = K * u."
  assumes: ["Δ_k is a non-affine function of u_k, such as softplus of a linear map"]
  derivation: selective-scan

- id: c-scan-associative
  type: mathematical
  text: "The steps x_k = a_k x_{k-1} + b_k of a diagonal time-varying recurrence compose under the associative operator (a_1, b_1) • (a_2, b_2) = (a_2 a_1, a_2 b_1 + b_2), so a parallel prefix scan computes all states in O(log L) depth."
  assumes: ["the a_k are diagonal", "x_{-1} = 0"]
  derivation: selective-scan

- id: c-mamba-scan
  type: attributive
  text: "Gu and Dao compute the selective SSM with a parallel scan and kernel fusion that keeps the expanded state in fast GPU memory instead of materializing it in high-bandwidth memory, and recompute the intermediate states in the backward pass."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Section 3.3.2", stance: for}

- id: c-lti-selective-copying
  type: attributive
  text: "Gu and Dao note that global convolutions can solve the standard Copying task, which only needs awareness of time, but have difficulty with the Selective Copying task, which varies the positions of the tokens to memorize and so needs awareness of content."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Section 3.1", stance: for}

- id: c-mamba-lm
  type: empirical
  text: "Mamba has 5 times higher inference throughput than Transformers and linear scaling in sequence length, and on language modeling Mamba-3B outperforms Transformers of the same size and matches Transformers twice its size, in pretraining and downstream evaluation."
  scope:
    models: "Mamba and Transformer language models up to a few billion parameters"
    data: [the-pile]
    scale: "up to about 3B parameters"
    setting: "autoregressive language modeling"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "the abstract", stance: for}

