- id: c-path-x
  type: empirical
  text: "S4 is the first model to solve the Path-X task of length 16384, with 88% accuracy compared to 50% random guessing for all prior work."
  scope:
    models: "S4 and the models of the Long Range Arena paper and its follow-ups"
