# SPDX-License-Identifier: MIT
# The shape contract of the Mamba language model (spec 08.6) as the reference code of the authors builds it: a token
# embedding, L Mamba blocks each with a pre-RMSNorm and a residual connection, a final RMSNorm and an output layer tied
# to the embedding. The block projects the D-wide stream to two branches of width I = E D, runs a causal depthwise
# convolution of width K, SiLU and the selective SSM with a state of N per channel on one branch, gates it by SiLU of
# the other and projects back to D. Delta comes from a projection of rank R. The FLOPs count the matrix products, the
# readout of the scan among them, a multiply-add as 2; the elementwise work, the depthwise convolution and the update
# of the state among it, is left out as on every page, and elementwise_flops gives those two.
config:
  d_model:  {meaning: "width of the residual stream", symbol: "D", example: 8}
  n_layers: {meaning: "number of Mamba blocks", symbol: "L", example: 2, sample: [1, 3]}
  expand:   {meaning: "expansion factor of the inner width", symbol: "E", example: 2, sample: [1, 3]}
  d_inner:  {meaning: "width of the two inner branches, the channels of the SSM", symbol: "I", formula: "expand * d_model"}
  d_state:  {meaning: "size of the SSM state of each channel", symbol: "N", example: 4, sample: [1, 6]}
  d_conv:   {meaning: "width of the causal depthwise convolution", symbol: "K", example: 3, sample: [1, 4]}
  dt_rank:  {meaning: "rank of the projection that computes Delta, ceil(d_model / 16) in the reference code", symbol: "R", example: 1, sample: [1, 3]}
  vocab:    {meaning: "size of the vocabulary, padded to a multiple of 8 in the released models", symbol: "V", example: 11, sample: [5, 20]}
axes:
  B: {meaning: "batch", example: 2}
  T: {meaning: "sequence length", example: 8}
  D: d_model
  I: d_inner
  N: d_state
  K: d_conv
  R: dt_rank
  V: vocab
blocks:
  - id: embed
    meaning: "the token embedding, a lookup with no FLOPs; the same matrix is the output layer"
    inputs: {tokens: "(B, T)"}
    outputs: {r: "(B, T, D)"}
    params: "V * D"
    flops_forward: "0"
  - id: mixer
    meaning: "one Mamba block with its RMSNorm: in_proj to x and z, the causal convolution and SiLU, x_proj to Delta (rank R), B and C, dt_proj, the selective scan, the skip D x, the gate SiLU(z) and out_proj, added to the stream"
    eq: [block, selection, scan]
    inputs: {r: "(B, T, D)"}
    outputs: {r: "(B, T, D)"}
    internals: {x: "(B, T, I)", z: "(B, T, I)", delta: "(B, T, I)", B_t: "(B, T, N)", C_t: "(B, T, N)", h: "(B, I, N)", conv_state: "(B, K - 1, I)"}
    params: "3 * I * D + I * (K + 1) + I * (R + 2 * N) + (R + 1) * I + I * N + I + D"
    flops_forward: "2 * B * T * (2 * D * I + I * (R + 2 * N) + R * I + I * N + I * D)"
  - id: head
    meaning: "the final RMSNorm and the output layer, the transposed embedding"
    inputs: {r: "(B, T, D)"}
    outputs: {logits: "(B, T, V)"}
    params: "D"
    flops_forward: "2 * B * T * D * V"
model:
  params: {formula: "embed.params + n_layers * mixer.params + head.params", symbol: "P", meaning: "all the parameters, the output layer counted once since it is tied to the embedding"}
  flops_forward: {formula: "embed.flops_forward + n_layers * mixer.flops_forward + head.flops_forward", symbol: "C", meaning: "FLOPs of one forward pass over B sequences of T tokens, a multiply-add counted as 2"}
  elementwise_flops: {formula: "2 * B * T * n_layers * I * (K + N)", meaning: "the multiply-adds of the depthwise convolution and of the update of the state, elementwise and not in flops_forward"}
  projection_params: {formula: "n_layers * 3 * I * D", meaning: "the parameters of in_proj and out_proj, the 3 E D^2 per block of the paper"}
  recurrent_state: {formula: "B * n_layers * I * (K - 1 + N)", meaning: "the numbers carried from one token to the next in generation, the same at every length"}
  sources:
    - {work: gu-2023-mamba, locator: "p. 7", note: "Section 3.4, the block, its 3 E D^2 parameters and the choice E = 2"}
    - {work: state-spaces-mamba-simple-v2-3-2, locator: "p. 1", note: "the shapes of the projections, the convolution, A_log, D and dt_proj, and dt_rank = ceil(d_model / 16)"}
configs:
  mamba_130m: {meaning: "Mamba-130M, the released model of 24 blocks of width 768", B: 1, T: 2048, d_model: 768, n_layers: 24, expand: 2, d_state: 16, d_conv: 4, dt_rank: 48, vocab: 50280, source: {work: state-spaces-2023-mamba-130m-config, locator: "p. 1", note: "d_model, n_layer and the vocabulary of 50,277 padded to a multiple of 8; the other sizes are the defaults of the reference code"}}
  mamba_370m: {meaning: "Mamba-370M, 48 blocks of width 1024, the 350M setting of the paper's ablations", B: 1, T: 2048, d_model: 1024, n_layers: 48, expand: 2, d_state: 16, d_conv: 4, dt_rank: 64, vocab: 50280, source: {work: state-spaces-2023-mamba-370m-config, locator: "p. 1"}}
  mamba_790m: {meaning: "Mamba-790M, 48 blocks of width 1536", B: 1, T: 2048, d_model: 1536, n_layers: 48, expand: 2, d_state: 16, d_conv: 4, dt_rank: 96, vocab: 50280, source: {work: state-spaces-2023-mamba-790m-config, locator: "p. 1"}}
  mamba_1_4b: {meaning: "Mamba-1.4B, 48 blocks of width 2048", B: 1, T: 2048, d_model: 2048, n_layers: 48, expand: 2, d_state: 16, d_conv: 4, dt_rank: 128, vocab: 50280, source: {work: state-spaces-2023-mamba-1-4b-config, locator: "p. 1"}}
  mamba_2_8b: {meaning: "Mamba-2.8B, 64 blocks of width 2560", B: 1, T: 2048, d_model: 2560, n_layers: 64, expand: 2, d_state: 16, d_conv: 4, dt_rank: 160, vocab: 50280, source: {work: state-spaces-2023-mamba-2-8b-config, locator: "p. 1"}}
