- id: c-params
  type: mathematical
  text: "A Mamba language model with L blocks of width D, inner width I = ED, state size N, convolution width K, Δ rank R and a vocabulary of V tokens, with the output layer tied to the embedding, has VD + D + L(3ID + I(K + 1) + I(R + 2N) + (R + 1)I + IN + I + D) parameters."
  assumes: ["the block of the reference code: in_proj and out_proj without bias, a depthwise convolution with bias, x_proj without bias, dt_proj with bias, A_log, D and a pre-RMSNorm", "an output layer tied to the embedding"]
  derivation: parameter-and-flop-count

- id: c-params-models
  type: mathematical
  text: "With the vocabulary of 50,277 padded to 50,280 and the default sizes of the reference code, the released models have 129,135,360 (Mamba-130M), 371,516,416 (Mamba-370M), 793,204,224 (Mamba-790M), 1,372,178,432 (Mamba-1.4B) and 2,768,345,600 (Mamba-2.8B) parameters."
  assumes: ["the count of c-params", "N = 16, K = 4, E = 2 and R = ceil(D / 16)"]
  derivation: parameter-and-flop-count

- id: c-params-ablations
  type: mathematical
  text: "The count of c-params reproduces the sizes of the paper's ablations on the 48 blocks of width 1024: 371.5M with N = 16 and R = 64, 367.1M with N = 1, 359.1M with R = 1 and 358.9M with no projection for Δ."
  assumes: ["the count of c-params with V = 50,280, D = 1024, L = 48"]
  derivation: parameter-and-flop-count

- id: c-flops
  type: mathematical
  text: "A forward pass over B sequences of T tokens costs 2BT(L(2DI + I(R + 2N) + RI + IN + ID) + DV) FLOPs in its matrix products, linear in T, of which the readout of the scan by C is 2BTLIN; the convolution and the update of the state add 2BTLI(K + N) elementwise."
  assumes: ["a multiply-add counts as 2 FLOPs", "the norms, the activations, the exponentials and the softmax are not counted"]
  derivation: parameter-and-flop-count

- id: c-disc-gap
  type: mathematical
  text: "The reference code discretizes B as ΔB rather than by the zero-order hold of the paper's eq. 4; with a diagonal A the two differ by the factor (exp(ΔA) − 1)/(ΔA) = 1 + ΔA/2 + O(Δ^2), so they agree for small steps, and for a large step the zero-order hold tends to −B/A while ΔB grows without bound."
  assumes: ["a diagonal A with negative entries", "Ā = exp(ΔA) in both rules"]
  derivation: discretization

- id: c-disc-gate
  type: mathematical
  text: "In the setting of Theorem 1 with the rule of the reference code, the recurrence is h_t = (1 − g_t) h_{t−1} + Δ_t x_t with Δ_t = −log(1 − g_t), a weight on the input of at least g_t that grows without bound as g_t → 1."
  assumes: ["N = 1, A = −1, B = 1, Δ_t = softplus(z_t), g_t = σ(z_t)", "B̄ = ΔB"]
  derivation: discretization

- id: c-quadratic
  type: mathematical
  text: "Because exp(Δ_t A) multiply along the sequence into exp(A(S_t − S_s)) with S the running sum of Δ, the selective SSM equals y_t = Σ_{s ≤ t} C_t exp(A(S_t − S_s)) B̄_s x_s, a lower-triangular T × T matrix per channel applied to the input, computed in O(T^2 N) per channel instead of O(TN) for the scan."
  assumes: ["a diagonal A", "Ā_t = exp(Δ_t A)", "h_0 = 0"]
  derivation: quadratic-form

- id: c-state
  type: mathematical
  text: "In generation each Mamba block carries I(K − 1 + N) numbers per sequence from one token to the next, the last K − 1 inputs of the convolution and the I × N state of the SSM, whatever the length; Mamba-2.8B carries 6,225,920."
  assumes: ["the block of the reference code"]
  derivation: recurrent-state

- id: c-state-compare
  type: mathematical
  text: "A Transformer with L/2 layers of width D, the parameter match of the paper, caches LDT keys and values for T tokens, which exceeds the 2LD(K − 1 + N) numbers of L Mamba blocks with E = 2 once T > 2(K − 1 + N), 38 tokens with the default K = 4 and N = 16."
  assumes: ["the count of c-state with I = 2D", "a Transformer layer caches a key and a value of width D per token"]
  derivation: recurrent-state

- id: c-flops-models
  type: mathematical
  text: "For Mamba-2.8B a forward pass over 2048 tokens costs 11,329,066,762,240 FLOPs in its products by the count of c-flops, 5,531,770,880 per token, within 0.09% of twice the parameters; the convolution and the update of the state add 26,843,545,600, about 0.24%."
  assumes: ["the count of c-flops with B = 1, T = 2048 and the config of Mamba-2.8B"]
  derivation: parameter-and-flop-count
