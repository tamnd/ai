- id: c-zero-shot
  type: empirical
  text: "In the zero-shot evaluations, Mamba-2.8B averaged 63.3 against 59.1 for Pythia-2.8B and 61.7 for Pythia-6.9B, and Mamba-1.4B averaged 59.7 against 55.2 for Pythia-1.4B."
  scope:
    models: "Mamba-1.4B, Mamba-2.8B, Pythia-1.4B, Pythia-2.8B, Pythia-6.9B"
    data: ["LAMBADA", "HellaSwag", "PIQA", "ARC-E", "ARC-C", "WinoGrande"]
    setting: "zero-shot, 300B training tokens"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Table 3", stance: for}

