# The claims of the Mamba page (spec 07). The build computes the labels.
- id: c-def
  type: attributive
  text: "Gu and Dao let the parameters of a structured state space model be functions of the input, design a hardware-aware parallel algorithm in recurrent mode, and integrate these selective SSMs into a simplified end-to-end neural network architecture without attention or even MLP blocks, which they call Mamba."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 1", stance: for}

- id: c-weakness
  type: attributive
  text: "Gu and Dao identify as a key weakness of subquadratic-time architectures such as linear attention, gated convolution, recurrent models and structured state space models their inability to perform content-based reasoning."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 1", stance: for}

- id: c-abstract
  type: empirical
  text: "The authors report that Mamba has 5× higher throughput than Transformers at inference, scales linearly in sequence length, and that their Mamba-3B model outperforms Transformers of the same size and matches Transformers twice its size, both in pretraining and downstream evaluation."
  scope:
    models: "Mamba-3B and open Transformer language models of similar and twice its size"
    data: ["the Pile"]
    setting: "pretraining on 300B tokens, zero-shot downstream evaluation and inference throughput"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 1", stance: for}

- id: c-properties
  type: attributive
  text: "Selective SSMs, and Mamba, are fully recurrent models: computation and memory scale linearly in sequence length during training, and unrolling the model autoregressively during inference requires only constant time per step since it does not require a cache of previous elements."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 2", stance: for}

- id: c-ssm
  type: definitional
  text: "S4 models are defined with four parameters (Δ, A, B, C) that define a sequence-to-sequence transformation in two stages: discretization, which transforms the continuous parameters (Δ, A, B) to discrete parameters by a rule such as the zero-order hold, and computation, as a linear recurrence or a global convolution."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 3", stance: for}

- id: c-modes
  type: attributive
  text: "Commonly the model uses the convolutional mode for efficient parallelizable training, where the whole input sequence is seen ahead of time, and switches into recurrent mode for efficient autoregressive inference."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 3", stance: for}

- id: c-lti
  type: definitional
  text: "In linear time invariance (LTI) the model's dynamics are constant through time: (Δ, A, B, C) are fixed for all time-steps; all structured SSMs before Mamba had been LTI because of fundamental efficiency constraints."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "pp. 3 to 4", stance: for}

- id: c-diagonal
  type: definitional
  text: "Mamba uses a diagonal state matrix, so that A, B and C can each be represented by N numbers; the SSM is applied independently to each of the D channels, the total hidden state has dimension DN per input, and computing it over the sequence length requires O(BLDN) time and memory."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 4", stance: for}

- id: c-compression
  type: attributive
  text: "The authors argue that a fundamental problem of sequence modeling is compressing context into a smaller state: attention does not compress context at all, so autoregressive inference stores the entire context in the KV cache, while recurrent models have a finite state, constant-time inference and linear-time training, but are limited by how well this state has compressed the context."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 5", stance: for}

- id: c-tasks
  type: definitional
  text: "The Selective Copying task modifies the Copying task by varying the position of the tokens to memorize; the Induction Heads task requires context-aware reasoning to know when to produce the correct output in the appropriate context."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 5", stance: for}

- id: c-lti-fail
  type: attributive
  text: "Global convolutions can solve the vanilla Copying task because it only requires time-awareness, but have difficulty with the Selective Copying task because of lack of content-awareness: the spacing between inputs and outputs is varying and cannot be modeled by static convolution kernels."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 5", stance: for}

- id: c-selection
  type: definitional
  text: "The selection mechanism makes the parameters Δ, B and C functions of the input; they then have a length dimension L, the model changes from time-invariant to time-varying, and it loses the equivalence to convolutions."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 5", stance: for}

- id: c-choices
  type: definitional
  text: "Mamba chooses s_B(x) = Linear_N(x), s_C(x) = Linear_N(x), s_Δ(x) = Broadcast_D(Linear_1(x)) and τ_Δ = softplus, where Linear_d is a parameterized projection to dimension d."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 5", stance: for}

- id: c-algorithm
  type: definitional
  text: "In Algorithm 2 (S6), B and C of shape (B, L, N) are computed from the input x of shape (B, L, D), Δ of shape (B, L, D) is τ_Δ of a parameter plus s_Δ(x), the discretized parameters have shape (B, L, D, N), and the time-varying SSM is computed by a recurrence (scan) only."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 6", stance: for}

- id: c-materialize
  type: attributive
  text: "The recurrent mode would require computing and materializing the latent state h with shape (B, L, D, N), larger by a factor of N than the input and output of shape (B, L, D); the convolution mode of LTI models bypasses the state computation."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 6", stance: for}

- id: c-recurrent-flops
  type: attributive
  text: "The naive recurrent computation uses O(BLDN) FLOPs while the convolutional computation uses O(BLD log(L)) FLOPs, and the former has a lower constant factor, so for long sequences and not-too-large state dimension N the recurrent mode can use fewer FLOPs."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-fusion
  type: attributive
  text: "Instead of preparing the scan input of size (B, L, D, N) in GPU HBM, the selective scan loads the SSM parameters (Δ, A, B, C) from HBM to fast SRAM, performs the discretization and recurrence in SRAM, and writes the final outputs of size (B, L, D) back to HBM."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-scan
  type: attributive
  text: "The recurrence is parallelized with a work-efficient parallel scan algorithm (Blelloch 1990)."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-recompute
  type: attributive
  text: "The intermediate states are not stored but recomputed in the backward pass when the inputs are loaded from HBM to SRAM, so the fused selective scan layer has the same memory requirements as an optimized transformer implementation with FlashAttention."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-block
  type: definitional
  text: "The Mamba block combines the H3 block, the basis of most SSM architectures, with the MLP block of Transformers into one block that is stacked homogenously, inspired by the gated attention unit (GAU); the block is repeated, interleaved with standard normalization and residual connections."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-block-params
  type: definitional
  text: "The block expands the model dimension D by a factor E; most of its parameters, 3ED^2, are in the linear projections, 2ED^2 for the input projections and ED^2 for the output projection; the authors fix E = 2 and use two stacks of the block to match the 12D^2 parameters of a Transformer's interleaved MHA and MLP blocks."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-silu
  type: definitional
  text: "Mamba uses the SiLU / Swish activation function, so that the Gated MLP becomes the SwiGLU variant, and an optional normalization layer, LayerNorm, motivated by RetNet."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 7", stance: for}

- id: c-h3-compare
  type: definitional
  text: "Compared to the H3 block, Mamba replaces the first multiplicative gate with an activation function; compared to the MLP block, Mamba adds an SSM to the main branch."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 8", stance: for}

- id: c-theorem1
  type: attributive
  text: "Theorem 1 of Gu and Dao states that when N = 1, A = −1, B = 1, s_Δ = Linear(x) and τ_Δ = softplus, the selective SSM recurrence takes the form g_t = σ(Linear(x_t)), h_t = (1 − g_t) h_{t−1} + g_t x_t."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 8", stance: for}

- id: c-broadcast
  type: attributive
  text: "If an input should be completely ignored, all D channels should ignore it, which is why Mamba projects the input down to 1 dimension before broadcasting it to Δ."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 8", stance: for}

- id: c-spacing
  type: attributive
  text: "Selectivity allows filtering out irrelevant noise tokens that may occur between inputs of interest, such as language fillers like um, because the model can filter out any particular input, for example in the gated case of Theorem 1 when g_t → 0."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 8", stance: for}

- id: c-context
  type: attributive
  text: "Many sequence models do not improve with longer context because they cannot effectively ignore irrelevant context; selective models can reset their state at any time to remove extraneous history, so their performance in principle improves monotonicly with context length."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 8", stance: for}

- id: c-reset
  type: attributive
  text: "Where independent sequences are stitched together, LTI models bleed information between the sequences, while selective SSMs can reset their state at boundaries, for example when Δ_t → ∞ or, in Theorem 1, when g_t → 1."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-delta
  type: attributive
  text: "Δ controls the balance between how much to focus or ignore the current input: a large Δ resets the state h and focuses on the current input x, while a small Δ persists the state and ignores the current input."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-a
  type: attributive
  text: "A could also be selective, but it affects the model only through its interaction with Δ in exp(ΔA), so selectivity in Δ is enough to ensure selectivity in the discrete parameters; the authors leave a selective A out for simplicity."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-bc
  type: attributive
  text: "Making B and C selective allows finer-grained control over whether to let an input x_t into the state h_t, or the state into the output y_t."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-real
  type: attributive
  text: "Mamba uses real values by default, which work well for all but one of the paper's tasks; the authors hypothesize that complex numbers are helpful for continuous modalities such as audio and video but not discrete ones such as text and DNA."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-init
  type: definitional
  text: "The default initialization is S4D-Lin for the complex case and S4D-Real for the real case, which define the n-th element of A as −1/2 + ni and −(n + 1) respectively."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-dt-rank
  type: definitional
  text: "The projection of s_Δ can be generalized from dimension 1 to a larger dimension R, a small fraction of D, giving the low-rank projection s_Δ(x) = Linear_D(Linear_R(x)); the bias of Δ is initialized to τ_Δ^{-1}(Uniform([0.001, 0.1]))."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-s6
  type: definitional
  text: "The paper abbreviates selective SSMs as S6 models, because they are S4 models with a selection mechanism and computed with a scan."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 9", stance: for}

- id: c-gating-not-selection
  type: attributive
  text: "Gu and Dao find insufficient the explanation that architecture gating gives data-dependence, because such gating does not interact along the sequence axis and cannot affect the spacing between tokens."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 10", stance: for}

- id: c-table1
  type: empirical
  text: "On Selective Copying, S4 with no gate reached 18.3% accuracy and S6 with no gate 97.0%; in the H3 architecture S4 reached 57.0%, Hyena 30.1% and S6 99.7%; in the Mamba architecture S4 reached 56.4%, Hyena 28.4% and S6 99.8%."
  scope:
    models: "S4, Hyena and S6 layers in no-gate, H3 and Mamba architectures"
    data: ["Selective Copying (synthetic)"]
    setting: "the synthetic setup of Section 4.1 and Appendix E.1"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Section 4.1", stance: for}

- id: c-induction
  type: empirical
  text: "On Induction Heads, 2-layer models trained at sequence length 256 with a vocab size of 16 were tested on lengths from 64 to 1048576; Mamba solved the task perfectly and generalized to million-length sequences, 4000× longer than it saw during training, while no other method went beyond 2×."
  scope:
    models: "Mamba, MHA with absolute, RoPE and xPos positions, H3, Hyena"
    data: ["Induction Heads (synthetic)"]
    setting: "2-layer models trained at length 256, tested at lengths 64 to 1048576"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 10", stance: for}

- id: c-induction-dims
  type: definitional
  text: "The induction heads models use a model dimension D of 64 for Mamba and 128 for the other models, and multi-head attention with 8 heads and various positional encodings."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 10", stance: for}

- id: c-induction-params
  type: empirical
  text: "In the full table of the induction heads results, Mamba has 74K parameters and the attention models MHA-Abs, MHA-RoPE and MHA-xPos 137K each."
  scope:
    models: "Mamba, MHA-Abs, MHA-RoPE, MHA-xPos, H3, Hyena"
    data: ["Induction Heads (synthetic)"]
    setting: "the models of the induction heads experiment"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "Table 11", stance: for}

- id: c-scaling
  type: empirical
  text: "Under the Chinchilla protocol, on models trained on the Pile, Mamba is the first attention-free model to match the performance of a very strong Transformer recipe (Transformer++), particularly as the sequence length grows."
  scope:
    models: "Mamba, Transformer, Transformer++, H3++, Hyena, RWKV, RetNet"
    data: ["the Pile"]
    setting: "models of about 125M to 1.3B parameters, the Chinchilla protocol, lengths 2048 and 8192"
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 11", stance: for}

- id: c-transformer-pp
  type: definitional
  text: "Transformer++ is the strongest Transformer recipe the authors know of, based on the PaLM and LLaMa architectures: rotary embedding, SwiGLU MLP, RMSNorm instead of LayerNorm, no linear bias, and higher learning rates."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 11", stance: for}

- id: c-pythia-setting
  type: definitional
  text: "Pythia and RWKV were trained with the same tokenizer, dataset, and training length (300B tokens) as the Mamba models; Mamba and Pythia are trained with context length 2048."
  evidence:
