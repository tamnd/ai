- id: c-limitations
  type: attributive
  text: "The authors name as limitations a continuous-discrete spectrum, on which the selection mechanism can impede performance on data that LTI SSMs excel on, the open question of downstream affordances such as fine-tuning and quantization, and an empirical evaluation limited to small model sizes below 7B parameters."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "p. 17", stance: for}

- id: c-history
  type: historical
  text: "Albert Gu of Carnegie Mellon University and Tri Dao of Princeton University introduced Mamba in arXiv 2312.00752, and open-sourced the model code and pre-trained checkpoints at github.com/state-spaces/mamba."
  evidence:
    - {work: "gu-2023-mamba", role: original, locator: "pp. 1 to 2", stance: for}

- id: c-code-defaults
  type: definitional
  text: "The class Mamba of mamba_simple.py takes d_state=16, d_conv=4, expand=2, dt_rank=auto, which is math.ceil(self.d_model / 16), dt_min=0.001 and dt_max=0.1."
  evidence:
    - {work: "state-spaces-mamba-simple-v2-3-2", role: original, locator: "p. 1", stance: for}

- id: c-code-init
  type: definitional
  text: "The reference code initializes A_log as the logarithm of 1 to d_state for every channel, D as ones, and the bias of dt_proj as the inverse of softplus of a step drawn between dt_min and dt_max, inv_dt = dt + torch.log(-torch.expm1(-dt)); A = -torch.exp(self.A_log)."
  evidence:
    - {work: "state-spaces-mamba-simple-v2-3-2", role: original, locator: "p. 1", stance: for}

- id: c-code-disc
  type: definitional
  text: "In selective_scan_ref, deltaA = torch.exp(torch.einsum('bdl,dn->bdln', delta, A)) and deltaB_u = torch.einsum('bdl,bnl,bdl->bdln', delta, B, u), and the state is updated as x = deltaA[:, :, i] * x + deltaB_u[:, :, i]."
  evidence:
    - {work: "state-spaces-mamba-selective-scan-v2-3-2", role: original, locator: "p. 1", stance: for}

- id: c-code-lm
  type: definitional
  text: "The language model of the reference code pads vocab_size to a multiple of pad_vocab_size_multiple, uses RMSNorm when rms_norm is set, and ties the weights of lm_head to the embedding."
  evidence:
    - {work: "state-spaces-mamba-mixer-seq-v2-3-2", role: original, locator: "p. 1", stance: for}

