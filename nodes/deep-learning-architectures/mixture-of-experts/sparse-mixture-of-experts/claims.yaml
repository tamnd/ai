- id: c-st-269b
  type: empirical
  text: "Zoph et al. scaled a sparse encoder-decoder to 269B parameters at a computational cost comparable to a 32B dense model, ST-MoE-32B, and report state-of-the-art transfer results across tasks including SuperGLUE, XSum and Natural Questions."
