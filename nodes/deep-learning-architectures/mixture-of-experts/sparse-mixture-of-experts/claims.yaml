- id: c-st-capacity-quality
  type: empirical
  text: "Zoph et al. found that raising the train and eval capacity factors improves quality, for example by 0.011 in negative log perplexity for top-1 routing going from 1.0 to 1.25, about a tenth of the gain from tripling a dense model, while linearly increasing the einsum, activation memory and all2all communication costs of the expert layers."
  scope:
    models: "sparse models with 32 experts FLOP-matched to T5-Large"
    data: [c4]
    scale: "100k steps with 1M tokens per batch"
    setting: "pre-training"
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 14", stance: for}

- id: c-st-top-n
  type: empirical
  text: "At a fixed capacity factor they found small gains from routing to one more expert, 0.004 for top-2 over top-1 at a train capacity factor of 1.25, which revises the earlier recommendation of Fedus et al.; they attribute the difference to an 8x larger training scale."
  scope:
    models: "sparse models with 32 experts FLOP-matched to T5-Large"
    data: [c4]
    scale: "1B-FLOP-matched models trained on 100B tokens"
    setting: "pre-training"
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 14", stance: for}

- id: c-st-diminishing
  type: attributive
  text: "Zoph et al. report that the incremental benefit of more experts quickly diminishes with many experts, more than 256, or very sparse models with under 1% of experts activated; since using more than one expert per core increases memory transfer while more experts do not change the computation, they recommend one expert or less per core on their TPU system."
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 14", stance: for}

# Stability and fine-tuning

- id: c-sw-selective-precision
  type: attributive
  text: "Switch Transformers cast the router input to float32 and do the router computation in float32 on each device, recasting the dispatch and combine tensors to bfloat16 at the end, which gave the stability of float32 at nearly the speed of bfloat16."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 9", stance: for}

- id: c-sw-init
  type: attributive
  text: "As a further remedy for instability Fedus et al. recommend reducing the default Transformer initialization scale s = 1.0 by a factor of 10."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 10", stance: for}

- id: c-sw-expert-dropout
  type: attributive
  text: "For fine-tuning Fedus et al. propose expert dropout, a much larger dropout rate inside the experts than elsewhere; a rate of 0.1 at non-expert layers and 0.4 at expert layers improved four smaller downstream tasks, while raising dropout everywhere made results worse."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 11", stance: for}

- id: c-st-z-loss
  type: definitional
  text: "Zoph et al. found float32 routing insufficient for reliable training at the largest scales and add the router z-loss L_z(x) = (1/B) Σ_i (log Σ_j e^{x_j^{(i)}})² over the B tokens and N experts, which penalizes large logits entering the gating network."
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 7", stance: for}

- id: c-st-total-loss
  type: definitional
  text: "The total loss of ST-MoE is L_CE + c_B L_B + c_z L_Z, the cross-entropy plus the weighted load-balance loss and z-loss, with c_z = 0.001 chosen by a sweep for the best quality after pre-training."
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 8", stance: for}

- id: c-st-table4
  type: empirical
  text: "In Zoph et al.'s Table 4, 4 of 6 baseline runs were stable, update clipping at 0.1 stabilized 3 of 3 but dropped quality to −4.206, and the router z-loss stabilized 3 of 3 with quality −1.741 against −1.755 for the baseline."
  scope:
    models: "sparse expert models of the ST-MoE stability study"
    data: [c4]
    scale: unknown
    setting: "pre-training, quality as negative log perplexity"
  evidence:
    - {work: "zoph-2022-st-moe", role: original, locator: "p. 8", stance: for}

# History

- id: c-sh-jacobs
  type: historical
  text: "Shazeer et al. trace the mixture-of-experts approach to Jacobs et al. (1991) and Jordan and Jacobs (1994), more than two decades before their work, and list later experts built from SVMs, Gaussian processes, Dirichlet processes and deep networks."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 3", stance: for}

- id: c-sh-softmax-gate
  type: historical
  text: "They cite Jordan and Jacobs (1994) for the simple non-sparse gate, a trainable weight matrix followed by a softmax."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 4", stance: for}

- id: c-sh-eigen
  type: historical
  text: "In those earlier works the mixture was the whole model; Eigen et al. (2013) used several mixtures with their own gating networks as parts of a deep model, and Shazeer et al. build on that use of the MoE as a general-purpose component."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 3", stance: for}
