# The claims of the sparse mixture-of-experts page (spec 07). The build computes the labels.

# Setting

- id: c-sh-capacity-limit
  type: attributive
  text: "Shazeer et al. start from the observation that the number of parameters limits how much information a neural network can absorb, and that conditional computation, in which parts of the network are active on a per-example basis, had been proposed as a way to raise capacity without a proportional rise in computation."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 1", stance: for}

- id: c-sh-quadratic
  type: attributive
  text: "Shazeer et al. note that for typical deep learning models, where the entire model is activated for every example, increasing both the model size and the number of training examples leads to a roughly quadratic growth in training costs."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 1", stance: for}

- id: c-sh-challenges
  type: attributive
  text: "They list the obstacles that had kept conditional computation from paying off: GPUs are much faster at arithmetic than at branching, conditional computation shrinks the batch each active chunk sees, network bandwidth between devices can be the bottleneck, extra loss terms may be needed to control sparsity, and earlier work used image data sets of up to 600,000 images, too small to train billions of parameters."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 2", stance: for}

- id: c-sw-abstract
  type: attributive
  text: "Fedus et al. describe mixture-of-experts models as selecting different parameters for each incoming example, giving a sparsely activated model with a very large number of parameters but a constant computational cost, and name complexity, communication costs and training instability as what had held back their adoption."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 1", stance: for}

# The method

- id: c-sh-moe-def
  type: definitional
  text: "The mixture-of-experts layer of Shazeer et al. consists of n expert networks E_1, …, E_n and a gating network G whose output is a sparse n-dimensional vector; the output is y = Σ_i G(x)_i E_i(x), and E_i(x) need not be computed wherever G(x)_i = 0."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 3", stance: for}

- id: c-sh-experts-ffn
  type: attributive
  text: "Experts only need to accept and produce vectors of the same sizes, but Shazeer et al. restrict their experts to feed-forward networks with identical architectures and separate parameters."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 3", stance: for}

- id: c-sh-noisy-top-k
  type: definitional
  text: "Noisy top-k gating adds two components to the softmax gating network, sparsity and noise: before the softmax, tunable Gaussian noise is added to x·W_g, with the amount of noise per component controlled by a second trainable weight matrix W_noise, and then only the top k values are kept and the rest set to −∞, so the corresponding gate values equal 0."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 4", stance: for}

- id: c-sh-discontinuities
  type: attributive
  text: "Shazeer et al. acknowledge that this sparsity makes the gating output discontinuous, and report that they had not yet observed this to be a problem in practice; the noise is there to help with load balancing."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 4", stance: for}

- id: c-sh-backprop
  type: attributive
  text: "The gating network is trained by back-propagation with the rest of the model; with k > 1 the gate values of the top k experts have nonzero derivatives with respect to the gating weights, unlike the boolean gates trained with a REINFORCE-style method by Bengio et al. (2015)."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 4", stance: for}

- id: c-topk-equivalence
  type: mathematical
  text: "The softmax of KeepTopK(h, k) equals the k largest entries of softmax(h) divided by their sum, with zeros elsewhere, because the softmax of a vector restricted to a subset is its full softmax renormalized on that subset."
  assumes: ["h is a finite vector of length N ≥ k ≥ 1", "the top k entries are unique or ties are broken the same way in both forms"]
  derivation: top-k-gate

- id: c-gs-every-other
  type: attributive
  text: "GShard scales the Transformer sparsely by replacing every other feed-forward layer, in both the encoder and the decoder, with a position-wise mixture-of-experts layer using a variant of top-2 gating."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 4", stance: for}

- id: c-gs-expert-ffn
  type: definitional
  text: "In GShard each of the E experts is a two-layer ReLU network FFN_e(x_s) = wo_e · ReLU(wi_e · x_s), each token is dispatched to at most two experts, and the layer output is the gate-weighted combination of the selected experts' outputs."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 4", stance: for}
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 5", stance: for}

- id: c-gs-naive-top-k
  type: attributive
  text: "Lepikhin et al. warn that simply choosing the top-k experts by softmax probability leads to load imbalance in training: most tokens go to a few busy experts with large input buffers while the others are barely trained."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 5", stance: for}

- id: c-gs-capacity
  type: definitional
  text: "GShard enforces an expert capacity, a uniform threshold of O(N/E) tokens per expert for a batch of N tokens, keeps a running count of the tokens dispatched to each expert, and treats a token whose selected experts are both full as overflowed: its gate vector becomes zero and its representation reaches the next layer through the residual connection."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 6", stance: for}

- id: c-gs-groups
  type: definitional
  text: "GShard splits the tokens of a batch evenly into G groups of S = N/G tokens that are routed independently in parallel, giving each group a fractional capacity of 2N/(G·E) per expert."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 6", stance: for}

- id: c-gs-normalize
  type: definitional
  text: "In GShard's Algorithm 1 the top-2 gates g1 and g2 of a token are normalized by dividing by g1 + g2; a first loop over the S tokens of the group dispatches each token to its best expert e1 if that expert's count is below the capacity C, and only a second loop then dispatches tokens to their second-best expert e2 under the same condition."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 7", stance: for}

- id: c-gs-random-routing
  type: definitional
  text: "With random routing, GShard ignores a token's 2nd expert when its weight is very small, to conserve the overall expert capacity: besides respecting the capacity constraint, the gate dispatches to the 2nd-best expert with probability proportional to its weight g2."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 6", stance: for}

- id: c-sw-router
  type: definitional
  text: "In the notation of Switch Transformers the router computes logits h(x) = W_r · x, normalizes them with a softmax over the N experts into gate values p_i(x), selects the top-k, and outputs Σ_{i∈T} p_i(x) E_i(x) over the selected set T."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 5", stance: for}

- id: c-sw-conjecture
  type: attributive
  text: "Fedus et al. report that Shazeer et al. conjectured that routing to k > 1 experts was necessary for the routing function to receive non-trivial gradients, intuiting that learning to route would not work without the ability to compare at least two experts."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 5", stance: for}

- id: c-sw-top-1
  type: attributive
  text: "Switch Transformers instead route each token to a single expert, a strategy they call a Switch layer, and report that it preserves model quality, reduces routing computation and performs better; the gate value p_i(x) still lets the router be trained by differentiation."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 6", stance: for}

- id: c-sw-benefits
  type: attributive
  text: "Fedus et al. give three benefits of k = 1: less router computation, an expert capacity that can be at least halved because each token goes to one expert, and a simpler implementation with lower communication costs."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 6", stance: for}

- id: c-sw-capacity
  type: definitional
  text: "Because TPUs need tensor shapes fixed at compilation, Switch Transformers set each expert's capacity to the tokens per batch divided by the number of experts, times a capacity factor; a factor above 1.0 leaves a buffer for uneven routing, and a token routed to a full expert is dropped: its computation is skipped and its representation passes to the next layer through the residual connection."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 6", stance: for}
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}

- id: c-sw-capacity-tradeoff
  type: attributive
  text: "Fedus et al. point out that a larger capacity factor alleviates overflow but increases computation and communication costs, that high expert capacity results in wasted computation and memory, and that empirically ensuring lower rates of dropped tokens is important for the scaling of sparse expert models."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 6", stance: for}
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}

# Load balancing

- id: c-sh-self-reinforcing
  type: attributive
  text: "Shazeer et al. observed that the gating network tends to converge to a state that produces large weights for the same few experts, and that this imbalance is self-reinforcing because the favored experts are trained more rapidly and are then selected even more by the gating network."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 5", stance: for}

- id: c-sh-importance
  type: definitional
  text: "Shazeer et al. define the importance of an expert over a batch as the sum of its gate values over the batch, and add the loss L_importance = w_importance · CV(Importance(X))², the squared coefficient of variation of the importance values times a hand-tuned factor."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 5", stance: for}

- id: c-sh-load-motivation
  type: attributive
  text: "Equal importance does not guarantee equal numbers of examples: one expert may get a few examples with large weights and another many with small weights, which causes memory and performance problems on distributed hardware, so Shazeer et al. add a second loss, L_load."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 6", stance: for}

- id: c-sh-load-def
  type: definitional
  text: "Because the number of examples an expert receives is discrete, Shazeer et al. use a smooth estimator: P(x, i) is the probability that G(x)_i is nonzero when only the noise on element i is drawn again, which equals Φ(((x·W_g)_i − kth_excluding(H(x), k, i)) / Softplus((x·W_noise)_i)) with Φ the standard normal CDF; Load(X)_i sums P(x, i) over the batch and L_load = w_load · CV(Load(X))²."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 13", stance: for}

- id: c-sh-zero-init
  type: attributive
  text: "To start training near equal load and avoid running out of memory before the soft constraints take effect, Shazeer et al. initialize W_g and W_noise to zeros, which gives no signal and some noise."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 13", stance: for}

- id: c-sh-table6
  type: empirical
  text: "In Shazeer et al.'s ablation, a model trained with neither balancing loss reached test perplexity 39.8 with the most loaded expert at 17.80 times the mean load, while w_importance = w_load = 0.1 gave 35.6 with a ratio of 1.14."
  scope:
    models: "the MoE-256 language model of Shazeer et al., two LSTM layers with a 256-expert MoE layer"
    data: [one-billion-word-benchmark]
    scale: "trained for 10 epochs"
    setting: "word-level language modeling; metrics averaged over several training batches"
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 13", stance: for}

- id: c-gs-aux
  type: definitional
  text: "GShard's auxiliary loss is ℓ_aux = (1/E) Σ_e (c_e/S) · m_e, where c_e/S is the fraction of the group's tokens routed to expert e and m_e the mean gate of expert e; since c_e comes from the top-2 operation and is not differentiable, m_e stands in for one factor of the mean square (c_e/S)², and the loss enters the total as ℓ_nll + k · ℓ_aux."
  evidence:
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 6", stance: for}
    - {work: "lepikhin-2020-gshard", role: original, locator: "p. 7", stance: for}

- id: c-sw-balance-def
  type: definitional
  text: "For each Switch layer the auxiliary loss is α · N · Σ_i f_i · P_i, where f_i is the fraction of the batch's T tokens whose highest router probability is expert i and P_i is the fraction of router probability given to expert i, the mean of p_i(x) over the batch."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}

- id: c-sw-simplifies
  type: historical
  text: "Fedus et al. present this loss as a simplification, following Shazeer et al. (2018) and Lepikhin et al. (2020), of the original design of Shazeer et al. (2017), which had separate importance and load losses."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}

- id: c-sw-balance-claims
  type: attributive
  text: "Fedus et al. state that the loss is minimized under uniform routing, that the P vector is differentiable but the f vector is not, and that the factor N keeps the loss constant as the number of experts changes, because Σ_i f_i P_i = 1/N under uniform routing."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 8", stance: for}

- id: c-sw-alpha
  type: attributive
  text: "Fedus et al. use α = 10⁻² throughout, after sweeping α from 10⁻¹ to 10⁻⁵ in powers of 10 and finding that 10⁻² balanced the load quickly without interfering with the training loss."
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 8", stance: for}

- id: c-sw-drop-rate
  type: empirical
  text: "Fedus et al. saw no dependence of the number of dropped tokens on the number of experts, typically under 1% of tokens, and found that the auxiliary loss with a large enough coefficient ensured good load balancing."
  scope:
    models: "Switch Transformer models of Fedus et al."
    data: [c4]
    scale: unknown
    setting: "masked language model pre-training"
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 7", stance: for}

- id: c-balance-uniform
  type: mathematical
  text: "Under uniform routing, f_i = P_i = 1/N for every expert, the Switch balance loss α · N · Σ_i f_i P_i equals α whatever the number of experts."
  assumes: ["N ≥ 2 experts", "f and P are probability vectors over the experts"]
  derivation: balance-loss-minimum

- id: c-balance-coupled-minimum
  type: mathematical
  text: "If the mean router probabilities equal the dispatch fractions, P = f, as when every token's router distribution is one-hot, the balance loss is α · N · Σ_i f_i², which is at least α by the Cauchy-Schwarz inequality, with equality exactly when f is uniform."
  assumes: ["N ≥ 2 experts", "P = f"]
  derivation: balance-loss-minimum

- id: c-balance-maximum
  type: mathematical
  text: "The balance loss never exceeds α · N, which it reaches when every token puts probability 1 on the same expert."
  assumes: ["N ≥ 2 experts", "f and P are probability vectors over the experts"]
  derivation: balance-loss-minimum

- id: c-balance-below-alpha
  type: mathematical
  text: "Without the coupling P = f the balance loss can fall below α, though never below α · Σ_i f_i² ≥ α/N, since a token's argmax expert gets probability at least 1/N; with two experts, three quarters of the tokens at p = (1/2 + ε, 1/2 − ε) and a quarter at p = (0, 1) give 0.875 · α as ε → 0."
  assumes: ["N ≥ 2 experts", "f counts each token's argmax expert once"]
  derivation: balance-loss-minimum

- id: c-balance-logit-gradient
  type: mathematical
  text: "With f held constant and p(x) = softmax(h(x)), the gradient of the balance loss with respect to logit j of token x is (α N / T) · p_j(x) · (f_j − Σ_i f_i p_i(x)), so a gradient step lowers the logit of each expert whose dispatch fraction is above the p(x)-weighted average and raises the others."
  assumes: ["f is treated as a constant", "p(x) is the softmax of the router logits h(x)", "a batch of T tokens"]
  derivation: balance-loss-minimum

- id: c-balance-worked
  type: mathematical
  text: "For one-hot routing of eight tokens over four experts with loads (4, 2, 1, 1), f = (0.5, 0.25, 0.125, 0.125) and the balance loss is 4α(0.25 + 0.0625 + 0.015625 + 0.015625) = 1.375 · α."
  assumes: ["one-hot router probabilities, so P = f"]
  derivation: balance-loss-minimum

# Capacity and cost

- id: c-capacity-count
  type: mathematical
  text: "With C = ⌊kTc/N⌋ slots per expert and n_i of the kT choices sent to expert i, the layer processes Σ_i min(n_i, C) choices, drops D = Σ_i max(0, n_i − C), and a static-shape implementation computes N·C slots of which N·C − kT + D are padding."
  assumes: ["T tokens, N experts, k distinct choices per token", "capacity factor c > 0 and capacity rounded down", "an expert keeps the first C choices it receives"]
  derivation: expert-capacity

- id: c-capacity-balanced
  type: mathematical
  text: "Under perfectly even routing with kT/N an integer and a capacity factor c ≥ 1, no choice is dropped and at most a fraction 1 − 1/c of the computed slots is padding."
  assumes: ["n_i = kT/N for every expert, an integer", "c ≥ 1", "capacity rounded down"]
  derivation: expert-capacity

- id: c-capacity-forced-drops
  type: mathematical
  text: "Whatever the routing, the number of dropped choices is at least kT − N·C ≥ kT(1 − c), so a capacity factor below 1 drops at least a fraction 1 − c of the choices; with k = 1 and every token sent to one expert, T − min(T, C) tokens are dropped."
  assumes: ["T tokens, N experts, k distinct choices per token", "capacity rounded down"]
  derivation: expert-capacity

- id: c-capacity-worked
  type: mathematical
  text: "With eight tokens, four experts, top-1 routing and loads (4, 2, 1, 1), a capacity factor of 1 gives C = 2 and drops 2 tokens with 6 of 8 slots used, 1.5 gives C = 3 and drops 1 token with 7 of 12 slots used, and 0.5 gives C = 1 and drops 4 tokens with all 4 slots used."
  assumes: ["capacity rounded down", "tokens are taken in order"]
  derivation: expert-capacity

- id: c-capacity-gshard-group
  type: mathematical
  text: "GShard's per-group capacity 2N/(G·E) is ⌊kTc/N⌋ with k = 2, T = S = N/G tokens per group, E experts and capacity factor 1."
  assumes: ["G divides the batch of N tokens evenly"]
  derivation: expert-capacity

- id: c-sh-shrinking-batch
  type: attributive
  text: "Shazeer et al. call the shrinking batch problem the fact that with k of n experts chosen per example, each expert receives only about kb/n of a batch of b examples, and recover a factor d by combining the batches of d synchronous data-parallel replicas, so each expert sees about kbd/n examples."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 4", stance: for}

- id: c-sh-bandwidth
  type: attributive
  text: "Because the experts stay on their devices, most communication is the experts' inputs and outputs; Shazeer et al. note that for an expert with one hidden layer the ratio of computation to input and output size equals the size of the hidden layer, so a larger hidden layer improves computational efficiency."
  evidence:
    - {work: "shazeer-2017-sparsely-gated-mixture-of-experts", role: original, locator: "p. 5", stance: for}

- id: c-cost-params-flops
  type: mathematical
  text: "A layer of N two-layer experts of width h on d-dimensional tokens with a d × N router has 2Ndh + dN weights and costs 4kdh + 2dN FLOPs per token when only the k chosen experts run, or 4kc·dh + 2dN on average when every padded slot is computed, against 2dh weights and 4dh FLOPs for a dense feed-forward layer of the same width."
  assumes: ["experts d → h → d without biases", "a multiply-add counts as 2 FLOPs", "nonlinearity, softmax, top-k, dispatch and combine costs left out"]
  derivation: sparse-cost

- id: c-cost-ratio
  type: mathematical
  text: "The ratio of weights to per-token expert FLOPs is N/(2k) for the sparse layer against 1/2 for the dense one, so with k fixed the parameter count grows with the number of experts while the per-token compute does not, apart from the router's 2dN."
  assumes: ["experts d → h → d without biases", "a multiply-add counts as 2 FLOPs"]
  derivation: sparse-cost

- id: c-cost-worked
  type: mathematical
  text: "With d = 768, h = 3072 and N = 128, one expert has 4,718,592 weights and the layer 604,078,080, and a token costs 9,633,792 FLOPs at k = 1, 11,993,088 at k = 1 with capacity factor 1.25 counting padding, and 19,070,976 at k = 2, against 9,437,184 for the dense layer."
  assumes: ["experts d → h → d without biases", "a multiply-add counts as 2 FLOPs"]
  derivation: sparse-cost

- id: c-cost-intensity
  type: mathematical
  text: "An expert d → h → d does 2dh multiply-adds per token and moves 2d numbers in and out, so its ratio of computation to communication is h."
  assumes: ["the expert's weights stay on its device and only token vectors are sent"]
  derivation: sparse-cost

- id: c-sw-table9
  type: empirical
  text: "In Switch Transformers' Table 9, T5-Base has 0.2B parameters and Switch-Base 7B with 128 experts, both at 124B FLOPs per sequence, and Switch-C has 1571B parameters with 2048 experts at 890B FLOPs per sequence."
  scope:
    models: "T5 and Switch Transformer encoder-decoder models"
    data: [c4]
    scale: "0.2B to 1571B parameters"
    setting: "model configurations of the pre-training study"
  evidence:
    - {work: "fedus-2022-switch-transformers", role: original, locator: "p. 23", stance: for}

