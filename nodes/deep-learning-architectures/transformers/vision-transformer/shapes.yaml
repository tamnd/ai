# SPDX-License-Identifier: MIT
# The shape contract of the Vision Transformer (spec 08.6), the network of Dosovitskiy et al. (2021) as it is
# fine-tuned: square images of G x G patches of P x P pixels with C channels, a class token and learned position
# embeddings, L pre-norm encoder layers of width M with H heads of width D and an MLP of width F, a final layer
# normalization and one linear layer to K classes. The FLOPs count the matrix products only, a multiply-add as 2;
# the softmax, the normalizations, the GELU and the additions are left out.
config:
  grid:        {meaning: "number of patches along each side of the image", symbol: "G", example: 4, sample: [1, 3]}
  patch_size:  {meaning: "side of a patch, in pixels", symbol: "P", example: 2, sample: [1, 3]}
  image_size:  {meaning: "side of the image, in pixels", symbol: "S", formula: "grid * patch_size"}
  channels:    {meaning: "number of channels of a pixel", symbol: "C", example: 3, sample: [1, 3]}
  n_heads:     {meaning: "number of attention heads", symbol: "h", example: 2, sample: [1, 3]}
  d_head:      {meaning: "width of each head", symbol: "D_h", example: 4, sample: [1, 3]}
  d_model:     {meaning: "width of the tokens, the latent vector size D of the paper", symbol: "D", formula: "n_heads * d_head"}
  d_ff:        {meaning: "width of the hidden layer of the MLP", symbol: "D_{\\text{MLP}}", example: 16, sample: [1, 8]}
  n_layers:    {meaning: "number of encoder layers", symbol: "L", example: 2, sample: [1, 2]}
  n_classes:   {meaning: "number of classes", symbol: "K", example: 5, sample: [2, 4]}
axes:
  B: {meaning: "batch", example: 2}
  G: grid
  P: patch_size
  S: image_size
  C: channels
  H: n_heads
  D: d_head
  M: d_model
  F: d_ff
  L: n_layers
  K: n_classes
blocks:
  - id: embed
    meaning: "the patches in raster order, their linear projection E, the class token in front and the position embeddings added"
    eq: [patches]
    inputs: {images: "(B, S, S, C)"}
    outputs: {tokens: "(B, G * G + 1, M)"}
    internals: {patches: "(B, G * G, P * P * C)"}
    params: "P * P * C * M + M + M + (G * G + 1) * M"
    flops_forward: "2 * B * G * G * P * P * C * M"
  - id: attn
    meaning: "multi-head self-attention of an encoder layer, on the normalized tokens"
    eq: [attn, msa]
    inputs: {x: "(B, G * G + 1, M)"}
    outputs: {y: "(B, G * G + 1, M)"}
    internals: {q: "(B, H, G * G + 1, D)", k: "(B, H, G * G + 1, D)", v: "(B, H, G * G + 1, D)", weights: "(B, H, G * G + 1, G * G + 1)"}
    params: "4 * M * M + 4 * M"
    flops_forward: "8 * B * (G * G + 1) * M * M + 4 * B * (G * G + 1) * (G * G + 1) * M"
  - id: mlp
    meaning: "the MLP of an encoder layer: two linear layers with a GELU between them"
    eq: [mlp]
    inputs: {x: "(B, G * G + 1, M)"}
    outputs: {y: "(B, G * G + 1, M)"}
    internals: {hidden: "(B, G * G + 1, F)"}
    params: "2 * M * F + F + M"
    flops_forward: "4 * B * (G * G + 1) * M * F"
  - id: norm
    meaning: "layer normalization: a gain and a bias for each feature"
    params: "2 * M"
  - id: layer
    of: [attn, mlp, norm, norm]
    inputs: {x: "(B, G * G + 1, M)"}
    outputs: {y: "(B, G * G + 1, M)"}
    params: "4 * M * M + 2 * M * F + 9 * M + F"
  - id: head
    meaning: "the final layer normalization of the class token and the linear layer to the class scores"
    eq: [output]
    inputs: {tokens: "(B, G * G + 1, M)"}
    outputs: {logits: "(B, K)"}
    internals: {y: "(B, M)"}
    params: "2 * M + M * K + K"
    flops_forward: "2 * B * M * K"
model:
  tokens: {formula: "G * G + 1", symbol: "n", meaning: "length of the sequence of the encoder: the patches and the class token"}
  params: {formula: "embed.params + n_layers * layer.params + head.params", symbol: "N", meaning: "all the parameters of the network"}
  params_encoder: {formula: "n_layers * layer.params", meaning: "the parameters of the encoder layers, which do not depend on the image size"}
  attention_flops: {formula: "n_layers * 4 * B * (G * G + 1) * (G * G + 1) * M", meaning: "the FLOPs of the products q k and A v, the only part that grows with the square of the number of tokens"}
  flops_forward: {formula: "embed.flops_forward + n_layers * (attn.flops_forward + mlp.flops_forward) + head.flops_forward", symbol: "C", meaning: "FLOPs of one forward pass over the batch, a multiply-add counted as 2"}
  sources:
    - {work: dosovitskiy-2021-image-worth-16x16-words, locator: "pp. 3 to 4", note: "eq. 1 to 4, the class token, the position embeddings and the pre-norm layers"}
    - {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 13", note: "eq. 5 to 8, the multi-head self-attention with D_h = D / k"}
configs:
  vit_b16: {meaning: "ViT-B/16 at 224 x 224 pixels with a linear head to the 1,000 ImageNet classes", B: 1, grid: 14, patch_size: 16, channels: 3, n_heads: 12, d_head: 64, d_ff: 3072, n_layers: 12, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 5", note: "Table 1, and the training resolution of 224 of Table 3 on p. 13"}}
  vit_b32: {meaning: "ViT-B/32 at 224 x 224 pixels, 1,000 classes", B: 1, grid: 7, patch_size: 32, channels: 3, n_heads: 12, d_head: 64, d_ff: 3072, n_layers: 12, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 5"}}
  vit_l16: {meaning: "ViT-L/16 at 224 x 224 pixels, 1,000 classes", B: 1, grid: 14, patch_size: 16, channels: 3, n_heads: 16, d_head: 64, d_ff: 4096, n_layers: 24, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 5"}}
  vit_l32: {meaning: "ViT-L/32 at 224 x 224 pixels, 1,000 classes", B: 1, grid: 7, patch_size: 32, channels: 3, n_heads: 16, d_head: 64, d_ff: 4096, n_layers: 24, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 5"}}
  vit_h14: {meaning: "ViT-H/14 at 224 x 224 pixels, 1,000 classes", B: 1, grid: 16, patch_size: 14, channels: 3, n_heads: 16, d_head: 80, d_ff: 5120, n_layers: 32, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 5"}}
  vit_b16_384: {meaning: "ViT-B/16 fine-tuned at 384 x 384 pixels, the default resolution of fine-tuning: 24 x 24 patches", B: 1, grid: 24, patch_size: 16, channels: 3, n_heads: 12, d_head: 64, d_ff: 3072, n_layers: 12, n_classes: 1000, source: {work: dosovitskiy-2021-image-worth-16x16-words, locator: "p. 14", note: "Table 4: fine-tuning resolution is 384"}}
