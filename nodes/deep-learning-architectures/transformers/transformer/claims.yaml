# The claims of the transformer page (spec 07). The build computes the labels.
- id: c-post-ln
  type: attributive
  text: "In the encoder and decoder stacks of Vaswani et al., each sub-layer has a residual connection followed by layer normalization, so the output of each sub-layer is LayerNorm(x + Sublayer(x))."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 3.1", stance: for}

- id: c-base-config
  type: attributive
  text: "The base Transformer has $N = 6$ identical layers in the encoder and in the decoder, $d_{model} = 512$, $h = 8$ attention heads and a feed-forward inner dimensionality of $2048$."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Sections 3.1 to 3.3, Table 3, p. 9", stance: for}

- id: c-bert-encoder
  type: attributive
  text: "The model architecture of BERT is a multi-layer bidirectional Transformer encoder."
  evidence:
    - {work: "devlin-2019-bert", role: original, locator: "Section 3", stance: for}

- id: c-gpt-decoder
  type: attributive
  text: "Radford et al. use a multi-layer Transformer decoder for the language model of their generative pre-training."
  evidence:
    - {work: "radford-2018-improving-language-understanding", role: original, locator: "Section 3.1", stance: for}

- id: c-tied-embeddings
  type: attributive
  text: "In Vaswani et al., the two embedding layers and the pre-softmax linear transformation share the same weight matrix, and the embedding layers multiply those weights by $\\sqrt{d_{model}}$."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 3.4", stance: for}

- id: c-pe-linear-offset
  type: mathematical
  text: "With sinusoidal positional encodings, for any fixed offset k, the encoding of position pos + k is a linear function of the encoding of position pos that depends only on k."
  assumes: ["the encoding of eq-pe, with a sine and a cosine of the same frequency in each pair of dimensions"]
  derivation: "node.md#components"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 3.5", stance: for}

- id: c-learned-pe-same
  type: empirical
  text: "Replacing the sinusoidal positional encoding of the base model with learned positional embeddings gave nearly identical results on the development set."
  scope:
    models: "the base Transformer, 65 million parameters"
    data: [wmt-2014-en-de, newstest2013]
    scale: "65 million parameters, 100,000 training steps"
    setting: "English to German translation, development set newstest2013"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 6.2, Table 3, p. 9", stance: for}

- id: c-causal-mask
  type: mathematical
  text: "With the causal mask, the output at position t depends only on the inputs at positions 1 to t, so the predictions of all positions of a sequence can be trained in one pass without any position seeing a later token."
  assumes: ["the mask entry M_ts is minus infinity for s > t and 0 otherwise", "the other sublayers act on each position separately"]
  derivation: "node.md#components"

- id: c-dot-variance
  type: mathematical
  text: "If the entries of a query and a key are independent with mean 0 and variance 1, their dot product has mean 0 and variance d_k."
  assumes: ["the 2 d_k entries are independent", "each entry has mean 0 and variance 1"]
  derivation: "node.md#components"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "p. 4", stance: for}

- id: c-scale-reason
  type: attributive
  text: "Vaswani et al. scale the scores by 1 / sqrt(d_k) because they suspect that for large d_k the dot products grow large and push the softmax into regions with extremely small gradients."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 3.2.1", stance: for}

- id: c-head-width
  type: attributive
  text: "Vaswani et al. use $h = 8$ heads with $d_k = d_v = d_{model} / h = 64$, and because of the reduced dimension of each head, the total computational cost is similar to that of single-head attention with full dimensionality."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 3.2.2", stance: for}

- id: c-single-head-worse
  type: empirical
  text: "Keeping the amount of computation constant, single-head attention was 0.9 BLEU worse on the development set than the best setting of the number of heads."
  scope:
    models: "the base Transformer"
    data: [wmt-2014-en-de, newstest2013]
    scale: "about 65 million parameters"
    setting: "English to German translation, development set newstest2013, beam search, no checkpoint averaging"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 6.2, Table 3, p. 9", stance: for}

- id: c-param-counts
  type: attributive
  text: "The params of Table 3, in millions, are 65 for the base model and 213 for the big model."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Table 3, p. 9", stance: for}

- id: c-flops-per-token
  type: attributive
  text: "Kaplan et al. estimate a forward pass of a Transformer at about $2N + 2 n_{layer} n_{ctx} d_{model}$ add-multiply operations, with $N$ the parameters excluding the vocabulary and positional embeddings, and the training compute at about $6N$ floating point operations per training token, since the backward pass costs about twice the forward pass."
  evidence:
    - {work: "kaplan-2020-scaling-laws", role: original, locator: "Eq. 2.2, p. 7", stance: for}

- id: c-complexity-table
  type: mathematical
  text: "A self-attention layer costs O(T^2 d) operations, needs O(1) sequential operations and has a maximum path length of O(1) between positions; a recurrent layer costs O(T d^2), needs O(T) sequential operations and has a maximum path length of O(T)."
  assumes: ["T is the sequence length and d the representation width", "full attention with no restriction to a neighbourhood"]
  derivation: "node.md#computation-and-cost"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 4, Table 1, p. 6", stance: for}

- id: c-mqa-cache
  type: attributive
  text: "In multi-query attention, the keys and values are shared across all of the attention heads, which reduces the size of these tensors and the memory bandwidth requirements of incremental decoding."
  evidence:
    - {work: "shazeer-2019-fast-transformer-decoding", role: original, locator: "the abstract, Section 1", stance: for}

- id: c-gqa
  type: attributive
  text: "Grouped-query attention is a generalization of multi-query attention that uses an intermediate number of key-value heads, more than one and fewer than the number of query heads."
  evidence:
    - {work: "ainslie-2023-gqa", role: original, locator: "the abstract, Section 1", stance: for}

- id: c-wmt-data
  type: attributive
  text: "The Transformer was trained on WMT 2014 English to German, about 4.5 million sentence pairs with a shared byte-pair vocabulary of about 37,000 tokens, and on WMT 2014 English to French, 36 million sentences with a vocabulary of 32,000 word pieces."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 5.1", stance: for}

- id: c-label-smoothing
  type: empirical
  text: "In the training of Vaswani et al., label smoothing of value $\\epsilon_{ls} = 0.1$ hurt perplexity, as the model learns to be more unsure, but improved accuracy and BLEU score."
  scope:
    models: "the Transformer, base and big"
    data: [wmt-2014-en-de, wmt-2014-en-fr]
    scale: "65 to 213 million parameters"
    setting: "machine translation, cross-entropy with label smoothing 0.1"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 5.4 \"Regularization\"", stance: for}

- id: c-residual-dropout
  type: attributive
  text: "The base Transformer applies dropout with rate 0.1 to the output of each sublayer before the residual addition and normalization, and to the sums of the embeddings and the positional encodings."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 5.4 \"Regularization\"", stance: for}

- id: c-training-time
  type: historical
  text: "On one machine with 8 NVIDIA P100 GPUs, the base Transformer was trained for 100,000 steps in 12 hours, and the big one for 300,000 steps in 3.5 days."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 5.2", stance: for}

- id: c-pre-ln-warmup
  type: mathematical
  text: "At initialization, the expected gradients of the parameters near the output layer of a post-LN Transformer are large, and those of a pre-LN Transformer are well behaved, so a pre-LN Transformer can be trained without the learning-rate warmup."
  assumes: ["the initialization and the simplifying assumptions of Xiong et al. (2020), Section 3"]
  evidence:
    - {work: "xiong-2020-layer-normalization-transformer", role: original, locator: "Sections 3 and 4", stance: for}

- id: c-gpt2-init
  type: attributive
  text: "In GPT-2, layer normalization was moved to the input of each sub-block, an additional layer normalization was added after the final self-attention block, and the weights of residual layers are scaled at initialization by a factor of $1/\\sqrt{N}$, where $N$ is the number of residual layers."
  evidence:
    - {work: "radford-2019-language-models-unsupervised-multitask", role: original, locator: "Section 2.3", stance: for}

- id: c-permutation-equivariance
  type: mathematical
  text: "Without positional encodings and without a mask, a Transformer encoder is permutation equivariant: permuting the input positions permutes the output positions in the same way."
  assumes: ["no positional encoding", "no attention mask", "the feedforward network and the normalization act on each position separately"]
  derivation: "node.md#inductive-biases"

- id: c-vit-data-hungry
  type: empirical
  text: "Trained on mid-sized datasets such as ImageNet without strong regularization, vision Transformers are a few percentage points less accurate than ResNets of comparable size, and pre-trained on larger datasets such as ImageNet-21k or JFT-300M they approach or beat the state of the art on several image recognition benchmarks."
  scope:
    models: "vision Transformers (ViT) against ResNets of comparable size"
    data: [imagenet, imagenet-21k, jft-300m]
    scale: "larger pre-training sets of 14 million to 300 million images"
    setting: "pre-training on each dataset, then transfer to image classification"
  evidence:
    - {work: "dosovitskiy-2021-image-worth-16x16-words", role: original, locator: "Section 1, Section 4.2, Figure 3", stance: for}

- id: c-wmt-bleu
  type: empirical
  text: "The big Transformer reached 28.4 BLEU on WMT 2014 English to German and 41.8 on English to French, better than the earlier models that the paper compares, at a fraction of their training cost."
  scope:
    models: "the big Transformer, 213 million parameters"
    data: [wmt-2014-en-de, wmt-2014-en-fr, newstest2014]
    scale: "213 million parameters, 300,000 steps on 8 P100 GPUs"
    setting: "test set newstest2014, beam size 4, length penalty 0.6, averaged checkpoints"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "the abstract, Table 2, Section 5.2", stance: for}

- id: c-wmt-fr-41
  type: attributive
  text: "Section 6.1 of the paper gives a BLEU score of 41.0 for the big model on WMT 2014 English to French, where the abstract and Table 2 give 41.8."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 6.1, the abstract, Table 2", stance: for}

- id: c-wmt-bleu-base
  type: empirical
  text: "The base Transformer reached 27.3 BLEU on WMT 2014 English to German and 38.1 on English to French."
  scope:
    models: "the base Transformer, 65 million parameters"
    data: [wmt-2014-en-de, wmt-2014-en-fr, newstest2014]
    scale: "65 million parameters, 100,000 steps on 8 P100 GPUs"
    setting: "test set newstest2014, beam size 4, length penalty 0.6, averaged checkpoints"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Table 2, Section 5.2", stance: for}

- id: c-parsing
  type: empirical
  text: "A 4-layer Transformer reached 91.3 F1 on English constituency parsing when trained on the Wall Street Journal part of the Penn Treebank only, and 92.7 F1 in a semi-supervised setting."
  scope:
    models: "a Transformer with 4 layers and d_model = 1024"
    data: [penn-treebank-wsj]
    scale: "about 40,000 training sentences, or about 17 million in the semi-supervised setting"
    setting: "constituency parsing as sequence to sequence, section 23 of the WSJ"
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "Section 6.3 and Table 4", stance: for}

- id: c-flash-memory
  type: attributive
  text: "FlashAttention computes exact attention with tiling, without materializing the $N \\times N$ attention matrix in the high bandwidth memory (HBM) of the GPU, and requires $O(N)$ additional memory beyond the inputs and output, with $O(N^2 d)$ FLOPs."
  evidence:
    - {work: "dao-2022-flashattention", role: original, locator: "Section 3, Figure 1", stance: for}

- id: c-length-extrapolation
  type: empirical
  text: "Transformer language models with sinusoidal position embeddings extrapolate weakly to sequences longer than those of training, and a 1.3 billion parameter model with linear biases on the attention scores (ALiBi), trained on sequences of length 1024, extrapolates to sequences of length 2048."
  scope:
    models: "decoder-only language models, up to 1.3 billion parameters"
    data: [wikitext-103]
    scale: "up to 1.3 billion parameters"
    setting: "train on sequences of length L, evaluate perplexity on longer sequences"
  evidence:
    - {work: "press-2022-train-short-test-long", role: original, locator: "the abstract, Section 1", stance: for}

- id: c-formal-limits
  type: mathematical
  text: "A Transformer with hard attention and a fixed number of layers and heads cannot recognize parity or the Dyck language of two bracket types for all input lengths, and with soft attention the effect on the output of changing one input symbol other than the last shrinks as the input grows."
  assumes: ["the attention models of Hahn (2020), hard or soft", "a fixed number of layers and heads", "inputs of unbounded length"]
  evidence:
    - {work: "hahn-2020-theoretical-limitations-self-attention", role: original, locator: "Sections 5 and 6", stance: for}

- id: c-attention-not-explanation
  type: empirical
  text: "Learned attention weights are frequently uncorrelated with gradient-based measures of feature importance, and very different attention distributions can yield equivalent predictions; Jain and Wallace conclude that standard attention modules do not provide meaningful explanations."
  scope:
    models: "BiLSTM encoders with a standard attention mechanism"
    setting: "text classification, question answering and natural language inference, with adversarial and permuted attention distributions"
  evidence:
    - {work: "jain-2019-attention-not-explanation", role: original, locator: "the abstract, Section 1", stance: for}

- id: c-bahdanau
  type: historical
  text: "Bahdanau, Cho and Bengio extended the encoder-decoder for neural machine translation, which encodes a source sentence into a fixed-length vector, by letting the model (soft-)search for the parts of the source sentence that are relevant to predicting a target word."
  evidence:
    - {work: "bahdanau-2015-neural-machine-translation", role: original, locator: "the abstract, Section 3", stance: for}

- id: c-published-2017
  type: historical
  text: "Attention Is All You Need was published at the 31st Conference on Neural Information Processing Systems (NIPS 2017), in Long Beach."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "the title page", stance: for}

- id: c-authors
  type: historical
  text: "The paper gives the affiliations Google Brain, Google Research and the University of Toronto."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "the title page", stance: for}

- id: c-equal-contribution
  type: historical
  text: "The authors of Attention Is All You Need state that they contributed equally and that the order of the names is random."
  evidence:
    - {work: "vaswani-2017-attention", role: original, locator: "the title page", stance: for}
