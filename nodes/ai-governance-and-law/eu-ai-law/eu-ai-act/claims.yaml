- id: c-high-risk-dates
  type: normative-reported
  text: "As amended, Chapter III Sections 1, 2 and 3, with the exception of Article 6(5), apply from 2 December 2027 as regards AI systems classified as high-risk pursuant to Annex III, and from 2 August 2028 as regards AI systems classified as high-risk pursuant to Annex I."
  evidence:
    - {work: "eu-2026-ai-act-consolidated-text-2026-07-27", role: official-text, locator: "Article 113", stance: for}

- id: c-public-2030
  type: normative-reported
