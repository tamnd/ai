- id: c-ai-office-competence
  type: normative-reported
  text: "As amended, the AI Office is exclusively competent for the supervision and enforcement of the Regulation for AI systems based on general-purpose AI models where the model and the system are developed by the same provider, with exceptions, and for AI systems that constitute or are integrated into a very large online platform or very large online search engine."
  evidence:
    - {work: "eu-2026-ai-act-consolidated-text-2026-07-27", role: official-text, locator: "Article 75(1)", stance: for}

- id: c-dsa
  type: normative-reported
