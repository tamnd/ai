  evidence:
    - {work: "eu-2026-ai-act-consolidated-text-2026-07-27", role: official-text, locator: "Article 75(1)", stance: for}

- id: c-ec-enforcement
  type: normative-reported
  text: "The Commission states that from 2 August 2026 the AI Office and the authorities of the Member States are responsible for implementing, supervising and enforcing the AI Act, and that the AI Office can request technical documentation, evaluate models, require corrective measures and issue fines for general-purpose AI models."
