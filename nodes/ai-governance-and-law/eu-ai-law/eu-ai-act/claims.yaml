    - {work: "eu-2024-regulation-2024-1689-ai-act", role: official-text, locator: "Article 99(1)", stance: for}

- id: c-fines-prohibited
  type: normative-reported
  text: "Non-compliance with the prohibition of the AI practices referred to in Article 5 is subject to administrative fines of up to EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide annual turnover for the preceding financial year, whichever is higher."
  evidence:
    - {work: "eu-2024-regulation-2024-1689-ai-act", role: official-text, locator: "Article 99(3)", stance: for}

- id: c-fines-operators
  type: normative-reported
  text: "Non-compliance with the listed provisions related to operators or notified bodies, namely the obligations of providers, authorised representatives, importers, distributors and deployers under Articles 16, 22, 23, 24 and 26, the requirements and obligations of notified bodies under Article 31, Article 33(1), (3) and (4) or Article 34, and the transparency obligations under Article 50, is subject to administrative fines of up to EUR 15 000 000 or, if the offender is an undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial year, whichever is higher, with lower limits for SMEs set elsewhere in the Article."
  evidence:
    - {work: "eu-2024-regulation-2024-1689-ai-act", role: official-text, locator: "Article 99(4)", stance: for}

- id: c-fines-info
  type: normative-reported
  text: "The supply of incorrect, incomplete or misleading information to notified bodies or national competent authorities in reply to a request is subject to administrative fines of up to EUR 7 500 000 or, if the offender is an undertaking, up to 1 % of its total worldwide annual turnover for the preceding financial year, whichever is higher, with lower limits for SMEs set elsewhere in the Article."
  evidence:
    - {work: "eu-2024-regulation-2024-1689-ai-act", role: official-text, locator: "Article 99(5)", stance: for}

- id: c-fines-sme
  type: normative-reported
  text: "For SMEs, including start-ups, each fine is up to the percentage or amount referred to in paragraphs 3, 4 and 5, whichever is lower."
  evidence:
    - {work: "eu-2024-regulation-2024-1689-ai-act", role: official-text, locator: "Article 99(6)", stance: for}

- id: c-fines-smc
