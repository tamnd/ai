- id: c-ga-k1
  type: attributive
  text: "Gao et al. note that an infinitely wide maximally sparse (k = 1) autoencoder can perfectly reconstruct by assigning latents densely in R^d while being completely structure-less."
  evidence:
    - {work: "gao-2024-scaling-sparse-autoencoders", role: original, locator: "p. 5", stance: for}

- id: c-ga-zero-ablation
  type: attributive
  text: "Because ablating the residual stream to zero causes very high downstream loss, even very poorly explaining the behavior can give high zero-ablation fidelity scores; the zero-ablation fidelity of the 16M autoencoder is 98.2%."
  evidence:
    - {work: "gao-2024-scaling-sparse-autoencoders", role: original, locator: "p. 6", stance: for}

- id: c-ra-rescale
  type: attributive
  text: "Rescaling the shrunk feature activations is not necessarily enough to overcome the L1 bias, since an SAE trained with the L1 penalty could have learnt sub-optimal encoder and decoder directions."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 5", stance: for}

- id: c-ra-unbiased-norm
  type: attributive
  text: "An unbiased but imperfect SAE must have mean squared reconstruction norm strictly less than the mean squared norm of its inputs even without shrinkage."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 8", stance: for}

- id: c-ga-limits
  type: attributive
  text: "Gao et al. note that TopK forces every token to use exactly k latents, which is likely suboptimal, and that a large fraction of the random activations of features they find, especially in GPT-4, are not yet adequately monosemantic."
  evidence:
    - {work: "gao-2024-scaling-sparse-autoencoders", role: original, locator: "p. 11", stance: for}

- id: c-ga-progressive
  type: attributive
  text: "Training with TopK only gives a progressive code up to the value of k used during training; summing TopK losses as L(k) + L(4k)/8 (Multi-TopK) gives a progressive code over all k', doing slightly worse than TopK at k."
  evidence:
    - {work: "gao-2024-scaling-sparse-autoencoders", role: original, locator: "p. 10", stance: for}

- id: c-el-challenges
  type: attributive
  text: "Elhage et al. list challenges of finding an overcomplete basis: it is no longer easy to know how many features to enumerate; it may mean factoring a millions (neurons) by billions (tokens) matrix to be a thousand or more times larger; and interference is no longer pushing in your favor."
  evidence:
    - {work: "elhage-2022-toy-models-of-superposition", role: original, locator: "p. 43", stance: for}

# Variants

- id: c-ra-two-roles
  type: attributive
  text: "The encoder of a baseline SAE has two roles, detecting which features are active, for which the L1 penalty is necessary, and estimating the magnitudes of active features, for which the L1 penalty is a source of unwanted bias."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 5", stance: for}

- id: c-ra-gated
  type: definitional
  text: "The gated encoder is f̃(x) := 1[(Wgate(x − bdec) + bgate) > 0] ⊙ ReLU(Wmag(x − bdec) + bmag), where fgate determines which features are active and fmag estimates their magnitudes; Wmag shares the projection directions of Wgate through a rescaling parameter rmag, so the Gated SAE has only 2 × M more parameters than a baseline SAE."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 5", stance: for}

- id: c-ra-compute
  type: attributive
  text: "The gated loss runs the decoder twice, leading to a 50% increase in the compute required for a training update step."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 7", stance: for}

- id: c-ga-jumprelu
  type: definitional
  text: "ProLU, also known as TRec or JumpReLU, sets all values below a positive threshold to zero, J_θ(x) = x · 1(x > θ), and needs an approximate gradient because θ is non-differentiable."
  evidence:
    - {work: "gao-2024-scaling-sparse-autoencoders", role: original, locator: "p. 10", stance: for}

# History

- id: c-el-l1
  type: attributive
  text: "Elhage et al. find it quite easy to get rid of superposition in their toy models, at the cost of a higher loss, by adding an L1 regularization term λ||h||_1 on the hidden layer activations."
  evidence:
    - {work: "elhage-2022-toy-models-of-superposition", role: original, locator: "p. 42", stance: for}

- id: c-cu-builds
  type: attributive
  text: "Building on Sharkey et al., Cunningham et al. train sparse autoencoders to learn these directions, an approach similar to Yun et al., who apply sparse dictionary learning to all residual stream layers."
  evidence:
    - {work: "cunningham-2023-sparse-autoencoders", role: original, locator: "p. 2", stance: for}

- id: c-ra-history
  type: attributive
  text: "Rajamanoharan et al. write that, motivated by the superposition hypothesis, Bricken et al. and Cunningham et al. used sparse autoencoders to find sparse decompositions of model activations in terms of an overcomplete basis, or dictionary."
  evidence:
    - {work: "rajamanoharan-2024-gated-sparse-autoencoders", role: original, locator: "p. 1", stance: for}

- id: c-cu-enumerative
  type: attributive
  text: "Cunningham et al. name enumerative safety as an ambitious dream: a complete list of a model's features that would provide a guarantee against dangerous behaviours such as deception."
  evidence:
    - {work: "cunningham-2023-sparse-autoencoders", role: original, locator: "p. 9", stance: for}
