# Faithfulness: Turpin et al. (2023) and Lanham et al. (2023)

- id: c-turpin-misrepresent
  type: empirical
  text: "Turpin et al. demonstrate that chain-of-thought explanations can systematically misrepresent the true reason for a model's prediction, by adding biasing features to model inputs, such as reordering the multiple-choice options in a few-shot prompt to make the answer always (A), which models systematically fail to mention in their explanations."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [big-bench-hard, bbq]
    scale: "13 tasks from BIG-Bench Hard"
    setting: "few-shot and zero-shot chain-of-thought prompting with biasing features"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 1", stance: for}

- id: c-turpin-36
  type: empirical
  text: "When models are biased toward incorrect answers, they frequently generate chain-of-thought explanations rationalizing those answers, causing accuracy to drop by as much as 36% on a suite of 13 tasks from BIG-Bench Hard when testing GPT-3.5 from OpenAI and Claude 1.0 from Anthropic."
  scope:
    models: "GPT-3.5 (text-davinci-003), Claude 1.0"
    data: [big-bench-hard]
    scale: "13 tasks"
    setting: "biased chain-of-thought prompting"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 1", stance: for}

- id: c-turpin-one-mention
  type: empirical
  text: "Of 426 explanations that support biased predictions, Turpin et al. find that only one explicitly mentions the bias."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [big-bench-hard]
    scale: "426 explanations"
    setting: "manual review of chain-of-thought explanations"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 3", stance: for}

- id: c-turpin-why-unfaithful
  type: attributive
  text: "Turpin et al. argue that there are reasons to not expect chain-of-thought explanations to be faithful: nothing in the training objectives explicitly incentivizes models to accurately report the reasons for their behavior, human-written explanations are themselves often unfaithful, and RLHF may directly disincentivize faithful explanations."
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 2", stance: for}

- id: c-turpin-drops
  type: empirical
  text: "With the Suggested Answer bias, zero-shot chain-of-thought accuracy of GPT-3.5 dropped by as much as 36.3%, and with the Answer is Always A bias the drops were 18.7% for GPT-3.5 and 4.7% for Claude 1.0."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [big-bench-hard]
    scale: "13 tasks, 3,299 examples"
    setting: "zero-shot and few-shot chain-of-thought prompting with biasing features"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 6", stance: for}

- id: c-turpin-helps-unbiased
  type: empirical
  text: "Both models benefit from using CoT in an unbiased context on average, from 57.1% to 59.6% for GPT-3.5 and from 59.2% to 65.3% for Claude 1.0, though on some tasks CoT makes results worse."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [big-bench-hard]
    scale: "13 tasks"
    setting: "few-shot chain-of-thought prompting"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 6", stance: for}

- id: c-turpin-73
  type: empirical
  text: "Of 104 manually annotated unfaithful explanations, as many as 73% support the bias-consistent answer, and 15% have no obvious errors, so models can give fully plausible CoT explanations that are nonetheless unfaithful."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [big-bench-hard]
    scale: "104 unfaithful explanations"
    setting: "manual annotation, Suggested Answer bias"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 7", stance: for}

- id: c-turpin-bbq
  type: empirical
  text: "On the social-bias task BBQ, models give explanations that justify answers in line with stereotypes without mentioning the influence of these social biases."
  scope:
    models: "GPT-3.5, Claude 1.0"
    data: [bbq]
    scale: "one bias benchmark"
    setting: "zero-shot and few-shot chain-of-thought prompting"
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 1", stance: for}

- id: c-turpin-necessary
  type: attributive
  text: "Turpin et al. describe their evaluation as a necessary but not sufficient test for faithfulness: explanations that pass it can still be unfaithful."
  evidence:
    - {work: "turpin-2023-unfaithful-explanations-chain-of-thought", role: original, locator: "p. 10", stance: for}

- id: c-lanham-hypotheses
  type: attributive
  text: "Lanham et al. test hypotheses for how chain of thought could be unfaithful: post-hoc reasoning, where the reasoning is generated after the conclusion is already certain, extra test-time computation that the tokens provide regardless of their content, and encoded reasoning in the phrasing of the chain of thought."
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 2", stance: for}

- id: c-lanham-vary
  type: empirical
  text: "Lanham et al. find that models show large variation across tasks in how strongly they condition on the chain of thought when predicting their answer, and that the performance boost from chain of thought does not seem to come from the added test-time compute alone or from information encoded via the particular phrasing of the chain of thought."
  scope:
    models: "a 175B-parameter pretrained decoder-only transformer finetuned with RLHF"
    data: [aqua, logiqa, arc-easy, arc-challenge, openbookqa, hellaswag, mmlu, truthfulqa]
    scale: "eight multiple-choice tasks"
    setting: "interventions on the chain of thought"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 1", stance: for}

- id: c-lanham-inverse
  type: empirical
  text: "Lanham et al. find that as models become larger and more capable, they produce less faithful reasoning on most tasks they study."
  scope:
    models: "RLHF models from 810M to 175B parameters"
    data: [aqua, logiqa, arc-easy, arc-challenge, openbookqa, hellaswag, mmlu, truthfulqa]
    scale: "810M to 175B parameters"
    setting: "early answering with and without chain of thought"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 1", stance: for}

- id: c-lanham-early
  type: empirical
  text: "In the early answering test, for ARC Easy, ARC Challenge and OpenBookQA the chain of thought changes the final answer less than 10% of the time, while for AQuA it changes the answer more than 60% of the time."
  scope:
    models: "a 175B-parameter RLHF model"
    data: [arc-easy, arc-challenge, openbookqa, aqua]
    scale: "100 samples per question"
    setting: "truncated chains of thought"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 4", stance: for}

- id: c-lanham-filler
  type: empirical
  text: "Replacing the chain of thought with strings of filler tokens, from zero tokens up to the length of the longest sampled chain of thought, shows no increase in accuracy, which suggests that extra test-time compute alone is not used by models to perform helpful but unstated reasoning."
  scope:
    models: "a 175B-parameter RLHF model"
    data: [aqua, logiqa, arc-easy, arc-challenge, openbookqa, hellaswag, mmlu, truthfulqa]
    scale: "eight multiple-choice tasks"
    setting: "filler tokens in place of the chain of thought"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 6", stance: for}

- id: c-lanham-paraphrase
  type: empirical
  text: "The accuracy after a paraphrased chain of thought closely matches the accuracy of the original chain of thought for almost all tasks, so the particular phrasing of the reasoning is unlikely to encode information responsible for the accuracy gains of CoT."
  scope:
    models: "a 175B-parameter RLHF model"
    data: [aqua, logiqa, arc-easy, arc-challenge, openbookqa, hellaswag, mmlu, truthfulqa]
    scale: "eight multiple-choice tasks"
    setting: "paraphrased chains of thought"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 7", stance: for}

- id: c-lanham-13b
  type: empirical
  text: "For seven of the eight tasks, the 13B model changes its answer after chain of thought more often than the 175B model does, an inverse scaling of faithfulness with model size."
  scope:
    models: "RLHF models from 810M to 175B parameters"
    data: [aqua, logiqa, arc-easy, arc-challenge, openbookqa, hellaswag, mmlu, truthfulqa]
    scale: "810M to 175B parameters"
    setting: "how often the answer with chain of thought differs from the answer without"
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 7", stance: for}

- id: c-lanham-limitations
  type: attributive
  text: "Lanham et al. state as a key limitation that they do not have a separate way to understand the model's real internal reasoning process, without which they cannot know if the chain of thought is faithful to it, and they analyzed only RLHF-finetuned models."
  evidence:
    - {work: "lanham-2023-measuring-faithfulness-chain-of-thought", role: original, locator: "p. 9", stance: for}

# Majority voting under independent samples: this page's own model

- id: c-binary-vote
  type: mathematical
  text: "If each of m sampled answers to a question is correct independently with probability p, and the vote is between the correct answer and one wrong answer, then for odd m the majority vote is correct with probability P_m(p) = Σ_{j > m/2} C(m, j) p^j (1 − p)^(m − j)."
  assumes: ["the m answers are independent and identically distributed given the question", "only two answers occur, the correct one and one wrong one", "m is odd, so there are no ties"]
  derivation: majority-vote

- id: c-binary-step
  type: mathematical
  text: "For odd m, P_{m+2}(p) − P_m(p) = C(m, (m + 1)/2) p^((m+1)/2) (1 − p)^((m+1)/2) (2p − 1), so with p > 1/2 the vote accuracy rises strictly with every two more samples, starting from P_1 = p, and with p < 1/2 it falls strictly."
  assumes: ["the m answers are independent and identically distributed given the question", "only two answers occur", "m is odd", "0 < p < 1"]
  derivation: majority-vote

- id: c-binary-limit
  type: mathematical
  text: "With p > 1/2 the majority vote accuracy tends to 1 as m grows, with error at most exp(−2m(p − 1/2)^2) by Hoeffding's inequality, and with p < 1/2 it tends to 0."
  assumes: ["the m answers are independent and identically distributed given the question", "only two answers occur", "m is odd"]
  derivation: majority-vote

- id: c-even-ties
  type: mathematical
  text: "If ties are broken by a fair coin, the vote accuracy with an even number 2k of samples equals the accuracy with 2k − 1 samples, so the sample counts 2k − 1 and 2k give the same accuracy."
  assumes: ["the answers are independent and identically distributed given the question", "only two answers occur", "ties are broken uniformly at random"]
  derivation: majority-vote

- id: c-first-seen-ties
  type: mathematical
  text: "For independent and identically distributed samples, breaking a tie in favour of the tied answer that was sampled first picks each tied answer with the same probability, so it has the same distribution as breaking the tie uniformly at random."
  assumes: ["the m answers are independent and identically distributed given the question", "the tie rule looks only at the order in which the answers were sampled"]
  derivation: majority-vote

- id: c-plurality-limit
  type: mathematical
  text: "With more than two possible answers drawn independently from a distribution q over a finite answer set, the plurality vote tends to the correct answer as m grows if the correct answer is the unique most likely answer of q, and to a wrong answer if some wrong answer is strictly more likely than the correct one; the correct answer need not have probability above 1/2."
  assumes: ["the m answers are independent and identically distributed given the question", "the answer set is finite", "the mode of q is unique when the limit is to a single answer"]
  derivation: majority-vote

- id: c-dataset-mixture
  type: mathematical
  text: "The benchmark accuracy of the vote is the mean of the per-question vote accuracies, so voting raises it only to the extent that the questions where the correct answer is the most likely answer outweigh those where a wrong answer is: with one question of correctness probability 0.9 and another where the correct answer has probability 0.3 and one wrong answer 0.5, single-sample accuracy is 0.6 and the vote accuracy tends to 0.5."
  assumes: ["the samples are independent and identically distributed given each question", "the questions are fixed, and each is weighted equally"]
  derivation: majority-vote

- id: c-worked-numbers
  type: mathematical
  text: "For p = 0.6 the binary vote accuracy is 0.648 with 3 samples, 0.68256 with 5 samples and about 0.8256 with 21 samples, and for p = 0.4 it is 0.352 with 3 samples."
  assumes: ["the samples are independent and identically distributed given the question", "only two answers occur"]
  derivation: majority-vote

