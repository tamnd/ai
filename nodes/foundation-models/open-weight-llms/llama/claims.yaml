# The claims of the llama page (spec 07). The build computes the labels.
- id: c-llama-collection
  type: attributive
  text: "Touvron et al. introduce LLaMA, a collection of foundation language models ranging from 7B to 65B parameters, trained using publicly available datasets exclusively."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "the abstract", stance: for}

- id: c-llama-gpt3
  type: attributive
  text: "Touvron et al. report that LLaMA-13B outperforms GPT-3 (175B) on most benchmarks."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "the abstract", stance: for}

- id: c-llama-noncommercial
  type: historical
  text: "Meta released LLaMA under a noncommercial license focused on research use cases, and access to the model was granted on a case-by-case basis to academic researchers, to those affiliated with organizations in government, civil society and academia, and to industry research laboratories."
  evidence:
    - {work: "meta-2023-introducing-llama", role: original, locator: "p. 1", stance: for}

- id: c-llama2-free
  type: historical
  text: "Meta announced Llama 2 as free for research and commercial use."
  evidence:
    - {work: "meta-2023-llama-2-announcement", role: original, locator: "p. 1", stance: for}

- id: c-llama4-moe
  type: attributive
  text: "Meta describes the Llama 4 models as its first models that use a mixture of experts (MoE) architecture."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-arch-llama
  type: historical
  text: "LLaMA is based on the transformer architecture, with three main differences from the original architecture: pre-normalization, the SwiGLU activation function and rotary embeddings."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "Section 2.2", stance: for}

- id: c-arch-sources
  type: historical
  text: "LLaMA normalizes the input of each transformer sub-layer with the RMSNorm normalizing function, after GPT3; replaces the ReLU non-linearity by the SwiGLU activation function, after PaLM; and removes the absolute positional embeddings and adds rotary positional embeddings (RoPE) at each layer, after GPTNeo."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "Section 2.2", stance: for}

- id: c-arch-llama2
  type: historical
  text: "Llama 2 adopts most of the model architecture of Llama 1, and the primary architectural differences from Llama 1 are an increased context length and grouped-query attention (GQA)."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "Section 2.2", stance: for}

- id: c-llama2-gqa
  type: historical
  text: "In the Llama 2 family, the bigger models, 34B and 70B, use Grouped-Query Attention (GQA)."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "Table 1", stance: for}

- id: c-context-2048-4096
  type: historical
  text: "Meta expanded the context window from 2048 tokens for Llama 1 to 4096 tokens for Llama 2."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 47", stance: for}

- id: c-arch-llama3
  type: historical
  text: "Meta opted for a relatively standard decoder-only transformer architecture in Llama 3, with a tokenizer with a vocabulary of 128K tokens and grouped query attention (GQA) across both the 8B and 70B sizes."
  evidence:
    - {work: "meta-2024-introducing-llama-3", role: original, locator: "p. 1", stance: for}

- id: c-arch-llama3-same
  type: attributive
  text: "Grattafiori et al. write that Llama 3 uses a standard, dense Transformer architecture that does not deviate significantly from Llama and Llama 2 in terms of model architecture."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "Section 3.2", stance: for}

- id: c-arch-dense
  type: attributive
  text: "Grattafiori et al. opt for a standard dense Transformer model architecture with minor adaptations, rather than for a mixture-of-experts model, to maximize training stability."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "p. 2", stance: for}

- id: c-arch-llama3-gqa8
  type: historical
  text: "Llama 3 uses grouped query attention (GQA) with 8 key-value heads, and an attention mask that prevents self-attention between different documents within the same sequence."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "Section 3.2", stance: for}

- id: c-arch-rope-base
  type: historical
  text: "Llama 3 increases the RoPE base frequency hyperparameter to 500,000 to better support longer contexts."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "Section 3.2", stance: for}

- id: c-arch-32-vision
  type: attributive
  text: "Meta writes that the Llama 3.2 11B and 90B models, as the first Llama models to support vision tasks, required an entirely new model architecture that supports image reasoning."
  evidence:
    - {work: "meta-2024-llama-3-2", role: original, locator: "p. 1", stance: for}

- id: c-arch-llama4-fusion
  type: historical
  text: "Llama 4 models are designed with native multimodality, incorporating early fusion to integrate text and vision tokens into a unified model backbone."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-arch-llama4-moe
  type: historical
  text: "Llama 4 Maverick uses alternating dense and mixture-of-experts (MoE) layers; the MoE layers use 128 routed experts and a shared expert, and each token is sent to the shared expert and also to one of the 128 routed experts."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-arch-irope
  type: attributive
  text: "Meta calls the Llama 4 architecture iRoPE, where the i stands for interleaved attention layers without positional embeddings, and RoPE refers to the rotary position embeddings employed in most layers."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-data-llama-mix
  type: historical
  text: "The pre-training data mixture of LLaMA samples English CommonCrawl at 67.0%, C4 at 15.0%, GitHub, Wikipedia and Books at 4.5% each, ArXiv at 2.5% and StackExchange at 2.0%."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "Table 1", stance: for}

- id: c-tokens-llama
  type: historical
  text: "LLaMA 7B and 13B are trained on 1.0T tokens, and LLaMA 33B and 65B on 1.4T tokens."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "Table 2", stance: for}

- id: c-data-llama2
  type: historical
  text: "The pretraining corpus of Llama 2 includes a mix of data from publicly available sources, which does not include data from Meta's products or services, and Meta made an effort to remove data from certain sites known to contain a high volume of personal information about private individuals."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "Section 2.1", stance: for}

- id: c-tokens-llama2
  type: historical
  text: "Llama 2 was trained on 2 trillion tokens of data."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "Section 2.1", stance: for}

- id: c-data-llama3
  type: attributive
  text: "Meta writes that Llama 3 is pretrained on over 15T tokens that were all collected from publicly available sources, a training dataset seven times larger than that used for Llama 2, with four times more code."
  evidence:
    - {work: "meta-2024-introducing-llama-3", role: original, locator: "p. 1", stance: for}

- id: c-data-llama3-cutoff
  type: historical
  text: "The pre-training dataset of Llama 3 is created from a variety of data sources containing knowledge until the end of 2023."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "Section 3.1", stance: for}

- id: c-tokens-405b
  type: historical
  text: "The flagship Llama 3 model, with 405B trainable parameters, was pre-trained on 15.6T text tokens."
  evidence:
    - {work: "grattafiori-2024-llama-3-herd", role: original, locator: "p. 1", stance: for}

- id: c-data-llama4
  type: attributive
  text: "The Llama 4 model card says that the models were pretrained on a mix of publicly available, licensed data and information from Meta's products and services, including publicly shared posts from Instagram and Facebook and people's interactions with Meta AI."
  evidence:
    - {work: "meta-llama-4-model-card", role: original, locator: "p. 1", stance: for}

- id: c-tokens-llama4-card
  type: attributive
  text: "The Llama 4 model card says that Llama 4 Scout was pretrained on about 40 trillion tokens and Llama 4 Maverick on about 22 trillion tokens of multimodal data."
  evidence:
    - {work: "meta-llama-4-model-card", role: original, locator: "p. 1", stance: for}

- id: c-tokens-llama4-blog
  type: attributive
  text: "Meta writes that the overall data mixture for training Llama 4 consisted of more than 30 trillion tokens and includes diverse text, image, and video datasets."
  evidence:
