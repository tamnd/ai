- id: c-train-llama3-post
  type: attributive
  text: "Grattafiori et al. adopt a post-training procedure based on supervised finetuning (SFT), rejection sampling (RS), and direct preference optimization (DPO), as opposed to more complex reinforcement learning algorithms."
