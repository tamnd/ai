- id: c-train-llama-gpus
  type: attributive
  text: "Touvron et al. report that, when training a 65B-parameter model, their code processes around 380 tokens/sec/GPU on 2048 A100 GPU with 80GB of RAM, so training over their dataset of 1.4T tokens takes approximately 21 days."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "p. 4", stance: for}

- id: c-llama2-chat
  type: definitional
  text: "Llama 2-Chat is a fine-tuned version of Llama 2 that is optimized for dialogue use cases."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 4", stance: for}

- id: c-train-llama2-rlhf
  type: historical
  text: "The Llama 2 authors explored RLHF fine-tuning with two main algorithms, Proximal Policy Optimization (PPO) and Rejection Sampling fine-tuning."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "p. 13", stance: for}

- id: c-train-compute
  type: attributive
