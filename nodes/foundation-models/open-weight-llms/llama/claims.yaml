- id: c-llama-access
  type: historical
  text: "Meta released LLaMA under a noncommercial license focused on research use cases, with access granted on a case-by-case basis."
  evidence:
    - {work: "meta-2023-introducing-llama", role: original, locator: "p. 1", stance: for}

- id: c-llama4-open-source
  type: attributive
  text: "Meta presents the download release of Llama 4 Maverick and Llama 4 Scout as in keeping with its commitment to open source."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-lineage-l1
  type: historical
  text: "LLaMA is based on the transformer architecture (Vaswani et al., 2017), and uses RMSNorm pre-normalization, the SwiGLU activation function and rotary embeddings (RoPE)."
  evidence:
    - {work: "touvron-2023-llama", role: original, locator: "Section 2.2", stance: for}

- id: c-lineage-l3
  type: historical
  text: "Llama 3 uses grouped query attention (GQA) across both the 8B and 70B sizes and a tokenizer with a vocabulary of 128K tokens."
  evidence:
    - {work: "meta-2024-introducing-llama-3", role: original, locator: "p. 1", stance: for}

- id: c-lineage-l4
  type: historical
  text: "Llama 4 models are the first Llama models that use a mixture of experts (MoE) architecture, they incorporate early fusion of text and vision tokens, and Llama 4 Maverick was codistilled from Llama 4 Behemoth as a teacher model."
  evidence:
    - {work: "meta-2025-llama-4-herd", role: original, locator: "p. 1", stance: for}

- id: c-tokens-llama2-known
  type: attributive
  text: "Touvron et al. report that Llama 2 was trained on 2 trillion tokens of data."
  evidence:
    - {work: "touvron-2023-llama-2", role: original, locator: "Section 2.1", stance: for}

- id: c-osi-restrict
  type: attributive
  text: "OSI writes that Meta's license puts restrictions on commercial use for some users and also restricts the use of the model and software for certain purposes through the Acceptable Use Policy."
  evidence:
    - {work: "osi-2023-llama-license-not-open-source", role: original, locator: "p. 1", stance: for}
