name = "AI"
version = "0.1.0"
defaultTargets = ["AI"]
testDriver = "AITest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Pin Mathlib to the release tag of the toolchain (spec 11.2). The monthly bump (11.11) moves the two together.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "AI"

# The tests of the definitions on small instances (rule F06). `lake test` builds them.
[[lean_lib]]
name = "AITest"
