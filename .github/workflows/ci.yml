# SPDX-License-Identifier: CC0-1.0
#
# The Lean job comes back when the Lean package AI exists (spec 11).
#
# The jobs that run code from the content (audit, tests, site) have no secrets. Only the deploy job has the Cloudflare token, and it runs no code from the content: it uploads the site that the site job made.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AIK_VERSION: v0.1.5
  GO_VERSION: "1.27.x"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install aik
        run: go install "github.com/tamnd/ai-agent/cmd/aik@${AIK_VERSION}"
      - name: Check the format
        run: aik fmt -check
      - name: Show the tags that the merge gives
        if: github.event_name == 'pull_request'
        run: aik mint -dry-run
      - name: Audit the changed nodes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: aik check -changed "$BASE"
      - name: Audit all nodes
        if: github.event_name != 'pull_request'
        run: aik check -main
      - name: Check the scenes
        run: aik viz check

  test:
    name: Test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [python, numpy, pytorch, jax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install aik
        run: go install "github.com/tamnd/ai-agent/cmd/aik@${AIK_VERSION}"
      # The cache keeps the results of the implementations that passed. A result is used again only while aik, the image, the files of the implementation and the cases stay the same.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
          restore-keys: test-${{ matrix.lang }}-
      - name: Run the tests
        env:
          LANG_ID: ${{ matrix.lang }}
        # Each test runs in a container of the image that manifests/images.yaml pins, with no network (spec 08.7).
        run: aik test -sandbox docker -lang "$LANG_ID" -cache build/test-cache -out build/results
      # The mutation score is part of I2 and X3 (spec 08.8). A score under the threshold lowers the rung and is not a
      # failure of the build, so the step may fail; the cache keeps the runs that reach the threshold.
      - name: Run the mutation tests
        continue-on-error: true
        env:
          LANG_ID: ${{ matrix.lang }}
        run: aik test -kind mutate -sandbox docker -lang "$LANG_ID" -cache build/test-cache -out build/results
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.lang }}
          path: build/results
          retention-days: 7
          if-no-files-found: ignore

  site:
    needs: [audit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install aik
        run: go install "github.com/tamnd/ai-agent/cmd/aik@${AIK_VERSION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: build/results
          merge-multiple: true
      - name: Render the site and check the links
        run: aik site check -out build/site -minify
      - name: Check the limits of Worker static assets
        run: |
          files=$(find build/site -type f | wc -l)
          big=$(find build/site -type f -size +24M | wc -l)
          echo "The site has $files files."
          if [ "$files" -gt 19500 ]; then echo "::error::The site has more than 19500 files."; exit 1; fi
          if [ "$big" -gt 0 ]; then echo "::error::A file of the site is larger than 24 MB."; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 7

  deploy:
    needs: site
    # Production is only the push to main and a run by hand on main. A run by hand on another branch, such as the one that bridge.yml starts, does not deploy.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url || 'https://ai.tamnd.com' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install aik
        run: go install "github.com/tamnd/ai-agent/cmd/aik@${AIK_VERSION}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # aik site deploy checks the limits of Worker static assets again and uploads the tree with a pinned wrangler. It does not print the token.
      - name: Deploy to the Cloudflare Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BRANCH" = main ]; then
            aik site deploy -no-build -out site -commit "$SHA" | tee deploy.log
          else
            aik site deploy -no-build -out site -commit "$SHA" -preview -branch "$BRANCH" | tee deploy.log
          fi
          tail -1 deploy.log >> "$GITHUB_STEP_SUMMARY"
