# The crosswalk of ACM CCS 2012 (spec 5.8): the concepts of the ACM Computing Classification System under
# "Computing methodologies > Machine learning", in the order of the classification, each mapped to the areas and nodes that
# cover it. The CCS is a polyhierarchy; a concept with two parents is kept here under its parent in this subtree. The ids
# and names are from the classification (free to use with credit); nothing else of it is kept (19). A match says what
# our item is to the concept: exact, broader (ours is wider), narrower (ours is a part of it) or related.
# The path acm-ccs-ml of the site (16.12) reads the concepts in this order. The part "> Artificial intelligence" (10010178)
# and the AI parts of "Theory of computation" and "Applied computing" are to come.
