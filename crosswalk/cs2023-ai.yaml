# The crosswalk of CS2023 (spec 5.8): the knowledge units of the Artificial Intelligence knowledge area of the ACM/IEEE-CS/AAAI
# Computer Science Curricula 2023, in the order of the curriculum, each mapped to the areas and nodes that teach it.
# Only the ids and the names of the units are kept, with the source; the text of the curriculum is not copied (19).
# A match says what our item is to the unit: exact, broader (ours is wider), narrower (ours is a part of it) or related.
# The path cs2023-ai of the site (16.12) reads the units in this order.
system: CS2023, the Artificial Intelligence knowledge area
version: CS2023 final report
source: https://csed.acm.org/mockup-artificial-intelligence/
licence: names of a public curriculum, cited
checked: 2026-11-15
paths:
  - {id: cs2023-ai, title: The CS2023 Artificial Intelligence knowledge area}
